# The Coolibah crew portal on Cloudflare Workers.
#
# One worker carries the whole thing: the page itself (served from ./assets),
# every /api route the page calls, and the engine behind them. The stores it
# leans on are all on Cloudflare's free tier:
#
#   DB     (D1)  — the file index, the portal's shared state, and the AI
#                  readings / job records (in one strongly consistent place)
#   FILES  (R2)  — the file bytes, until SharePoint takes over (see FILE_STORE)
#
# Secrets are set with `wrangler secret put <NAME>`, never written here:
#   ANTHROPIC_API_KEY  — the AI account the readings run on
#   MS_CLIENT_SECRET   — the SharePoint app's secret, once IT provides it
#
# The ids below are placeholders until the real Cloudflare account exists:
# create the resources with `wrangler d1 create portal` and
# `wrangler r2 bucket create portal-files`, then paste the D1 id in.
name = "coolibah-portal"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The portal's own name, bought 13 Sep 2026 and held in the same Cloudflare
# account. The long workers.dev address keeps working alongside it.
routes = [
  { pattern = "coolibah-portal.com", custom_domain = true },
  { pattern = "www.coolibah-portal.com", custom_domain = true },
]

[assets]
directory = "./assets"
binding = "ASSETS"
# The worker always answers first, so the sign-in gate stands in front of the
# page itself — without this, the asset layer can serve the portal straight
# past the gate (and does, in local dev).
run_worker_first = true

# Sign-in codes go out through Cloudflare's own email sending, from the
# portal's domain. Needs the domain onboarded once under Email Service.
[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "portal"
database_id = "9d763383-b034-4864-801d-8ed375727e2c"

[[r2_buckets]]
binding = "FILES"
bucket_name = "portal-files"

[vars]
# The first IT Help account: with the users table empty, this address may
# sign in and becomes the portal's first user. Meaningless once anyone
# exists — every later grant is made on the Access grants page.
BOOTSTRAP_IT_EMAIL = "matthew.jones@unitedmarine.au"
# Where the model lives. The key itself is a secret (above).
ANTHROPIC_BASE_URL = "https://api.anthropic.com"
# Which file store holds the bytes. Flipped to SharePoint on 11 Sep 2026,
# the day Atcom's app registration landed; "r2" remains the fallback and the
# local-dev driver.
FILE_STORE = "sharepoint"
# SharePoint, for when FILE_STORE flips: the tenant, the app registration's
# client id, the site, and the document library the portal files into.
# From Atcom's app registration, ticket 259549 (11 Sep 2026). The client
# secret is a worker secret, never written here; it expires ~11 Sep 2027 —
# ask Atcom for a new one before then.
MS_TENANT_ID = "7faf9a35-e2e2-46aa-a65f-041ea912894e"
MS_CLIENT_ID = "1a98fdfd-a0bf-4cf6-ae83-448d7ace84e8"
SHAREPOINT_HOSTNAME = "unitedmarineau.sharepoint.com"
# The site the files live in: the United Operations Team's own SharePoint
# site — a Teams team is a SharePoint site underneath, and its Shared files
# are the "Documents" library. The path below follows the standard Teams
# naming; VERIFY it before the flip by opening the Teams file view, "..."
# menu, Open in SharePoint, and comparing the address bar. The app
# registration from IT must grant Sites.Selected on this same site.
SHAREPOINT_SITE_PATH = "/sites/UnitedOperationsTeam"
SHAREPOINT_LIBRARY = "Documents"
# Where the portal's filing lands in the library. SHAREPOINT_MAP marries the
# portal's own filing families to the folders the team already uses — so a
# certificate filed through the portal appears in Crew Certificate
# Verifications, the matrices in Matrix, and so on, and /api/sync can take
# onto the portal's books whatever people drop into those folders straight
# from Teams. Anything not mapped (removed copies, working uploads) sits
# under the portal's own SHAREPOINT_ROOT folder. Moving or renaming a file
# the portal has on its books still breaks its link — run /api/sync after a
# tidy-up rather than doing nothing.
# A Teams channel's files sit inside a folder named after the channel in the
# site's Documents library, so every path starts with the channel folder.
SHAREPOINT_ROOT = "United Operations Team/Crew Portal"
SHAREPOINT_MAP = """
{
  "certification/spreadsheet/": "United Operations Team/OPMS Documents/Crew Certificates Spreadsheet/",
  "certification/": "United Operations Team/Crew Certificate Verifications/",
  "matrices/": "United Operations Team/Matrix/",
  "opms/": "United Operations Team/OPMS Documents/",
  "roster/": "United Operations Team/Crew Roster/",
  "notes/": "United Operations Team/Handover Notes/"
}
"""
