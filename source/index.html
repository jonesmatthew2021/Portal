    // allocation sheet, from the Swing Compliance page. Shared, same as above.
    shiftAnalysis: null,
    // The last swing compliance report generated at the bottom of the Swing
    // Compliance page — one swing's roster read whole against the crew matrix
    // spreadsheets and the certificates on file, written down so the answer is
    // on the page for whoever opens it next. Shared, same as above.
    swingReport: null,
    // The day the matrix was last rebuilt from a spreadsheet. Shared, so it
    // reads the same for everyone rather than per browser.
    matrixUpdated: "",
  });

  const [sync, setSync] = useState({ state: "loading" });
  /* Whether anything typed is still on its way up.
   *
   * The badge used to read the connection and nothing else, so it said SAVED
   * from the moment the portal loaded and went on saying it while somebody
   * typed — which answers "is it saved?" with "yes" before it is. dirty is a
   * ref, and a ref changing does not redraw anything, so the fact has to be
   * held somewhere the screen watches. */
  const [pending, setPending] = useState(false);
  /* Whether somebody holds the workbook, as the portal last said when this
     tab asked (/api/sync/last): asked by the hourly tick and by every wait
     before a round, never on a clock of its own. The buttons that write
     the workbook are held down while it is true - under the holder's name,
     as the 409 or the last look gave it, so the lease passing to the hour
     or another person mid-wait renames the buttons; the name goes with the
     lease. A look that says "running" and names nobody keeps the name it
     has. */
  const [roundHeld, setRoundHeld] = useState({ running: false, holder: null });
  const roundRunning = roundHeld.running;
  const roundHolder = roundHeld.holder;
  const setRoundRunning = (running, holder) => setRoundHeld((h) => {
    const next = running
      ? { running: true, holder: String(holder || "").trim() || (h.running ? h.holder : null) }
      : { running: false, holder: null };
    return h.running === next.running && h.holder === next.holder ? h : next;
  });
  const [loaded, setLoaded] = useState(false);
  const [files, setFiles] = useState({ state: "loading" });
  const [retry, setRetry] = useState(0);
  const rev = useRef(0);
  const dirty = useRef(new Set());
  /* How many times each slice has been changed here. A save takes a while
     to land, and a slice changed again while its save is in the air is
     still unsaved when that save comes back; the count says so, where the
     set of dirty slices alone would have it crossed off (see settledKeys). */
  const gen = useRef(new Map());
  const saving = useRef(false);
  const firstLoad = useRef(true);
  const storedFiles = useRef([]);

  // One setter per slice, so the rest of the app is unchanged. Which slices were
  // touched is remembered, not just that something was: if two people save at
  // the same moment, only the parts each of them actually changed are carried
  // over, so a roster edit and a posted note can't wipe each other out.
  const put = (key) => (v) => {
    dirty.current.add(key);
    gen.current.set(key, (gen.current.get(key) || 0) + 1);
    setPending(true);
    setStore((s) => ({ ...s, [key]: typeof v === "function" ? v(s[key]) : v }));
  };
  const notes = store.notes,               setNotes = put("notes");
  const suggestions = store.suggestions,   setSuggestions = put("suggestions");
  const correspondence = store.correspondence, setCorrespondence = put("correspondence");
  const pwCorrespondence = store.pwCorrespondence, setPwCorrespondence = put("pwCorrespondence");
  const appSuggestions = store.appSuggestions, setAppSuggestions = put("appSuggestions");
  const people = store.people,             setPeople = put("people");
  const overrides = store.overrides,       setOverrides = put("overrides");
  const swingBoard = store.swingBoard || { side: {}, shift: {} }, setSwingBoard = put("swingBoard");
  const swingBoards = store.swingBoards || {}, setSwingBoards = put("swingBoards");
  const swingLists = store.swingLists || { A: null, B: null }, setSwingLists = put("swingLists");
  const swingDates = store.swingDates || {}, setSwingDates = put("swingDates");
  const swingArchive = store.swingArchive || {}, setSwingArchive = put("swingArchive");
  const skillsRequirements = store.skillsRequirements || null, setSkillsRequirements = put("skillsRequirements");
  // The swing pattern, merged over the defaults so a portal saved before the
  // pattern could be moved still runs four weeks from 12 Aug 2026. The two
  // module-level values everything reads (ROSTER_ANCHOR, CYCLE) are re-pointed
  // here — during render, before any child works a swing out — so the whole
  // portal follows a move at once, and falls back to the defaults while a box
  // is half-typed rather than working swings out from nonsense.
  // When the documentation was last brought up to date, by hand or on the hour.
  const lastDocUpdate = store.lastDocUpdate || null, setLastDocUpdate = put("lastDocUpdate");
  /* Which cells on the crew matrix were filled from a certificate rather than
     coming in on the office's spreadsheet. Held so a certificate being deleted
     can take its date with it: without it the portal cannot tell a date it put
     there itself from one the office typed, and clearing the wrong ones would
     empty most of the matrix. */
  const filledFromCert = store.filledFromCert || {}, setFilledFromCert = put("filledFromCert");
  /* Which OPMS folder belongs to whom, where the name alone doesn't say.
     The office names its folders for the person, not for the record - "AJ",
     "Bob", "Tom", "Chris" - and the portal keeps the crew as the matrix writes
     them. Rather than make the office rename forty folders, the pairing is
     written down here the once, the first time anybody is asked. */
  const folderNames = store.folderNames || {}, setFolderNames = put("folderNames");
  /* Spellings the library holds that are not anybody — a folder of paperwork,
     a filename the sync read as a name. Kept so Crew Details stops asking. */
  const notPeople = store.notPeople || [], setNotPeople = put("notPeople");
  /* The one folder in the library that holds the crew's certificate folders —
     the primary location, set once on Crew Details. A folder the office already
     has: the portal is told which one it is, it does not make one. */
  const certRoot = store.certRoot || "", setCertRoot = put("certRoot");
  const rosterPattern = { ...ROSTER_DEFAULTS, ...(store.rosterPattern || {}) };
  const setRosterPattern = put("rosterPattern");
  ROSTER_ANCHOR = /^\d{4}-\d{2}-\d{2}$/.test(rosterPattern.anchor || "")
    ? rosterPattern.anchor : ROSTER_DEFAULTS.anchor;
  CYCLE = Number(rosterPattern.cycle) > 0 ? Math.round(Number(rosterPattern.cycle)) : ROSTER_DEFAULTS.cycle;
  const history = store.history,           setHistory = put("history");
  const comments = store.comments,         setComments = put("comments");
  const hiddenTabs = store.hiddenTabs,     setHiddenTabs = put("hiddenTabs");
  // Requirement rows are dropped here rather than on each screen, so the crew
  // are the same forty people wherever they are counted — the matrix, the
  // certificate lists, the reports and what is sent away to be compared.
  /* Worked out when the matrix or the register changes and not on every
     render: the gate hands back a new object whenever it has renamed anything,
     and forty-three rows of fifty-three items rebuilt on every keystroke is
     felt. */
  const quals = useMemo(() => crewRowsOnly(store.quals || QUALS, store.people, NO_EXPIRY_CODES),
    [store.quals, store.people]);
  const setQuals = put("quals");
  const docs = store.docs,                 setDocs = put("docs");
  // Matrix spreadsheets filed before the portal kept the date itself. Nothing
  // writes to this any more — it is read only so that a matrix updated back then
  // still shows a date rather than nothing.
  const matrixArchive = store.matrixArchive;
  const certificates = store.certificates || [];
  const certSheet = store.certSheet || null;
  // Falls back to the newest spreadsheet on file, so a matrix updated before
  // this was recorded still shows a date rather than nothing.
  const matrixUpdated =
    store.matrixUpdated || (matrixArchive && matrixArchive[0] ? matrixArchive[0].uploaded : "");
  const setMatrixUpdated = put("matrixUpdated");
  const certAnalysis = store.certAnalysis || null;
  const setCertAnalysis = put("certAnalysis");
  // The dates the certificates on file carry — issued and expires, keyed
  // "PERSON::CODE" — for the date columns on the certification screens. Each
  // entry also carries the issuing authority as it was read off the scan (for
  // the not-Australian flag on the checker) and a link to the scan itself, so
  // the Certificate column on those screens can open the certificate.
  const certDates = store.certDates || null;
  const setCertDates = put("certDates");
  // The standing notes on the certification pages. Held in the shared state so
  // an admin can add or reword one and every device reads the same list; the
  // built-in notes seed it until somebody edits.
  // A list, whatever an older save left here — the notes panel maps over it.
  const certNotes = Array.isArray(store.certNotes) ? store.certNotes : CERT_PAGE_NOTES;
  const setCertNotes = put("certNotes");
  // What has been done about each OPMS disagreement, keyed by the finding —
  // "sent" (reported to OPMS, with the date) or "fixed" (corrected on our
  // side). Shared, so the same item isn't chased twice by two admins, and so
  // next week's run remembers what was already dealt with.
  const opmsMarks = store.opmsMarks || {};
  const setOpmsMarks = put("opmsMarks");
  // What is being done about each certificate that has gone red — booked,
  // chased, or evidence in hand — keyed "PERSON::CODE". Each mark carries the
  // day it was made, who made it, and a one-line note. Shared, so every admin
  // sees what is already in motion and nothing is chased twice. Marks need no
  // tidying up: once the renewal is filed and the item leaves the red lists,
  // the mark has nowhere left to show.
  const renewalMarks = store.renewalMarks || {};
  const setRenewalMarks = put("renewalMarks");
  const validityPeriods = store.validityPeriods || null;
  const setValidityPeriods = put("validityPeriods");
  const refreshCertDates = async () => {
    // The validity periods ride along with the dates: both are readings the
    // server already holds, and every place that wants one fresh wants the other.
    try {
      const [r, v] = await Promise.all([
        analyse({ action: "dates" }),
        analyse({ action: "validity-periods" }).catch(() => null),
      ]);
      const map = {};
      /* The server reads these off the documents, which carry their folder's
         wording. Keyed under the register's name instead, so a date found in
         "Sam - OPMS" reaches Sam Sample's row. */
      const known = asKnownPerson(people);
      (r.dates || []).forEach((d) => {
        map[`${known(d.person).toUpperCase()}::${String(d.code || "").toUpperCase()}`] = {
          issued: d.issued || null,
          expires: d.expires || null,
          issuer: d.issuer || null,
          url: d.fileId ? `/api/files/${d.fileId}` : null,
        };
      });
      setCertDates({ at: r.at || new Date().toISOString(), map });
      if (v) {
        setValidityPeriods({
          at: new Date().toISOString(),
          filename: v.filename || null,
          read: v.read !== false,
          periods: v.periods || [],
        });
      }
    } catch (e) {
      // The columns keep showing whatever they had; the next run asks again.
    }
  };
  // The two required matrices, the validity periods matrix read alongside them,
  // and the last answer the AI gave on them.
  const trainingMatrix = store.trainingMatrix || null;
  const skillsMatrix = store.skillsMatrix || null;
  const crewRoster = store.crewRoster || null;
  const rosterPlan = store.rosterPlan || null, setRosterPlan = put("rosterPlan");
  const setCrewRoster = (record) => setStore((s) => ({ ...s, crewRoster: record }));
  // The validity periods ride on the skills matrix - the office folded the old
  // separate validity spreadsheet into it - so whatever skills matrix is on
  // file is also the validity periods document. There was once a slot of its
  // own for that spreadsheet; it held a copy of the skills matrix, nothing read
  // it, and it is gone. The newest skills matrix is the source, and there is no
  // second file to keep in step.
  const validityMatrix = store.skillsMatrix || null;
  const matrixAnalysis = store.matrixAnalysis || null;
  const setMatrixAnalysis = put("matrixAnalysis");
  // The latest spreadsheet out of OPMS, which the OPMS Checker reads from, and the
  // last answer the AI gave on it. The answer is kept with everything else the
  // portal shares, so it is on the page for whoever opens it next rather than
  // only for the admin who pressed the button.
  const opmsSheet = store.opmsSheet || null;
  const opmsAnalysis = store.opmsAnalysis || null;
  const setOpmsAnalysis = put("opmsAnalysis");
  // The office's shift allocation sheet, and the last answer the AI gave on it
  // against the swing roster. Shared like the others: the answer belongs to the
  // vessel rather than to whoever pressed the button.
  const shiftAllocation = store.shiftAllocation || null;
  const shiftAnalysis = store.shiftAnalysis || null;
  const setShiftAnalysis = put("shiftAnalysis");
  // The last swing compliance report, generated at the bottom of the Swing
  // Compliance page and shared like every other answer on the portal.
  const swingReport = store.swingReport || null;
  const setSwingReport = put("swingReport");

  // Files are the one thing that is always kept on the server. This used to run
  // once and never again, so a document someone else uploaded stayed invisible
  // until the page was reloaded — on a phone, where the portal is left open in a
  // tab for weeks, that could be days late. It now refreshes on the same footing
  // as everything else, and again the moment the phone comes back to it.
  /* The two polls, reachable from the round runner below: a round that has
     just landed on the server wants the files and the document pulled now,
     not on the next tick. Each hands a caller a fresh pull after any in
     flight (freshPull), so what comes back was asked for after the round
     saved. The tick and the wake-up keep sharing the one in flight. */
  const pullFilesRef = useRef(null);
  const pullStateRef = useRef(null);
  React.useEffect(() => {
    let alive = true;
    let inFlight = null;
    let seen = null;

    const pullFiles = () => {
      if (inFlight) return inFlight;
      inFlight = pullFilesOnce().finally(() => { inFlight = null; });
      return inFlight;
    };
    const pullFilesOnce = async () => {
      try {
        const items = await fetchStoredFiles();
        if (!alive) return;
        setFiles((f) => (f.state === "ok" && f.count === items.length ? f : { state: "ok", count: items.length }));

        // Most polls find exactly what the last one did. Leaving the page alone
        // in that case keeps a repost from landing on top of someone typing. The
        // fingerprint carries the filename and the folder as well as the id,
        // because a certificate moved into another person's folder is the same
        // file in a different place and has to reach the page as a change.
        const listing = items.map((i) => {
          const r = i.record || {};
          return `${r.id || ""}|${r.filename || ""}|${r.folder || ""}|${r.person || ""}|${r.uploaded || ""}`;
        }).join(",");
        if (listing === seen) return;
        seen = listing;

        storedFiles.current = items;
        setStore((s) => withStoredFiles(s, items));
      } catch (e) {
        if (alive) setFiles({ state: "error", msg: e.message });
      }
    };

    pullFilesRef.current = () => freshPull(inFlight, pullFiles);
    pullFiles();
    const id = setInterval(pullFiles, FILES_POLL_MS);
    const stopWatching = onWake(pullFiles);
    return () => { alive = false; pullFilesRef.current = null; clearInterval(id); stopWatching(); };
  }, []);

  // The matrix as this tab last loaded or saved it. A save that lands on
  // top of somebody else's is merged against this rather than laid over
  // theirs whole — see mergeQuals.
  const baseline = useRef(null);
  // The same for the three notes the round on the hour writes as well: the
  // cells filled from a certificate, the orphans it has seen, and what it
  // owes the workbook. Merged against these on a collision - see mergeSaved.
  const baselineFilled = useRef(null);
  const baselineSeen = useRef(null);
  const baselinePending = useRef(null);
  // And the change log, so a line the server has since taken off (a saved
  // version put back from Revisions) is not brought back by a tab that
  // still held it - only the lines this tab wrote since go over.
  const baselineHistory = useRef(null);
  const rebase = (data) => {
    baseline.current = (data && data.quals) || null;
    baselineFilled.current = (data && data.filledFromCert) || {};
    baselineSeen.current = (data && data.orphanSeen) || {};
    baselinePending.current = (data && data.workbookPending) || [];
    baselineHistory.current = (data && data.history) || [];
  };

  // Load once, then keep checking for other people's changes.
  React.useEffect(() => {
    let alive = true;
    let inFlight = null;

    // A poll and a wake-up can land together. One at a time is enough: a
    // second ask while one is running is handed the one running.
    const pull = () => {
      if (inFlight) return inFlight;
      inFlight = pullOnce().finally(() => { inFlight = null; });
      return inFlight;
    };
    const pullOnce = async () => {
      try {
        const { rev: serverRev, data } = await loadState();
        if (!alive) return;

        if (data && serverRev > rev.current && dirty.current.size === 0) {
          rev.current = serverRev;
          rebase(data);
          // Files always come from the file store, never from this document.
          setStore(withStoredFiles(data, storedFiles.current));
        } else if (!data && firstLoad.current) {
          // Nothing has ever been saved — put what the portal starts with on the
          // server so there is something for everyone else to load.
          const seeded = await saveState(withoutStoredFiles(store), 0);
          rev.current = seeded.rev;
          rebase(seeded.conflict && seeded.data ? seeded.data : store);
          // Somebody beat us to it by a fraction of a second. Theirs wins.
          if (seeded.conflict && seeded.data) {
            setStore(withStoredFiles(seeded.data, storedFiles.current));
          }
        }
        // The server has answered, so what is on screen from here is the shared
        // copy. Until this happens the portal is only holding the content it
        // ships with, which must never be shown as though it were the crew's.
        if (alive) setLoaded(true);
        if (alive) setSync({ state: "ok", at: new Date().toISOString().slice(11, 16) });
      } catch (e) {
        if (alive) setSync({ state: "error", msg: e.message });
      }
      // Anything changed before the first load finished was held back rather
      // than saved on top of nothing. Let it go up now.
      if (firstLoad.current) {
        firstLoad.current = false;
        if (alive && dirty.current.size > 0) setRetry((n) => n + 1);
      }
    };

    pullStateRef.current = () => freshPull(inFlight, pull);
    pull();
    const id = setInterval(pull, POLL_MS);
    const stopWatching = onWake(pull);
    return () => { alive = false; pullStateRef.current = null; clearInterval(id); stopWatching(); };
  }, []);

  // Push local changes up, shortly after they stop coming.
  React.useEffect(() => {
    if (firstLoad.current || dirty.current.size === 0) return;

    const id = setTimeout(async () => {
      // A save is already on its way. Come back once it has landed rather than
      // running two saves at each other.
      if (saving.current) { setRetry((n) => n + 1); return; }
      saving.current = true;

      const touched = [...dirty.current];
      // Where each slice's count of changes stood when this save left.
      const seen = new Map(touched.map((k) => [k, gen.current.get(k)]));
      try {
        const mine = withoutStoredFiles(store);
        let sent = mine;
        let res = await saveState(mine, rev.current);

        if (res.conflict) {
          // Someone saved while this was being typed. Rather than throw either
          // version away, take theirs and lay only the slices touched here back
          // on top of it. The matrix, the change log and the round's notes are
          // the exception: laid back whole, a tab that changed one cell ten
          // minutes ago would write its ten-minute-old copy over every date
          // the hour had filled in since. So only what this tab actually
          // changed goes back over theirs - see mergeSaved.
          // What this tab last loaded or saved, taken now: rebase moves it
          // on once the merged copy lands, and the edits made in the
          // meantime were built on this one.
          const base = { quals: baseline.current, filled: baselineFilled.current,
            seen: baselineSeen.current, pending: baselinePending.current,
            history: baselineHistory.current };
          const merged = mergeSaved({ touched, mine: store, theirs: res.data, base });
          sent = withoutStoredFiles(merged);
          res = await saveState(sent, res.rev);

          if (!res.conflict) {
            // Anything edited while the merged copy was in the air is laid
            // back over it the same way: only what that edit changed since
            // the copy the first save carried, which is what the edit was
            // built on. Kept raw, the local copy would be the one built
            // before the merge, without the hour's line and dates - and
            // the next save, on a rev that now matches, would write it
            // over them. See afterMergedSave.
            setStore((s) => withStoredFiles(afterMergedSave(s, merged, mine, [...dirty.current]), storedFiles.current));
          }
        }

        if (res.conflict) {
          // Two collisions in a row. The change is still pending, so try again.
          setSync({ state: "error", msg: "Someone else saved at the same moment - trying again" });
          setTimeout(() => setRetry((n) => n + 1), 1200);
          return;
        }

        rev.current = res.rev;
        rebase(sent);
        // A slice changed again while this save was in the air is still
        // unsaved, and stays on the list for the next one.
        settledKeys(touched, seen, gen.current).forEach((k) => dirty.current.delete(k));
        if (dirty.current.size === 0) setPending(false);
        else setRetry((n) => n + 1);
        setSync({ state: "ok", at: new Date().toISOString().slice(11, 16) });
      } catch (e) {
        setSync({ state: "error", msg: e.message });
        // A save that never got there, or that the server fell over on, is
        // tried again; one that would fail the same way next time is left
        // for the person to see (see saveTryAgainIn).
        const again = saveTryAgainIn(e);
        if (again) setTimeout(() => setRetry((n) => n + 1), again);
      } finally {
        saving.current = false;
      }
    }, SAVE_MS);

    return () => clearTimeout(id);
  }, [store, retry]);

  // What this tab holds unsaved goes up the moment it can: when the
  // connection comes back, and when a phone comes back to the portal after
  // the timers inside it were stopped in the background.
  React.useEffect(() => {
    const flush = () => { if (dirty.current.size > 0) setRetry((n) => n + 1); };
    window.addEventListener("online", flush);
    const stopWatching = onWake(flush);
    return () => { window.removeEventListener("online", flush); stopWatching(); };
  }, []);

  // Unread counts per section, so tabs can show a dot and the app icon a number.
  const [unread, setUnread] = useState({});
  const unreadTotal = Object.values(unread).reduce((a, b) => a + b, 0);

  // Paint the number on the installed app's icon, the way any other app does.
  // Only works once the portal is installed to the home screen. On iOS this
  // hands back a promise that is rejected whenever the badge isn't allowed,
  // which try/catch never sees — so it is turned down here rather than left to
  // surface as an unexplained failure.
  React.useEffect(() => {
    if (typeof navigator === "undefined") return;
    const quietly = (p) => { if (p && p.catch) p.catch(() => {}); };
    try {
      if (unreadTotal > 0 && navigator.setAppBadge) quietly(navigator.setAppBadge(unreadTotal));
      else if (navigator.clearAppBadge) quietly(navigator.clearAppBadge());
    } catch (e) {}
  }, [unreadTotal]);
  const admin = isAdmin(currentUser);

  // The date columns on the certification screens fill themselves in on first
  // load where certificates have already been read but nobody has pressed
  // Update matrix on this portal yet. Once, and only for an admin — the answer
  // is shared, so after that everyone reads what is already held.
  const askedCertDates = useRef(false);
  React.useEffect(() => {
    if (!loaded || !admin || askedCertDates.current || (store.certDates && store.validityPeriods)) return;
    askedCertDates.current = true;
    refreshCertDates();
  }, [loaded, admin]);

  const removeDoc = (key, doc, label) => {
    // A section added after the state was first saved has no list yet, so an
    // absent one reads as empty rather than breaking the page.
    setDocs((d) => ({ ...d, [key]: (d[key] || []).filter((x) => x.id !== doc.id) }));
    deleteStoredFile(doc, currentUser);
    log(label, `Removed "${doc.title}"`, `${doc.from} · restore it from the Admin tab`);
  };

  const addDoc = (key, doc, label) => {
    setDocs((d) => ({ ...d, [key]: [doc, ...(d[key] || [])] }));
    log(label, "Posted a document", `${doc.title} · ${doc.from}`);
  };

  // Certificates live in the file store too, one folder per person. Replacing an
  // existing one takes the old record off the page as the new one goes on.
  const addCertificates = (records, replacedIds = []) =>
    setStore((s) => ({
      ...s,
      certificates: [
        ...records,
        ...(s.certificates || []).filter((c) => !replacedIds.includes(c.id)),
      ],
    }));

  const removeCertificate = (cert) => {
    setStore((s) => ({ ...s, certificates: (s.certificates || []).filter((c) => c.id !== cert.id) }));
    deleteStoredFile(cert, currentUser);
    log("Admin", `Removed a certificate for ${cert.person}`, `${cert.filename} · restore it from the Admin tab`);
  };

  // A certificate whose details were corrected — the code it answers to, the
  // date it expires. The server row has already been changed; this puts the same
  // change on the page rather than waiting for the next poll.
  const updateCertificate = (id, fields) =>
    setStore((s) => ({
      ...s,
      certificates: (s.certificates || []).map((c) => (c.id === id ? { ...c, ...fields } : c)),
    }));

  // A certificate read as belonging to someone else has already been moved on the
  // server. This puts the same move on the page rather than waiting for the next
  // poll to notice a file that has the same id in a different folder.
  const refileCertificates = (moved) =>
    setStore((s) => {
      const by = new Map(moved.map((m) => [m.id, m]));
      return {
        ...s,
        certificates: (s.certificates || []).map((c) => {
          const m = by.get(c.id);
          return m ? { ...c, person: m.to, folder: m.folder, filename: m.filename } : c;
        }),
      };
    });

  // One spreadsheet at a time: a new one takes the place of whatever was there.
  const setCertSheet = (record) => setStore((s) => ({ ...s, certSheet: record }));

  // The same for the two matrices. These are file records rather than typed
  // content, so they are set straight onto the store without being marked dirty —
  // the server already holds them, and the next file poll would say the same.
  const setTrainingMatrix = (record) => setStore((s) => ({ ...s, trainingMatrix: record }));
  const setSkillsMatrix = (record) => setStore((s) => ({ ...s, skillsMatrix: record }));
  const setOpmsSheet = (record) => setStore((s) => ({ ...s, opmsSheet: record }));
  const setShiftAllocation = (record) => setStore((s) => ({ ...s, shiftAllocation: record }));

  // Single place every section reports changes to — and the one hook that
  // fires a notification, so anything logged is something crew can be told about.
  const log = (section, action, detail = "") => {
    setHistory((h) => [
      { id: "h" + Date.now() + Math.random(), at: new Date().toISOString().slice(0, 16), by: currentUser, section, action, detail },
      ...h,
    ].slice(0, HISTORY_LIMIT));
    if (section !== "Admin") {
      setUnread((u) => ({ ...u, [section]: (u[section] || 0) + 1 }));
    }
    if (notifyOn && section !== "Admin" && typeof Notification !== "undefined" && Notification.permission === "granted") {
      try { new Notification(section, { body: action, tag: section }); } catch (e) {}
    }
  };

  // ---- the round, started from the page --------------------------------------
  //
  // One runner behind every Update matrix button, the certificate upload and
  // Update portal. The page does what only a page can - reads the new
  // certificates (the extract loop spends model credit and cannot fit one
  // request) and refiles them - and then starts the server's round (POST
  // /api/round), the same code the hour runs, under the same lease. The
  // server is the one writer: it puts the dates on the shared document and
  // into the office's workbook, and this tab pulls the document back rather
  // than applying anything itself. It lives here so any screen can start it,
  // it carries on when the admin moves to another tab, and it is watched
  // from the one window (UpdateMatrixRun) wherever they are.
  //
  // matrixRun: null | { phase, origin, by, read, total, filed, toFile, pct,
  //   word, outcome, message } - phase is "reading", "filing", "starting"
  //   (the server's round, with its pct and word), "waiting" (for the hour
  //   to let go of the lease), "done" (with the outcome) or "failed".
  const [matrixRun, setMatrixRun] = useState(null);
  const clearMatrixRun = () => setMatrixRun(runCleared);

  // What the run reads is what is on the page at the moment it reads it, not
  // at the moment it was set going several renders earlier.
  const matrixRunInputs = useRef(null);
  matrixRunInputs.current = { quals, skillsMatrix };

  // One run at a time. A start landing mid-run is remembered and run once
  // the current one finishes, because a run that started before it can't
  // have counted what it was started for.
  const matrixRunState = useRef({ running: false, queued: null });

  /* The document pulled now, once this tab has nothing unsaved and no save
     in the air (a pull leaves the document alone while it has), so the
     matrix on screen is the row the round just saved. Waits up to twenty
     seconds for that, then pulls anyway and says so - see pullNowStep. */
  const pullNow = async () => {
    const t0 = Date.now();
    let late = false;
    for (;;) {
      const step = pullNowStep({ dirty: dirty.current.size, saving: saving.current, waitedMs: Date.now() - t0 });
      if (step === "pull") break;
      if (step === "pull-late") { late = true; break; }
      await new Promise((ok) => setTimeout(ok, 250));
    }
    if (pullStateRef.current) await pullStateRef.current();
    return late;
  };

  const runMatrixRound = async (input = {}) => {
    if (matrixRunState.current.running) {
      // Answered when the round that runs for this ask has finished (queueRound).
      return new Promise((ok) => { matrixRunState.current.queued = queueRound(matrixRunState.current.queued, input, ok); });
    }
    matrixRunState.current.running = true;

    const origin = input.origin || "button";
    const by = String(input.by || role || "").trim() || "the page";
    const base = { origin, by, read: 0, total: 0, filed: 0, toFile: 0, pct: 0, word: "" };
    let progress = { read: 0, total: 0 };
    const moved = [];
    let prepareProblem = null;
    // The round's own progress, read every second and a half; the request
    // is raced against the record saying the round was cut off, and kept
    // alive either way (cutOffSwitch).
    let poll = null;
    let cutOff = false;
    let cutOffSeen = 0;
    const stopPoll = () => { if (poll) clearInterval(poll); poll = null; };
    const { tripped: cutOffP, cutOffNow } = cutOffSwitch();
    let last = null;
    const show = (next) => { last = next; setMatrixRun(next); };

    try {
      const QUALS = matrixRunInputs.current.quals || { cols: [], rows: [] };
      /* The crew matrix having no items on it is not a fault; it is a portal
         that has just been started again. Said plainly rather than thrown
         out as an error about the items not being included. */
      if (!(QUALS.cols || []).length) {
        show({ ...base, phase: "done", outcome: { noItems: true } });
        return last;
      }

      show({ ...base, phase: "reading" });

      /* The skills matrix read again on every round - the same read Update
         portal makes - so the requirements the certification screens hold
         follow a new skills matrix without anybody opening a page for it.
         It failing is not worth losing the round over. */
      const skills = matrixRunInputs.current.skillsMatrix;
      if (skills && skills.url) {
        try {
          const read = await readSkillsMatrix(skills, QUALS.cols || []);
          if (read) setSkillsRequirements(read);
        } catch (e) { /* the list the portal already holds stands */ }
      }

      /* The rules the round reads by - the Equivalence sheet and the expiry
         rules off the skills matrix - kept on the server before the page
         reads and refiles, so a certificate the sheet re-homes is renamed on
         this press rather than the one after. Its problem, if any, is said
         on the done panel; it is not a reason to stop. */
      try {
        const r = await fetch("/api/round/prepare", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
        const out = await r.json().catch(() => ({}));
        prepareProblem = r.ok ? (out.problem || null) : (out.error || `The rules couldn't be kept (${r.status}).`);
      } catch (e) {
        prepareProblem = e.message || String(e);
      }

      // Every certificate not read yet. Readings are kept as they are made,
      // so this costs the new uploads only.
      progress = await readCertificates({
        quals: QUALS, fresh: false,
        onPhase: (p) => { progress = { read: p.read, total: p.total }; show({ ...base, ...p, phase: "reading" }); },
      });

      // Certificates filed under the wrong person are moved before the round
      // compares, or they would be held against the wrong row. A slice at a
      // time: the window keeps count, and no single request is asked to
      // move more files than it can finish. What a pass couldn't reach is
      // left for the next press or the hour. Failing is not worth losing
      // the round over.
      show({ ...base, ...progress, phase: "filing" });
      try {
        let filed = 0;
        for (let pass = 0; pass < 200; pass++) {
          const r = await analyse({ action: "refile", names: (QUALS.rows || []).map((row) => row[0]), limit: 40 });
          const got = r.moved || [];
          got.forEach((m) => moved.push(m));
          filed += got.length;
          const left = Number(r.remaining) || 0;
          show({ ...base, ...progress, phase: "filing", filed, toFile: filed + left });
          if (!left || !got.length) break;
        }
      } catch (e) {
        // Whatever was filed stands; the rest is picked up next time.
      }
      if (moved.length) {
        refileCertificates(moved);
        // The server's round does not know about the page's refile, so the
        // line in the log is the page's to write.
        log("Admin", `Refiled ${moved.length} certificate${moved.length === 1 ? "" : "s"}`,
          moved.map((m) => `${m.filename} → ${m.to}`).join(", "));
      }

      // The server's round, watched by the runId this page sends: only a
      // progress record carrying it is this round's (progressAccept).
      // (A page opened over plain http has no randomUUID; a stamp will do,
      // the mark only has to be this round's and nobody else's.)
      const runId = crypto.randomUUID ? crypto.randomUUID() : "run-" + Date.now() + "-" + Math.random().toString(36).slice(2);
      show({ ...base, ...progress, phase: "starting", pct: 0, word: "Starting" });
      poll = setInterval(async () => {
        let rec = null;
        try {
          const r = await fetch("/api/round/progress", { cache: "no-store" });
          if (r.ok) rec = await r.json();
        } catch (e) { return; }
        if (!poll) return;
        const got = progressAccept(rec, runId);
        if (got === "ignore") return;
        if (got === "cut-off") {
          // Twice running, three seconds apart: the server reads the record
          // before the lease, so a round finishing between the two reads
          // looks cut off for one look and is not.
          if (++cutOffSeen < 2) return;
          cutOff = true;
          stopPoll();
          cutOffNow();
          return;
        }
        cutOffSeen = 0;
        setMatrixRun((m) => (m && m.phase === "starting" ? { ...m, pct: got.pct, word: got.word } : m));
      }, 1500);

      const post = () => fetch("/api/round", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ by, runId }),
      });
      let r = await Promise.race([post(), cutOffP]);
      let body = await r.json().catch(() => ({}));
      let answer = roundAnswerPhase(r.status, body, by);
      if (answer === "waiting") {
        // The hour holds the lease: wait for it to let go, then once more.
        show({ ...base, ...progress, phase: "waiting" });
        await waitForRound(undefined, setRoundRunning);
        show({ ...base, ...progress, phase: "starting", pct: 0, word: "Starting" });
        r = await Promise.race([post(), cutOffP]);
        body = await r.json().catch(() => ({}));
        answer = roundAnswerPhase(r.status, body, by);
        if (answer === "waiting") answer = "failed:" + (body.error || ROUND_BUSY);
      }
      if (answer !== "done") {
        // A person's round: the buttons that write the workbook stay down,
        // under that person's name, until the lease drops - watched for
        // from here rather than left to the next tick.
        if (r.status === 409) {
          setRoundRunning(true, typeof body.by === "string" ? body.by : "");
          waitForRound(undefined, setRoundRunning).catch(() => {});
        }
        throw new Error(answer.slice("failed:".length));
      }
      stopPoll();
      setRoundRunning(false);
      const outcome = body || {};
      show({ ...base, ...progress, phase: "starting", pct: 100, word: "Done" });

      // The round saved the document and filed the workbook. This tab reads
      // both back rather than applying anything itself: the files first, so
      // trainingMatrix is the new row, then the document.
      if (pullFilesRef.current) await pullFilesRef.current().catch(() => {});
      const late = await pullNow();
      await refreshCertDates();

      // The swing report reads when the matrix was last brought up to the
      // certificates from here (matrixFresh), so the round's stamp goes on.
      setCertAnalysis({
        at: outcome.at, by, model: "round", items: [], notes: [], summary: outcome.summary || {}, verdicts: {},
        generated: {
          at: outcome.at, by, filename: outcome.workbook || null, applied: outcome.applied || 0, dismissed: 0,
          fileId: outcome.workbookId || null, failed: outcome.workbookProblem || outcome.roundError || null,
        },
      });

      show({
        ...base, ...progress, phase: "done",
        outcome: { ...outcome, refiled: moved.length, moved, prepareProblem, note: late ? PULL_LATE_NOTE : null },
      });
      return last;
    } catch (e) {
      // Whatever was filed is filed either way, and every reading is kept.
      const message = cutOff ? CUT_OFF : (e && e.message) || String(e);
      show({ ...base, ...progress, phase: "failed", message });
      return last;
    } finally {
      stopPoll();
      matrixRunState.current.running = false;
      const queued = matrixRunState.current.queued;
      matrixRunState.current.queued = null;
      // Whoever asked while this one ran is answered by the round that runs for them.
      if (queued) {
        runMatrixRound(queued.input).then(
          (r) => queued.waiters.forEach((ok) => ok(r)),
          () => queued.waiters.forEach((ok) => ok(null)),
        );
      }
    }
  };

  // Admin can remove anything. Crew can remove what was posted from this browser.
  const canDelete = (item) => admin || (item && item.session === SESSION);

  const addComment = (itemId, text, name) => {
    const c = { id: "c" + Date.now(), text, by: name || (admin ? "Admin" : "Crew"), date: todayISO(), session: SESSION };
    setComments((m) => ({ ...m, [itemId]: [...(m[itemId] || []), c] }));
    log("Comments", "Comment added", text.slice(0, 90) + (text.length > 90 ? "..." : ""));
  };

  const removeComment = (itemId, cid) => {
    setComments((m) => ({ ...m, [itemId]: (m[itemId] || []).filter((c) => c.id !== cid) }));
    log("Comments", "Comment deleted");
  };

  const hideTab = (id, label) => {
    setHiddenTabs((h) => (h.includes(id) ? h : [...h, id]));
    // Landing on a tab that has itself been removed is what left the portal
    // showing an empty section with nothing in the bar above it. Move to
    // whatever is still there instead.
    if (tab === id) {
      const left = ALL_TABS.find((t) => t.id !== id && !hiddenTabs.includes(t.id));
      setTab(left ? left.id : "admin");
    }
    log("Admin", `Removed the ${label} tab`, "Restore it from the Admin tab");
  };

  const restoreTab = (id, label) => {
    setHiddenTabs((h) => h.filter((x) => x !== id));
    log("Admin", `Restored the ${label} tab`);
  };

  const restoreAllTabs = () => {
    setHiddenTabs([]);
    log("Admin", "Restored every section", "All tabs are back for everyone");
  };

  // A tab clears its dot when opened; History clears everything.
  const SECTIONS_FOR_TAB = {
    handover: ["Handover Notes"],
    correspondence: [VESSEL.labels.correspondence, VESSEL.labels.pwCorrespondence, VESSEL.labels.vesselSafety, VESSEL.labels.partnershipSafety],
    documentation: [VESSEL.labels.documentation, "Insurance", VESSEL.labels.travel, "Templates", VESSEL.labels.agreements],
    suggestions: ["Crew Suggestions"],
    "app-suggestions": ["App / Portal Suggestions"],
  };

  const openTab = (id) => {
    setTab(id);
    setUnread((u) => {
      const next = { ...u };
      if (id === "history") return {};
      (SECTIONS_FOR_TAB[id] || []).forEach((sec) => delete next[sec]);
      return next;
    });
  };

  const countFor = (id) =>
    id === "history"
      ? unreadTotal
      : (SECTIONS_FOR_TAB[id] || []).reduce((n, sec) => n + (unread[sec] || 0), 0);

  const ALL_TABS = [
    { id: "correspondence", label: VESSEL.labels.correspondence },
    { id: "handover", label: "Handover Notes" },
    { id: "training", label: "Crew Matrix" },
    { id: "crew-roster", label: "Roster" },
    { id: "fauna", label: "Fauna Log" },
    { id: "documentation", label: "Documentation" },
    { id: "upload-certs", label: "Upload Crew Certificates" },
    { id: "suggestions", label: "Crew Suggestions" },
    { id: "history", label: "History" },
    { id: "app-suggestions", label: "App / Portal Suggestions" },
  ];

  // The hidden-sections state is shared and outlives the code: the AI Checker
  // was a tab here before it moved onto the Admin tab, and anyone who had
  // hidden it would otherwise carry a hidden section that no longer exists —
  // counted in the Admin banner, restorable only by "Restore all". Ids that no
  // longer name a tab are ignored everywhere.
  const hiddenNow = hiddenTabs.filter((id) => ALL_TABS.some((t) => t.id === id));

  const TABS = [
    ...ALL_TABS,
    ...(admin ? [{ id: "admin", label: "Admin" }] : []),
  ].filter((t) => !hiddenNow.includes(t.id) || t.id === "admin");

  // Every section can be removed from the Admin tab, and removing all of them
  // used to leave the portal looking as though everything in it had been lost:
  // an empty bar, and below it whichever section happened to be open, still
  // rendered even though it had been taken away. The tab that is shown is now
  // always one that is actually there.
  const shown = TABS.some((t) => t.id === tab) ? tab : (TABS[0] ? TABS[0].id : null);

  const views = {
    handover: <HandoverNotes notes={notes} setNotes={setNotes} log={log} />,
    correspondence: <PartnershipHub data={correspondence} setData={setCorrespondence} currentUser={currentUser} log={log} docs={docs} addDoc={addDoc} removeDoc={removeDoc} pwData={pwCorrespondence} setPwData={setPwCorrespondence} />,
    training: <TrainingMatrix />,
    "crew-roster": <RosterListPage />,
    fauna: <FaunaLog />,

    documentation: <DocumentationHub docs={docs} addDoc={addDoc} removeDoc={removeDoc} currentUser={currentUser}
      people={people} setPeople={setPeople} overrides={overrides} setOverrides={setOverrides} log={log} />,
    "upload-certs": <CrewCertificateUpload />,
    suggestions: <SuggestionBoard data={suggestions} setData={setSuggestions} log={log} currentUser={currentUser}
      title="Crew Suggestions" logLabel="Crew Suggestions"
      placeholder="Anything that would make the job safer, quicker or less painful." />,
    "app-suggestions": <SuggestionBoard data={appSuggestions} setData={setAppSuggestions} log={log} currentUser={currentUser}
      title="App / Portal Suggestions" logLabel="App / Portal Suggestions"
      blurb="Ideas for the portal itself - what's missing, what's awkward, what would make it more useful."
      placeholder="What would you change about this portal?" />,
    history: <History entries={history} />,
    admin: <Admin currentUser={currentUser} people={people} notes={notes} files={files} sync={sync}
      setPeople={setPeople} overrides={overrides} setOverrides={setOverrides} log={log}
      swingBoard={swingBoard} setSwingBoard={setSwingBoard}
      corrCount={correspondence.length} history={history}
      allTabs={ALL_TABS} hiddenTabs={hiddenNow} onHideTab={hideTab}
      onRestoreTab={restoreTab} onRestoreAllTabs={restoreAllTabs} />,
  };

  /* The swing that is on is written to the archive as it stands, under its
     swing number, whenever it changes — so the day it ends, the record of it
     is already there. Records older than five years are let go. */
  React.useEffect(() => {
    if (!quals || !quals.rows) return;
    const k = currentSwingIndex();
    const entry = swingSnapshot(k, people, swingBoard, swingDates, quals);
    const keep = isoShift(todayISO(), -(ARCHIVE_YEARS * 365 + 2));
    const stale = Object.keys(swingArchive || {}).filter((key) => (swingArchive[key] || {}).flyHome < keep);
    const same = JSON.stringify((swingArchive || {})[k] || null) === JSON.stringify(entry);
    if (same && !stale.length) return;
    setSwingArchive((a) => {
      const next = { ...(a || {}) };
      stale.forEach((key) => { delete next[key]; });
      next[k] = entry;
      return next;
    });
  }, [people, swingBoard, swingDates, quals, swingArchive]);

  useFitToWidth();

  /* Taking a crew member off the portal, everywhere at once.
   *
   * A person is written down in more places than anyone holds in their head:
   * the crew matrix, the roster's swings, the crew list the swing board is
   * built from, the one-off changes against their name, the renewal notes,
   * and their certificates. Left to be done by hand, some of it is always
   * missed, and the portal goes on half-believing in somebody who has gone.
   *
   * Their certificates are archived rather than destroyed - the same removal
   * the Admin tab can undo - because a person leaving is not a reason to burn
   * the evidence they were ever qualified.
   *
   * Whoever calls this has already asked. It does not ask again. */
  /* The two workbooks the office keeps, brought into line with a crew change
   * without anyone having to remember to press anything.
   *
   * The roster workbook is rewritten from the plan either way, so it simply
   * says what the portal says. The training matrix is a cell-by-cell document
   * with formulas and print ranges pointing at fixed rows, so a person coming
   * off has their row emptied rather than lifted out - the line stays, with
   * nothing on it - and a person going on gets a row on the end, under the
   * last of the crew, formatted like the row above it.
   *
   * Their dates are not written here. Those come off their certificates, which
   * is the long read behind Update matrix; this puts the person on the
   * sheet so the next round has a row to fill.
   *
   * It runs after the change rather than as part of it: a workbook that cannot
   * be reached is a reason to say so, not a reason to leave a person half on or
   * half off the portal.
   */
  const writeCrewToWorkbooks = async ({ want, plan, rows, leaving }) => {
    const trouble = [];
    const written = [];

    if (crewRoster && crewRoster.url && plan) {
      try {
        const record = await fileRosterWorkbook(crewRoster, plan, role);
        if (record) setCrewRoster(record);
        setRosterPlan((p) => (p ? { ...p, edited: false, filename: crewRoster.filename, savedAt: todayISO() } : p));
        written.push("the roster workbook rewritten");
      } catch (e) {
        trouble.push("the roster workbook: " + (e.message || String(e)));
      }
    }

    /* Nothing is written into the training matrix while the crew matrix has
       no columns. The workbook is found by looking for its row of item codes,
       and with no codes to look for there is nothing to match - which comes
       back as "it isn't laid out like the crew qualification workbook", which
       is true of no workbook and alarming to read. A portal that has just been
       started again is in exactly this state. */
    const haveCodes = ((rows || quals.rows) && (quals.cols || []).length > 0);
    if (!haveCodes) {
      written.push("the training matrix was left alone — the crew matrix has no items on it yet");
    } else if (trainingMatrix && trainingMatrix.url && /\.xls[xm]$/i.test(trainingMatrix.filename || "") && zipCapable()) {
      try {
        const resp = await fetch(trainingMatrix.url);
        if (!resp.ok) throw new Error("it couldn't be downloaded (" + resp.status + ")");
        /* Coming off: no cells are written and the emptying is the whole of it.
           Going on: the write is narrowed to their cells alone, which is what
           tells the workbook there is a row of theirs to put on the end. */
        const sheet = { cols: quals.cols, rows: rows || quals.rows };
        const only = leaving
          ? new Set()
          : new Set(sheet.cols.map((c) => String(want).trim().toUpperCase() + "|" + c[0]));
        const { blob } = await updateFiledWorkbook(
          await resp.arrayBuffer(), sheet, only, leaving ? new Set([want]) : null);
        if (blob) {
          const file = new File([blob], trainingMatrix.filename, { type: XLSX_MIME });
          const up = await uploadSingleDocument(file, "training-matrix",
            { uploadedBy: role, filedOn: todayISO(), session: SESSION }, "replace");
          if (up.record) setTrainingMatrix(up.record);
          written.push(leaving
            ? "their row emptied on the training matrix"
            : "a row put on the end of the training matrix for them");
        } else {
          written.push(leaving
            ? "the training matrix had no row of theirs to empty"
            : "the training matrix couldn't take a row on the end, so add one by hand");
        }
      } catch (e) {
        trouble.push("the training matrix workbook: " + (e.message || String(e)));
      }
    }

    // What was actually done, said plainly. A workbook nobody has filed on the
    // portal is neither a success nor a failure, and is not reported as either.
    if (!trouble.length && !written.length) return { ok: true, said: "no workbook is filed on the portal to update" };
    const what = want + (leaving ? " coming off" : " going on");
    log("Admin", trouble.length
      ? "The spreadsheets could not be brought into line with " + what
      : "The spreadsheets brought into line with " + what,
      [...written, ...trouble].join(" · "));
    return { ok: !trouble.length, said: [...written, ...trouble].join(" · ") };
  };

/* One person renamed everywhere the portal writes their name down.
   *
   * The same sweep as taking somebody off, changing rather than dropping, and
   * written through the portal's own setters because those are what mark a
   * slice as changed - written straight into the store, the new name would go
   * from the screen and the old one be back on the next load.
   *
   * His certificates come with him. The files themselves do not move - they
   * are in the office's folders and they stay there - but the name on the page
   * changes with everything else, and the spelling he is leaving behind is
   * kept as one of his on the register, so the next poll reads the server's
   * copy back as him rather than as a stranger.
   */
  const renameCrew = (from, to) => {
    const was = String(from || "").trim();
    const now = canonicalName(to || "");
    if (!was || !now || was === now) return { ok: false };
    const letters = (n) => String(n || "").toUpperCase().replace(/[^A-Z]/g, "");
    const same = (n) => letters(n) === letters(was);
    const done = { matrix: 0, crewList: 0, swings: 0, lists: 0, marks: 0 };

    /* The matrix as the portal reads it, not the raw slice the store holds.
       A portal that has never had a crew matrix filed holds nothing there and
       reads the built-in one instead - and writing the slice back would have
       put an empty matrix over the top of it and lost every row. Written only
       where a row actually changed, for the same reason. */
    {
      const rows = (quals.rows || []).map((r) => {
        if (!same(r[0])) return r;
        done.matrix++;
        return [now, r[1], r[2], r[3]];
      });
      if (done.matrix) setQuals({ ...quals, rows });
    }

    setPeople((list) => (list || []).map((p) => {
      if (!same(p.name)) return p;
      done.crewList++;
      /* The spelling he is leaving behind becomes one of his. A spreadsheet, a
         folder or a certificate filed under it is still calling him that, and
         the register is the thing that stops that mattering. */
      return { ...p, name: now, aliases: [...new Set([...(p.aliases || []), p.name])] };
    }));

    setRosterPlan((plan) => {
      if (!plan) return plan;
      let hit = 0;
      const rows = (plan.rows || []).map((r) => {
        if (!same(r.name)) return r;
        hit++;
        return { ...r, name: now };
      });
      done.swings = hit;
      return hit ? { ...plan, rows, edited: true, updatedAt: todayISO() } : plan;
    });

    setSwingLists((held) => {
      const next = {};
      Object.entries(held || {}).forEach(([k, list]) => {
        next[k] = {
          ...list,
          entries: (((list || {}).entries) || []).map((e) => {
            if (!same(e.name)) return e;
            done.lists++;
            return { ...e, name: now };
          }),
        };
      });
      return next;
    });

    /* The notes and the "this came off a certificate" marks are kept under
       "NAME::ITEM". Re-keyed rather than dropped, so a note written against a
       man under the wrong name is still his afterwards. */
    const rekey = (held) => {
      const next = {};
      Object.entries(held || {}).forEach(([k, v]) => {
        const join = k.includes("::") ? "::" : "|";
        const parts = k.split(join);
        if (parts.length > 1 && same(parts[0])) {
          next[now.toUpperCase() + join + parts.slice(1).join(join)] = v;
          done.marks++;
        } else next[k] = v;
      });
      return next;
    };
    setRenewalMarks(rekey(renewalMarks));
    setOpmsMarks(rekey(opmsMarks));
    setFilledFromCert(rekey(filledFromCert));

    /* His certificates, on the page, now. The server's copy still carries the
       old spelling and the relabel runs alongside this - but the register
       answers to that spelling as his from here on, so the next poll reads it
       back as him either way. Written here as well so the certificate list
       says the new name the moment the button is pressed. */
    setStore((st) => ({
      ...st,
      certificates: (st.certificates || []).map((c) => (same(c.person) ? { ...c, person: now } : c)),
    }));

    log("Admin", was + " is " + now,
      [done.matrix ? "the matrix" : null, done.crewList ? "the crew list" : null,
        done.swings ? done.swings + " roster rows" : null].filter(Boolean).join(" · ")
      || "nothing was holding the old name");
    return { ok: true, ...done };
  };

  /**
   * Somebody's rank, changed once and landing everywhere.
   *
   * A rank is written down in three places and they used to be set one at a
   * time: the row the office sends on the crew matrix, the man's own entry on
   * Crew Details, and the rows the roster is built from. Changed on one page
   * only, the other two went on saying what they said before - so the
   * certificate list called him a Master and the roster still had him an IR.
   *
   * All three are set together here, through the portal's own setters, which
   * is what has every page holding his details read the new rank at once
   * rather than after a reload. The department follows the rank, because it
   * has only ever been worked out from it.
   */
  const setCrewRank = (name, rank) => {
    const who = String(name || "").trim();
    const job = String(rank || "").trim();
    if (!who) return { ok: false };
    const letters = (n) => String(n || "").toUpperCase().replace(/[^A-Z]/g, "");
    const same = (n) => letters(n) === letters(who);
    const done = { matrix: 0, crewList: 0, swings: 0 };

    // What it was, read before anything is set, so the log says so plainly.
    const was = ((quals.rows || []).find((r) => same(r[0])) || [])[1]
      || ((people || []).find((p) => same(p.name)) || {}).rank || "";
    if (String(was) === job) return { ok: false };

    // The matrix as the portal reads it, and written back only where a row
    // changed - see renameCrew for why the raw slice is no good here.
    {
      const rows = (quals.rows || []).map((r) => {
        if (!same(r[0]) || String(r[1] || "") === job) return r;
        done.matrix++;
        return [r[0], job, r[2], r[3]];
      });
      if (done.matrix) setQuals({ ...quals, rows });
    }

    setPeople((list) => (list || []).map((p) => {
      if (!same(p.name) || (p.rank || "") === job) return p;
      done.crewList++;
      return { ...p, rank: job, dept: job ? deptForRank(job) : p.dept };
    }));

    setRosterPlan((plan) => {
      if (!plan) return plan;
      let hit = 0;
      const rows = (plan.rows || []).map((r) => {
        if (!same(r.name) || String(r.rank || "") === job) return r;
        hit++;
        return { ...r, rank: job };
      });
      done.swings = hit;
      return hit ? { ...plan, rows, edited: true, updatedAt: todayISO() } : plan;
    });

    log("Admin", who + " is " + (job || "on no rank"),
      [was ? "was " + was : null,
        done.matrix ? "the matrix" : null,
        done.crewList ? "the register" : null,
        done.swings ? done.swings + " roster rows" : null].filter(Boolean).join(" · ")
      || "nothing was holding a rank for him");
    return { ok: true, ...done };
  };

  const removeCrew = (name) => {
    const want = String(name || "").trim();
    if (!want) return { ok: false };
    const same = (n) => String(n || "").toUpperCase().replace(/[^A-Z]/g, "")
      === want.toUpperCase().replace(/[^A-Z]/g, "");

    const gone = { matrix: 0, swings: 0, crewList: 0, certificates: 0 };

    // The crew matrix.
    setQuals((q) => {
      const rows = (q.rows || []).filter((r) => !same(r[0]));
      gone.matrix = (q.rows || []).length - rows.length;
      return { ...q, rows };
    });

    // The roster's swings. The plan as it will stand is kept hold of, because
    // it is what the workbook has to be written from a moment later.
    let plannedAfter = rosterPlan;
    setRosterPlan((plan) => {
      if (!plan) return plan;
      const rows = (plan.rows || []).filter((r) => !same(r.name));
      gone.swings = (plan.rows || []).length - rows.length;
      if (!gone.swings) return plan;
      plannedAfter = { ...plan, rows, edited: true, updatedAt: todayISO() };
      return plannedAfter;
    });

    /* The crew list, and everything keyed to the person it holds. Written
       through the portal's own setters rather than straight into the store,
       because those are what mark a slice as changed - written straight in,
       the person would go from the screen and be back on the next load. */
    const leaving = (people || []).filter((p) => same(p.name));
    if (leaving.length) {
      gone.crewList = leaving.length;
      const ids = new Set(leaving.map((p) => p.id));
      setPeople((list) => (list || []).filter((p) => !ids.has(p.id)));
      setOverrides((held) => {
        const next = { ...(held || {}) };
        Object.keys(next).forEach((k) => { if (ids.has(String(k).split(":")[0])) delete next[k]; });
        return next;
      });
      setSwingBoards((held) => {
        const next = {};
        Object.entries(held || {}).forEach(([k, board]) => {
          const side = { ...(board.side || {}) };
          const shift = { ...(board.shift || {}) };
          const window = { ...(board.window || {}) };
          ids.forEach((id) => { delete side[id]; delete shift[id]; delete window[id]; });
          next[k] = { ...board, side, shift, window };
        });
        return next;
      });
      setSwingBoard((board) => {
        const side = { ...((board || {}).side || {}) };
        const shift = { ...((board || {}).shift || {}) };
        const window = { ...((board || {}).window || {}) };
        ids.forEach((id) => { delete side[id]; delete shift[id]; delete window[id]; });
        return { ...(board || {}), side, shift, window };
      });
    }

    // The notes kept against their name.
    const strip = (held) => {
      const next = { ...(held || {}) };
      Object.keys(next).forEach((k) => { if (same(k.split("::")[0]) || same(k.split("|")[0])) delete next[k]; });
      return next;
    };
    setRenewalMarks(strip(renewalMarks));
    setOpmsMarks(strip(opmsMarks));

    // Their certificates, archived where they can be fetched back.
    const theirs = (certificates || []).filter((c) => same(c.person));
    gone.certificates = theirs.length;
    theirs.forEach((c) => deleteStoredFile(c, currentUser));
    setStore((st) => ({ ...st, certificates: (st.certificates || []).filter((c) => !same(c.person)) }));

    log("Admin", want + " taken off the portal",
      [gone.matrix ? "matrix row" : null,
        gone.swings ? gone.swings + " swing entries" : null,
        gone.crewList ? "crew list" : null,
        gone.certificates ? gone.certificates + " certificates archived" : null]
        .filter(Boolean).join(" · ") || "nothing was held against the name");

    // The office's spreadsheets follow, on their own, in the background.
    writeCrewToWorkbooks({ want, plan: plannedAfter, leaving: true }).catch(() => {});
    return { ok: true, gone };
  };

  const ctx = { role, admin, session: SESSION, pending, roundRunning, roundHolder, setRoundRunning, removeCrew, renameCrew, setCrewRank, people, setPeople,
    notPeople, setNotPeople, certRoot, setCertRoot, writeCrewToWorkbooks, lastDocUpdate, setLastDocUpdate, folderNames, setFolderNames, filledFromCert, setFilledFromCert, comments, addComment, removeComment, canDelete, log, quals, setQuals, certificates, addCertificates, removeCertificate, refileCertificates, updateCertificate, certSheet, setCertSheet, matrixUpdated, setMatrixUpdated, certAnalysis, setCertAnalysis, certDates, refreshCertDates, validityPeriods, certNotes, setCertNotes, opmsMarks, setOpmsMarks, renewalMarks, setRenewalMarks, trainingMatrix, setTrainingMatrix, skillsMatrix, setSkillsMatrix, validityMatrix, matrixAnalysis, setMatrixAnalysis, opmsSheet, setOpmsSheet, opmsAnalysis, setOpmsAnalysis, shiftAllocation, setShiftAllocation, shiftAnalysis, setShiftAnalysis, swingLists, setSwingLists, swingDates, setSwingDates, rosterPattern, setRosterPattern, swingBoard, swingBoards, setSwingBoards, swingArchive, setSwingArchive, skillsRequirements, setSkillsRequirements, crewRoster, setCrewRoster, rosterPlan, setRosterPlan, swingReport, setSwingReport, matrixRun, runMatrixRound, clearMatrixRun };

  return (
    <Ctx.Provider value={ctx}>
    <div className="um" style={{ background: T.deep, minHeight: "100vh", fontFamily: T.body }}>
      <style>{stylesNow()}</style>
      <div style={{ height: 3, background: `linear-gradient(90deg, ${T.accent} 0%, ${T.teal} 100%)` }} />
      <div style={{ margin: "0 auto", padding: "0 18px 44px" }}>
        <header className="um-head" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 24, padding: "16px 0 12px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
            <Roundel />
            <div>
              <div style={{ fontFamily: T.display, fontSize: 34, fontWeight: 700, letterSpacing: "0.03em", textTransform: "uppercase", lineHeight: 1 }}>
                <span style={{ color: T.text }}>{VESSEL.name} </span>
                <span style={{ color: T.accent }}>{VESSEL.nameAccent}</span>
              </div>
              <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 7, letterSpacing: "0.04em" }}>Crew Portal · {VESSEL.operator}</div>
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontFamily: T.display, fontSize: 11, fontWeight: 700, letterSpacing: "0.16em", textTransform: "uppercase", color: T.muted, marginBottom: 10 }}>{VESSEL.strapline}</div>
            {/* Prototype only — stands in for a real login. */}
            <div style={{ display: "flex", gap: 10, alignItems: "center", justifyContent: "flex-end" }}>
              {/* Saving while anything typed is still on its way up, Saved
                  once it has landed, and the time it landed on hovering — so
                  "is that saved?" has an answer on the screen. */}
              {(() => {
                const state = sync.state === "error" ? "error" : pending ? "saving"
                  : sync.state === "ok" ? "ok" : "loading";
                const colour = state === "error" ? T.bRed : state === "saving" ? T.bOrange
                  : state === "ok" ? T.teal : T.muted;
                const said = state === "error" ? "Not saving" : state === "saving" ? "Saving…"
                  : state === "ok" ? "Saved" : "…";
                return (
                  <span title={state === "error" ? sync.msg
                    : state === "saving" ? "Your changes are on their way to the server"
                    : state === "ok" ? `Everything is saved — last written ${sync.at}` : "Connecting"}
                    style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: T.mono, fontSize: 10,
                      color: colour, textTransform: "uppercase", letterSpacing: "0.08em" }}>
                    <span style={{ width: 7, height: 7, borderRadius: "50%", background: colour }} />
                    {said}
                  </span>
                );
              })()}
              <UpdateDocumentation />
              <NotifyToggle log={log} on={notifyOn} setOn={setNotifyOn} count={unreadTotal} />
              {/* Chris's FIT TO SAIL, one click away — the address comes from the
                  server with the sign-in, so the button only shows when it's set. */}
              {SESSION_USER.fitToSail && (
                <a className="um-btn" href={SESSION_USER.fitToSail} target="_blank" rel="noreferrer"
                  style={{ background: T.accent, color: "#fff", border: `1px solid ${T.accent}`, fontSize: 11,
                    fontWeight: 700, padding: "7px 11px", borderRadius: 2, textDecoration: "none",
                    letterSpacing: "0.06em" }}>
                  FIT TO SAIL
                </a>
              )}
              <Chip fg={admin ? T.accent : T.muted} bg={admin ? T.accentSoft : T.raised}>{currentUser}</Chip>
              <button className="um-btn" onClick={onSignOut}
                style={{ background: "transparent", color: T.muted, border: `1px solid ${T.rule}`,
                  fontSize: 11, fontWeight: 700, padding: "7px 11px", borderRadius: 2 }}>
                Sign out
              </button>
            </div>
          </div>
        </header>

        <nav className="um-nav um-scroll" style={{ display: loaded ? "flex" : "none", gap: 4, borderBottom: `1px solid ${T.rule}`, marginBottom: 22 }}>
          {TABS.map((t) => {
            const on = shown === t.id;
            return (
              <button key={t.id} className="um-btn um-tab" onClick={() => openTab(t.id)}
                style={{ background: on ? T.panel : "transparent", color: on ? T.text : T.muted, fontSize: 11.5, fontWeight: 700, padding: "10px 12px", borderBottom: `3px solid ${on ? T.accent : "transparent"}`, marginBottom: -1, display: "inline-flex", alignItems: "center", gap: 7 }}>
                {t.label}
                {countFor(t.id) > 0 && (
                  <span style={{ background: T.bRed, color: "#fff", fontFamily: T.mono, fontSize: 10, fontWeight: 600,
                                 minWidth: 17, height: 17, borderRadius: 9, padding: "0 5px", letterSpacing: 0,
                                 display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                    {countFor(t.id)}
                  </span>
                )}
              </button>
            );
          })}
        </nav>

        {!loaded
          ? <NotLoadedYet error={sync.state === "error" ? sync.msg : null} />
          : shown ? views[shown] : <EverythingHidden admin={admin} onRestoreAll={restoreAllTabs} />}

        <footer style={{ marginTop: 34, paddingTop: 13, borderTop: `1px solid ${T.rule}`, fontFamily: T.mono, fontSize: 11, color: T.muted, lineHeight: 1.8 }}>
          <div>Prototype for crew review — not a controlled record under the SMS.</div>
          <div>Entries and uploads are saved on the server and shared with everyone.</div>
        </footer>
      </div>

      {/* The round from the page, watched from over whichever screen is open —
          it can be set going from more than one of them. */}
      <UpdateMatrixRun />
    </div>
    </Ctx.Provider>
  );
}

/* Nothing on the portal runs off the side of the screen.
 *
 * Zooming in is the page getting narrower, and a box that can't fit its
 * contents at that width would otherwise scroll sideways - which on a desk
 * means half a swing, or half a table, sitting where nobody can see it. Any
 * such box is shrunk just enough to fit instead, so the whole of it stays on
 * screen at any zoom.
 *
 * Two exceptions, both deliberate: the crew matrix is a spreadsheet and scrolls
 * side to side as one, and a phone-sized screen is left to scroll the way
 * phones do rather than shrinking everything to nothing.
 */
const FIT_FLOOR = 0.4;
// A phone is told apart by its screen being touched rather than by its width:
// a laptop zoomed to 300% is as narrow as a phone, and on that the whole page
// still has to fit.
const onTouchScreen = () =>
  !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
function useFitToWidth() {
  React.useEffect(() => {
    let frame = 0;
    const fit = () => {
      const phone = onTouchScreen();
      document.querySelectorAll(".um-scroll").forEach((el) => {
        // The matrix keeps its own sideways scroll, and so does the bar that
        // drives it.
        if (el.closest(".um-matrix") || el.querySelector(".um-matrix") || el.closest(".um-floatbar")) return;
        el.style.zoom = "";
        if (phone) return;
        // Shrinking the box changes what it measures, so the fit is closed in
        // on rather than guessed at once.
        for (let pass = 0; pass < 3; pass++) {
          const room = el.clientWidth;
          const want = el.scrollWidth;
          if (room <= 0 || want <= room + 1) break;
          const at = parseFloat(el.style.zoom) || 1;
          const next = Math.max(FIT_FLOOR, Math.floor(at * (room / want) * 995) / 1000);
          if (next >= at) break;
          el.style.zoom = String(next);
        }
      });
    };
    // A resize is answered at once; everything else - a tab switched, a panel
    // opened - is caught by the timer within half a second. The page used to be
    // watched for every change it made, but the portal redraws constantly, and
    // re-measuring five scroll strips on every redraw was work with no reader.
    const soon = () => {
      if (frame) return;
      frame = requestAnimationFrame(() => { frame = 0; fit(); });
    };
    soon();
    window.addEventListener("resize", soon);
    const tick = setInterval(soon, 400);
    return () => {
      window.removeEventListener("resize", soon);
      clearInterval(tick);
      cancelAnimationFrame(frame);
    };
  }, []);
}

function App() {
  // Who this is comes from the server: the page only ever loads behind a
  // real sign-in (email plus a code sent to it), and /api/me says the name
  // and the level. The old name-picker (SignIn, kept above unused) and the
  // per-tab remembering are superseded — the session cookie is the memory,
  // and it holds for ninety days per device. On the local preview, where no
  // server sign-in exists, /api/me answers 404/failed and the page falls
  // back to the picker so the preview keeps working.
  const [me, setMe] = useState(null);
  const [noServer, setNoServer] = useState(false);
  React.useEffect(() => {
    (async () => {
      try {
        const r = await fetch("/api/me");
        if (r.status === 401) { window.location.href = "/login"; return; }
        if (!r.ok) { setNoServer(true); return; }
        const who = await r.json();
        SESSION_USER = { name: who.name, role: who.role, email: who.email || "", fitToSail: who.fitToSail || "" };
        setMe(who);
      } catch (e) {
        setNoServer(true);
      }
    })();
  }, []);

  // Preview fallback: the honour-system picker, exactly as it always was.
  const [picked, setPicked] = useState(() => {
    try { return sessionStorage.getItem("um-signed-in") || null; } catch (e) { return null; }
  });
  if (noServer) {
    if (picked) {
      // Restored from the tab's memory: keep the role map in step.
      SESSION_USER = { name: picked, role: picked === IT_SUPPORT_ACCOUNT_NAME ? "it" : ADMINS.includes(picked) ? "management" : "crew", email: "" };
    }
    if (!picked) {
      return (
        <Boundary>
          <SignIn onSignIn={(r) => {
            try { sessionStorage.setItem("um-signed-in", r); } catch (e) {}
            SESSION_USER = { name: r, role: r === IT_SUPPORT_ACCOUNT_NAME ? "it" : ADMINS.includes(r) ? "management" : "crew", email: "" };
            setPicked(r);
          }} />
        </Boundary>
      );
    }
    return (
      <Boundary>
        <Portal role={picked} onSignOut={() => {
          try { sessionStorage.removeItem("um-signed-in"); } catch (e) {}
          setPicked(null);
        }} />
      </Boundary>
    );
  }

  if (!me) {
    return (
      <Boundary>
        <div style={{ minHeight: "60vh", display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: "system-ui", color: "#5b6b7a", fontSize: 14 }}>Signing you in...</div>
      </Boundary>
    );
  }

  return (
    <Boundary>
      <Portal role={me.name} onSignOut={() => { window.location.href = "/logout"; }} />
    </Boundary>
  );
}
