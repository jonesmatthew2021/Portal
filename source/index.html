                    </span>
                    <span style={cell}>{ourText(it)}</span>
                    <span style={cell}>{opmsText(it)}</span>
                    <span style={{ display: "flex", gap: 6, alignItems: "baseline", justifyContent: "flex-end",
                      flexWrap: "wrap", minWidth: 130 }}>
                      {fr && (side
                        ? <Chip fg={side.fg} bg={side.bg}>{side.key === "ours" ? "ours to fix" : "OPMS to fix"}</Chip>
                        : <Chip fg={T.muted} bg={T.raised}>no certificate</Chip>)}
                      {f && (f.detail || f.evidence || f.action) && (
                        <button className="um-btn" onClick={() => setDetailFor(openThis ? null : dKey)}
                          style={{ background: "transparent", color: T.muted, fontSize: 9.5, fontWeight: 700, padding: "2px 0" }}>
                          {openThis ? "Close" : "Details"}
                        </button>
                      )}
                    </span>
                  </div>
                  {f && openThis && (
                    <div style={{ background: T.raised, borderRadius: 2, padding: "8px 11px", marginTop: 6 }}>
                      <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
                        OPMS <span style={{ color: T.text }}>{f.opmsSays || "nothing"}</span>
                        {"  ·  "}OURS <span style={{ color: T.text }}>{f.weSay || "nothing"}</span>
                      </div>
                      {f.detail && <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, lineHeight: 1.6, marginTop: 4 }}>{f.detail}</div>}
                      {f.evidence && <div style={{ fontFamily: T.body, fontSize: 12.5, color: side ? side.fg : T.muted, lineHeight: 1.6, marginTop: 4 }}>{f.evidence}</div>}
                      {f.action && <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.text, lineHeight: 1.6, marginTop: 4 }}>{f.action}</div>}
                    </div>
                  )}
                  {f && side && side.key && (() => {
                    const mk = markOf(side.key, f);
                    const steps = side.key === "opms"
                      ? [{ st: "sent", label: "Sent to OPMS" }, { st: "fixed", label: "Settled" }]
                      : [{ st: "fixed", label: "Fixed on our side" }];
                    return (
                      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", marginTop: 5 }}>
                        {steps.map(({ st, label }) => {
                          const on = mk && mk.status === st;
                          return (
                            <button key={st} className="um-btn" onClick={() => setMark(side.key, f, st)}
                              title={on ? `${label} ${fmtDate(mk.on)} — press to clear` : `Mark as ${label.toLowerCase()}`}
                              style={{ background: on ? T.accentSoft : "transparent", color: on ? T.accent : T.muted,
                                border: `1px solid ${on ? T.accent : T.rule}`, borderRadius: 2,
                                padding: "2px 8px", fontSize: 9.5, fontWeight: 700 }}>
                              {label}{on ? ` · ${fmtDate(mk.on)}` : ""}
                            </button>
                          );
                        })}
                      </div>
                    );
                  })()}
                </div>
              );
            };

            const groups = [
              ...[...names, ...extras].map((n) => ({ name: n })),
              ...(crewWide.length ? [{ name: "The crew as a whole", cw: true }] : []),
            ];

            return (
              <div style={{ marginBottom: 14 }}>
                {!opmsRows && opmsSheet && (
                  <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, lineHeight: 1.6, marginBottom: 8 }}>
                    Reading the OPMS export off the spreadsheet — if this line stays, the sheet couldn't
                    be read in this browser and the OPMS column shows only what the comparison reported.
                  </div>
                )}
                {groups.map(({ name, cw }) => {
                  const finds = cw ? crewWide : findsFor(name);
                  const items = cw ? [] : sideBySide(name);
                  const matched = new Set();
                  items.forEach((it) => {
                    const fr = finds.find(({ f }) => it.code && keyOf(f.code) === keyOf(it.code));
                    if (fr) matched.add(fr);
                  });
                  const loose = cw ? finds : finds.filter((x) => !matched.has(x));
                  const hotCount = items.filter((it) =>
                    it.diff || finds.some(({ f }) => it.code && keyOf(f.code) === keyOf(it.code))).length + loose.length;
                  const bad = hotCount > 0;
                  return (
                    <details key={name} open style={{ background: T.panel, border: `1px solid ${T.rule}`,
                      borderLeft: `4px solid ${bad ? T.bRed : T.teal}`, borderRadius: 2,
                      marginBottom: 6, padding: "0 15px" }}>
                      <summary style={{ cursor: "pointer", padding: "11px 0", fontFamily: T.body }}>
                        <span style={{ fontSize: 14, fontWeight: 600, color: bad ? T.bRed : T.text }}>{name}</span>
                        <span style={{ fontFamily: T.mono, fontSize: 10.5, color: bad ? T.bRed : T.muted, marginLeft: 10 }}>
                          {bad ? `${hotCount} difference${hotCount === 1 ? "" : "s"}`
                            : items.length ? `${items.length} items · agree` : "agrees"}
                        </span>
                      </summary>
                      <div style={{ paddingBottom: 11 }}>
                        {items.length > 0 && (
                          <>
                            <div className="um-datehead" style={{ display: "flex", gap: 10, alignItems: "baseline",
                              padding: "2px 0 5px", borderBottom: `2px solid ${T.rule}` }}>
                              <span style={{ ...head, flex: "1 1 220px" }}>Certificate</span>
                              <span style={{ ...head, flex: "1 1 130px" }}>Our expiry</span>
                              <span style={{ ...head, flex: "1 1 130px" }}>OPMS expiry</span>
                              <span style={{ minWidth: 130 }} />
                            </div>
                            {items.map((it, i) => dataRow(name, it, i, finds))}
                          </>
                        )}
                        {loose.map(({ f, side }, i) => findingRow(f, i, side))}
                        {items.length === 0 && loose.length === 0 && (
                          <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, lineHeight: 1.6 }}>
                            Nothing on either side for this name.
                          </div>
                        )}
                      </div>
                    </details>
                  );
                })}
              </div>
            );
          })()}

          {notes.length > 0 && (
            <details style={{ background: T.raised, border: `1px solid ${T.rule}`, borderRadius: 2,
              padding: "13px 15px" }}>
              <summary style={{ cursor: "pointer" }}><Eyebrow>What couldn't be compared · {notes.length}</Eyebrow></summary>
              <div style={{ fontFamily: T.body, fontSize: 13, color: T.text, lineHeight: 1.8, marginTop: 7 }}>
                {notes.map((n, i) => <div key={i}>{n}</div>)}
              </div>
            </details>
          )}
        </>
      )}
    </div>
  );
}

/**
 * Everything the portal has to be given, on one page.
 *
 * There are four of them: the three documents it keeps exactly one of apiece — the
 * training matrix, the skills matrix (which also carries the validity periods),
 * the crew certificates spreadsheet — and the crew's certificates themselves.
 * They used to sit on three different screens of the Certification Checker, which
 * meant an admin setting up a fresh portal had to find each one somewhere else and
 * could not see, from any one of them, what was still outstanding. They are filed
 * here now, first thing on the tab, and the screens that read them only read them.
 */
function RequiredDocuments() {
  const portal = usePortal();
  const { certSheet } = portal;
  const records = matrixRecords(portal);
  const setters = matrixSetters(portal);

  const docs = [
    ...MATRIX_CARDS.map((c) => ({
      key: c.key,
      title: c.title,
      noun: c.noun,
      blurb: c.blurb,
      required: c.required,
      record: records[c.key] || null,
      upload: (record) => (
        <SingleDocumentUpload
          category={c.category}
          noun={c.noun}
          eyebrow={c.title}
          blurb={`${c.blurb} One is kept on the portal - the latest - ${
            c.required
              ? "and it is required at all times, so uploading a newer one replaces it in the same step."
              : "so uploading a newer one replaces it in the same step."}`}
          current={record}
          onFiled={(rec) => {
            setters[c.key](rec);
            // The skills matrix carries the validity periods, which feed the
            // crew matrix — they are what turns a certificate's issue date
            // into the expiry the matrix carries — so replacing it holds the
            // certificates against the new periods and brings the matrix up to
            // what they now say. The compliance check reads it afresh on its
            // own screen.
            if (c.key === "skills") portal.runMatrixAuto({ validityMatrix: rec, origin: "spreadsheet" });
          }}
          logAction={c.logAction}
          label={record ? `Replace the ${c.noun}` : `Upload the ${c.noun}`}
          variant={record ? "quiet" : "solid"}
        />
      ),
    })),
    {
      key: "certificate-sheet",
      title: "OPMS spreadsheet",
      noun: "crew certificates spreadsheet",
      blurb: "This spread sheet is populated weekly from Portways and is the our crews records held by OPMS, call PK if you need it.",
      required: true,
      record: certSheet || null,
      upload: (record) => (
        <UpdateSpreadsheet
          label={record ? "Replace the spreadsheet" : "Upload the spreadsheet"}
          variant={record ? "quiet" : "solid"}
        />
      ),
    },
  ];

  const missing = docs.filter((d) => d.required && !d.record);

  return (
    <div>
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
        borderLeft: `4px solid ${missing.length ? T.bRed : T.green}`, borderRadius: 2,
        padding: "15px 17px", marginBottom: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 10, alignItems: "baseline", flexWrap: "wrap" }}>
          <Eyebrow color={missing.length ? T.bRed : T.accent}>Required documents for upload</Eyebrow>
          <Chip fg={missing.length ? T.bRed : T.bGreen} bg={missing.length ? T.bRedBg : T.bGreenBg}>
            {missing.length
              ? `${missing.length} of ${docs.length} not on file`
              : `all ${docs.length} on file`}
          </Chip>
        </div>
        <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 10 }}>
          Three spreadsheets and the crew's certificates. The portal keeps one of each spreadsheet —
          the latest — and every certification screen on the tab reads from what is filed here, so
          anything missing is missing from all of them.
          {missing.length > 0 && <> Still to come: {missing.map((m) => `the ${m.noun}`).join(", ")}.</>}
        </div>
      </div>

      <div className="um-reqdocs">
        {docs.map((d) => (
          <div key={d.key} style={{ background: T.panel, border: `1px solid ${T.rule}`,
            borderLeft: `4px solid ${d.record ? T.green : d.required ? T.bRed : T.bOrange}`, borderRadius: 2,
            padding: "13px 15px", minWidth: 0 }}>
            <div style={{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "baseline", flexWrap: "wrap" }}>
              <Eyebrow color={d.record ? T.accent : d.required ? T.bRed : T.bOrange}>{d.title}</Eyebrow>
              <Chip fg={d.record ? T.bGreen : d.required ? T.bRed : T.bOrange}
                bg={d.record ? T.bGreenBg : d.required ? T.bRedBg : T.bOrangeBg}>
                {d.record ? "on file" : d.required ? "required - not on file" : "not on file"}
              </Chip>
            </div>
            <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 8 }}>
              {d.blurb}
            </div>
            <div style={{ fontFamily: T.body, fontSize: 13.5, color: d.record ? T.text : d.required ? T.bRed : T.bOrange,
              marginTop: 10, wordBreak: "break-word" }}>
              {d.record
                ? d.record.filename
                : d.required
                ? `No ${d.noun} has been filed. The portal is required to hold one at all times.`
                : `No ${d.noun} has been filed. It is read with the skills matrix wherever one is.`}
            </div>
            {/* When the document was last updated, said in every box - a dash
                means nothing has ever been filed for it. */}
            <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 3 }}>
              Last updated: {d.record?.uploaded ? fmtDate(d.record.uploaded) : "—"}
              {d.record?.size ? ` · ${d.record.size}` : ""}
              {d.record?.by ? ` · ${d.record.by}` : ""}
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginTop: 12 }}>
              {d.record && <OpenLink url={d.record.url} />}
              {d.upload(d.record)}
            </div>
          </div>
        ))}
      </div>

      <div style={{ height: 1, background: T.rule, margin: "22px 0" }} />

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start",
        gap: 14, flexWrap: "wrap", marginBottom: 14 }}>
        <div style={{ flex: "1 1 320px" }}>
          <Eyebrow color={T.accent}>Crew certificates</Eyebrow>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.muted, lineHeight: 1.7, marginTop: 8 }}>
            The certificates themselves, filed one folder per crew member. Unlike the spreadsheets
            above, the portal holds as many of these as you give it.
          </div>
        </div>
        <UpdateTableButton />
      </div>
      <UploadCertificates />
    </div>
  );
}

/* The Admin tab's landing page: one screen that answers "what needs me
   today?". Every number on it exists elsewhere in the portal — this page only
   gathers them, worst first, each with the button that goes to the fix. */
function TodayScreen({ go }) {
  const { quals: QUALS, certificates, certSheet, opmsSheet, matrixUpdated,
    opmsAnalysis, opmsMarks, renewalMarks } = usePortal();

  // Everything urgent, as a single worklist: expired, inside 30 days, or
  // required-but-not-held — each with what has been done about it so far.
  const work = useMemo(() => {
    const items = [];
    QUALS.rows.forEach((r) => {
      (r[3] || []).forEach((v, i) => {
        const b = bandFor(v);
        if (!b) return;
        const code = QUALS.cols[i][0], title = QUALS.cols[i][1];
        if (b.key === "not") {
          items.push({ person: r[0], position: r[1], code, title, kind: "not", urgency: 9000, say: "never held" });
        } else if (b.date) {
          const d = daysTo(b.date);
          if (d < 0) items.push({ person: r[0], position: r[1], code, title, kind: "expired", urgency: -d + 10000, say: `expired ${Math.abs(d)} days ago` });
          else if (d <= 30) items.push({ person: r[0], position: r[1], code, title, kind: "soon", urgency: 30 - d, say: `${d} days left` });
        }
      });
    });
    // The most overdue first — the order the work should be done in.
    items.sort((a, b) => b.urgency - a.urgency);
    return items;
  }, [QUALS]);

  const [showAll, setShowAll] = useState(false);
  // The renewal loop read against the list: which urgent items already have
  // something being done about them. Hiding those leaves the true to-do list.
  const markedCount = work.filter((x) => renewalMarkFor(renewalMarks, x.person, x.code)).length;
  const [hideInMotion, setHideInMotion] = useState(false);
  const listed = hideInMotion
    ? work.filter((x) => !renewalMarkFor(renewalMarks, x.person, x.code))
    : work;
  const shown = showAll ? listed : listed.slice(0, 6);

  // Quiet numbers for everything that is not urgent, one line each only when
  // it actually needs an admin; good news is one green sentence, not nine tiles.
  const quiet = useMemo(() => {
    let in60 = 0, unknown = 0;
    QUALS.rows.forEach((r) => (r[3] || []).forEach((v) => {
      const b = bandFor(v);
      if (!b) return;
      if (b.key === "unknown") unknown++;
      else if (b.date) { const d = daysTo(b.date); if (d > 30 && d <= 60) in60++; }
    }));
    const surnameOfP = (p) => { const m = /^\s*([A-Za-z'\-]+)\s*,/.exec(p || ""); return (m ? m[1] : (p || "").split(" ")[0] || "").toUpperCase(); };
    const misfiled = certificates.filter((c) => {
      const ps = surnameOfP(c.person);
      const m = /^\s*([A-Za-z'\-]+)[_\s,]/.exec(c.filename || "");
      const fs = (m ? m[1] : "").toUpperCase();
      return ps && fs && fs.length > 3 && fs !== ps && !(c.filename || "").toUpperCase().includes(ps);
    }).length;
    const age = (iso) => (iso ? Math.max(0, -daysTo(String(iso).slice(0, 10))) : null);
    return { in60, unknown, misfiled, opmsAge: age(opmsSheet && opmsSheet.uploaded), sheetAge: age(certSheet && certSheet.uploaded) };
  }, [QUALS, certificates, opmsSheet, certSheet]);

  // OPMS disagreements still open — the comparison's two columns minus what
  // has been marked sent or fixed. Zero means two independent systems agree.
  const opmsOpen = useMemo(() => {
    const check = opmsAnalysis && opmsAnalysis.check;
    if (!check) return null;
    const marks = opmsMarks || {};
    const keyOf = (sideKey, f) =>
      `${sideKey}::${String(f.person || "crew").trim().toUpperCase()}::${String(f.code || f.item || "").trim().toUpperCase()}`;
    const open = (sideKey) => (Array.isArray(check[sideKey]) ? check[sideKey] : [])
      .filter((f) => !marks[keyOf(sideKey, f)]).length;
    return open("ours") + open("opms");
  }, [opmsAnalysis, opmsMarks]);

  const attention = [];
  if (opmsOpen) attention.push({ n: opmsOpen, text: "OPMS disagreements nothing has been done about — fix ours, send theirs", target: "opms", act: "OPMS checker" });
  if (quiet.in60) attention.push({ n: quiet.in60, text: "expiring in 30 to 60 days — next month's bookings", target: "checker", act: "See them" });
  if (quiet.unknown) attention.push({ n: quiet.unknown, text: "marked with a question mark nobody has answered", target: "checker", act: "Settle them" });
  if (quiet.misfiled) attention.push({ n: quiet.misfiled, text: "scans that look filed under the wrong person", target: "required-docs", act: "Check them" });
  if (quiet.opmsAge != null && quiet.opmsAge > 9) attention.push({ n: `${quiet.opmsAge}d`, text: "since Portways refreshed the OPMS spreadsheet — chase the weekly export", target: "opms", act: "OPMS" });
  if (quiet.sheetAge != null && quiet.sheetAge > 30) attention.push({ n: `${quiet.sheetAge}d`, text: "since the training matrix spreadsheet was updated — press Update the spreadsheet after your next batch", target: "required-docs", act: "Go" });

  const stKind = { expired: { fg: T.bRed, bg: T.bRedBg }, soon: { fg: T.bRed, bg: T.bRedBg }, not: { fg: T.accent, bg: T.accentSoft } };

  return (
    <div>
      {/* The one sentence that matters. Green means go home. */}
      <div style={{ background: work.length === 0 ? T.bGreenBg : T.panel,
        border: `1px solid ${work.length === 0 ? T.bGreen : T.rule}`,
        borderLeft: `4px solid ${work.length === 0 ? T.bGreen : T.bRed}`,
        borderRadius: 2, padding: "16px 18px", marginBottom: 18 }}>
        <div style={{ fontFamily: T.body, fontSize: 17, fontWeight: 700,
          color: work.length === 0 ? T.bGreen : T.text }}>
          {work.length === 0
            ? "Nothing is urgent. You're on top of it."
            : `${work.length} item${work.length === 1 ? "" : "s"} need${work.length === 1 ? "s" : ""} you. Start at the top.`}
        </div>
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, marginTop: 4, lineHeight: 1.6 }}>
          Expired, running out inside 30 days, or required and never held — worst first.
          {markedCount > 0 && ` ${markedCount} of them already ${markedCount === 1 ? "has" : "have"} something in motion — booked, chased, or evidence waiting to be filed.`}
        </div>
      </div>

      {/* When some items are marked, the list can be narrowed to the ones
          nothing has been done about — that shorter list is the day's work. */}
      {markedCount > 0 && (
        <div style={{ marginBottom: 8 }}>
          <Button variant={hideInMotion ? "solid" : "quiet"} onClick={() => setHideInMotion(!hideInMotion)}>
            {hideInMotion ? `Showing the ${listed.length} with nothing done yet · show all` : `Hide the ${markedCount} in motion`}
          </Button>
        </div>
      )}

      {/* The worklist itself: act from here, no other page needed. Each line
          carries its renewal marks, so booking or chasing is recorded on the
          spot rather than on another page. */}
      {shown.map((x) => {
        const k = stKind[x.kind];
        return (
          <div key={x.person + x.code} style={{ background: T.panel, border: `1px solid ${T.rule}`,
            borderRadius: 2, padding: "10px 14px", marginBottom: 6, display: "flex", gap: 12,
            alignItems: "center", flexWrap: "wrap" }}>
            <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 700, background: k.bg, color: k.fg,
              padding: "3px 7px", borderRadius: 2, whiteSpace: "nowrap" }}>{x.say}</span>
            <span style={{ flex: "1 1 240px", minWidth: 0 }}>
              <span style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text }}>{x.person}</span>
              <span style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted }}> · {x.code} {x.title}</span>
            </span>
            <RenewalMark person={x.person} code={x.code} />
          </div>
        );
      })}
      {listed.length > 6 && (
        <div style={{ marginBottom: 6 }}>
          <Button variant="quiet" onClick={() => setShowAll(!showAll)}>
            {showAll ? "Show just the first six" : `Show all ${listed.length}`}
          </Button>
        </div>
      )}

      {/* Worth knowing, not urgent. Absent entirely when there is nothing. */}
      {attention.length > 0 && (
        <div style={{ marginTop: 20 }}>
          <Eyebrow color={T.muted}>Worth a look when the list above is clear</Eyebrow>
          {attention.map((a, i) => (
            <div key={i} style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap",
              padding: "8px 2px", borderBottom: `1px solid ${T.rule}` }}>
              <span style={{ fontFamily: T.display, fontSize: 17, fontWeight: 700, color: T.bOrange, minWidth: 40, textAlign: "right" }}>{a.n}</span>
              <span style={{ flex: "1 1 240px", fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.5 }}>{a.text}</span>
              <Button variant="quiet" onClick={() => go(a.target)}>{a.act}</Button>
            </div>
          ))}
        </div>
      )}
      {attention.length === 0 && (
        <div style={{ marginTop: 20, fontFamily: T.body, fontSize: 13, color: T.bGreen }}>
          Everything else is in order — spreadsheets fresh, files where they belong, no open questions.
        </div>
      )}
    </div>
  );
}
