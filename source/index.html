          if (up.record) setTrainingMatrix(up.record);
          written.push(leaving
            ? "their row emptied on the training matrix"
            : "a row put on the end of the training matrix for them");
        } else {
          written.push(leaving
            ? "the training matrix had no row of theirs to empty"
            : "the training matrix couldn't take a row on the end, so add one by hand");
        }
      } catch (e) {
        trouble.push("the training matrix workbook: " + (e.message || String(e)));
      }
    }

    // What was actually done, said plainly. A workbook nobody has filed on the
    // portal is neither a success nor a failure, and is not reported as either.
    if (!trouble.length && !written.length) return { ok: true, said: "no workbook is filed on the portal to update" };
    const what = want + (leaving ? " coming off" : " going on");
    log("Admin", trouble.length
      ? "The spreadsheets could not be brought into line with " + what
      : "The spreadsheets brought into line with " + what,
      [...written, ...trouble].join(" · "));
    return { ok: !trouble.length, said: [...written, ...trouble].join(" · ") };
  };

/* One person renamed everywhere the portal writes their name down.
   *
   * The same sweep as taking somebody off, changing rather than dropping, and
   * written through the portal's own setters because those are what mark a
   * slice as changed - written straight into the store, the new name would go
   * from the screen and the old one be back on the next load.
   *
   * His certificates come with him. The files themselves do not move - they
   * are in the office's folders and they stay there - but the name on the page
   * changes with everything else, and the spelling he is leaving behind is
   * kept as one of his on the register, so the next poll reads the server's
   * copy back as him rather than as a stranger.
   */
  const renameCrew = (from, to) => {
    const was = String(from || "").trim();
    const now = canonicalName(to || "");
    if (!was || !now || was === now) return { ok: false };
    const letters = (n) => String(n || "").toUpperCase().replace(/[^A-Z]/g, "");
    const same = (n) => letters(n) === letters(was);
    const done = { matrix: 0, crewList: 0, swings: 0, lists: 0, marks: 0 };

    /* The matrix as the portal reads it, not the raw slice the store holds.
       A portal that has never had a crew matrix filed holds nothing there and
       reads the built-in one instead - and writing the slice back would have
       put an empty matrix over the top of it and lost every row. Written only
       where a row actually changed, for the same reason. */
    {
      const rows = (quals.rows || []).map((r) => {
        if (!same(r[0])) return r;
        done.matrix++;
        return [now, r[1], r[2], r[3]];
      });
      if (done.matrix) setQuals({ ...quals, rows });
    }

    setPeople((list) => (list || []).map((p) => {
      if (!same(p.name)) return p;
      done.crewList++;
      /* The spelling he is leaving behind becomes one of his. A spreadsheet, a
         folder or a certificate filed under it is still calling him that, and
         the register is the thing that stops that mattering. */
      return { ...p, name: now, aliases: [...new Set([...(p.aliases || []), p.name])] };
    }));

    setRosterPlan((plan) => {
      if (!plan) return plan;
      let hit = 0;
      const rows = (plan.rows || []).map((r) => {
        if (!same(r.name)) return r;
        hit++;
        return { ...r, name: now };
      });
      done.swings = hit;
      return hit ? { ...plan, rows, edited: true, updatedAt: todayISO() } : plan;
    });

    setSwingLists((held) => {
      const next = {};
      Object.entries(held || {}).forEach(([k, list]) => {
        next[k] = {
          ...list,
          entries: (((list || {}).entries) || []).map((e) => {
            if (!same(e.name)) return e;
            done.lists++;
            return { ...e, name: now };
          }),
        };
      });
      return next;
    });

    /* The notes and the "this came off a certificate" marks are kept under
       "NAME::ITEM". Re-keyed rather than dropped, so a note written against a
       man under the wrong name is still his afterwards. */
    const rekey = (held) => {
      const next = {};
      Object.entries(held || {}).forEach(([k, v]) => {
        const join = k.includes("::") ? "::" : "|";
        const parts = k.split(join);
        if (parts.length > 1 && same(parts[0])) {
          next[now.toUpperCase() + join + parts.slice(1).join(join)] = v;
          done.marks++;
        } else next[k] = v;
      });
      return next;
    };
    setRenewalMarks(rekey(renewalMarks));
    setOpmsMarks(rekey(opmsMarks));
    setFilledFromCert(rekey(filledFromCert));

    /* His certificates, on the page, now. The server's copy still carries the
       old spelling and the relabel runs alongside this - but the register
       answers to that spelling as his from here on, so the next poll reads it
       back as him either way. Written here as well so the certificate list
       says the new name the moment the button is pressed. */
    setStore((st) => ({
      ...st,
      certificates: (st.certificates || []).map((c) => (same(c.person) ? { ...c, person: now } : c)),
    }));

    log("Admin", was + " is " + now,
      [done.matrix ? "the matrix" : null, done.crewList ? "the crew list" : null,
        done.swings ? done.swings + " roster rows" : null].filter(Boolean).join(" · ")
      || "nothing was holding the old name");
    return { ok: true, ...done };
  };

  /**
   * Somebody's rank, changed once and landing everywhere.
   *
   * A rank is written down in three places and they used to be set one at a
   * time: the row the office sends on the crew matrix, the man's own entry on
   * Crew Details, and the rows the roster is built from. Changed on one page
   * only, the other two went on saying what they said before - so the
   * certificate list called him a Master and the roster still had him an IR.
   *
   * All three are set together here, through the portal's own setters, which
   * is what has every page holding his details read the new rank at once
   * rather than after a reload. The department follows the rank, because it
   * has only ever been worked out from it.
   */
  const setCrewRank = (name, rank) => {
    const who = String(name || "").trim();
    const job = String(rank || "").trim();
    if (!who) return { ok: false };
    const letters = (n) => String(n || "").toUpperCase().replace(/[^A-Z]/g, "");
    const same = (n) => letters(n) === letters(who);
    const done = { matrix: 0, crewList: 0, swings: 0 };

    // What it was, read before anything is set, so the log says so plainly.
    const was = ((quals.rows || []).find((r) => same(r[0])) || [])[1]
      || ((people || []).find((p) => same(p.name)) || {}).rank || "";
    if (String(was) === job) return { ok: false };

    // The matrix as the portal reads it, and written back only where a row
    // changed - see renameCrew for why the raw slice is no good here.
    {
      const rows = (quals.rows || []).map((r) => {
        if (!same(r[0]) || String(r[1] || "") === job) return r;
        done.matrix++;
        return [r[0], job, r[2], r[3]];
      });
      if (done.matrix) setQuals({ ...quals, rows });
    }

    setPeople((list) => (list || []).map((p) => {
      if (!same(p.name) || (p.rank || "") === job) return p;
      done.crewList++;
      return { ...p, rank: job, dept: job ? deptForRank(job) : p.dept };
    }));

    setRosterPlan((plan) => {
      if (!plan) return plan;
      let hit = 0;
      const rows = (plan.rows || []).map((r) => {
        if (!same(r.name) || String(r.rank || "") === job) return r;
        hit++;
        return { ...r, rank: job };
      });
      done.swings = hit;
      return hit ? { ...plan, rows, edited: true, updatedAt: todayISO() } : plan;
    });

    log("Admin", who + " is " + (job || "on no rank"),
      [was ? "was " + was : null,
        done.matrix ? "the matrix" : null,
        done.crewList ? "the register" : null,
        done.swings ? done.swings + " roster rows" : null].filter(Boolean).join(" · ")
      || "nothing was holding a rank for him");
    return { ok: true, ...done };
  };

  const removeCrew = (name) => {
    const want = String(name || "").trim();
    if (!want) return { ok: false };
    const same = (n) => String(n || "").toUpperCase().replace(/[^A-Z]/g, "")
      === want.toUpperCase().replace(/[^A-Z]/g, "");

    const gone = { matrix: 0, swings: 0, crewList: 0, certificates: 0 };

    // The crew matrix.
    setQuals((q) => {
      const rows = (q.rows || []).filter((r) => !same(r[0]));
      gone.matrix = (q.rows || []).length - rows.length;
      return { ...q, rows };
    });

    // The roster's swings. The plan as it will stand is kept hold of, because
    // it is what the workbook has to be written from a moment later.
    let plannedAfter = rosterPlan;
    setRosterPlan((plan) => {
      if (!plan) return plan;
      const rows = (plan.rows || []).filter((r) => !same(r.name));
      gone.swings = (plan.rows || []).length - rows.length;
      if (!gone.swings) return plan;
      plannedAfter = { ...plan, rows, edited: true, updatedAt: todayISO() };
      return plannedAfter;
    });

    /* The crew list, and everything keyed to the person it holds. Written
       through the portal's own setters rather than straight into the store,
       because those are what mark a slice as changed - written straight in,
       the person would go from the screen and be back on the next load. */
    const leaving = (people || []).filter((p) => same(p.name));
    if (leaving.length) {
      gone.crewList = leaving.length;
      const ids = new Set(leaving.map((p) => p.id));
      setPeople((list) => (list || []).filter((p) => !ids.has(p.id)));
      setOverrides((held) => {
        const next = { ...(held || {}) };
        Object.keys(next).forEach((k) => { if (ids.has(String(k).split(":")[0])) delete next[k]; });
        return next;
      });
      setSwingBoards((held) => {
        const next = {};
        Object.entries(held || {}).forEach(([k, board]) => {
          const side = { ...(board.side || {}) };
          const shift = { ...(board.shift || {}) };
          const window = { ...(board.window || {}) };
          ids.forEach((id) => { delete side[id]; delete shift[id]; delete window[id]; });
          next[k] = { ...board, side, shift, window };
        });
        return next;
      });
      setSwingBoard((board) => {
        const side = { ...((board || {}).side || {}) };
        const shift = { ...((board || {}).shift || {}) };
        const window = { ...((board || {}).window || {}) };
        ids.forEach((id) => { delete side[id]; delete shift[id]; delete window[id]; });
        return { ...(board || {}), side, shift, window };
      });
    }

    // The notes kept against their name.
    const strip = (held) => {
      const next = { ...(held || {}) };
      Object.keys(next).forEach((k) => { if (same(k.split("::")[0]) || same(k.split("|")[0])) delete next[k]; });
      return next;
    };
    setRenewalMarks(strip(renewalMarks));
    setOpmsMarks(strip(opmsMarks));

    // Their certificates, archived where they can be fetched back.
    const theirs = (certificates || []).filter((c) => same(c.person));
    gone.certificates = theirs.length;
    theirs.forEach((c) => deleteStoredFile(c, currentUser));
    setStore((st) => ({ ...st, certificates: (st.certificates || []).filter((c) => !same(c.person)) }));

    log("Admin", want + " taken off the portal",
      [gone.matrix ? "matrix row" : null,
        gone.swings ? gone.swings + " swing entries" : null,
        gone.crewList ? "crew list" : null,
        gone.certificates ? gone.certificates + " certificates archived" : null]
        .filter(Boolean).join(" · ") || "nothing was held against the name");

    // The office's spreadsheets follow, on their own, in the background.
    writeCrewToWorkbooks({ want, plan: plannedAfter, leaving: true }).catch(() => {});
    return { ok: true, gone };
  };

  const ctx = { role, admin, session: SESSION, pending, roundRunning, roundHolder, setRoundRunning, removeCrew, renameCrew, setCrewRank, people, setPeople,
    notPeople, setNotPeople, certRoot, setCertRoot, writeCrewToWorkbooks, lastDocUpdate, setLastDocUpdate, folderNames, setFolderNames, filledFromCert, setFilledFromCert, comments, addComment, removeComment, canDelete, log, quals, setQuals, certificates, addCertificates, removeCertificate, refileCertificates, updateCertificate, certSheet, setCertSheet, matrixUpdated, setMatrixUpdated, certAnalysis, setCertAnalysis, certDates, refreshCertDates, validityPeriods, certNotes, setCertNotes, opmsMarks, setOpmsMarks, renewalMarks, setRenewalMarks, trainingMatrix, setTrainingMatrix, skillsMatrix, setSkillsMatrix, validityMatrix, matrixAnalysis, setMatrixAnalysis, opmsSheet, setOpmsSheet, opmsAnalysis, setOpmsAnalysis, shiftAllocation, setShiftAllocation, shiftAnalysis, setShiftAnalysis, swingLists, setSwingLists, swingDates, setSwingDates, rosterPattern, setRosterPattern, swingBoard, swingBoards, setSwingBoards, swingArchive, setSwingArchive, skillsRequirements, setSkillsRequirements, crewRoster, setCrewRoster, rosterPlan, setRosterPlan, swingReport, setSwingReport, matrixRun, runMatrixRound, clearMatrixRun };

  return (
    <Ctx.Provider value={ctx}>
    <div className="um" style={{ background: T.deep, minHeight: "100vh", fontFamily: T.body }}>
      <style>{stylesNow()}</style>
      <div style={{ height: 3, background: `linear-gradient(90deg, ${T.accent} 0%, ${T.teal} 100%)` }} />
      <div style={{ margin: "0 auto", padding: "0 18px 44px" }}>
        <header className="um-head" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 24, padding: "16px 0 12px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
            <Roundel />
            <div>
              <div style={{ fontFamily: T.display, fontSize: 34, fontWeight: 700, letterSpacing: "0.03em", textTransform: "uppercase", lineHeight: 1 }}>
                <span style={{ color: T.text }}>{VESSEL.name} </span>
                <span style={{ color: T.accent }}>{VESSEL.nameAccent}</span>
              </div>
              <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 7, letterSpacing: "0.04em" }}>Crew Portal · {VESSEL.operator}</div>
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontFamily: T.display, fontSize: 11, fontWeight: 700, letterSpacing: "0.16em", textTransform: "uppercase", color: T.muted, marginBottom: 10 }}>{VESSEL.strapline}</div>
            {/* Prototype only — stands in for a real login. */}
            <div style={{ display: "flex", gap: 10, alignItems: "center", justifyContent: "flex-end" }}>
              {/* Saving while anything typed is still on its way up, Saved
                  once it has landed, and the time it landed on hovering — so
                  "is that saved?" has an answer on the screen. */}
              {(() => {
                const state = sync.state === "error" ? "error" : pending ? "saving"
                  : sync.state === "ok" ? "ok" : "loading";
                const colour = state === "error" ? T.bRed : state === "saving" ? T.bOrange
                  : state === "ok" ? T.teal : T.muted;
                const said = state === "error" ? "Not saving" : state === "saving" ? "Saving…"
                  : state === "ok" ? "Saved" : "…";
                return (
                  <span title={state === "error" ? sync.msg
                    : state === "saving" ? "Your changes are on their way to the server"
                    : state === "ok" ? `Everything is saved — last written ${sync.at}` : "Connecting"}
                    style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: T.mono, fontSize: 10,
                      color: colour, textTransform: "uppercase", letterSpacing: "0.08em" }}>
                    <span style={{ width: 7, height: 7, borderRadius: "50%", background: colour }} />
                    {said}
                  </span>
                );
              })()}
              <UpdateDocumentation />
              <NotifyToggle log={log} on={notifyOn} setOn={setNotifyOn} count={unreadTotal} />
              {/* Chris's FIT TO SAIL, one click away — the address comes from the
                  server with the sign-in, so the button only shows when it's set. */}
              {SESSION_USER.fitToSail && (
                <a className="um-btn" href={SESSION_USER.fitToSail} target="_blank" rel="noreferrer"
                  style={{ background: T.accent, color: "#fff", border: `1px solid ${T.accent}`, fontSize: 11,
                    fontWeight: 700, padding: "7px 11px", borderRadius: 2, textDecoration: "none",
                    letterSpacing: "0.06em" }}>
                  FIT TO SAIL
                </a>
              )}
              <Chip fg={admin ? T.accent : T.muted} bg={admin ? T.accentSoft : T.raised}>{currentUser}</Chip>
              <button className="um-btn" onClick={onSignOut}
                style={{ background: "transparent", color: T.muted, border: `1px solid ${T.rule}`,
                  fontSize: 11, fontWeight: 700, padding: "7px 11px", borderRadius: 2 }}>
                Sign out
              </button>
            </div>
          </div>
        </header>

        <nav className="um-nav um-scroll" style={{ display: loaded ? "flex" : "none", gap: 4, borderBottom: `1px solid ${T.rule}`, marginBottom: 22 }}>
          {TABS.map((t) => {
            const on = shown === t.id;
            return (
              <button key={t.id} className="um-btn um-tab" onClick={() => openTab(t.id)}
                style={{ background: on ? T.panel : "transparent", color: on ? T.text : T.muted, fontSize: 11.5, fontWeight: 700, padding: "10px 12px", borderBottom: `3px solid ${on ? T.accent : "transparent"}`, marginBottom: -1, display: "inline-flex", alignItems: "center", gap: 7 }}>
                {t.label}
                {countFor(t.id) > 0 && (
                  <span style={{ background: T.bRed, color: "#fff", fontFamily: T.mono, fontSize: 10, fontWeight: 600,
                                 minWidth: 17, height: 17, borderRadius: 9, padding: "0 5px", letterSpacing: 0,
                                 display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                    {countFor(t.id)}
                  </span>
                )}
              </button>
            );
          })}
        </nav>

        {!loaded
          ? <NotLoadedYet error={sync.state === "error" ? sync.msg : null} />
          : shown ? views[shown] : <EverythingHidden admin={admin} onRestoreAll={restoreAllTabs} />}

        <footer style={{ marginTop: 34, paddingTop: 13, borderTop: `1px solid ${T.rule}`, fontFamily: T.mono, fontSize: 11, color: T.muted, lineHeight: 1.8 }}>
          <div>Prototype for crew review — not a controlled record under the SMS.</div>
          <div>Entries and uploads are saved on the server and shared with everyone.</div>
        </footer>
      </div>

      {/* The round from the page, watched from over whichever screen is open —
          it can be set going from more than one of them. */}
      <UpdateMatrixRun />
    </div>
    </Ctx.Provider>
  );
}

/* Nothing on the portal runs off the side of the screen.
 *
 * Zooming in is the page getting narrower, and a box that can't fit its
 * contents at that width would otherwise scroll sideways - which on a desk
 * means half a swing, or half a table, sitting where nobody can see it. Any
 * such box is shrunk just enough to fit instead, so the whole of it stays on
 * screen at any zoom.
 *
 * Two exceptions, both deliberate: the crew matrix is a spreadsheet and scrolls
 * side to side as one, and a phone-sized screen is left to scroll the way
 * phones do rather than shrinking everything to nothing.
 */
const FIT_FLOOR = 0.4;
// A phone is told apart by its screen being touched rather than by its width:
// a laptop zoomed to 300% is as narrow as a phone, and on that the whole page
// still has to fit.
const onTouchScreen = () =>
  !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
function useFitToWidth() {
  React.useEffect(() => {
    let frame = 0;
    const fit = () => {
      const phone = onTouchScreen();
      document.querySelectorAll(".um-scroll").forEach((el) => {
        // The matrix keeps its own sideways scroll, and so does the bar that
        // drives it.
        if (el.closest(".um-matrix") || el.querySelector(".um-matrix") || el.closest(".um-floatbar")) return;
        el.style.zoom = "";
        if (phone) return;
        // Shrinking the box changes what it measures, so the fit is closed in
        // on rather than guessed at once.
        for (let pass = 0; pass < 3; pass++) {
          const room = el.clientWidth;
          const want = el.scrollWidth;
          if (room <= 0 || want <= room + 1) break;
          const at = parseFloat(el.style.zoom) || 1;
          const next = Math.max(FIT_FLOOR, Math.floor(at * (room / want) * 995) / 1000);
          if (next >= at) break;
          el.style.zoom = String(next);
        }
      });
    };
    // A resize is answered at once; everything else - a tab switched, a panel
    // opened - is caught by the timer within half a second. The page used to be
    // watched for every change it made, but the portal redraws constantly, and
    // re-measuring five scroll strips on every redraw was work with no reader.
    const soon = () => {
      if (frame) return;
      frame = requestAnimationFrame(() => { frame = 0; fit(); });
    };
    soon();
    window.addEventListener("resize", soon);
    const tick = setInterval(soon, 400);
    return () => {
      window.removeEventListener("resize", soon);
      clearInterval(tick);
      cancelAnimationFrame(frame);
    };
  }, []);
}

function App() {
  // Who this is comes from the server: the page only ever loads behind a
  // real sign-in (email plus a code sent to it), and /api/me says the name
  // and the level. The old name-picker (SignIn, kept above unused) and the
  // per-tab remembering are superseded — the session cookie is the memory,
  // and it holds for ninety days per device. On the local preview, where no
  // server sign-in exists, /api/me answers 404/failed and the page falls
  // back to the picker so the preview keeps working.
  const [me, setMe] = useState(null);
  const [noServer, setNoServer] = useState(false);
  React.useEffect(() => {
    (async () => {
      try {
        const r = await fetch("/api/me");
        if (r.status === 401) { window.location.href = "/login"; return; }
        if (!r.ok) { setNoServer(true); return; }
        const who = await r.json();
        SESSION_USER = { name: who.name, role: who.role, email: who.email || "", fitToSail: who.fitToSail || "" };
        setMe(who);
      } catch (e) {
        setNoServer(true);
      }
    })();
  }, []);

  // Preview fallback: the honour-system picker, exactly as it always was.
  const [picked, setPicked] = useState(() => {
    try { return sessionStorage.getItem("um-signed-in") || null; } catch (e) { return null; }
  });
  if (noServer) {
    if (picked) {
      // Restored from the tab's memory: keep the role map in step.
      SESSION_USER = { name: picked, role: picked === IT_SUPPORT_ACCOUNT_NAME ? "it" : ADMINS.includes(picked) ? "management" : "crew", email: "" };
    }
    if (!picked) {
      return (
        <Boundary>
          <SignIn onSignIn={(r) => {
            try { sessionStorage.setItem("um-signed-in", r); } catch (e) {}
            SESSION_USER = { name: r, role: r === IT_SUPPORT_ACCOUNT_NAME ? "it" : ADMINS.includes(r) ? "management" : "crew", email: "" };
            setPicked(r);
          }} />
        </Boundary>
      );
    }
    return (
      <Boundary>
        <Portal role={picked} onSignOut={() => {
          try { sessionStorage.removeItem("um-signed-in"); } catch (e) {}
          setPicked(null);
        }} />
      </Boundary>
    );
  }

  if (!me) {
    return (
      <Boundary>
        <div style={{ minHeight: "60vh", display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: "system-ui", color: "#5b6b7a", fontSize: 14 }}>Signing you in...</div>
      </Boundary>
    );
  }

  return (
    <Boundary>
      <Portal role={me.name} onSignOut={() => { window.location.href = "/logout"; }} />
    </Boundary>
  );
}
