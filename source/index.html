/* The Portways Crew List & Shift Allocation form, opened from the portal.

   The form itself is the office's own page, kept byte-for-byte at
   crew-list-form.html — same layout, same checks, same Print and Save
   editable copy buttons; the portal never redraws it. The one thing the
   portal does is bring the form's own editable data lines up to date on the
   way out the door: the crew name lists are rebuilt from the swing lists the
   Swing Compliance page holds, and the crew-change dates take in the fly-out
   dates the portal knows. A person already on the form's own list keeps
   their SAMS number and Portways position wording; someone the swings added
   comes in new, with the position read off their rank. */
const RANK_TO_PORTWAYS = {
  "Master": "Master", "Chief Mate": "Chief Officer", "2nd Mate": "Second Mate",
  "Second Mate": "Second Mate", "Chief Engineer": "Chief Engineer",
  "1st Engineer": "First Engineer", "Junior Engineer": "Assistant Engineer",
  "GPH": "General Purpose Hand", "Cook": "Cook",
};

function CrewListFormPage({ people }) {
  const { swingLists, swingDates, swingBoards } = usePortal();
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [opened, setOpened] = useState(null);

  // Everyone on any swing list, one entry per person — the same names the
  // Swing Compliance page shows.
  const swingCrew = useMemo(() => {
    const seen = new Set(); const out = [];
    Object.keys(swingLists || {}).sort().forEach((k) => {
      (((swingLists || {})[k] || {}).entries || []).forEach((e) => {
        const name = String(e.name || "").trim();
        if (!name || seen.has(name.toLowerCase())) return;
        seen.add(name.toLowerCase());
        out.push({ name, rank: e.rank || "" });
      });
    });
    return out;
  }, [swingLists]);

  // First name + surname, lowercased — how a portal name ("Cornelius Keogh")
  // finds its form entry ("Cornelius James KEOGH") whatever the middle names.
  const keyOf = (n) => {
    const w = String(n || "").toLowerCase().replace(/[^a-z\s'-]/g, " ").trim().split(/\s+/);
    return w.length ? w[0] + " " + w[w.length - 1] : "";
  };

  const open = async () => {
    setBusy(true); setErr(""); setOpened(null);
    // The tab is opened in the same breath as the click — a browser only
    // allows a new tab from the click itself, and the fetch below would
    // spend that permission. A browser that refuses a new tab altogether
    // gets the form in this tab instead, with Back returning to the portal.
    const win = window.open("", "_blank");
    try {
      // Beside the portal on the live site; under source/ on the local server.
      let res = await fetch("crew-list-form.html");
      if (!res.ok) res = await fetch("source/crew-list-form.html");
      if (!res.ok) throw new Error("The form template (crew-list-form.html) isn't on the server.");
      let html = await res.text();

      const readList = (re) => {
        const m = re.exec(html);
        try { return m ? JSON.parse(m[1]) : []; } catch (e) { return []; }
      };

      // The form's own crew list, kept for SAMS numbers and position wording.
      const held = {};
      readList(/const CREW=(\[.*?\]);/).forEach((c) => {
        const k = keyOf(c.n); if (k && !held[k]) held[k] = c;
      });

      const crew = swingCrew.map(({ name, rank }) => {
        const was = held[keyOf(name)];
        return was ? { s: was.s, n: was.n, p: was.p }
          : { s: "", n: name, p: RANK_TO_PORTWAYS[rank] || rank || "" };
      }).sort((a, b) => a.n.localeCompare(b.n));
      if (!crew.length) throw new Error("The swing lists are empty — there is nobody to put on the form.");
      html = html.replace(/const CREW=\[.*?\];/, "const CREW=" + JSON.stringify(crew) + ";");

      // The designated crew-change days: the form's own list plus every
      // fly-out date the portal holds, oldest first.
      const dates = readList(/const CREW_CHANGE_DATES=(\[.*?\]);/);
      Object.values(swingDates || {}).forEach((s) => {
        const d = s && s.flyOut;
        if (d && /^\d{4}-\d{2}-\d{2}$/.test(d) && dates.indexOf(d) < 0) dates.push(d);
      });
      dates.sort();
      html = html.replace(/const CREW_CHANGE_DATES=\[.*?\];/, "const CREW_CHANGE_DATES=" + JSON.stringify(dates) + ";");

      // -- the planned crew list: who flies out at the next crew change ------
      // The swing after the one onboard now. Its crew letter names the joining
      // swing list, its fly-out day is the crew-change date, and its board —
      // where one has been worked on the roster — says who stands which watch.
      const k1 = currentSwingIndex() + 1;
      const sw = swingWithDates(k1, swingDates);
      const joining = ((((swingLists || {})[sw.crew]) || {}).entries || [])
        .map((e) => ({ name: String(e.name || "").trim(), rank: String(e.rank || "") }))
        .filter((e) => e.name);
      const board = (swingBoards || {})[k1] || null;
      const watchFor = (name) => {
        const person = (people || []).find((p) => p && keyOf(p.name) === keyOf(name));
        const w = person && board && board.shift ? board.shift[person.id] : "";
        // The form's AM watch is the 2400-1200 shift — the portal's night.
        return w === "night" ? "AM" : w === "day" ? "PM" : "";
      };
      const samsFor = (name) => { const c = crew.find((x) => keyOf(x.n) === keyOf(name)); return c ? c.s : ""; };

      // The form's fixed rows, in the order it draws them. `take` is matched
      // against the swing list's rank wording, loosely on purpose. Someone
      // whose watch the board knows goes to that watch's row; otherwise the
      // pair fills in order and the watches are swapped on the form if wrong.
      const SLOTS = [
        { i: 0, take: ["master"], watch: "AM" }, { i: 1, take: ["master"], watch: "PM" },
        { i: 2, take: ["chief mate", "chief officer"], watch: "AM" }, { i: 3, take: ["chief mate", "chief officer"], watch: "PM" },
        { i: 4, take: ["2nd mate", "second mate"], watch: "AM" }, { i: 5, take: ["2nd mate", "second mate"], watch: "PM" },
        { i: 6, take: ["chief engineer"] }, { i: 7, take: ["1st engineer", "first engineer"] },
        { i: 8, take: ["assistant engineer", "junior engineer"], watch: "AM" },
        { i: 9, take: ["assistant engineer", "junior engineer"], watch: "PM" },
        { i: 10, take: ["gph"], watch: "AM" }, { i: 11, take: ["gph"], watch: "PM" },
        { i: 12, take: ["gph"], watch: "AM" }, { i: 13, take: ["gph"], watch: "PM" },
        { i: 16, take: ["cook"] },
      ];
      // The form's own eligibility, read off the copy itself, so nobody is
      // pressed into a row the form would refuse — its Chief Mate Unlimited
      // slot takes only the SAMS numbers on Portways' CMU list, and the rest
      // go by the Portways position wording each person carries.
      const cmuSet = (() => {
        const m2 = /const CMU_SET=new Set\((\[.*?\])\)/.exec(html);
        try { return new Set(m2 ? JSON.parse(m2[1]) : []); } catch (e) { return new Set(); }
      })();
      const mayFill = (c, sl) => {
        if (!c) return false;
        if (sl.i <= 1) return c.p === "Master";
        if (sl.i === 2) return cmuSet.has(c.s);
        if (sl.i === 3) return c.p === "Chief Officer";
        if (sl.i <= 5) return c.p === "Second Mate" || c.p === "Chief Officer";
        if (sl.i === 6) return c.p === "Chief Engineer";
        if (sl.i === 7) return c.p === "First Engineer";
        if (sl.i <= 9) return ["Assistant Engineer", "First Engineer", "Chief Engineer"].indexOf(c.p) >= 0;
        if (sl.i <= 13) return c.p !== "Cook";
        return c.p === "Cook";
      };

      const fill = {};
      const unplaced = [];
      joining.forEach((e) => {
        const r = e.rank.toLowerCase();
        const c = crew.find((x) => keyOf(x.n) === keyOf(e.name)) || null;
        // Someone without a SAMS number goes in through the form's own
        // "Other (not listed)" route, which every row accepts.
        const entry = c && c.s ? { s: c.s } : { other: e.name };
        const cand = SLOTS.filter((sl) => !fill[sl.i]
          && sl.take.some((t) => r === t || r.includes(t) || t.includes(r))
          && (entry.other ? true : mayFill(c, sl)));
        const w = watchFor(e.name);
        const slot = (w && cand.find((sl) => sl.watch === w)) || cand[0];
        if (slot) { fill[slot.i] = entry(); return; }
        // The two flexible rows take the overflow — extra GPHs and engineers.
        if (r.includes("gph") || r.includes("engineer") || r.includes("eto")) {
          const fi = [14, 15].find((i) => !fill[i]);
          if (fi != null) { fill[fi] = Object.assign({ pos: r.includes("gph") ? "GPH" : "Assistant Engineer" }, entry); return; }
        }
        unplaced.push(e.name);
      });

      // Pressed into the page by a script that runs once and takes itself out
      // of the document — the form's own Save editable copy keeps the choices,
      // never the script. A copy already carrying saved work is left alone.
      const boot = {
        fields: { partnership: "UNI", vessel: "Coolibah", changedate: sw.flyOut },
        fill,
      };
      const bootScript = "\n<scr" + "ipt>\n"
        + "/* Written by the crew portal as this copy was opened: it presses the\n"
        + "   same dropdowns a person would, once, then removes itself - a saved\n"
        + "   copy carries the choices, not this script. */\n"
        + "(function(){\n"
        + "  var el = document.currentScript; if (el) el.remove();\n"
        + "  if (document.getElementById('pwSavedState')) return;\n"
        + "  var BOOT = " + JSON.stringify(boot).replace(/</g, "\\u003c") + ";\n"
        + "  function setVal(input, v){ if(!input||!v) return; input.value=v;\n"
        + "    input.dispatchEvent(new Event('input',{bubbles:true}));\n"
        + "    input.dispatchEvent(new Event('change',{bubbles:true})); }\n"
        + "  function go(){ try{\n"
        + "    setVal(document.getElementById('partnership'), BOOT.fields.partnership);\n"
        + "    setVal(document.getElementById('vessel'), BOOT.fields.vessel);\n"
        + "    setVal(document.getElementById('changedate'), BOOT.fields.changedate);\n"
        + "    var body = document.getElementById('plannedBody'); if(!body) return;\n"
        + "    Object.keys(BOOT.fill).forEach(function(i){\n"
        + "      var row = body.children[Number(i)]; if(!row) return;\n"
        + "      var f = BOOT.fill[i];\n"
        + "      if (f.pos){ var ps = row.querySelector('select.r-pos'); if (ps) setVal(ps, f.pos); }\n"
        + "      var nm = row.querySelector('.r-name'); if (!nm) return;\n"
        + "      if (f.s){ setVal(nm, f.s); }\n"
        + "      else if (f.other){ setVal(nm, '__other__'); var ot = row.querySelector('.r-name-other'); if (ot) setVal(ot, f.other); }\n"
        + "    });\n"
        + "  }catch(e){} }\n"
        + "  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();\n"
        + "})();\n"
        + "</scr" + "ipt>\n";
      html = html.indexOf("</body>") >= 0 ? html.replace("</body>", bootScript + "</body>") : html + bootScript;

      const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      if (win) {
        win.location = url;
        setTimeout(() => URL.revokeObjectURL(url), 120000);
        setOpened({ crew: crew.length, sams: crew.filter((c) => c.s).length,
          swing: `${sw.crew} · flying out ${fmtDate(sw.flyOut)}`,
          placed: Object.keys(fill).length, joining: joining.length, unplaced });
      } else {
        window.location.assign(url);
        return;
      }
    } catch (e) {
      try { if (win) win.close(); } catch (x) {}
      setErr(String((e && e.message) || e));
    }
    setBusy(false);
  };

  return (
    <div>
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.accent}`,
        borderRadius: 2, padding: "16px 18px", marginBottom: 14 }}>
        <Eyebrow color={T.accent}>Portways form</Eyebrow>
        <div style={{ fontFamily: T.body, fontSize: 15, fontWeight: 700, color: T.text, marginTop: 8 }}>
          Crew List &amp; Shift Allocation
        </div>
        <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.muted, lineHeight: 1.7, marginTop: 6 }}>
          Portways' own form, exactly as they issue it — it opens in its own tab with its layout,
          checks, Print and Save editable copy buttons untouched. The portal fills its name
          lists from the swing lists on Swing Compliance ({swingCrew.length} crew
          across the swings right now), adds the fly-out dates it knows to the crew-change days,
          and starts the planned crew list with the swing flying out at the next change — each
          person in their position's row, watches following the swing's board where one has been
          set on the roster. Check it over, finish it there, then use the form's own
          {" "}<b>Save editable copy</b> to keep your work.
        </div>
        <div style={{ marginTop: 12 }}>
          <Button onClick={open} disabled={busy || !swingCrew.length}>
            {busy ? "Preparing..." : "Open the form with today's crew"}
          </Button>
        </div>
        {opened && (
          <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.bGreen, marginTop: 8 }}>
            Opened with {opened.crew} crew in the name lists ({opened.sams} with their SAMS number)
            and the planned crew list filled with swing {opened.swing} — {opened.placed} of
            {" "}{opened.joining} placed in their position rows.
            {opened.unplaced.length > 0 && ` No row could be picked for ${opened.unplaced.join(", ")} — add them on the form by hand.`}
          </div>
        )}
        {err && (
          <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.bRed, marginTop: 8 }}>{err}</div>
        )}
        {!swingCrew.length && (
          <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, marginTop: 8 }}>
            The swing lists are empty, so there is nobody to put on the form yet — fill them in on
            Swing Compliance first.
          </div>
        )}
      </div>
    </div>
  );
}

/* Access grants — who may enter the portal and at what level.

   Three levels, enforced by the server on every request: IT Help runs
   everything including the maintenance machinery, Management runs everything
   but that machinery, and Crew reads and comments. Granting access here is
   all a new person needs — they sign in with their email and the code it
   receives; there is no password to hand out. Disabling a grant signs their
   devices out on the spot. */
const ACCESS_LEVELS = [
  { id: "crew", label: "Crew", blurb: "Reads everything, comments on posts. No Admin tab." },
  { id: "management", label: "Management", blurb: "Everything — uploads, checkers, rosters — except the portal's maintenance machinery." },
  { id: "it", label: "IT Help", blurb: "Everything, the machinery included. Only IT Help can grant IT Help." },
];

function AccessGrantsPage() {
  const { swingLists, quals } = usePortal();
  const [grants, setGrants] = useState(null);
  const [err, setErr] = useState("");
  const [busyId, setBusyId] = useState(null);
  const [draft, setDraft] = useState({ name: "", email: "", role: "crew" });
  const [traffic, setTraffic] = useState(null);
  const [trafficErr, setTrafficErr] = useState("");
  const myRole = SESSION_USER.role;

  // The company address a muster name almost certainly has: first name, dot,
  // surname, all lowercase — "Cornelius James KEOGH" becomes
  // cornelius.keogh@unitedmarine.au. Editable before granting, for the
  // exceptions.
  const guessEmail = (name) => {
    const parts = String(name || "").trim().toLowerCase().split(/\s+/).map((p) => p.replace(/[^a-z-]/g, ""));
    if (parts.length < 2 || !parts[0] || !parts[parts.length - 1]) return "";
    return `${parts[0]}.${parts[parts.length - 1]}@unitedmarine.au`;
  };

  // All crew without a grant yet — everyone on the crew matrix plus anyone
  // on a swing list, one row each, ready to be granted in one click.
  const ungranted = useMemo(() => {
    const seen = new Set(); const out = [];
    // Matrix names read "SURNAME, First"; swing lists read "First Surname".
    // Both become "First Surname" so one person is one row however spelled,
    // and the guessed email runs the right way round.
    const canonical = (raw) => {
      let name = String(raw || "").trim();
      const m = name.match(/^([^,]+),\s*(.+)$/);
      if (m) name = `${m[2].trim()} ${m[1].trim()}`;
      return name.split(/\s+/).map((w) => (/^[A-Z][A-Z'-]+$/.test(w) ? w[0] + w.slice(1).toLowerCase() : w)).join(" ");
    };
    const keyOf = (name) => {
      const parts = name.toLowerCase().split(/\s+/);
      return parts.length < 2 ? parts[0] : `${parts[0]}|${parts[parts.length - 1]}`;
    };
    const held = new Set((grants || []).flatMap((g) => [keyOf(canonical(g.name)), g.email.toLowerCase()]));
    const add = (rawName, rank) => {
      const name = canonical(rawName);
      if (!name) return;
      const key = keyOf(name);
      if (seen.has(key)) return;
      seen.add(key);
      if (held.has(key) || held.has(guessEmail(name))) return;
      out.push({ name, rank: rank || "" });
    };
    (((quals || {}).rows) || []).forEach((r) => add(r[0], r[1]));
    Object.keys(swingLists || {}).sort().forEach((k) => {
      (((swingLists || {})[k] || {}).entries || []).forEach((e) => add(e.name, e.rank));
    });
    out.sort((a, b) => a.name.localeCompare(b.name));
    return out;
  }, [swingLists, quals, grants]);

  // The same rank order the swing board reads under: bridge, engine room,
  // galley — anyone whose rank matches nothing waits under Other.
  const rankGroups = useMemo(() => {
    const groups = RANK_GROUPS.map(([label]) => ({ label, people: [] }));
    const other = { label: "Other", people: [] };
    ungranted.forEach((p) => {
      const at = RANK_GROUPS.findIndex(([, re]) => re.test(p.rank));
      (at >= 0 ? groups[at] : other).people.push(p);
    });
    return [...groups, other].filter((g) => g.people.length > 0);
  }, [ungranted]);

  // Per-muster-row drafts: email prefilled from the name, level picked here.
  const [rowDrafts, setRowDrafts] = useState({});
  const rowOf = (name) => rowDrafts[name] || { email: guessEmail(name), role: "crew" };
  const setRow = (name, patch) => setRowDrafts((d) => ({ ...d, [name]: { ...rowOf(name), ...patch } }));

  const loadTraffic = async () => {
    try {
      const r = await fetch("/api/login-events");
      if (!r.ok) throw new Error((await r.json()).error || `The traffic couldn't be read (${r.status}).`);
      setTraffic(await r.json());
      setTrafficErr("");
    } catch (e) { setTrafficErr(String(e.message || e)); }
  };
  React.useEffect(() => { loadTraffic(); }, []);

  const load = async () => {
    try {
      const r = await fetch("/api/users");
      if (!r.ok) throw new Error((await r.json()).error || `The list couldn't be read (${r.status}).`);
      setGrants(await r.json());
      setErr("");
    } catch (e) { setErr(String(e.message || e)); }
  };
  React.useEffect(() => { load(); }, []);

  const post = async (body) => {
    const r = await fetch("/api/users", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || `The grant was refused (${r.status}).`);
    await load();
  };
  const grant = async () => {
    setErr("");
    try {
      await post({ ...draft, name: canonicalName(draft.name) });
      setDraft({ name: "", email: "", role: "crew" });
    } catch (e) { setErr(String(e.message || e)); }
  };
  const grantRow = async (name) => {
    setBusyId(name); setErr("");
    try { await post({ name: canonicalName(name), email: rowOf(name).email, role: rowOf(name).role }); }
    catch (e) { setErr(String(e.message || e)); }
    setBusyId(null);
  };

  const change = async (id, patch) => {
    setBusyId(id); setErr("");
    try {
      const r = await fetch(`/api/users/${id}`, { method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch) });
      const out = await r.json();
      if (!r.ok) throw new Error(out.error || `The change was refused (${r.status}).`);
      await load();
    } catch (e) { setErr(String(e.message || e)); }
    setBusyId(null);
  };

  const remove = async (g) => {
    if (!window.confirm(`Remove ${g.name}'s grant entirely? They are signed out everywhere and can only return if granted again.`)) return;
    setBusyId(g.id); setErr("");
    try {
      const r = await fetch(`/api/users/${g.id}`, { method: "DELETE" });
      const out = await r.json();
      if (!r.ok) throw new Error(out.error || `The removal was refused (${r.status}).`);
      await load();
    } catch (e) { setErr(String(e.message || e)); }
    setBusyId(null);
  };

  const roleChip = (role) => {
    const on = { it: { fg: T.violet, bg: T.violetBg }, management: { fg: T.accent, bg: T.accentSoft }, crew: { fg: T.muted, bg: T.raised } }[role] || {};
    const label = (ACCESS_LEVELS.find((l) => l.id === role) || { label: role }).label;
    return <Chip fg={on.fg} bg={on.bg}>{label}</Chip>;
  };

  return (
    <div>
      <div style={{ marginBottom: 10 }}><Eyebrow color={T.accent}>Who can enter, and at what level</Eyebrow></div>
      
      {/* Granting */}
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.accent}`,
        borderRadius: 2, padding: "13px 15px", marginBottom: 16, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <input className="um-in" style={{ flex: "1 1 150px" }} placeholder="Full name" value={draft.name}
          onChange={(e) => setDraft({ ...draft, name: e.target.value })} />
        <input className="um-in" style={{ flex: "1 1 200px" }} placeholder="Email address" value={draft.email}
          onChange={(e) => setDraft({ ...draft, email: e.target.value })} />
        <select className="um-in" style={{ flex: "0 1 150px" }} value={draft.role}
          onChange={(e) => setDraft({ ...draft, role: e.target.value })}>
          {ACCESS_LEVELS.filter((l) => l.id !== "it").map((l) => (
            <option key={l.id} value={l.id}>{l.label}</option>
          ))}
        </select>
        <Button onClick={grant} disabled={!draft.name.trim() || !draft.email.trim()}>Grant access</Button>
      </div>

      {err && <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.bRed, marginBottom: 12 }}>{err}</div>}

      {/* The grants */}
      {!grants ? <Empty>Loading the grants...</Empty> : grants.length === 0 ? (
        <Empty>Nobody has a grant yet — the first sign-in seeds the first IT Help account.</Empty>
      ) : grants.map((g) => {
        const mine = g.email === SESSION_USER.email || g.name === SESSION_USER.name;
        const untouchable = mine || (g.role === "it" && myRole !== "it");
        return (
          <div key={g.id} style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap",
            padding: "9px 12px", borderBottom: `1px solid ${T.rule}`, opacity: g.disabled ? 0.55 : 1 }}>
            <span style={{ flex: "1 1 200px", minWidth: 0 }}>
              <span style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text }}>{g.name}</span>
              <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}> · {g.email}</span>
            </span>
            {roleChip(g.role)}
            {g.disabled && <Chip fg={T.bRed} bg={T.bRedBg}>disabled</Chip>}
            {mine && <Chip fg={T.teal} bg={T.raised}>you</Chip>}
            {!untouchable && (
              <span style={{ display: "flex", gap: 6, alignItems: "center" }}>
                <select className="um-in" style={{ fontSize: 11.5, padding: "3px 6px" }} value={g.role}
                  disabled={busyId === g.id}
                  onChange={(e) => change(g.id, { role: e.target.value })}>
                  {ACCESS_LEVELS.filter((l) => l.id !== "it").map((l) => (
                    <option key={l.id} value={l.id}>{l.label}</option>
                  ))}
                </select>
                <Button variant="quiet" disabled={busyId === g.id}
                  onClick={() => change(g.id, { disabled: !g.disabled })}>
                  {g.disabled ? "Re-enable" : "Disable"}
                </Button>
                <Button variant="quiet" disabled={busyId === g.id} onClick={() => remove(g)}>
                  <span style={{ color: T.bRed }}>Delete</span>
                </Button>
              </span>
            )}
          </div>
        );
      })}

      {/* The muster lists, ready to grant — names arrive by themselves, the
          level is all that's picked. */}
      {ungranted.length > 0 && (
        <div style={{ marginTop: 26 }}>
          <div style={{ marginBottom: 8 }}><Eyebrow color={T.teal}>Crew without a grant yet</Eyebrow></div>
          {rankGroups.map((grp) => (
            <div key={grp.label} style={{ marginBottom: 6 }}>
              <div style={{ fontFamily: T.body, fontSize: 11, fontWeight: 700, color: T.accent,
                textTransform: "uppercase", letterSpacing: ".08em", padding: "10px 12px 4px" }}>{grp.label}</div>
              {grp.people.map((p) => (
                <div key={p.name} style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap",
                  padding: "7px 12px", borderBottom: `1px solid ${T.rule}` }}>
                  <span style={{ flex: "1 1 170px", minWidth: 0 }}>
                    <span style={{ fontFamily: T.body, fontSize: 13.5, fontWeight: 600, color: T.text }}>{p.name}</span>
                    {p.rank && <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.muted }}> · {p.rank}</span>}
                  </span>
                  <input className="um-in" style={{ flex: "1 1 230px", fontSize: 12 }} value={rowOf(p.name).email}
                    onChange={(e) => setRow(p.name, { email: e.target.value })} />
                  <select className="um-in" style={{ fontSize: 11.5, padding: "3px 6px" }} value={rowOf(p.name).role}
                    onChange={(e) => setRow(p.name, { role: e.target.value })}>
                    {ACCESS_LEVELS.filter((l) => l.id !== "it").map((l) => (
                      <option key={l.id} value={l.id}>{l.label}</option>
                    ))}
                  </select>
                  <Button variant="quiet" disabled={busyId === p.name || !rowOf(p.name).email.trim()}
                    onClick={() => grantRow(p.name)}>Grant</Button>
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      {/* The sign-in book — every knock on the door, wanted or not. */}
      <div style={{ marginTop: 30 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
          <Eyebrow color={T.violet}>Sign-in traffic</Eyebrow>
          <Button variant="quiet" onClick={loadTraffic}>Refresh</Button>
        </div>
        {trafficErr && <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.bRed, marginBottom: 10 }}>{trafficErr}</div>}
        {!traffic ? (!trafficErr && <Empty>Reading the sign-in book...</Empty>) : (
          <>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
              {Object.keys(traffic.week || {}).length === 0 ? (
                <span style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted }}>Nothing in the last seven days.</span>
              ) : Object.entries(traffic.week).sort().map(([kind, n]) => {
                const bad = ["unknown_email", "code_wrong", "code_lockout", "denied", "disabled_account", "rate_limited"].includes(kind);
                return <Chip key={kind} fg={bad ? T.bRed : T.teal} bg={bad ? T.bRedBg : T.raised}>{kind.replace(/_/g, " ")}: {n} this week</Chip>;
              })}
            </div>
            {traffic.events.length === 0 ? <Empty>No traffic recorded yet.</Empty> : (
              <div style={{ overflowX: "auto" }}>
                <table style={{ borderCollapse: "collapse", width: "100%", fontFamily: T.mono, fontSize: 11 }}>
                  <thead><tr>
                    {["When", "What", "Email", "IP", "Country"].map((h) => (
                      <th key={h} style={{ textAlign: "left", padding: "5px 10px", borderBottom: `2px solid ${T.rule}`,
                        fontFamily: T.body, fontSize: 11, color: T.muted, textTransform: "uppercase", letterSpacing: ".06em" }}>{h}</th>
                    ))}
                  </tr></thead>
                  <tbody>
                    {traffic.events.map((ev, i) => {
                      const bad = ["unknown_email", "code_wrong", "code_lockout", "denied", "disabled_account", "rate_limited"].includes(ev.kind);
                      return (
                        <tr key={i} style={{ borderBottom: `1px solid ${T.rule}` }}>
                          <td style={{ padding: "5px 10px", whiteSpace: "nowrap", color: T.muted }}>
                            {new Date(ev.ts * 1000).toLocaleString("en-AU", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}
                          </td>
                          <td style={{ padding: "5px 10px" }}>
                            <Chip fg={bad ? T.bRed : T.teal} bg={bad ? T.bRedBg : T.raised}>{ev.kind.replace(/_/g, " ")}</Chip>
                            {ev.detail && <span style={{ color: T.muted }}> {ev.detail}</span>}
                          </td>
                          <td style={{ padding: "5px 10px", color: T.text }}>{ev.email || "—"}</td>
                          <td style={{ padding: "5px 10px", color: T.muted }}>{ev.ip || "—"}</td>
                          <td style={{ padding: "5px 10px", color: T.muted }}>{ev.country || "—"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* The company's SharePoint library, browsed live — the United Operations
   Team's real folders and files exactly as Teams holds them, one folder per
   request through the worker's Graph connection. */
function SharePointPage() {
  const [path, setPath] = useState("");
  const [listing, setListing] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const load = async (at) => {
    setBusy(true); setErr("");
    try {
      const r = await fetch(`/api/sharepoint?path=${encodeURIComponent(at)}`);
      const out = await r.json();
      if (!r.ok) throw new Error(out.error || `The library couldn't be read (${r.status}).`);
      setListing(out);
    } catch (e) { setErr(String(e.message || e)); }
    setBusy(false);
  };
  React.useEffect(() => { load(path); }, [path]);

  // Folders → portal, on demand: the same pass the hourly schedule runs.
  const [syncing, setSyncing] = useState(false);
  const [syncOut, setSyncOut] = useState(null);
  const [prog, setProg] = useState(null);
  const syncNow = async () => {
    setSyncing(true); setSyncOut(null); setProg({ pct: 0, word: "Asking the portal to read the folders" });
    // While the sync request is held open, the worker writes its progress down
    // and this poll reads the percentage back for the window.
    const poll = setInterval(async () => {
      try {
        const r = await fetch("/api/sync/progress");
        if (r.ok) { const p = await r.json(); if (p && !p.done) setProg(p); }
      } catch (e) {}
    }, 700);
    try {
      const r = await fetch("/api/sync", { method: "POST" });
      const out = await r.json();
      if (!r.ok) throw new Error(out.error || `The sync failed (${r.status}).`);
      setSyncOut(out);
      await load(path);
    } catch (e) { setSyncOut({ error: String(e.message || e) }); }
    clearInterval(poll);
    setSyncing(false);
  };
  const syncLine = () => {
    const ls = listing && listing.lastSync;
    if (!ls) return "Files dropped into these folders from Teams are taken onto the portal's books every hour — no sync has run yet.";
    const when = new Date(ls.at).toLocaleString("en-AU", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    if (ls.error) return `Last sync ${when} (${ls.by}) failed: ${ls.error}`;
    return `Folders last read ${when} (${ls.by}): ${ls.registered} new certificate${ls.registered === 1 ? "" : "s"} taken on` +
      (ls.adopted ? `, ${ls.adopted} document${ls.adopted === 1 ? "" : "s"} adopted` : "") +
      (ls.missing ? `, ${ls.missing} on the books but gone from the folders` : "") +
      (ls.strays ? `, ${ls.strays} loose in the certificates root` : "") + ". Runs every hour.";
  };

  const fmtBytes = (n) => n == null ? "" :
    n < 1024 ? `${n} B` : n < 1048576 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`;
  const fmtWhen = (s) => !s ? "" :
    new Date(s).toLocaleDateString("en-AU", { day: "2-digit", month: "short", year: "numeric" });

  const crumbs = path ? path.split("/") : [];
  const entries = (listing && listing.entries) || [];

  return (
    <div>
      <div style={{ marginBottom: 10 }}><Eyebrow color={T.accent}>The company library, live</Eyebrow></div>
      {/* Folders → portal: what the hourly sync last did, and a button to run it now. */}
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", fontFamily: T.body,
        fontSize: 12.5, color: T.muted, padding: "9px 12px", border: `1px solid ${T.rule}`, borderRadius: 2,
        marginBottom: 12 }}>
        <span style={{ flex: 1, minWidth: 0, lineHeight: 1.6 }}>{syncLine()}</span>
        <Button variant="quiet" disabled={syncing} onClick={syncNow}>{syncing ? "Syncing..." : "Sync now"}</Button>
      </div>
      {/* The sync window: the worker's own percentage while it runs, and a
          plain answer when it is done — what was taken on, or why nothing was. */}
      {(syncing || syncOut) && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(22,50,74,0.45)", zIndex: 60,
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderTop: `4px solid ${T.accent}`,
            borderRadius: 3, padding: "22px 26px", width: "min(540px, 92vw)", maxHeight: "80vh", overflowY: "auto" }}>
            <Eyebrow color={T.accent}>{syncing ? "Syncing with SharePoint" : "Sync finished"}</Eyebrow>
            {syncing ? (
              <>
                <div style={{ fontFamily: T.display, fontSize: 46, fontWeight: 700, color: T.text, margin: "10px 0 2px" }}>
                  {Math.round((prog && prog.pct) || 0)}%
                </div>
                <div style={{ height: 8, background: T.raised, borderRadius: 4, overflow: "hidden", margin: "8px 0 10px" }}>
                  <div style={{ height: "100%", width: `${Math.round((prog && prog.pct) || 0)}%`, background: T.accent,
                    transition: "width .5s" }} />
                </div>
                <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted }}>{(prog && prog.word) || "Working..."}</div>
              </>
            ) : syncOut.error ? (
              <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, margin: "12px 0" }}>{syncOut.error}</div>
            ) : (
              <div style={{ fontFamily: T.body, fontSize: 13, color: T.text, lineHeight: 1.7, margin: "12px 0" }}>
                {syncOut.registered.length === 0 ? (
                  <b>Nothing new to take on.</b>
                ) : (
                  <>
                    <b>{syncOut.registered.length} new certificate{syncOut.registered.length === 1 ? "" : "s"} taken on:</b>
                    <ul style={{ margin: "6px 0", paddingLeft: 20, fontFamily: T.mono, fontSize: 11.5 }}>
                      {syncOut.registered.slice(0, 12).map((r) => <li key={r.id}>{r.key.split("/").slice(1).join(" / ")}</li>)}
                    </ul>
                    {syncOut.registered.length > 12 && <div>...and {syncOut.registered.length - 12} more.</div>}
                  </>
                )}
                {syncOut.adopted.length > 0 && (
                  <div style={{ marginTop: 6 }}>{syncOut.adopted.length} document{syncOut.adopted.length === 1 ? "" : "s"} adopted.</div>
                )}
                {syncOut.missing.length > 0 && (
                  <div style={{ color: T.bRed, marginTop: 8 }}>
                    {syncOut.missing.length} on the books but gone from the folders (moved or renamed by hand) — nothing was deleted.
                  </div>
                )}
              </div>
            )}
            {!syncing && (
              <div style={{ display: "flex", justifyContent: "flex-end" }}>
                <Button onClick={() => setSyncOut(null)}>Close</Button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Where we are */}
      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", fontFamily: T.mono,
        fontSize: 12, padding: "9px 12px", background: T.panel, border: `1px solid ${T.rule}`,
        borderLeft: `4px solid ${T.accent}`, borderRadius: 2, marginBottom: 12 }}>
        <a style={{ cursor: "pointer", color: T.accent, fontWeight: 700 }} onClick={() => setPath("")}>Library</a>
        {crumbs.map((c, i) => (
          <React.Fragment key={i}>
            <span style={{ color: T.muted }}>/</span>
            <a style={{ cursor: "pointer", color: i === crumbs.length - 1 ? T.text : T.accent }}
              onClick={() => setPath(crumbs.slice(0, i + 1).join("/"))}>{c}</a>
          </React.Fragment>
        ))}
        <span style={{ flex: 1 }} />
        <Button variant="quiet" disabled={busy} onClick={() => load(path)}>Refresh</Button>
      </div>

      {err && <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.bRed, marginBottom: 12 }}>{err}</div>}
      {busy && !listing ? <Empty>Reading the library...</Empty> : null}

      {listing && !busy && entries.length === 0 && !err && <Empty>This folder is empty.</Empty>}

      {entries.map((e) => (
        <div key={e.path} style={{ display: "flex", gap: 10, alignItems: "center", padding: "8px 12px",
          borderBottom: `1px solid ${T.rule}`, opacity: busy ? 0.5 : 1 }}>
          {e.folder ? (
            <>
              <span style={{ color: T.accent, fontFamily: T.mono, fontSize: 12 }}>&#9656;</span>
              <a style={{ cursor: "pointer", flex: 1, fontFamily: T.body, fontSize: 13.5, fontWeight: 600,
                color: T.text }} onClick={() => setPath(e.path)}>{e.name}</a>
              <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.muted }}>
                {e.count == null ? "" : `${e.count} item${e.count === 1 ? "" : "s"}`}
              </span>
            </>
          ) : (
            <>
              <span style={{ width: 10 }} />
              <span style={{ flex: 1, fontFamily: T.body, fontSize: 13, color: T.text, minWidth: 0,
                overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.name}</span>
              <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.muted }}>{fmtBytes(e.size)}</span>
              <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.muted }}>{fmtWhen(e.modified)}</span>
              {e.downloadUrl && (
                <a href={e.downloadUrl} target="_blank" rel="noreferrer"
                  style={{ fontFamily: T.body, fontSize: 12, fontWeight: 600, color: T.accent }}>Open</a>
              )}
            </>
          )}
        </div>
      ))}
    </div>
  );
}

/* Upload Crew Certificates — the crew's own door. A name and a drop, and the
   file is filed into the company SharePoint under them, read, converted to
   PDF and named the way OPMS wants it; the window then hands the finished
   file back to save and upload to OPMS. */
function CrewCertificateUpload() {
  const { quals: QUALS } = usePortal();
  const names = useMemo(() => QUALS.rows.map((r) => r[0]), [QUALS]);
  const [typed, setTyped] = useState(SESSION_USER.name || "");
  const filedAs = useMemo(() => {
    const c = canonicalName(typed);
    return c ? (matchRoster(c, names) || c) : "";
  }, [typed, names]);
  const [jobs, setJobs] = useState([]);
  const [open, setOpen] = useState(false);
  const [hot, setHot] = useState(false);
  const [nameErr, setNameErr] = useState("");
  const fileRef = useRef(null);
  const camRef = useRef(null);
  const [shots, setShots] = useState([]);
  const [retake, setRetake] = useState("");
  const patchJob = (key, p) => setJobs((js) => js.map((j) => (j.key === key ? { ...j, ...p } : j)));

  /* A photo straight off the phone: turned the right way up, brought down to
     a size that uploads quickly, re-saved as a JPEG, and measured for
     sharpness so a blurred shot is caught before it goes anywhere. */
  const takeIn = async (file) => {
    const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
    const scale = Math.min(1, 2200 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const small = document.createElement("canvas");
    const sw = 400, sh = Math.max(1, Math.round(canvas.height * (400 / canvas.width)));
    small.width = sw; small.height = sh;
    small.getContext("2d").drawImage(canvas, 0, 0, sw, sh);
    const px = small.getContext("2d").getImageData(0, 0, sw, sh).data;
    const g = new Float32Array(sw * sh);
    for (let i = 0; i < sw * sh; i++) g[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
    let sum = 0, sum2 = 0, n = 0;
    for (let y = 1; y < sh - 1; y++) for (let x = 1; x < sw - 1; x++) {
      const i = y * sw + x;
      const v = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - sw] - g[i + sw];
      sum += v; sum2 += v * v; n++;
    }
    const sharpness = n ? sum2 / n - (sum / n) * (sum / n) : 0;
    const blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.86));
    return { key: Date.now() + "-" + Math.random().toString(36).slice(2, 7), blob, preview: URL.createObjectURL(blob),
      blurry: sharpness < 30 };
  };

  const addShots = async (files) => {
    const list = [...files].filter((f) => f && f.size > 0);
    if (!list.length) return;
    setRetake("");
    const taken = [];
    for (const f of list) {
      try { taken.push(await takeIn(f)); } catch (e) { setRetake("That photo couldn't be opened. Take it again."); }
    }
    setShots((s) => [...s, ...taken]);
  };
  const dropShot = (key) => setShots((s) => s.filter((x) => x.key !== key));
  const clearShots = () => { shots.forEach((s) => URL.revokeObjectURL(s.preview)); setShots([]); };

  const uploadOne = (file, key) => new Promise((resolve) => {
    const fd = new FormData();
    if (Array.isArray(file)) {
      file.forEach((s, i) => fd.append("page", s.blob, `page-${i + 1}.jpg`));
      fd.append("pagesName", `${filedAs} - certificate photo`);
    } else {
      fd.append("file", file);
    }
    fd.append("category", "certificate");
    fd.append("person", filedAs);
    fd.append("uploadedBy", SESSION_USER.name || filedAs);
    fd.append("onDuplicate", "skip");
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/files");
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) patchJob(key, { pct: Math.round((e.loaded / e.total) * 45), phase: "Uploading to SharePoint" });
    };
    xhr.onload = () => {
      let body = {};
      try { body = JSON.parse(xhr.responseText || "{}"); } catch (e) {}
      resolve({ status: xhr.status, body });
    };
    xhr.onerror = () => resolve({ status: 0, body: {} });
    xhr.send(fd);
  });

  const run = async (files, fromCamera) => {
    if (!filedAs) { setNameErr("Type your name first."); return; }
    setNameErr("");
    const list = fromCamera ? [files] : [...files].filter((f) => f && f.size > 0);
    if (!list.length) return;
    const start = list.map((f, i) => ({ key: Date.now() + "-" + i,
      name: fromCamera ? `Photo · ${f.length} page${f.length === 1 ? "" : "s"}` : f.name, pct: 0, phase: "Waiting", done: false }));
    setJobs(start); setOpen(true);
    for (let i = 0; i < list.length; i++) {
      const key = start[i].key;
      const up = await uploadOne(list[i], key);
      if (up.status === 200 && up.body.skipped) {
        patchJob(key, { pct: 100, phase: "Already on file", done: true });
        continue;
      }
      if (up.status < 200 || up.status >= 300 || !up.body.record) {
        patchJob(key, { pct: 100, phase: "Failed", done: true, note: up.body.error || `Upload failed (${up.status || "no connection"})` });
        continue;
      }
      const rec = up.body.record;
      if (fromCamera) clearShots();
      patchJob(key, { pct: 50, phase: "Converting and reading the certificate" });
      let creep = 50;
      const timer = setInterval(() => { creep = Math.min(90, creep + 1); patchJob(key, { pct: creep }); }, 700);
      try {
        const r = await fetch("/api/certificates/read-one", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: rec.id, discardUnreadable: !!fromCamera }) });
        const out = await r.json();
        if (!r.ok) throw new Error(out.error || `Reading failed (${r.status})`);
        clearInterval(timer);
        if (out.discarded) {
          patchJob(key, { pct: 100, phase: "Not clear — take the photo again", done: true, failed: true, note: out.reason || "" });
          setRetake("The photo wasn't clear enough to read. Take it again.");
          continue;
        }
        patchJob(key, { pct: 100, phase: "Done", done: true, filename: out.filename, url: out.url, code: out.code,
          note: out.readable ? (out.code ? "" : "Certificate type not identified — name kept as uploaded.") : (out.reason || "Couldn't be read.") });
      } catch (e) {
        clearInterval(timer);
        patchJob(key, { pct: 100, phase: "Uploaded — not renamed", done: true, filename: rec.filename, url: rec.url, note: String(e.message || e) });
      }
    }
  };

  const save = async (j) => {
    const r = await fetch(j.url);
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = j.filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  const allDone = jobs.length > 0 && jobs.every((j) => j.done);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <SectionHead title="Upload Crew Certificates" />
        <a className="um-btn" href="https://portways.opms.com.au/" target="_blank" rel="noreferrer"
          style={{ background: T.accent, color: "#fff", border: `1px solid ${T.accent}`, fontSize: 11, fontWeight: 700,
            padding: "8px 13px", borderRadius: 2, textDecoration: "none", letterSpacing: "0.06em" }}>
          OPEN OPMS
        </a>
      </div>
      <div style={{ fontFamily: T.body, fontSize: 14, color: T.muted, lineHeight: 1.7, marginBottom: 16 }}>
        Drop your certificate here with your name on it. It is filed straight into the company
        SharePoint under you, converted to PDF and named the way OPMS wants it — then handed back so
        you can save the finished file and upload that same copy to OPMS.
      </div>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 12 }}>
        <div style={{ flex: "1 1 260px" }}>
          <Field label="Your name">
            <input className="um-in" value={typed} placeholder="First name and surname"
              onChange={(e) => setTyped(e.target.value)} />
          </Field>
        </div>
        <div style={{ fontFamily: T.mono, fontSize: 11.5, color: filedAs ? T.text : T.muted, paddingBottom: 9 }}>
          {filedAs ? `Filed as ${filedAs}` : ""}
        </div>
      </div>
      {nameErr && <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.bRed, marginBottom: 10 }}>{nameErr}</div>}

      <input ref={fileRef} type="file" multiple accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/*" style={{ display: "none" }}
        onChange={(e) => { run(e.target.files); if (fileRef.current) fileRef.current.value = ""; }} />
      <input ref={camRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }}
        onChange={(e) => { addShots(e.target.files); if (camRef.current) camRef.current.value = ""; }} />

      <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 3, padding: "14px 16px", marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
          <Button onClick={() => camRef.current && camRef.current.click()}>
            {shots.length ? "Take the next page" : "Take a photo"}
          </Button>
          {shots.length > 0 && !shots.some((s) => s.blurry) && (
            <Button variant="ghost" onClick={() => run(shots, true)}>
              Upload {shots.length} page{shots.length === 1 ? "" : "s"} as one certificate
            </Button>
          )}
          {shots.length > 0 && <Button variant="quiet" onClick={clearShots}>Start again</Button>}
        </div>
        {retake && <div style={{ fontFamily: T.body, fontSize: 13, fontWeight: 600, color: T.bRed, marginTop: 10 }}>{retake}</div>}
        {shots.length > 0 && (
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 12 }}>
            {shots.map((s, i) => (
              <div key={s.key} style={{ width: 96 }}>
                <div className="um-shot" style={{ outline: s.blurry ? `3px solid ${T.bRed}` : "none" }}>
                  <img src={s.preview} alt="" />
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 10.5, color: s.blurry ? T.bRed : T.muted, marginTop: 4, textAlign: "center" }}>
                  {s.blurry ? "Not clear — retake" : `Page ${i + 1}`}
                </div>
                <div style={{ textAlign: "center", marginTop: 2 }}>
                  <a style={{ fontFamily: T.body, fontSize: 11.5, color: T.accent, cursor: "pointer" }} onClick={() => dropShot(s.key)}>Remove</a>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="um-drop"
        onDragOver={(e) => { e.preventDefault(); setHot(true); }}
        onDragLeave={() => setHot(false)}
        onDrop={(e) => { e.preventDefault(); setHot(false); run(e.dataTransfer.files); }}
        onClick={() => fileRef.current && fileRef.current.click()}
        style={{ border: `2px dashed ${hot ? T.accent : T.rule}`, borderRadius: 3, background: hot ? T.raised : T.panel,
          padding: "34px 16px", textAlign: "center", cursor: "pointer", marginBottom: 18 }}>
        <div className="um-cue" style={{ fontFamily: T.display, fontSize: 14, fontWeight: 700, color: T.text, letterSpacing: "0.04em" }}>
          Drop certificates here
        </div>
        <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 6 }}>or press to choose files · PDF or photo · 5 MB each</div>
      </div>

      {open && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(22,50,74,0.45)", zIndex: 60,
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderTop: `4px solid ${T.accent}`,
            borderRadius: 3, padding: "22px 26px", width: "min(600px, 94vw)", maxHeight: "84vh", overflowY: "auto" }}>
            <Eyebrow color={T.accent}>{allDone ? "Finished" : "Uploading"}</Eyebrow>
            {jobs.map((j) => (
              <div key={j.key} style={{ padding: "12px 0", borderBottom: `1px solid ${T.rule}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12 }}>
                  <span style={{ fontFamily: T.body, fontSize: 13.5, fontWeight: 600, color: T.text, minWidth: 0,
                    overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{j.filename || j.name}</span>
                  <span style={{ fontFamily: T.display, fontSize: 22, fontWeight: 700, color: T.text }}>{j.pct}%</span>
                </div>
                <div style={{ height: 7, background: T.raised, borderRadius: 4, overflow: "hidden", margin: "8px 0 6px" }}>
                  <div style={{ height: "100%", width: `${j.pct}%`, background: j.failed || (j.note && j.phase === "Failed") ? T.bRed : T.accent,
                    transition: "width .4s" }} />
                </div>
                <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted }}>{j.phase}{j.note ? ` · ${j.note}` : ""}</div>
                {j.done && j.url && (
                  <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap", marginTop: 10 }}>
                    <span style={{ fontFamily: T.body, fontSize: 13, color: T.text }}>Save this document for upload to OPMS</span>
                    <Button onClick={() => save(j)}>Save to this device</Button>
                  </div>
                )}
              </div>
            ))}
            {allDone && (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, marginTop: 14 }}>
                <span style={{ fontFamily: T.body, fontSize: 14, fontWeight: 700, color: T.teal }}>Upload successfully completed</span>
                <Button variant="quiet" onClick={() => { setOpen(false); setJobs([]); }}>Close</Button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* The Admin tab's own pages. Kept as a list so the strip that switches between
   them and the page that is rendered can't disagree about what exists. */
const ADMIN_PAGES = [
  { id: "today", label: "Today" },
  { id: "roster", label: "Roster" },
  { id: "required-docs", label: "Required Documents For Upload" },
  { id: "checker", label: "Certification Checker" },
  { id: "elearning", label: "E-Learning Status" },
  { id: "swing-compliance", label: "Swing Compliance" },
  { id: "opms", label: "OPMS Checker" },
  { id: "portways-docs", label: "Portways Documentation" },
  { id: "ai-checker", label: "AI Checker" },
  { id: "sharepoint", label: "SharePoint" },
  { id: "access", label: "Access Grants" },
];

function Admin({ currentUser, people, setPeople, overrides, setOverrides, swingBoard, setSwingBoard, notes, corrCount, history, allTabs, hiddenTabs, onHideTab, onRestoreTab, onRestoreAllTabs, files, sync, log }) {
  // The Admin tab is seven pages now, not one: the documents the portal has to
  // be given, the certification work it started as, the pages that were being
  // asked for around them, and the AI Checker — moved here from the crew tab
  // bar so it sits with the rest of the admin tooling. The page is remembered
  // here so switching between them doesn't reset the screen underneath.
  // Uploads come first — a portal with nothing filed can do nothing else on
  // this tab.
  const [page, setPage] = useRemembered("admin-page", "today",
    (v) => ADMIN_PAGES.some((p) => p.id === v));

  if (!isAdmin(currentUser)) {
    return (
      <div>
        <SectionHead title="Admin" />
        <Empty>You don't have admin access. Ask the Master if you need something changed.</Empty>
      </div>
    );
  }

  const stat = (label, value) => (

function NotifyToggle({ log, on, setOn, count = 0 }) {
  const supported = typeof window !== "undefined" && "Notification" in window;
  const [blocked, setBlocked] = useState(() => supported && Notification.permission === "denied");
  const state = !supported ? "unsupported" : blocked ? "blocked" : on ? "on" : "off";

  const label = { on: "Notifications on", off: "Notifications off", blocked: "Notifications blocked in your browser settings", unsupported: "Notifications aren't supported on this device" }[state];

  const toggle = async () => {
    if (state === "unsupported" || state === "blocked") return;
    if (state === "on") {
      setOn(false);
      log("Admin", "Turned notifications off");
      return;
    }
    let perm = Notification.permission;
    if (perm === "default") {
      try { perm = await Notification.requestPermission(); } catch (e) { perm = "denied"; }
    }
    if (perm === "granted") {
      setOn(true);
      log("Admin", "Turned notifications on");
      try { new Notification("TSV Coolibah", { body: "You'll be told when notes are filed or the roster changes." }); } catch (e) {}
    } else {
      setBlocked(true);
    }
  };

  const dim = state === "blocked" || state === "unsupported";

  return (
    <span style={{ position: "relative", display: "inline-block" }}>
    <button className="um-btn" onClick={toggle} title={label} aria-label={label} aria-pressed={state === "on"}
      style={{
        background: state === "on" ? T.accentSoft : "transparent",
        border: `1px solid ${state === "on" ? T.accent : T.rule}`,
        borderRadius: 2, padding: "8px 10px", lineHeight: 0,
        cursor: dim ? "default" : "pointer", opacity: dim ? 0.4 : 1,
      }}>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke={state === "on" ? T.accent : T.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        {state !== "on" && <line x1="3" y1="3" x2="21" y2="21" stroke={T.muted} />}
      </svg>
    </button>
    {count > 0 && (
      <span style={{ position: "absolute", top: -6, right: -7, background: T.bRed, color: "#fff",
                     fontFamily: T.mono, fontSize: 10, fontWeight: 600, minWidth: 17, height: 17,
                     borderRadius: 9, padding: "0 4px", display: "flex", alignItems: "center",
                     justifyContent: "center", border: `2px solid ${T.deep}` }}>
        {count > 99 ? "99+" : count}
      </span>
    )}
    </span>
  );
}

class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return (
        <div style={{ fontFamily: "ui-monospace, monospace", color: "#fff", background: "#8A1E15",
          padding: "18px 22px", fontSize: 13, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
          {"SOMETHING BROKE - screenshot this and send it over\n\n" + String(this.state.err.message)}
        </div>
      );
    }
    return this.props.children;
  }
}

/* A piece of screen state that survives the page reloading itself — which
   main tab is open, which Admin page — so a refresh (or the live preview
   putting an edit up) lands back where the reader was, not on the front page.
   Kept per-tab in sessionStorage, the same as the sign-in; `ok` guards
   against a stored value that no longer names a real page. */
function useRemembered(key, initial, ok) {
  const [v, setV] = useState(() => {
    try {
      const held = sessionStorage.getItem("um-ui-" + key);
      if (held && (!ok || ok(held))) return held;
    } catch (e) {}
    return initial;
  });
  const set = (next) => {
    try { sessionStorage.setItem("um-ui-" + key, next); } catch (e) {}
    setV(next);
  };
  return [v, set];
}
