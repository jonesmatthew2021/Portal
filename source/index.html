function loadXLSX() {
  if (typeof window === "undefined") return Promise.reject(new Error("no browser"));
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    // Only needed for a spreadsheet upload, and the failure is reported on the
    // page that asked for it — so the fatal banner leaves this one alone.
    el.setAttribute("data-optional", "1");
    el.crossOrigin = "anonymous";
    el.onload = () => (window.XLSX ? res(window.XLSX) : rej(new Error("SheetJS failed to load")));
    el.onerror = () => rej(new Error("Couldn't download the spreadsheet reader - check the connection"));
    document.head.appendChild(el);
  });
}

const isoOf = (v) => {
  if (v instanceof Date && !isNaN(v)) {
    return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
  return null;
};

// Pull the same shape out of the workbook that the portal already holds.
// Only crew and their dates are taken - the columns already on the page stay as they are.
function parseWorkbook(XLSX, buf, current) {
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const name = wb.SheetNames.find((n) => n.toUpperCase().includes("CREW EXPIRY")) || wb.SheetNames[0];
  const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true });

  // row 14 holds the item codes, row 15 the titles, crew start on row 16
  const codes = (grid[13] || []).map((c) => (c == null ? "" : String(c).trim()));
  if (!codes.some((c) => /^[A-Z]{2}-\d/.test(c))) {
    throw new Error(`Couldn't find the item codes on sheet "${name}" - is this the right workbook?`);
  }

  // map each column the portal already knows about to its column in the file
  const colFor = {};
  current.cols.forEach((c, idx) => {
    const at = codes.indexOf(c[0]);
    if (at >= 0) colFor[idx] = at;
  });

  const incoming = [];
  for (let r = 15; r < grid.length; r++) {
    const row = grid[r] || [];
    const nm = row[1] == null ? "" : String(row[1]).trim();
    if (!nm) continue;
    const vals = current.cols.map((_, idx) => {
      const at = colFor[idx];
      if (at === undefined) return null;
      const raw = row[at];
      if (raw == null || raw === "") return "";
      const iso = isoOf(raw);
      return iso || String(raw).trim();
    });
    incoming.push({ name: nm, pos: String(row[2] || "").trim(), sam: String(row[3] || "").trim(), vals });
  }
  if (!incoming.length) throw new Error("No crew rows found in that file.");
  return incoming;
}

/**
 * A document the portal keeps exactly one of.
 *
 * One file is kept on the server per document — the crew certificates spreadsheet,
 * the training matrix, the skills matrix — and uploading a new one replaces it.
 * Because that takes the old one out of the portal, the replacement is never
 * silent: the first attempt writes nothing and comes back with the file that is
 * already there, which is put in front of the uploader to accept.
 *
 * `onFiled` is handed the new record once it is down, so the caller can put it on
 * the page and act on it — filing a matrix is what sets the analysis going.
 */
/* One of the office's workbooks, taken straight from the library.
 *
 * The office drops these loose in the certificate location. Until now the
 * portal only ever got one two ways: a sync that happened to notice, or
 * somebody downloading it to their own machine and uploading it back into the
 * portal it was already sitting next to. This lists what the library holds
 * that looks like the document and files the one chosen — nothing is moved,
 * the portal points at where the office put it. */
function ImportFromSharePoint({ category, noun, onFiled, logAction }) {
  const { log } = usePortal();
  const [open, setOpen] = useState(false);
  const [found, setFound] = useState(null);   // null = not asked yet
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const look = async () => {
    setOpen(true); setBusy(true); setErr(""); setFound(null);
    try {
      const r = await fetch("/api/import-single", { method: "POST",
        headers: { "content-type": "application/json" }, body: JSON.stringify({ category }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || ("the library couldn't be read (" + r.status + ")"));
      setFound(out.found || []);
    } catch (e) { setErr(e.message || String(e)); setFound([]); }
    setBusy(false);
  };

  const take = async (f) => {
    setBusy(true); setErr("");
    try {
      const r = await fetch("/api/import-single", { method: "POST",
        headers: { "content-type": "application/json" }, body: JSON.stringify({ category, key: f.key }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || ("it couldn't be filed (" + r.status + ")"));
      onFiled(out.record, out.replaced || []);
      log("Admin", logAction || ("Filed the " + noun + " from SharePoint"),
        out.record.filename + (out.restored ? " — put back as it was" : "")
        + ((out.replaced || []).length ? " · replaced " + out.replaced[0].filename : ""));
      setOpen(false);
    } catch (e) { setErr(e.message || String(e)); }
    setBusy(false);
  };

  return (
    <>
      <button className="um-btn um-tab" onClick={look}
        style={{ background: T.panel, color: T.text, border: `1px solid ${T.rule}`,
          fontSize: 11, fontWeight: 700, padding: "9px 14px", borderRadius: 2, whiteSpace: "nowrap" }}>
        Import from SharePoint
      </button>

      {open && (
        <div style={{ position: "fixed", inset: 0, zIndex: 80, background: "rgba(18,41,61,0.45)",
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderTop: `4px solid ${T.accent}`,
            borderRadius: 3, padding: 20, width: "100%", maxWidth: 560 }}>
            <Eyebrow color={T.accent}>The {noun}, from SharePoint</Eyebrow>
            {busy && !found && (
              <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, marginTop: 10 }}>Looking in the library…</div>
            )}
            {found && found.length === 0 && !err && (
              <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, marginTop: 10, lineHeight: 1.6 }}>
                Nothing in the library looks like a {noun}.
              </div>
            )}
            {found && found.length > 0 && found.map((f) => (
              <div key={f.key} style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap",
                padding: "9px 0", borderTop: `1px solid ${T.rule}`, marginTop: 6 }}>
                <span style={{ fontFamily: T.mono, fontSize: 12, color: T.text, flex: "1 1 260px", wordBreak: "break-word" }}>
                  {f.filename}
                  {f.wasOnFile && <span style={{ color: T.muted }}> · was on file before</span>}
                </span>
                <Button variant="solid" disabled={busy} onClick={() => take(f)}>File this one</Button>
              </div>
            ))}
            {err && <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.bRed, marginTop: 10 }}>{err}</div>}
            <div style={{ marginTop: 14 }}>
              <Button variant="quiet" onClick={() => setOpen(false)}>Close</Button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function SingleDocumentUpload({
  category,
  noun,
  eyebrow,
  blurb = "",
  current,
  onFiled,
  logAction,
  label,
  footnote = "",
  accept = ".xlsx,.xlsm,.xls,.csv,.pdf",
  variant = "quiet",
}) {
  const { log, role } = usePortal();
  const [step, setStep] = useState(null);      // null | "file" | "overwrite" | "done"
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [pending, setPending] = useState(null);
  const [result, setResult] = useState(null);
  const fileRef = useRef(null);

  const close = () => { setStep(null); setErr(""); setPending(null); setResult(null); };

  const send = async (file, decide) => {
    setBusy(true); setErr("");
    try {
      const res = await uploadSingleDocument(
        file, category, { uploadedBy: role, filedOn: todayISO(), session: SESSION }, decide,
      );

      if (res.overwrite) {
        // Nothing was written. Show what would go, and ask.
        setPending({ file, existing: res.existing || [] });
        setStep("overwrite");
      } else if (res.record) {
        const replaced = res.replaced || [];
        onFiled(res.record, replaced);
        setResult({ record: res.record, replaced });
        setStep("done");
        log("Admin", logAction,
          replaced.length ? `${res.record.filename} - replaced ${replaced[0].filename}` : res.record.filename);
      }
    } catch (e) {
      setErr(e.message || String(e));
      setStep("file");
    }
    setBusy(false);
    if (fileRef.current) fileRef.current.value = "";
  };

  const onPick = (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) send(f, "ask");
  };

  return (
    <>
      <button className="um-btn um-tab" onClick={() => { close(); setStep("file"); }}
        style={{ background: variant === "solid" ? T.accent : T.panel,
          color: variant === "solid" ? "#FFF" : T.text,
          border: `1px solid ${variant === "solid" ? T.accent : T.rule}`,
          fontSize: 11, fontWeight: 700, padding: "9px 14px", borderRadius: 2, whiteSpace: "nowrap" }}>
        {label}
      </button>

      {step && (
        <div style={{ position: "fixed", inset: 0, zIndex: 80, background: "rgba(18,41,61,0.45)",
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 3,
            padding: 20, width: "100%", maxWidth: 460 }}>

            {step === "file" && (
              <DropSpot disabled={busy} accept={accept}
                onFile={(f) => send(f, "ask")}
                onReject={(f) => setErr(`${f.name} isn't a file type this takes (${accept.replaceAll(",", ", ")}).`)}>
                <div style={{ marginBottom: 5 }}><Eyebrow color={T.accent}>{eyebrow}</Eyebrow></div>
                {blurb && (
                  <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 14 }}>
                    {blurb}
                  </div>
                )}

                {current ? (
                  <div style={{ background: T.raised, borderRadius: 2, padding: "9px 11px", marginBottom: 14,
                    display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ marginBottom: 4 }}><Eyebrow>On file now</Eyebrow></div>
                      <div style={{ fontFamily: T.body, fontSize: 13, color: T.text, wordBreak: "break-word" }}>
                        {current.filename}
                      </div>
                      <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 2 }}>
                        {current.uploaded ? `${fmtDate(current.uploaded)} · ` : ""}{current.size}
                      </div>
                    </div>
                    <OpenLink url={current.url} />
                  </div>
                ) : (
                  <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, marginBottom: 14 }}>
                    No {noun} has been filed yet.
                  </div>
                )}

                <input ref={fileRef} type="file" accept={accept}
                  style={{ display: "none" }} onChange={onPick} />
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                  <Button onClick={() => fileRef.current && fileRef.current.click()}>
                    {busy ? "Uploading..." : current ? `Choose a newer ${noun}` : `Choose ${noun}`}
                  </Button>
                  <Button variant="quiet" onClick={close}>Cancel</Button>
                  <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>or drag it onto this box</span>
                </div>
                {err && (
                  <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, marginTop: 14, lineHeight: 1.6 }}>{err}</div>
                )}
              </DropSpot>
            )}

            {step === "overwrite" && pending && (
              <>
                <div style={{ marginBottom: 5 }}><Eyebrow color={T.bOrange}>There is already a {noun} on file</Eyebrow></div>
                <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginBottom: 14 }}>
                  Only one {noun} is kept, so uploading{" "}
                  <strong style={{ fontWeight: 600 }}>{pending.file.name}</strong> replaces the one
                  that is there. Nothing has been saved yet.
                </div>

                <div style={{ background: T.raised, borderRadius: 2, padding: "9px 11px", marginBottom: 16 }}>
                  <div style={{ marginBottom: 7 }}><Eyebrow>Would be overwritten</Eyebrow></div>
                  {pending.existing.map((e) => (
                    <div key={e.id} style={{ display: "flex", justifyContent: "space-between", gap: 10,
                      alignItems: "center", flexWrap: "wrap", padding: "4px 0" }}>
                      <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, wordBreak: "break-word" }}>
                        {e.filename}
                        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
                          {" "}· {e.size}{e.uploaded ? ` · filed ${fmtDate(e.uploaded)}` : ""}
                          {e.by ? ` · ${e.by}` : ""}
                        </span>
                      </span>
                      <OpenLink url={e.url} />
                    </div>
                  ))}
                </div>

                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <Button onClick={() => send(pending.file, "replace")}>
                    {busy ? "Overwriting..." : "Overwrite it"}
                  </Button>
                  <Button variant="quiet" onClick={() => { setPending(null); setStep("file"); }}>
                    Keep the one on file
                  </Button>
                </div>
                {err && (
                  <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, marginTop: 14, lineHeight: 1.6 }}>{err}</div>
                )}
              </>
            )}

            {step === "done" && result && (
              <>
                <div style={{ marginBottom: 5 }}><Eyebrow color={T.green}>{noun} uploaded</Eyebrow></div>
                <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginBottom: 6 }}>
                  {result.record.filename}
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginBottom: 14, wordBreak: "break-all" }}>
                  {result.record.path}
                </div>
                <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 16 }}>
                  {result.replaced.length
                    ? `It overwrote ${result.replaced[0].filename}, which is no longer on the portal — it is kept in the removed list.`
                    : `It is the first ${noun} filed, so nothing was overwritten.`}
                  {footnote ? ` ${footnote}` : ""}
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <Button onClick={close}>Done</Button>
                  <OpenLink url={result.record.url} />
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </>
  );
}

/**
 * The crew certificates spreadsheet, as a single-file upload.
 *
 * Filing one also moves the "matrix updated" date the certification screens read
 * from, because that date is about the spreadsheet rather than about the portal.
 */
function UpdateSpreadsheet({ label = "Upload or replace the spreadsheet", variant = "quiet" }) {
  const { certSheet, setCertSheet, setMatrixUpdated } = usePortal();
  return (
    <SingleDocumentUpload
      category="certificate-sheet"
      noun="spreadsheet"
      eyebrow="Crew certificates spreadsheet"
      blurb="One spreadsheet is kept on the portal - the latest. Uploading a newer one replaces it, and the certification screens read from whichever is on file."
      current={certSheet || null}
      onFiled={(record) => {
        // The OPMS sheet is read by the screens that read it; replacing it
        // starts no round - the round compares certificates against the
        // crew matrix, and never against this sheet.
        setCertSheet(record);
        setMatrixUpdated(todayISO());
      }}
      logAction="Spreadsheet uploaded"
      label={label}
      footnote={`Filed ${fmtDate(TODAY)}.`}
      variant={variant}
    />
  );
}

/* ==================================================================== */
/*  Reports as a PDF file                                               */
/* ==================================================================== */

// The PDF writer, like the spreadsheet reader, is fetched the first time
// someone asks for a file rather than on every visit. The promise is kept so a
// second click while it is still coming down doesn't start another download.
let pdfLib = null;
function loadPDF() {
  if (typeof window === "undefined") return Promise.reject(new Error("no browser"));
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (pdfLib) return pdfLib;
  pdfLib = new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    // Asked for on demand and reported on the screen that asked, so the fatal
    // banner leaves this one alone - same as the spreadsheet reader.
    el.setAttribute("data-optional", "1");
    el.crossOrigin = "anonymous";
    el.onload = () => (window.jspdf && window.jspdf.jsPDF
      ? res(window.jspdf.jsPDF)
      : rej(new Error("The PDF writer failed to load")));
    el.onerror = () => {
      pdfLib = null;
      rej(new Error("Couldn't download the PDF writer - check the connection and try again"));
    };
    document.head.appendChild(el);
  });
  pdfLib.catch(() => { pdfLib = null; });
  return pdfLib;
}

const rgbOf = (hex) => {
  const h = String(hex || "#000000").replace("#", "");
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
};

const slugOf = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

/* One matrix item as a line on the page: its code, what it is, the three
   columns the certification screens carry against it — how long it stays valid,
   when it was issued, when it runs out — and how that expiry reads today in its
   own colour.

   `ctx` is what the screen knows and the item on its own doesn't: whose line
   this is, the shared store of dates read off the certificates, and how to look
   up a validity period. Give it none and the line is what it always was — code,
   title, expiry, status — so a report with nothing to fill those columns with
   prints exactly as before. */
const pdfLineIn = (ctx = {}) => (x) => {
  const d = ctx.person != null ? certDateFor(ctx.dates, ctx.person, x.code) : null;
  // The expiry the matrix holds, or where it holds none, the one the
  // certificate itself carries — the same order of preference the screens use.
  // A date the reader can't parse is left off the line rather than printed as a
  // dash, which on paper would read as "there isn't one".
  const col = (v) => {
    const s = v ? colDate(v) : "";
    return s === "—" ? "" : s;
  };
  return {
    code: x.code,
    title: x.title,
    validity: (ctx.validityFor && ctx.validityFor(x)) || "",
    issued: col(d && d.issued),
    date: col(x.band.date || (d && d.expires)),
    status: bandLabel(x.band),
    fg: x.band.fg,
    bg: x.band.bg,
  };
};

/**
 * Every report on the portal is the same thing on paper: a title block, then
 * groups of items with a status against each. So there is one writer, and a
 * report only has to describe itself:
 *
 *   { title, subtitle, intro, filename, empty,
 *     groups: [{ heading, meta, blurb, items }] }
 *
 * An item is a line - code, title, date, status - and may carry `notes`, a few
 * short lines printed under the title in their own colour. A matrix report has
 * no use for them; a report that says why something is on the page can't be read
 * without them.
 *
 * A line off a certification screen carries two more columns as well - `validity`,
 * how long the item stays valid, and `issued`, the date it was issued - which
 * print to the left of the expiry date under their own headings, in the order
 * they sit in on screen. Room is only kept for the columns a report actually
 * fills, so a report with neither prints at the width it always did.
 *
 * The text is written into the PDF rather than photographed off the screen, so
 * it stays sharp at any zoom, can be searched, and the file is a few kilobytes.
 */
async function saveReportPDF(report) {
  const jsPDF = await loadPDF();
  const doc = new jsPDF({ unit: "pt", format: "a4", compress: true });

  const PW = doc.internal.pageSize.getWidth();
  const PH = doc.internal.pageSize.getHeight();
  const M = 42;                    // margin
  const W = PW - M * 2;
  const FLOOR = PH - 52;           // where the body has to stop for the footer
  let page = 1;
  let y = M;

  const ink = (hex) => doc.setTextColor(...rgbOf(hex));
  const fill = (hex) => doc.setFillColor(...rgbOf(hex));
  const stroke = (hex) => doc.setDrawColor(...rgbOf(hex));

  const footer = () => {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    ink(T.muted);
    doc.text(`${VESSEL.name} ${VESSEL.nameAccent} - ${report.title}`, M, PH - 28);
    doc.text(String(page), PW - M, PH - 28, { align: "right" });
  };

  // Keeps a block whole: if it won't fit under what is already on the page,
  // start a new one rather than split it across the fold.
  const room = (h) => {
    if (y + h <= FLOOR) return;
    footer();
    doc.addPage();
    page += 1;
    y = M;
  };

  // Title block
  doc.setFont("helvetica", "bold");
  doc.setFontSize(15);
  ink(T.text);
  doc.splitTextToSize(String(report.title).toUpperCase(), W).forEach((line) => {
    doc.text(line, M, y + 12);
    y += 18;
  });
  if (report.subtitle) {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    ink(T.muted);
    doc.splitTextToSize(report.subtitle, W).forEach((line) => {
      doc.text(line, M, y + 9);
      y += 12;
    });
  }
  y += 6;
  stroke(T.text);
  doc.setLineWidth(1.2);
  doc.line(M, y, PW - M, y);
  y += 18;

  // The standing to read the rest by - on a report that apportions fault, the
  // columns underneath mean nothing without the rule that put a finding in one.
  if (report.intro) {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    ink(T.text);
    doc.splitTextToSize(report.intro, W).forEach((line) => {
      doc.text(line, M, y + 8);
      y += 12;
    });
    y += 10;
  }

  const groups = (report.groups || []).filter((g) => g && g.items && g.items.length);

  /* The columns the certification screens carry against each item, on paper in
     the order they read in on screen: how long it stays valid, when it was
     issued, when it runs out. Room is only kept for the ones something in this
     report actually fills, and the expiry column stays where the single date
     column has always sat - so a report carrying none of the new columns comes
     out at the width and in the place it always did. */
  const COL_STATUS = 100;   // room kept at the right edge for the status tag
  const COL_DATE = 48;      // issue date and expiry date
  const COL_VALID = 60;     // module validity, which is words rather than a date

  const filled = (k) => groups.some((g) => g.items.some((it) => it[k]));
  const dateCols = [];
  let colX = PW - M - COL_STATUS;
  [
    { key: "date", head: "Expiry date", w: COL_DATE, fg: T.text },
    { key: "issued", head: "Issue date", w: COL_DATE, fg: T.text },
    { key: "validity", head: "Module validity", w: COL_VALID, fg: T.muted },
  ].forEach((c) => {
    if (!filled(c.key)) return;
    dateCols.push({ ...c, x: colX });
    colX -= c.w;
  });

  // Headings go over the columns only where the headings say what the column
  // holds. A report that puts its own reading in the date column - the
  // certificate review's proposed value, say - fills neither of the other two,
  // and keeps its bare lines rather than being labelled an expiry date.
  const heads = filled("validity") || filled("issued");
  const titleW = Math.max(120, colX - M - 52 - 8);

  if (groups.length === 0) {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    ink(T.muted);
    doc.text(report.empty || "Nothing to report.", M, y + 9);
  }

  groups.forEach((g) => {
    // Enough room for the heading band, the column headings under it where
    // there are any, and the first line - so a group never starts at the very
    // foot of a page with its contents on the next.
    room(heads ? 66 : 52);

    fill(T.raised);
    doc.rect(M, y, W, 18, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    ink(T.text);
    doc.text(g.heading, M + 7, y + 12.5);
    if (g.meta) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      ink(T.muted);
      doc.text(g.meta, PW - M - 7, y + 12.5, { align: "right" });
    }
    y += 25;

    if (g.blurb) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      ink(T.muted);
      const blurb = doc.splitTextToSize(g.blurb, W);
      room(blurb.length * 10 + 4);
      blurb.forEach((line) => {
        doc.text(line, M, y + 7);
        y += 10;
      });
      y += 4;
    }

    // The column headings sit over each group rather than once at the top of
    // the report, so a group carried onto a new page still says what the
    // figures down its right-hand side are.
    if (heads) {
      room(16);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(6.5);
      ink(T.muted);
      dateCols.forEach((c) => doc.text(c.head.toUpperCase(), c.x, y + 6, { align: "right" }));
      y += 9;
      stroke(T.rule);
      doc.setLineWidth(0.7);
      doc.line(M, y, PW - M, y);
      y += 4;
    }

    g.items.forEach((it) => {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      const lines = doc.splitTextToSize(it.title, titleW);

      // Wrapped at the size they are drawn at, and measured before anything is
      // drawn, so the block is either whole on this page or whole on the next.
      doc.setFontSize(8);
      const notes = (it.notes || [])
        .filter((n) => n && n.text)
        .map((n) => ({ fg: n.fg || T.muted, lines: doc.splitTextToSize(String(n.text), titleW) }));
      const notesH = notes.reduce((h, n) => h + n.lines.length * 9.5, 0);

      const h = Math.max(15, lines.length * 11 + 4 + (notesH ? notesH + 4 : 0));
      room(h);

      doc.setFontSize(7);
      ink(T.accent);
      doc.text(it.code, M, y + 9);

      doc.setFontSize(9);
      ink(T.text);
      lines.forEach((line, i) => doc.text(line, M + 52, y + 9 + i * 11));

      if (notes.length) {
        doc.setFontSize(8);
        let ny = y + 9 + lines.length * 11;
        notes.forEach((n) => {
          ink(n.fg);
          n.lines.forEach((line) => {
            doc.text(line, M + 52, ny);
            ny += 9.5;
          });
        });
      }

      if (dateCols.length) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(7.5);
        dateCols.forEach((c) => {
          if (!it[c.key]) return;
          ink(heads ? c.fg : T.muted);
          doc.text(String(it[c.key]), c.x, y + 9, { align: "right" });
        });
      }

      if (it.status) {
        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.5);
        const tw = Math.min(96, doc.getTextWidth(it.status) + 11);
        fill(it.bg || T.raised);
        doc.roundedRect(PW - M - tw, y, tw, 12.5, 2, 2, "F");
        ink(it.fg || T.muted);
        doc.text(it.status, PW - M - tw / 2, y + 8.7, { align: "center" });
      }

      y += h;
      stroke(T.rule);
      doc.setLineWidth(0.5);
      doc.line(M, y - 3, PW - M, y - 3);
    });

    y += 11;
  });

  footer();
  doc.save(report.filename);
}

// ---------------------------------------------------------------------------
// AI CHECKER
// A free-form conversation with the model behind the portal's analysis tools.
// The other AI on the portal is all narrow questions with fixed answers; this
// is the open end of it — ask whatever needs asking, with a file attached
// where the question is about one: an image, a PDF, or an Excel workbook, picked
// with the button or dropped onto the box. Lives on the Admin tab. The
// conversation lives in this browser for this visit and is sent up whole with
// every question, so nothing anyone asks is saved on the server or shown to
// anyone else.
//
// The AI can read the portal as well: the shared record, the file index, the
// certificates and their scans, and the answers the portal's own checks have
// made. It does that on the server, in `lib/portal.ts`, which is why an answer
// can take a minute before any words arrive — and why the waiting bubble shows
// what is being looked at rather than a bare "Thinking...". Nothing it does
// changes anything on the portal.
// ---------------------------------------------------------------------------
const AI_CHECKER_API = "/api/ai-checker";

// A question is not answered by the request that asks it. Answering is one long
// question to the model — often with a PDF on it — and a request that waited for
// it was cut off by the platform partway and came back as a bare 504 with
// nothing in it. So the server writes the question down, a background function
// answers it, and the answer is read out of the job as the model writes it,
// which is why it still arrives a few words at a time.
//
// The worker is given fifteen minutes and a question over a long document can
// take minutes of them, so the wait is generous. The poll is quick, because
// reading the answer as it is written is the whole point of it.
const AI_POLL_MS = 800;
const AI_WAIT_MS = 14 * 60 * 1000;

/** One call to the AI Checker endpoint, with its own words on a refusal. */
async function askChecker(body) {
  const r = await fetch(AI_CHECKER_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && data.error) || `The AI couldn't be reached (${r.status}).`);
  if (!data) throw new Error("The AI answered with something that couldn't be read. Ask again.");
  return data;
}

/**
 * Read an answer as it is written, handing each new piece to `onText`.
 *
 * A poll that fails is not an answer that failed — the worker is writing it
 * either way — so a dropped request is tried again and only several in a row are
 * taken as the connection having gone.
 *
 * `onStep` is given what the checker is looking at on the portal while it works
 * something out — reading someone's certificates, opening a document. It arrives
 * before any of the answer does and stops the moment words start, so a question
 * that has the AI going through several records doesn't sit there looking stuck.
 */
async function readCheckerAnswer(jobId, onText, onStep) {
  const startedAt = Date.now();
  let answer = "";
  let misses = 0;
  let step = "";

  while (Date.now() - startedAt < AI_WAIT_MS) {
    await sleep(AI_POLL_MS);

    let poll;
    try {
      poll = await askChecker({ jobId, have: answer.length });
      misses = 0;
    } catch (e) {
      if (++misses >= 3) throw e;
      continue;
    }

    if (poll.text) {
      answer += poll.text;
      onText(answer);
    }
    // Only on a change, so a poll every eight-tenths of a second doesn't set
    // React redrawing the thread for a line that hasn't moved.
    const said = poll.step || "";
    if (said !== step) {
      step = said;
      if (onStep) onStep(step);
    }
    if (poll.state === "error") {
      throw new Error(poll.error || "The AI stopped without saying why. Ask again.");
    }
    if (poll.state === "done") {
      if (!answer.trim()) throw new Error("The AI sent nothing back. Ask again.");
      // Where the answer stopped before the model had finished, the reason is
      // put on the end of it rather than thrown over what did arrive.
      return poll.note ? `${answer.trim()}\n\n${poll.note}` : answer.trim();
    }
  }

  throw new Error(
    "The answer is taking longer than it should. Ask again — something shorter, or without the attachment, if it happens twice.",
  );
}

// What can ride along with a question: the images the model can look at and
// PDFs it can read. Sizes are bounded by the request the function will take
// (about 6MB after base64), not by what the model could hold.
const AI_ATTACH_TYPES = {
  pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg",
  gif: "image/gif", webp: "image/webp",
};

// Spreadsheets go up a different way. A .xlsx is a zip, so there is nothing in
// one for a model to look at: the workbook is opened here instead, with the same
// reader the portal already uses for its own uploads, and what the sheets say is
// sent as text. Which means an Excel file costs the request its words rather
// than its megabytes, and a 20MB workbook of mostly empty cells sends very
// little.
const AI_SHEET_TYPES = {
  xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  xlsm: "application/vnd.ms-excel.sheet.macroEnabled.12",
  xls: "application/vnd.ms-excel",
  csv: "text/csv",
};
const AI_SHEET_MAX_BYTES = 20 * 1024 * 1024;   // what will be opened in the browser
const AI_SHEET_MAX_CHARS = 60000;              // text kept from one workbook
const AI_SHEET_PAYLOAD_BUDGET = 120000;        // sheet text per request

const AI_ATTACH_MAX_FILES = 4;                    // per question
const AI_ATTACH_MAX_BYTES = 3 * 1024 * 1024;      // per question, before base64
// The whole conversation is resent with every follow-up, attachments included.
// This is how much attachment data one request will carry: the newest files
// are kept and older ones are dropped from the payload (never from the
// screen), so a long thread never grows past what the function accepts.
const AI_ATTACH_PAYLOAD_BUDGET = 4200000;         // base64 characters per request

const AI_ATTACH_ACCEPT = ".pdf,.png,.jpg,.jpeg,.gif,.webp,.xlsx,.xlsm,.xls,.csv";
const AI_ATTACH_REJECTED =
  "isn't a file the AI can look at. It takes images (PNG, JPG, GIF, WebP), PDFs and spreadsheets (XLSX, XLSM, XLS, CSV).";

// What kind of attachment a picked file is: a spreadsheet to be read here, a
// file to be sent as bytes, or nothing this page takes. Extension decides for
// spreadsheets, because what a browser calls a .csv or a .xls varies by machine.
const aiAttachKind = (file) => {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (AI_SHEET_TYPES[ext]) return { type: AI_SHEET_TYPES[ext], sheet: true };
  if (Object.values(AI_SHEET_TYPES).includes(file.type)) return { type: file.type, sheet: true };
  const byMime = Object.values(AI_ATTACH_TYPES).includes(file.type) ? file.type : null;
  const type = byMime || AI_ATTACH_TYPES[ext] || null;
  return type ? { type, sheet: false } : null;
};

// A workbook as text, sheet by sheet, the same way the portal reads the matrices
// it holds: every sheet under its own heading with the rows as CSV, cut off at
// what one question can carry with a line saying so.
async function aiSheetText(file) {
  const XLSX = await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });

  let text = "";
  for (const name of wb.SheetNames) {
    const csv = XLSX.utils.sheet_to_csv(wb.Sheets[name], { blankrows: false, dateNF: "yyyy-mm-dd" });
    if (!csv.trim()) continue;
    text += `### SHEET: ${name}\n${csv}\n\n`;
    if (text.length > AI_SHEET_MAX_CHARS) break;
  }
  if (!text.trim()) throw new Error("every sheet in it is empty.");

  return text.length > AI_SHEET_MAX_CHARS
    ? `${text.slice(0, AI_SHEET_MAX_CHARS)}\n\n[This is where the file was cut off — it is too long to send whole, so anything below this point is missing.]`
    : text;
}

const readFileAsB64 = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => { const s = String(r.result || ""); res(s.slice(s.indexOf(",") + 1)); };
  r.onerror = () => rej(new Error(`${file.name} couldn't be read.`));
  r.readAsDataURL(file);
});


/* Whether the authority that issued a certificate reads as Australian.

   Goes off the issuing authority the portal read from each scan when the dates
   were last brought up to date (Update matrix) — nothing here re-reads a
   certificate. The markers are generous on purpose: a line is only flagged
   when its issuer names nothing Australian at all, and the issuer is printed
   on the flag itself so a wrongly flagged line gives itself away at a glance.
   A certificate whose issuer hasn't been read yet says nothing either way, so
   it is never flagged. */
const AU_ISSUER = new RegExp([
  "australia", "amsa", "\\.gov\\.au", "\\brto\\b", "tafe", "austswim",
  "new south wales", "\\bnsw\\b", "queensland", "\\bqld\\b", "victoria", "\\bvic\\b",
  "tasmania", "western australia", "\\bwa\\b", "south australia", "northern territory",
  "worksafe", "safework", "st john", "surf life saving", "royal life saving",
  "maritime safety queensland", "australian maritime college", "\\bamc\\b",
  // The customer's and the operator's own names, from the vessel file.
  ...VESSEL.customerMarks.auIssuers,
  // How an Australian company writes its own name, and the numbers only an
  // Australian company has. "Link Resources Training Pty Ltd" named nothing
  // on the list above and was called foreign for it - and that is how most
  // of the training providers in the country write themselves.
  "\\bpty\\.?\\s*l\\.?t\\.?d\\.?\\b", "\\bpty\\b", "\\babn\\b", "\\bacn\\b",
  "registered training organisation", "nationally recognised",
].join("|"), "i");

/* A unit of competency out of the national training packages - RIIWHS204E,
   HLTAID011, SITXFSA005. The code is the qualification: it exists on
   training.gov.au and nowhere else, so a certificate carrying one was issued
   in Australia to an Australian standard, whatever the provider is called. */
const AU_UNIT = /\\b(?:RII|HLT|SIT|TLI|CPC|UEE|MEM|PUA|BSB|AHC|AUR|CHC|ICT|MSM|SIS|CUA|FSK|AVI|MAR|CUV|DEF|NWP|RGR)[A-Z]{0,5}\\d{3,5}[A-Z]?\\b/i;

/* Another country's maritime authority, or the country itself, named outright.

   This list is the whole of the test now, and it used to be the other way
   round: anything that did not name something Australian was called foreign.
   On this vessel that flagged 234 certificates and every one of them was
   wrong - Tiller Academy, Veritas, SeaWays, Kangaroo Training Institute,
   Mandurah Safety & Training Services are all Australian and not one of them
   says so in its name. A provider is under no obligation to put the country
   in the title, so its absence says nothing at all, and a flag that is wrong
   every time it appears teaches everyone to read past it.

   Naming a foreign authority is evidence; not naming Australia is not. So the
   portal only speaks where it has the first. Missing a foreign ticket is a
   worse failure than the old noise in one way and a better one in another -
   it leaves the question to the person reading the certificate, where a wrong
   flag took it away from them. */
const FOREIGN_ISSUER = new RegExp([
  "philippines", "philippine", "\\bmarina\\b",
  "\\bindia\\b", "indian", "directorate general of shipping",
  "indonesia", "ukrain", "russia", "poland", "polish", "romania", "sri lanka",
  "myanmar", "burma", "banglades", "pakistan", "nepal", "\\bchina\\b", "chinese",
  "singapore", "malaysia", "thailand", "vietnam", "\\bkorea", "\\bjapan\\b",
  "panama", "liberia", "marshall island", "\\bmalta\\b", "cyprus", "bahamas",
  "vanuatu", "\\bfiji\\b", "papua new guinea", "\\bpng\\b",
  "maritime new zealand", "new zealand", "\\bsamsa\\b", "south africa",
  "maritime and coastguard agency", "maritime & coastguard agency", "\\bmca\\b",
  "united kingdom", "isle of man", "gibraltar", "bermuda",
  "norway", "norwegian", "denmark", "danish", "netherlands", "dutch",
  "germany", "german", "greece", "hellenic", "turkey", "turkish", "croatia",
  "\\begypt", "\\bmyanma",
].join("|"), "i");

/* The issuer to flag a line with: the issuer as read, where it names another
   country's authority and nothing Australian. Null everywhere else, including
   where no issuer has been read.

   A certificate naming both - "Australian Maritime Safety Authority / UK
   Maritime & Coastguard Agency" - is an Australian one that mentions the
   other, so Australia has the last word. */
const foreignIssuerOf = (d, title) => {
  const issuer = d && d.issuer ? String(d.issuer).trim() : "";
  if (!issuer) return null;
  const words = [issuer, title, d && d.title, d && d.certificateTitle].filter(Boolean).join(" ");
  if (AU_ISSUER.test(words) || AU_UNIT.test(words)) return null;
  return FOREIGN_ISSUER.test(issuer) ? issuer : null;
};

/* The renewal loop. A red item looks the same whether it is being ignored or
   the course is booked for Tuesday — these marks are the difference. Each
   expired, expiring, or not-held certificate can be marked Booked, Chased, or
   Evidence in, with the day the mark was made and a one-line note on where it
   stands. Set from the Certification Checker or the Today screen; shared, so
   two admins never chase the same item twice. */
const renewalKeyOf = (person, code) =>
  `${String(person || "").trim().toUpperCase()}::${String(code || "").trim().toUpperCase()}`;
const renewalMarkFor = (marks, person, code) => (marks || {})[renewalKeyOf(person, code)] || null;
const RENEWAL_STEPS = [
  { st: "booked", label: "Booked", hint: "The course or renewal is booked" },
  { st: "chased", label: "Chased", hint: "The provider or the crew member has been chased" },
  { st: "evidence", label: "Evidence in", hint: "The certificate is in hand, waiting to be filed" },
];
const renewalStepOf = (st) => RENEWAL_STEPS.find((s) => s.st === st) || null;

/* The note beside a mark. Kept as a draft while it is being typed and written
   to the shared state when the field is left, so a save isn't sent per
   keystroke. */
function RenewalNote({ value, onSave }) {
  const [draft, setDraft] = useState(value || "");
  React.useEffect(() => { setDraft(value || ""); }, [value]);
  return (
    <input className="um-in" value={draft} onChange={(e) => setDraft(e.target.value)}
      onBlur={() => { if (draft !== (value || "")) onSave(draft); }}
      onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
      placeholder="One line on where it stands — course date, who was emailed"
      style={{ flex: "1 1 200px", minWidth: 150, fontSize: 11.5, padding: "3px 8px" }} />
  );
}

/* The three mark buttons for one person-and-certificate, and, once a mark is
   on, its note. Pressing the mark that is already on clears it. */
function RenewalMark({ person, code }) {
  const { renewalMarks, setRenewalMarks, role } = usePortal();
  const k = renewalKeyOf(person, code);
  const mk = renewalMarkFor(renewalMarks, person, code);
  const set = (st) => {
    const next = { ...(renewalMarks || {}) };
    if (next[k] && next[k].status === st) delete next[k];
    else next[k] = { status: st, on: todayISO(), by: role || "admin", note: (next[k] && next[k].note) || "" };
    setRenewalMarks(next);
  };
  return (
    <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap",
      flex: "1 1 100%", padding: "2px 0 4px 56px" }}>
      {RENEWAL_STEPS.map(({ st, label, hint }) => {
        const on = mk && mk.status === st;
        return (
          <button key={st} className="um-btn" onClick={() => set(st)}
            title={on ? `${label} ${fmtDate(mk.on)}${mk.by ? ` by ${mk.by}` : ""} — press to clear` : hint}
            style={{ background: on ? T.accentSoft : "transparent", color: on ? T.accent : T.muted,
              border: `1px solid ${on ? T.accent : T.rule}`, borderRadius: 2,
              padding: "2px 8px", fontSize: 9.5, fontWeight: 700 }}>
            {label}{on ? ` · ${fmtDate(mk.on)}` : ""}
          </button>
        );
      })}
      {mk && (
        <RenewalNote value={mk.note}
          onSave={(note) => setRenewalMarks({ ...(renewalMarks || {}), [k]: { ...mk, note } })} />
      )}
    </div>
  );
}


/* @shared */

// How a matrix cell reads in a sentence. The raw values are a mix of dates,
// "Y", "N", "?" and blank, and a column of those is unreadable next to prose.
function valueReads(v) {
  const s = (v == null ? "" : String(v)).trim();
  if (s === "") return "nothing";
  if (s === "?") return "a question mark";
  if (s.toUpperCase() === "Y") return "held";
  if (s.toUpperCase() === "N") return "not held";
  return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.split("-").reverse().join("/") : s;
}

/* ==================================================================== */
/*  Taking a copy of the whole portal                                   */
/*                                                                      */
/*  One zip holding everything the portal is and everything it holds:   */
/*  the source it is built from, every file anyone has uploaded, and    */
/*  the shared state with the roster, the notes, the correspondence     */
/*  and the change log in it.                                           */
/*                                                                      */
/*  It is built here, in the browser, rather than by a function. A      */
/*  streamed function response is capped at 20 MB by the platform and   */
/*  the documents alone can be past that, so a server-built archive     */
/*  would work until the day the portal got big enough that it didn't.  */
/*  Assembling it here has no such ceiling, and it means progress can   */
/*  be shown against a real count while it runs — which matters, since  */
/*  this is the one thing in the portal that can take a minute.         */
/*                                                                      */
/*  The zip writer in source/shared/workbook.js is the one the crew     */
/*  matrix uses to rewrite a workbook; a .xlsx is a zip, so it was      */
/*  already there.                                                      */
/* ==================================================================== */

const ARCHIVE_MIME = "application/zip";
// Everything in the zip sits under one folder, so unpacking it on a desktop
// leaves a single tidy folder rather than thirty loose files.
const ARCHIVE_FOLDER = "portal build";
const ARCHIVE_SOURCE = "/review/portal-source.json";

// Zip timestamps are the MS-DOS ones from 1980: the date packed into sixteen
// bits, the time into another sixteen, seconds counted in twos.
function dosStamp(when) {
  const year = Math.max(1980, when.getFullYear());
  return {
    date: ((year - 1980) << 9) | ((when.getMonth() + 1) << 5) | when.getDate(),
    time: (when.getHours() << 11) | (when.getMinutes() << 5) | (when.getSeconds() >> 1),
  };
}

/**
 * One file, ready to be written into the zip.
 *
 * Compression is tried and then kept only if it actually helped. Most of what
 * goes in is text and shrinks to a fraction, but the certificates are PDFs and
 * scans that are compressed already, and deflating those spends time to make
 * them very slightly bigger. Storing those as they are is both faster and
 * smaller.
 */
async function archiveEntry(name, data, stamp) {
  const bytes = typeof data === "string" ? new TextEncoder().encode(data) : new Uint8Array(data);
  const usize = bytes.length;

  let method = 0;
  let body = bytes;
  if (usize > 0) {
    const packed = await deflateRaw(bytes);
    if (packed.length < usize) {
      method = 8;
      body = packed;
    }
  }

  return {
    name,
    method,
    // Bit 11 says the name is UTF-8. Paths are cleaned to ASCII on the way out
    // of the server, but a file named in another alphabet should still unpack
    // under its own name rather than mojibake if one ever gets through.
    flag: /[^\x20-\x7e]/.test(name) ? 0x800 : 0,
    time: stamp.time,
    date: stamp.date,
    crc: crc32(bytes),
    csize: body.length,
    usize,
    body,
  };
}

const archiveJson = async (url) => {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${url} answered ${res.status}`);
  return res.json();
};

/**
 * Fetch a handful of things at once rather than one after another.
 *
 * A portal with two hundred certificates on it is two hundred round trips, and
 * done strictly in turn that is minutes of waiting on latency rather than on
 * bytes. Four at a time is enough to keep the connection busy without opening
 * so many that a phone on ship's wifi starts timing them out.
 */
async function archivePool(items, worker, width = 4) {
  let next = 0;
  const runners = Array.from({ length: Math.min(width, items.length) }, async () => {
    while (next < items.length) {
      const i = next++;
      await worker(items[i], i);
    }
  });
  await Promise.all(runners);
}

/**
 * Build the archive.
 *
 * `onStep` is called as it goes with what is being done and how far along it
 * is, so the button can show progress. Anything that can't be fetched is
 * recorded and the archive is finished without it — a file whose bytes have
 * gone from the store still has a row in the database, and one of those should
 * not cost somebody the copy of everything else.
 */
async function buildPortalArchive(onStep) {
  if (!zipCapable()) {
    throw new Error(
      "This browser can't build a zip — it has no compression support. Try Chrome, Edge, Safari or Firefox.",
    );
  }

  const startedAt = new Date();
  const stamp = dosStamp(startedAt);
  const entries = [];
  const missing = [];
  let bytesIn = 0;

  const add = async (path, data) => {
    const entry = await archiveEntry(`${ARCHIVE_FOLDER}/${path}`, data, stamp);
    bytesIn += entry.usize;
    entries.push(entry);
  };

  onStep({ label: "Reading what's on the portal", done: 0, total: 0, bytes: 0 });

  /* The three lists the archive is built from, fetched together. The manifest
     is every document row and where each belongs in the zip; the source is the
     packaged copy of the portal's own files; the state is the roster, notes,
     correspondence and change log. */
  const [manifest, source, state] = await Promise.all([
    archiveJson("/api/archive"),
    archiveJson(ARCHIVE_SOURCE).catch(() => null),
    archiveJson("/api/state"),
  ]);

  /* index.html is fetched from "/" rather than read out of the packaged source,
     because it is two thirds of the repository and duplicating it into a static
     JSON file would double the size of the deploy for no gain. Fetching it also
     means the copy in the archive is the front end that is actually running,
     not one packaged whenever the script was last run. */
  const frontEnd = await fetch("/", { cache: "no-store" }).then((r) => {
    if (!r.ok) throw new Error(`the portal's own page answered ${r.status}`);
    return r.text();
  });

  const sourceFiles = source && Array.isArray(source.files) ? source.files : [];
  const docs = Array.isArray(manifest.files) ? manifest.files : [];
  const total = sourceFiles.length + docs.length + 1;
  let done = 0;

  const step = (label) => onStep({ label, done, total, bytes: bytesIn });

  await add("source/index.html", frontEnd);
  done++;
  step("Packing the portal's source");

  for (const file of sourceFiles) {
    await add(`source/${file.path}`, file.text);
    done++;
    if (done % 5 === 0) step("Packing the portal's source");
  }

  await add(
    "portal-state.json",
    JSON.stringify({ rev: state.rev, savedAt: startedAt.toISOString(), data: state.data }, null, 2),
  );
  await add("documents/index.json", JSON.stringify(docs, null, 2));

  step("Downloading the files on the portal");

  /* Written into the array by index rather than pushed, so the order of the zip
     matches the order of the manifest however the downloads happen to finish. */
  const fetched = new Array(docs.length).fill(null);

  await archivePool(docs, async (doc, i) => {
    try {
      const res = await fetch(doc.url, { cache: "no-store" });
      if (!res.ok) throw new Error(`answered ${res.status}`);
      fetched[i] = await res.arrayBuffer();
    } catch (e) {
      missing.push({ path: doc.path, filename: doc.filename, why: e.message || String(e) });
    }
    done++;
    step("Downloading the files on the portal");
  });

  for (let i = 0; i < docs.length; i++) {
    if (fetched[i]) await add(`documents/${docs[i].path}`, fetched[i]);
    // Freed as it goes: holding every certificate twice over, once as the
    // download and once compressed into the zip, is what would run a phone out
    // of memory on a big portal.
    fetched[i] = null;
  }

  await add("README.txt", archiveReadme({ startedAt, source, state, docs, missing, frontEnd }));

  onStep({ label: "Writing the zip", done: total, total, bytes: bytesIn });

  return {
    blob: writeZip(entries, ARCHIVE_MIME),
    filename: `${ARCHIVE_FOLDER}.zip`,
    fileCount: entries.length,
    documentCount: docs.length - missing.length,
    sourceCount: sourceFiles.length + 1,
    missing,
    bytesIn,
  };
}

/** The note at the top of the archive, for whoever opens it a year from now. */
function archiveReadme({ startedAt, source, state, docs, missing, frontEnd }) {
  const kb = (n) => `${Math.round(n / 1024).toLocaleString("en-AU")} KB`;
  const frontEndBytes = new TextEncoder().encode(frontEnd).length;
  const lines = [
    `${VESSEL.name} ${VESSEL.nameAccent} CREW PORTAL — COMPLETE COPY`.toUpperCase(),
    "=".repeat(60),
    "",
    `Taken:            ${startedAt.toLocaleString("en-AU")}`,
    `Portal state:     revision ${state.rev}`,
    `Files:            ${docs.length - missing.length} of ${docs.length} downloaded`,
    "",
    "WHAT IS IN HERE",
    "-".repeat(60),
    "",
    "source/",
    "    Every file the portal is built from — the front end, the worker",
    "    routes behind it, the database schema and its migrations.",
    `    index.html is the live page as served at the time above (${kb(frontEndBytes)}).`,
    ...(source
      ? [`    The rest was packaged on ${source.packagedOn} by scripts/build-archive-source.mjs.`]
      : [
          "    NOT INCLUDED — review/portal-source.json could not be read. Run",
          "    node scripts/build-archive-source.mjs and take the archive again.",
        ]),
    "",
    "documents/",
    "    Every file anyone has uploaded, laid out the way the portal files",
    "    them: certificates under certification/<person>/, the matrices under",
    "    matrices/, handover notes under notes/<swing>/<rank>/, and so on.",
    "    Anything taken off the portal but not destroyed is under removed/ —",
    "    those are superseded or withdrawn, not current.",
    "",
    "documents/index.json",
    "    What the portal knows about each of those files: who filed it, when,",
    "    which crew member and matrix code a certificate answers to, its expiry",
    "    date, and its checksum.",
    "",
    "portal-state.json",
    "    Everything the portal holds that isn't a file — the roster, the swing",
    "    pattern, handover notes, correspondence, comments, suggestions, the",
    "    crew matrix and the change log.",
    "",
  ];

  if (missing.length) {
    lines.push(
      "FILES THAT COULD NOT BE DOWNLOADED",
      "-".repeat(60),
      "",
      "These are listed in the portal but their contents could not be fetched.",
      "The record of each is still in documents/index.json.",
      "",
      ...missing.map((m) => `    ${m.path} — ${m.why}`),
      "",
    );
  }

  lines.push(
    "PUTTING IT BACK",
    "-".repeat(60),
    "",
    "This is a copy to keep, not a backup the portal can restore from on its",
    "own. The source rebuilds and redeploys as it is. The documents and the",
    "state would have to be uploaded again through the portal.",
    "",
    "Treat the whole archive as internal — it is every crew certificate and",
    "every note on the portal, in one folder.",
    "",
  );

  return lines.join("\n");
}

const archiveMB = (n) => `${(n / (1024 * 1024)).toFixed(1)} MB`;

/**
 * The Admin tab's "download everything" button.
 *
 * Kept as its own component because building the archive is the one thing in
 * the portal that can run for a minute, and a button that looks stuck for a
 * minute is a button people press again. It counts as it goes instead.
 */
/* Start again: everything the portal read out of a document, put back to
 * nothing.
 *
 * The portal's screens are built out of the library's documents - the crew
 * matrix out of the crew qualification workbook, the roster out of the roster
 * workbook, the requirements out of the skills matrix, the dates out of the
 * certificates. Clearing the library one document at a time gets there in the
 * end, but somebody starting the filing over wants one press, not forty.
 *
 * It takes nothing out of SharePoint. The library is the store and stays
 * exactly as it is; this empties the portal's account of it, and the next
 * update reads it all back in from whatever is actually there. That is the
 * point - it is how you find out what the library really holds, rather than
 * what the portal remembers being told a fortnight ago.
 *
 * What it keeps: the history, so there is still a record of what was done, and
 * the sign-ins. Everything else that came out of a document goes.
 */
function StartAgain() {
  const {
    log, admin, quals: QUALS, setQuals, setRosterPlan, setSkillsRequirements,
    setCertAnalysis, setMatrixAnalysis, setMatrixUpdated, setFilledFromCert,
    setRenewalMarks, setOpmsMarks, setOpmsAnalysis, setShiftAnalysis,
    certificates, clearMatrixRun,
  } = usePortal();
  const [asking, setAsking] = useState(false);
  const [done, setDone] = useState(false);

  if (!admin) return null;

  const rows = (QUALS.rows || []).length;
  const dated = (QUALS.rows || []).reduce(
    (n, r) => n + (r[3] || []).filter((v) => String(v || "").trim() !== "").length, 0);

  const go = () => {
    setQuals({ cols: [], rows: [] });
    setRosterPlan(null);
    setSkillsRequirements(null);
    setCertAnalysis(null);
    setMatrixAnalysis(null);
    setOpmsAnalysis(null);
    setShiftAnalysis(null);
    setMatrixUpdated("");
    setFilledFromCert({});
    setRenewalMarks({});
    setOpmsMarks({});
    // A finished run's window goes. A run still going is on the server by
    // now and is left to finish (runCleared); this tab pulls whatever it
    // saves, over the empty matrix, like any other round's.
    if (clearMatrixRun) clearMatrixRun();
    log("Admin", "The portal was started again",
      rows + " crew and " + dated + " dates cleared — nothing was taken out of SharePoint");
    setAsking(false);
    setDone(true);
  };

  return (
    <div style={{ marginTop: 26, paddingTop: 18, borderTop: `1px solid ${T.rule}` }}>
      <Eyebrow color={T.bRed}>Start again</Eyebrow>
      <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.7, margin: "8px 0 12px",
        maxWidth: 680 }}>
        Empties everything the portal read out of the library — the crew matrix, the roster, the
        requirements and every date against a name — and leaves SharePoint exactly as it is.
        Press Update portal afterwards and the portal reads back in whatever the library
        actually holds, from nothing.
      </div>
      {done ? (
        <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.teal }}>
          Cleared. Press Update portal to read the library back in.
        </div>
      ) : asking ? (
        <div style={{ background: T.bRedBg, border: `1px solid ${T.bRed}`, borderRadius: 2,
          padding: "13px 15px", maxWidth: 680 }}>
          <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.7, marginBottom: 12 }}>
            Clear {rows} crew and {dated} {dated === 1 ? "date" : "dates"} off the portal?
            {certificates && certificates.length > 0 && <> The {certificates.length} {certificates.length === 1 ? "certificate" : "certificates"} on file {certificates.length === 1 ? "stays" : "stay"} where {certificates.length === 1 ? "it is" : "they are"} and {certificates.length === 1 ? "is" : "are"} read again on the next update.</>}
            {" "}Nothing is taken out of SharePoint, and nothing is written into the office's
            spreadsheet until the next update settles a date.
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <Button variant="solid" onClick={go}>Yes, start again</Button>
            <Button variant="quiet" onClick={() => setAsking(false)}>No</Button>
          </div>
        </div>
      ) : (
        <Button variant="quiet" onClick={() => setAsking(true)}>Start again</Button>
      )}
    </div>
  );
}

function DownloadEverything({ log }) {
  const [busy, setBusy] = useState(false);
  const [step, setStep] = useState(null);
  const [err, setErr] = useState("");
  const [done, setDone] = useState(null);

  const go = async () => {
    setErr("");
    setDone(null);
    setBusy(true);
    try {
      const result = await buildPortalArchive(setStep);

      const url = URL.createObjectURL(result.blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = result.filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      // A zip of a few hundred megabytes takes the browser a moment to start
      // writing, and revoking the URL before it has would cancel the download.
      setTimeout(() => URL.revokeObjectURL(url), 120000);

      setDone(result);
      log(
        "Admin",
        "Downloaded a copy of the whole portal",
        `${result.documentCount} files, ${archiveMB(result.blob.size)}`,
      );
    } catch (e) {
      setErr(e.message || String(e));
    } finally {
      setBusy(false);
      setStep(null);
    }
  };

  return (
    <>
      <div style={{ marginBottom: 10, marginTop: 22 }}><Eyebrow color={T.accent}>Take a copy of everything</Eyebrow></div>
      <div style={{ background: T.panel, border: `1px solid ${err ? T.bOrange : T.rule}`,
        borderLeft: `4px solid ${err ? T.bOrange : T.teal}`, borderRadius: 2, padding: "13px 15px" }}>
        <div style={{ fontFamily: T.body, fontSize: 15, color: T.text, opacity: 0.92, lineHeight: 1.7 }}>
          One zip holding the whole portal: every source file it is built from, every document and
          certificate anyone has uploaded, and the roster, notes, correspondence and change log. It
          unpacks into a single folder called <b>portal build</b>, so you can drop it straight on a
          desktop. Big portals take a minute and the file can run to hundreds of megabytes — do it on
          a computer rather than a phone. Treat it as internal: it is every certificate on the portal
          in one folder.
        </div>

        {busy && step && (
          <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, marginTop: 10 }}>
            {step.label}
            {step.total > 0 && ` · ${step.done} of ${step.total}`}
            {step.bytes > 0 && ` · ${archiveMB(step.bytes)}`}
          </div>
        )}

        {err && (
          <div style={{ fontFamily: T.mono, fontSize: 12, color: T.bOrange, marginTop: 10 }}>
            The copy didn't finish: {err}
          </div>
        )}

        {done && (
          <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, marginTop: 10 }}>
            portal build.zip · {archiveMB(done.blob.size)} · {done.sourceCount} source files,{" "}
            {done.documentCount} documents
            {done.missing.length > 0 && (
              <div style={{ color: T.bOrange, marginTop: 4 }}>
                {done.missing.length} {done.missing.length === 1 ? "file was" : "files were"} listed on
                the portal but couldn't be downloaded — they are named in the README inside the zip.
              </div>
            )}
          </div>
        )}

        <div style={{ marginTop: 12 }}>
          <button className="um-btn" onClick={go} disabled={busy}
            style={{ background: busy ? T.raised : T.accent, color: busy ? T.muted : "#fff",
              fontFamily: T.display, fontSize: 11, fontWeight: 700, letterSpacing: "0.1em",
              textTransform: "uppercase", padding: "9px 15px", borderRadius: 2, border: "none",
              cursor: busy ? "default" : "pointer" }}>
            {busy ? "Building the zip…" : "Download everything"}
          </button>
        </div>
      </div>
    </>
  );
}



function NotLoadedYet({ error }) {
  // Opened straight off a disk — someone double-clicked the build file itself.
  // There is no server behind it there, so rather than reporting an outage that
  // isn't one, say which file this is and which one they were after. The test
  // preview never shows this: it answers the portal's requests itself.
  const offDisk = location.protocol === "file:";
  return (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
      borderLeft: `4px solid ${error ? T.bRed : T.teal}`,
      borderRadius: 2, padding: "22px 24px", maxWidth: 720 }}>
      <Eyebrow color={T.accent}>
        {error ? (offDisk ? "Nothing is broken — wrong file" : "Couldn't reach the portal") : "Loading"}
      </Eyebrow>
      <div style={{ fontFamily: T.body, fontSize: 15, color: T.text, lineHeight: 1.7, marginTop: 12 }}>
        {error
          ? (offDisk
            ? "This is the portal's build file — it only runs on the live site, so opened from a folder it shows this notice and nothing else. It never works from Downloads, and a downloaded copy like this one can simply be deleted."
            : "Everything the crew has filed is still on the server — this device just can't reach it at the moment.")
          : "Fetching everything the crew has filed…"}
      </div>
      {error && offDisk && (
        <div style={{ background: T.accentSoft, borderRadius: 2, padding: "12px 14px", marginTop: 14,
          fontFamily: T.body, fontSize: 14.5, fontWeight: 600, color: T.accent, lineHeight: 1.6 }}>
          To use the portal on this computer: Desktop → portal build → double-click preview.html
        </div>
      )}
      {error && !offDisk && (
        <>
          <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, marginTop: 12 }}>{error}</div>
          <div style={{ marginTop: 18 }}>
            <Button onClick={() => location.reload()}>Try again</Button>
          </div>
        </>
      )}
    </div>
  );
}

/* Every section of the portal can be removed from the Admin tab, and removing
   the last one leaves nothing behind it — which reads to the crew as though
   the portal has been wiped back to the day it was set up. Nothing is lost when
   a section is removed, so say so plainly, and give an admin the way back in
   one press rather than seven. */
function EverythingHidden({ admin, onRestoreAll }) {
  return (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.bOrange}`,
      borderRadius: 2, padding: "22px 24px", maxWidth: 720 }}>
      <Eyebrow color={T.accent}>Nothing to show</Eyebrow>
      <div style={{ fontFamily: T.body, fontSize: 15, color: T.text, lineHeight: 1.7, marginTop: 12 }}>
        Every section of the portal has been removed from the tab bar.
      </div>
      <div style={{ fontFamily: T.body, fontSize: 14, color: T.muted, lineHeight: 1.7, marginTop: 10 }}>
        Nothing has been deleted — everything is still on the server and comes back the moment the
        sections are restored.
      </div>
      {admin ? (

        </div>
      ) : (
        <div style={{ fontFamily: T.body, fontSize: 14, color: T.muted, lineHeight: 1.7, marginTop: 10 }}>
          An admin can put them back from the Admin tab.
        </div>
      )}
    </div>
  );
}

/**
 * What has been taken off the portal and can still be put back.
 *
 * Removing a file anywhere in the portal — a handover note, a document, an email
 * attachment, a certificate replaced by a renewal — takes it out of sight but
 * keeps it. This is where it goes, and where a wrong click is undone. It is also
 * the only place anything can actually be destroyed, and that takes a second,
 * separate confirmation.
 */
function RemovedFiles() {
  const { log } = usePortal();
  const [state, setState] = useState({ status: "loading", items: [], msg: "" });
  const [busy, setBusy] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [problem, setProblem] = useState("");

  const load = async () => {
    try {
      const items = await fetchRemovedFiles();
      setState({ status: "ok", items, msg: "" });
    } catch (e) {
      setState({ status: "error", items: [], msg: e.message });
    }
  };

  React.useEffect(() => { load(); }, []);

  // What this file was, in the words the portal uses for it elsewhere.
  const describe = (it) => {
    const r = it.record || {};
    if (it.category === "certificate") return `${it.person || "Unknown"} — certificate`;
    if (it.category === "certificate-sheet") return "Crew certificates spreadsheet";
    if (it.category === "training-matrix") return "Training matrix";
    if (it.category === "skills-matrix") return "Skills matrix";
    if (it.category === "opms-sheet") return "OPMS spreadsheet";
    if (it.category === "matrix") return "Crew matrix spreadsheet";
    if (it.category === "note") return "Handover note";
    if (it.category === "correspondence") return it.title || r.title || "Correspondence attachment";
    return it.title || r.title || "Document";
  };

  const when = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("en-AU", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
  };

  const restore = async (it) => {
    setBusy(it.record.id);
    setProblem("");
    try {
      await restoreStoredFile(it.record.id);
      log("Admin", `Restored ${it.record.filename}`, describe(it));
      await load();
    } catch (e) {
      setProblem(e.message);
    }
    setBusy(null);
  };

  const purge = async (it) => {
    setBusy(it.record.id);
    setProblem("");
    try {
      await purgeStoredFile(it.record.id);
      log("Admin", `Deleted ${it.record.filename} for good`, "It can't be restored");
      setConfirm(null);
      await load();
    } catch (e) {
      setProblem(e.message);
    }
    setBusy(null);
  };

  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, marginBottom: 10 }}>
        <Eyebrow color={T.accent}>Removed files</Eyebrow>
        <Button variant="quiet" onClick={load}>Refresh</Button>
      </div>

      <div style={{ fontFamily: T.body, fontSize: 14, color: T.muted, lineHeight: 1.6, marginBottom: 12 }}>
        Removing a file takes it off the portal but doesn't destroy it; deleting for good is the one
        thing the portal can't undo.
      </div>

      {state.status === "error" && (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.bOrange}`,
          borderRadius: 2, padding: "13px 15px", marginBottom: 22 }}>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7 }}>
            <b>The removed files couldn't be listed.</b> Nothing has been lost — try again in a moment.
            <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, marginTop: 8 }}>{state.msg}</div>
          </div>
        </div>
      )}

      {problem && (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.bOrange}`,
          borderRadius: 2, padding: "13px 15px", marginBottom: 16 }}>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7 }}>{problem}</div>
        </div>
      )}

      {state.status === "loading" && <Empty>Checking what has been removed…</Empty>}

      {state.status === "ok" && state.items.length === 0 && (
        <Empty>Nothing has been removed. Anything taken off the portal shows up here.</Empty>
      )}

      <div style={{ marginBottom: 22 }}>
        {state.items.map((it) => {
          const r = it.record || {};
          const asking = confirm === r.id;
          return (
            <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start",
              gap: 16, flexWrap: "wrap", padding: "10px 13px", borderBottom: `1px solid ${T.rule}`,
              opacity: busy === r.id ? 0.5 : 1 }}>
              <div style={{ flex: 1, minWidth: 240 }}>
                <div style={tx.name}>{r.filename}</div>
                <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, marginTop: 4, lineHeight: 1.5 }}>
                  {describe(it)} · {r.size}
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, marginTop: 4 }}>
                  Removed {when(it.removedAt)}{it.removedBy ? ` by ${it.removedBy}` : ""}
                </div>
              </div>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                {asking ? (
                  <>
                    <span style={{ fontFamily: T.body, fontSize: 13, color: T.text }}>
                      Delete for good? This can't be undone.
                    </span>
                    <button className="um-btn" onClick={() => purge(it)}
                      style={{ background: T.accent, color: "#fff", fontSize: 10, fontWeight: 700, padding: "5px 9px", borderRadius: 2 }}>
                      Delete for good
                    </button>
                    <button className="um-btn" onClick={() => setConfirm(null)}
                      style={{ background: "transparent", color: T.muted, fontSize: 10, fontWeight: 700, padding: "4px 0" }}>
                      Keep
                    </button>
                  </>
                ) : (
                  <>
                    <OpenLink url={r.url} />
                    <Button variant="quiet" onClick={() => restore(it)}>Restore</Button>
                    {/* The office's own file, kept where the office put it: the
                        portal will not delete it, so it is not offered. */}
                    {!it.keptInPlace && (
                      <button className="um-btn" onClick={() => setConfirm(r.id)}
                        style={{ background: "transparent", color: T.muted, fontSize: 10, fontWeight: 700, padding: "4px 0" }}>
                        Delete for good
                      </button>
                    )}
                  </>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}
