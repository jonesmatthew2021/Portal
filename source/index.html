            <colgroup>
              <col style={{ width: MX_NAME_W }} />
              {colIdx.map((i) => <col key={i} style={{ width: MX_COL_W }} />)}
              {/* Takes whatever width is left over when the items don't fill the
                  frame, so no real column is ever stretched. */}
              <col />
            </colgroup>
            <thead>
              <tr>
                <th style={{ textAlign: "left", padding: "5px 8px 5px 7px" }}>
                  <Eyebrow>Crew</Eyebrow>
                </th>
                {colIdx.map((i) => (
                  <th key={i} style={{ padding: "4px 3px", verticalAlign: "bottom" }}>
                    <div style={{ fontFamily: T.mono, fontSize: 8.5, color: T.accent }}>{QUALS.cols[i][0]}</div>
                    {/* Narrower columns leave less room per line, so the label is
                        given four lines instead of two to make up for it. The full
                        title is on hover either way. */}
                    <div title={QUALS.cols[i][1]} style={{ fontFamily: T.display, fontSize: 8.5, fontWeight: 700,
                      letterSpacing: "0.03em", textTransform: "uppercase", color: T.muted, lineHeight: 1.2,
                      maxHeight: 44, overflow: "hidden", overflowWrap: "break-word" }}>
                      {QUALS.cols[i][1].length > 36 ? QUALS.cols[i][1].slice(0, 35) + "\u2026" : QUALS.cols[i][1]}
                    </div>
                  </th>
                ))}
                <th />
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => {
                const isPicked = keyOf(r) === picked;
                const stand = standings.get(keyOf(r)) || null;
                return (
                <tr key={r[0] + r[2]} className="um-row">
                  {/* Name only, and the name is the way into the person: pressing
                      it opens everything held against them under the table, and
                      pressing it again closes it. The position used to sit under
                      the name and doubled the height of every row - it is in the
                      panel now, and searching by position still works.

                      This column is sticky and paints over the grid as it scrolls
                      underneath, so it has to stay opaque - hence T.panel rather
                      than transparent when the row isn't the open one. Its right
                      hand rule is repeated here because an inline shadow replaces
                      the stylesheet's outright. */}
                  <td style={{ padding: "3px 8px 3px 7px", borderBottom: `1px solid ${T.rule}`,
                    background: isPicked ? T.raised : stand ? T.violetBg : T.panel,
                    boxShadow: isPicked
                      ? `inset -1px 0 0 ${T.rule}, inset 3px 0 0 ${T.accent}`
                      : stand
                        ? `inset -1px 0 0 ${T.rule}, inset 3px 0 0 ${T.violet}`
                        : `inset -1px 0 0 ${T.rule}` }}>
                    <button className="um-btn" title={stand ? stand.note : `Certificates held by ${r[0]}`}
                      onClick={() => setPicked(isPicked ? "" : keyOf(r))}
                      style={{ background: "transparent", padding: 0, width: "100%", textAlign: "left",
                        letterSpacing: 0, textTransform: "none", cursor: "pointer", display: "block" }}>
                      <div style={{ display: "flex", gap: 5, alignItems: "center" }}>
                        <div style={{ flex: 1, minWidth: 0, fontFamily: T.body, fontSize: 11.5, fontWeight: 600,
                          color: isPicked ? T.accent : T.text,
                          whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r[0]}</div>
                        {/* The column is 184px and the names already run out of it,
                            so the mark is a dot rather than a word - which ticket
                            it is, and what it means, is in the panel and on hover. */}
                        {stand && (
                          <span aria-label={stand.label} style={{ flex: "0 0 auto", width: 8, height: 8,
                            borderRadius: "50%", border: `1.5px solid ${T.violet}`,
                            background: stand.strong ? T.violet : T.panel }} />
                        )}
                      </div>
                    </button>
                  </td>
                  {colIdx.map((i) => {
                    const url = String(r[3][i] || "").trim()
                      ? certLinkFor(certDates, certificates, r[0], QUALS.cols[i][0])
                      : null;
                    return (
                    <td key={i} style={{ padding: "2px", borderBottom: `1px solid ${T.rule}`, textAlign: "center",
                      background: isPicked ? T.raised : "transparent" }}>
                      <Cell value={r[3][i]}
                        onOpen={url ? () => setCellScan({ url, person: r[0], code: QUALS.cols[i][0], title: QUALS.cols[i][1] }) : undefined} />
                    </td>
                    );
                  })}
                  <td style={{ borderBottom: `1px solid ${T.rule}`, background: isPicked ? T.raised : "transparent" }} />
                </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* Whoever is open, under the table where it was asked for. A name that
          the search or the band filter has taken off screen closes the panel
          with it, so what is open always matches what is on the table. */}
      {pickedRow && (
        <div ref={detail}>
          <MatrixPerson row={pickedRow} onClose={() => setPicked("")} />
        </div>
      )}

      <div style={{ display: "flex", gap: 18, marginTop: 22, flexWrap: "wrap" }}>
        {[["Expired or within 30 days", T.bRed], ["30 to 60 days", T.bOrange],
          ["60 to 90 days", T.bYellow], ["More than 90 days", T.bGreen]].map(([l, c]) => (
          <span key={l} style={{ display: "flex", gap: 8, alignItems: "center", fontFamily: T.body, fontSize: 13, color: T.muted }}>
            <span style={{ width: 11, height: 11, background: c, borderRadius: 2 }} /> {l}
          </span>
        ))}
        <span style={{ display: "flex", gap: 8, alignItems: "center", fontFamily: T.body, fontSize: 13, color: T.muted }}>
          <span style={{ width: 22, height: 11, borderRadius: 2, border: `1px solid ${T.hatchLine}`,
            backgroundImage: `repeating-linear-gradient(45deg, ${T.hatchLine} 0 1.5px, ${T.hatchBg} 1.5px 5px)` }} />
          Not required for that position
        </span>
        {/* The last two say nothing about a date, which is why they are a colour
            the four bands above them don't use. */}
        <span style={{ display: "flex", gap: 8, alignItems: "center", fontFamily: T.body, fontSize: 13, color: T.muted }}>
          <span style={{ width: 11, height: 11, borderRadius: "50%", background: T.violet,
            border: `1.5px solid ${T.violet}` }} />
          Ticket does not cover the position worked
        </span>
        <span style={{ display: "flex", gap: 8, alignItems: "center", fontFamily: T.body, fontSize: 13, color: T.muted }}>
          <span style={{ width: 11, height: 11, borderRadius: "50%", background: T.panel,
            border: `1.5px solid ${T.violet}` }} />
          Holds a higher ticket than the position
        </span>
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 18, marginBottom: 30 }}>
        <Button onClick={() => setReport("crew")}>Generate crew report</Button>
        <Button variant="quiet" onClick={() => setReport("individual")}>Generate individual report</Button>
        {/* The third of them, and the only one that changes anything: the two
            above report the matrix as it stands, this one brings it up to date
            with the certificates that have gone up since it was last read. */}
        <GenerateLatestMatrix variant="quiet" />
        {/* And the fourth: the matrix exactly as it stands, written out as the
            spreadsheet, downloaded and opened — nothing read, nothing changed. */}
        <DownloadLatestMatrix variant="quiet" />
      </div>

      {/* floats above everything, pinned to the bottom of the screen */}
      <div ref={bar} className="um-floatbar"><div ref={inner} style={{ height: 1 }} /></div>

      {cellScan && (
        <CertViewer url={cellScan.url} person={cellScan.person} code={cellScan.code}
          title={cellScan.title}
          filename={((certificates || []).find((c) => c.url === cellScan.url) || {}).filename}
          onClose={() => setCellScan(null)} />
      )}
    </div>
  );
}

/* ==================================================================== */
/*  Crew Rosters — who is onboard now, who is on the off swing           */
/* ==================================================================== */

/* The two watches. Nobody works both, and plenty of people are onboard without
   being on either — day workers, and anyone whose watch isn't settled yet. */
const SHIFTS = [{ id: "day", label: "Day" }, { id: "night", label: "Night" }];

/**
 * Which side of the board somebody is on.
 *
 * Once the board has been touched it says where everybody is and nothing is
 * worked out. Until then there is nothing to go on but the pattern, so the crew
 * whose swing the calendar says is up gets shown onboard — the page opens
 * looking right on a portal nobody has set up yet, and stops following the
 * calendar the moment anybody moves somebody.
 */
const boardSide = (p, board) => {
  if (!p.active) return "off";
  const held = board && board.side ? board.side[p.id] : null;
  if (held === "on" || held === "off") return held;
  return p.crew && swingAt(currentSwingIndex()).crew === p.crew ? "on" : "off";
};

const boardShift = (p, board) => (board && board.shift ? board.shift[p.id] || "" : "");

/**
 * The board written out in full, ready to be changed.
 *
 * Anything still being taken from the pattern is written down as it stands
 * first, so that a change to one person doesn't leave everybody else to drift
 * when the calendar rolls over to the next swing.
 */
function settledBoard(people, board) {
  const side = { ...((board && board.side) || {}) };
  people.forEach((p) => { if (p.active) side[p.id] = boardSide(p, board); });
  return { side, shift: { ...((board && board.shift) || {}) } };
}

/**
 * Somebody on the roster, added or changed.
 *
 * Crew is the swing they belong to when the vessel is running to pattern. It is
 * left blank for anyone who isn't on a rotation — a fill-in flown up for one
 * trip, or somebody shore-based — because those people are moved by hand and
 * are not carried across by a crew change.
 */
function PersonEditor({ person, onSave, onRemove, onCancel, matrix, onRank }) {
  // The rank is the position the crew matrix holds against them; saving
  // writes it there, and every page that reads it follows.
  const [rank, setRank] = useState((matrix && matrix.rank) || "");
  const [f, setF] = useState({
    name: person.name || "",
    dept: person.dept || DEPT_ORDER[0],
    crew: person.crew || "",
    active: person.active !== false,
  });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const name = f.name.trim();

  return (
    <div style={{ background: T.panel, border: `1px solid ${T.accent}`, borderRadius: 2,
      padding: "15px 17px", marginBottom: 22 }}>
      <div style={{ marginBottom: 13 }}>
        <Eyebrow color={T.accent}>{person.id ? `Edit ${person.name}` : "Add crew member"}</Eyebrow>
      </div>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 13 }}>
        <div style={{ flex: "1 1 220px" }}>
          <Field label="Name">
            <input className="um-in" value={f.name} onChange={set("name")}
              placeholder="The name the crew use for them" />
          </Field>
        </div>
        <div style={{ flex: "1 1 160px" }}>
          <ChoiceField label="Department">
            <Choices value={f.dept} onPick={(v) => setF({ ...f, dept: v })} options={DEPT_ORDER} compact />
          </ChoiceField>
        </div>
        <div style={{ flex: "1 1 160px" }}>
          <ChoiceField label="Swing">
            <Choices value={f.crew} onPick={(v) => setF({ ...f, crew: v })} compact
              options={[{ value: "", label: "Not on a rotation" },
                ...SWINGS.map((s) => ({ value: s.letter, label: s.name }))]} />
          </ChoiceField>
        </div>
      </div>

      {matrix ? (
        <div style={{ marginBottom: 13 }}>
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
            <div style={{ flex: "1 1 260px" }}>
              <ChoiceField label={matrix.name
                ? `Rank / position — on the matrix as ${matrix.name}`
                : "Rank / position — saving adds them to the crew matrix"}>
                <Choices value={rank} compact onPick={(v) => setRank(v)}
                  options={matrix.options.map((p) => ({ value: p, label: p }))} />
              </ChoiceField>
            </div>
            <div style={{ flex: "0 1 220px" }}>
              <Field label="Or type a new one">
                <input className="um-in" value={rank} onChange={(e) => setRank(e.target.value)} />
              </Field>
            </div>
          </div>
        </div>
      ) : null}

      <label style={{ display: "flex", gap: 9, alignItems: "center", marginBottom: 15,
        fontFamily: T.body, fontSize: 13.5, color: T.text, cursor: "pointer" }}>
        <input type="checkbox" checked={f.active}
          onChange={(e) => setF({ ...f, active: e.target.checked })} />
        On the roster. Turn this off for somebody who has left — they keep their history and can be
        put back at any time, and they are never shown onboard.
      </label>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <Button onClick={() => {
            if (!name) return;
            const canon = canonicalName(name);
            const r = rank.trim();
            if (matrix && onRank && r && r !== (matrix.rank || "")) {
              onRank(matrix.name, r, canon);
            }
            // The rank decides the roster's own grouping too — the department
            // follows it, so one save applies the rank everywhere at once.
            const dept = r ? deptForRank(r) : f.dept;
            onSave({ ...person, ...f, dept, name: canon, crew: f.crew || null });
          }}
          disabled={!name}>
          {person.id ? "Save" : "Add to the roster"}
        </Button>
        {person.id && (
          <Button variant="ghost" onClick={() => onRemove(person)}
            title="Take them off the roster altogether. Turning them off above keeps the record instead.">
            Remove
          </Button>
        )}
        <Button variant="quiet" onClick={onCancel}>Cancel</Button>
      </div>
    </div>
  );
}

// Column headings and the like, which turn up on a crew list and are nobody's
// name. Checked in lower case.
const NOT_A_NAME = new Set([
  "name", "names", "full name", "crew", "crew list", "crew member", "surname", "given", "first",
  "first name", "last", "last name", "position", "rank", "role", "title", "dept", "department",
  "shift", "watch", "day", "days", "night", "nights", "onboard", "on board", "off", "off swing",
  "swing", "date", "dates", "vessel", "total", "notes", "note", "remarks", "status", "company",
  "phone", "email", "cabin", "sign on", "sign off", "signon", "signoff", "deck", "engine",
  "galley", "engineering", "catering", "n/a", "tbc", "tba",
]);

/**
 * Whether a cell reads like somebody's name.
 *
 * A crew list has as much heading and date on it as it has crew, so a cell only
 * counts as a name if it is a few words of letters and isn't one of the words
 * the office puts at the top of a column.
 */
function looksLikeName(v) {
  const s = (v == null ? "" : String(v)).trim();
  if (s.length < 2 || s.length > 40) return false;
  if (NOT_A_NAME.has(s.toLowerCase())) return false;
  if (!/^[A-Za-z][A-Za-z'\-., ]*$/.test(s)) return false;
  return s.split(/\s+/).length <= 4;
}

/* Every name typed anywhere on the portal is written down one way:
   LASTNAME, First — the format the crew matrix has always used — so the same
   person can never exist in two spellings. "evan farmer", "Farmer, Evan" and
   "EVAN FARMER" all come out as "FARMER, Evan"; hyphens and apostrophes keep
   their capitals (O'Brien, Smith-Jones); a single word is left as a
   capitalised first name, for somebody whose surname isn't known yet. */
function canonicalName(raw) {
  const s = String(raw == null ? "" : raw).trim().replace(/\s+/g, " ");
  if (!s) return s;
  const word = (w) => w.split(/([-'])/).map((p) =>
    p === "-" || p === "'" ? p : p ? p[0].toUpperCase() + p.slice(1).toLowerCase() : p).join("");
  let last, firsts;
  if (s.includes(",")) {
    const [l, ...rest] = s.split(",");
    last = l.trim(); firsts = rest.join(",").trim();
  } else {
    const parts = s.split(" ");
    if (parts.length === 1) return word(parts[0]);
    last = parts[parts.length - 1]; firsts = parts.slice(0, -1).join(" ");
  }
  const first = firsts.split(" ").filter(Boolean).map(word).join(" ");
  return first ? `${last.toUpperCase()}, ${first}` : last.toUpperCase();
}

/* The two swings the vessel runs to. The roster has always held A and B against
   each person and everything else in the portal reads that letter, so the letter
   is still what is written down — Alpha and Bravo are what the office calls them
   and what the crew see. */
const SWINGS = [
  { letter: "A", name: "Swing Alpha", colour: T.accent },
  { letter: "B", name: "Swing Bravo", colour: T.bYellow },
];

const swingNamed = (letter) => (SWINGS.find((s) => s.letter === letter) || {}).name || `Swing ${letter}`;

// Ranks as they are written on a swing list. Only used to tell a rank apart from
// a name and to work out which department somebody belongs in — whatever the
// document actually wrote is what gets shown, recognised or not.
const RANK_HINT = /master|skipper|coxswain|chief|c\/o|c\/e|mate|officer|engineer|\beto\b|electrician|oiler|motorman|greaser|gph|general purpose|deckhand|integrated rating|able seafarer|\bab\b|bosun|cook|chef|steward|galley|cadet|trainee|rating|cargo|crane/i;

const looksLikeRank = (v) => {
  const s = (v == null ? "" : String(v)).trim();
  return s.length > 1 && s.length <= 60 && RANK_HINT.test(s);
};

// Which of the roster's departments a rank belongs to. Order matters: a chief
// officer is deck and a chief engineer is not, and both start the same way.
const DEPT_FOR_RANK = [
  [/master|skipper|coxswain/i, "Masters"],
  [/engineer|c\/e|\beto\b|electrician|oiler|motorman|greaser/i, "Engineers"],
  [/officer|mate|c\/o|navigat/i, "DECK OFFICERS"],
  [/cook|chef|steward|galley/i, "Chefs"],
];

const deptForRank = (rank) => {
  const hit = DEPT_FOR_RANK.find(([re]) => re.test(rank || ""));
  return hit ? hit[1] : "GPH";
};

// What the office puts at the top of the two columns that matter.
const NAME_HEADING = /^(name|names|full name|crew|crew name|crew member|surname|seafarer|personnel|employee)$/i;
const RANK_HEADING = /^(rank|ranks|position|role|title|rating|capacity)$/i;

// Titles and banners, which read like a name — two or three words of plain
// letters — and are not one. A swing list nearly always opens with one.
const TITLE_HINT = /\b(swing|alpha|bravo|roster|rota|crew list|list|vessel|tsv|mv|rotation|onboard|ashore|manning|confidential|draft|final)\b/i;

const looksLikeCrewName = (v) => looksLikeName(v) && !TITLE_HINT.test(v);

/**
 * A swing list, read exactly as it was written.
 *
 * The office sends whatever it has to hand, so nothing is assumed about the
 * layout. Where the columns are headed, the name column is the name and the rank
 * column is the rank. Where they aren't, the first cell on a row that reads like
 * somebody's name is the name and the first that reads like a rank is the rank —
 * and a rank sitting on a row by itself is taken as a heading over the names
 * beneath it, which is how most of these lists are actually laid out.
 *
 * Nothing is matched against the roster here and nothing is tidied up. The names
 * come back spelled the way the document spelled them, in the order of rank the
 * document itself sets: ranks in the order they first appear, and the people
 * within a rank in the order they are written. A list that already runs from the
 * Master down comes back exactly as it went in.
 */
function readSwingList(XLSX, buf) {
  const wb = XLSX.read(buf, { type: "array", cellDates: false });

  const rows = [];
  wb.SheetNames.forEach((sheet) => {
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { header: 1, defval: null, raw: false });
    grid.forEach((r) => rows.push((r || []).map((c) => (c == null ? "" : String(c).trim()))));
  });

  let nameCol = -1;
  let rankCol = -1;
  let from = 0;
  rows.forEach((cells, i) => {
    if (nameCol >= 0) return;
    const n = cells.findIndex((c) => NAME_HEADING.test(c));
    if (n < 0) return;
    nameCol = n;
    rankCol = cells.findIndex((c) => RANK_HEADING.test(c));
    from = i + 1;
  });

  const entries = [];
  const seen = new Set();
  let heading = "";

  rows.slice(nameCol >= 0 ? from : 0).forEach((cells) => {
    const filled = cells.filter(Boolean);
    if (!filled.length) return;

    // A rank on its own, standing over the names underneath it.
    if (filled.length === 1 && looksLikeRank(filled[0])) { heading = filled[0]; return; }

    let name = "";
    let rank = "";
    if (nameCol >= 0) {
      name = cells[nameCol] || "";
      if (!looksLikeCrewName(name)) return;
      if (rankCol >= 0) rank = cells[rankCol] || "";
    } else {
      name = cells.find((c) => looksLikeCrewName(c) && !looksLikeRank(c)) || "";
      if (!name) return;
    }
    if (!rank) rank = cells.find((c) => c !== name && looksLikeRank(c)) || heading;

    const key = name.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    entries.push({ name, rank: rank.trim() });
  });

  if (!entries.length) {
    throw new Error("No names could be read off that file. Check it is the swing list and not something else.");
  }

  const order = [];
  entries.forEach((e) => {
    const k = e.rank.toLowerCase();
    if (!order.includes(k)) order.push(k);
  });
  return entries
    .slice()
    .sort((a, b) => order.indexOf(a.rank.toLowerCase()) - order.indexOf(b.rank.toLowerCase()));
}

/* One swing, written out the way its document has it — every name on the list,
   in order of rank, spelled as the document spelled it. Ranks are run together
   as headings so the shape of the list is the shape of the crew. */
function SwingListView({ letter, list }) {
  const swing = SWINGS.find((s) => s.letter === letter) || SWINGS[0];

  const groups = [];
  ((list && list.entries) || []).forEach((e) => {
    const last = groups[groups.length - 1];
    if (last && last.rank === e.rank) last.names.push(e.name);
    else groups.push({ rank: e.rank, names: [e.name] });
  });

  let n = 0;

  return (
    <div style={{ flex: "1 1 330px", minWidth: 0, background: T.panel, border: `1px solid ${T.rule}`,
      borderTop: `4px solid ${swing.colour}`, borderRadius: 2, padding: "14px 16px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
        <Eyebrow color={swing.colour}>{swing.name}</Eyebrow>
        <span style={{ fontFamily: T.mono, fontSize: 12, color: T.muted }}>
          {list && list.entries ? list.entries.length : 0}
        </span>
      </div>

      {list ? (
        <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 7,
          overflowWrap: "anywhere" }}>
          {list.filename}{list.uploaded ? ` · ${fmtDate(list.uploaded)}` : ""}
        </div>
      ) : (
        <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, lineHeight: 1.6, marginTop: 7 }}>
          Nothing uploaded yet. The crew show here exactly as the document lists them.
        </div>
      )}

      {!list ? (
        <Empty>No list uploaded.</Empty>
      ) : (
        groups.map((g, gi) => (
          <div key={gi} style={{ marginTop: 15 }}>
            <Eyebrow>{g.rank || "Rank not stated"}</Eyebrow>
            {g.names.map((name) => {
              n += 1;
              return (
                <div key={name} style={{ display: "flex", gap: 10, alignItems: "baseline",
                  padding: "8px 0", borderBottom: `1px solid ${T.rule}` }}>
                  <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, width: 20,
                    flex: "0 0 auto", textAlign: "right" }}>{n}</span>
                  <span style={{ fontFamily: T.body, fontSize: 15, fontWeight: 600, color: T.text,
                    minWidth: 0, overflowWrap: "anywhere" }}>{name}</span>
                </div>
              );
            })}
          </div>
        ))
      )}
    </div>
  );
}

/**
 * The two swing lists, and the buttons that upload them.
 *
 * A swing is a document the office sends rather than something the portal works
 * out, so each swing gets its own button and its own file. Reading a file
 * changes nothing: what was on it is put up first — every name in order of rank,
 * who on the roster it answers to, and who comes off that swing — and only then
 * is it applied.
 */
function SwingListUploads({ lists, people, admin, onApply }) {
  const alphaRef = useRef(null);
  const bravoRef = useRef(null);
  const pickers = { A: alphaRef, B: bravoRef };

  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const [preview, setPreview] = useState(null); // { letter, filename, entries }

  const read = async (letter, file) => {
    setBusy(letter); setErr(""); setPreview(null);
    try {
      const XLSX = await loadXLSX();
      setPreview({ letter, filename: file.name, entries: readSwingList(XLSX, await file.arrayBuffer()) });
    } catch (e2) {
      setErr(e2.message || String(e2));
    }
    setBusy("");
  };

  const pick = (letter) => (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (file) read(letter, file);
  };

  // What applying it would do to the roster. Worked out the same way it is
  // applied, so what is shown here is what happens.
  const shown = preview ? matchSwingList(preview.entries, people) : null;
  const leaving = preview
    ? people.filter((p) => p.active && p.crew === preview.letter && !shown.claimed.has(p.id))
    : [];

  return (
    <div>
      {admin && (
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.accent}`,
        borderRadius: 2, padding: "15px 17px", marginBottom: 18 }}>
        <Eyebrow color={T.accent}>Upload a swing list</Eyebrow>
        <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 10 }}>
          One document per swing — a spreadsheet or a CSV, in whatever layout it arrives in. The crew
          are listed exactly as the document has them, in order of rank, and the roster is brought into
          line so the rest of the portal is talking about the same people. Nothing changes until you
          have read what it found and applied it.
        </div>

        <input ref={alphaRef} type="file" accept=".xlsx,.xlsm,.xls,.csv" style={{ display: "none" }} onChange={pick("A")} />
        <input ref={bravoRef} type="file" accept=".xlsx,.xlsm,.xls,.csv" style={{ display: "none" }} onChange={pick("B")} />

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 14 }}>
          {SWINGS.map((s) => (
            <DropSpot key={s.letter} disabled={!!busy} accept=".xlsx,.xlsm,.xls,.csv"
              onFile={(f) => read(s.letter, f)}
              onReject={(f) => setErr(`${f.name} isn't a spreadsheet or a CSV.`)}>
              <Button disabled={!!busy}
                onClick={() => pickers[s.letter].current && pickers[s.letter].current.click()}
                title={`Upload the ${s.name} list — choose it, or drop it on this button`}>
                {busy === s.letter ? "Reading..." : `Upload ${s.name}`}
              </Button>
            </DropSpot>
          ))}
          {preview && <Button variant="quiet" onClick={() => setPreview(null)}>Cancel</Button>}
        </div>

        {err && (
          <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, marginTop: 13, lineHeight: 1.6 }}>{err}</div>
        )}
      </div>
      )}

      {preview && (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 2,
          padding: "15px 17px", marginBottom: 18 }}>
          <Eyebrow color={T.accent}>{swingNamed(preview.letter)} — {preview.filename}</Eyebrow>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 9 }}>
            {preview.entries.length} on the list.{" "}
            {shown.claimed.size} of them are already on the roster and{" "}
            {shown.newcomers.length} are new and will be added.
            {leaving.length > 0
              ? ` ${leaving.length} on ${swingNamed(preview.letter)} now are not on it and come off the swing.`
              : ""}
          </div>

          {shown.newcomers.length > 0 && (
            <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.7, marginTop: 11 }}>
              <span style={{ color: T.green, fontWeight: 600 }}>New to the roster:</span>{" "}
              {shown.newcomers.map((e) => `${e.name}${e.rank ? ` (${e.rank})` : ""}`).join(", ")}
            </div>
          )}
          {leaving.length > 0 && (
            <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.7, marginTop: 8 }}>
              <span style={{ color: T.bOrange, fontWeight: 600 }}>Coming off {swingNamed(preview.letter)}:</span>{" "}
              {leaving.map((p) => p.name).join(", ")}. They stay on the roster with no swing against them.
            </div>
          )}

          <div style={{ marginTop: 16 }}>
            <SwingListView letter={preview.letter}
              list={{ filename: preview.filename, uploaded: "", entries: preview.entries }} />
          </div>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 16 }}>
            <Button onClick={() => { onApply(preview); setPreview(null); }}>
              Apply {swingNamed(preview.letter)}
            </Button>
            <Button variant="quiet" onClick={() => setPreview(null)}>Cancel</Button>
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "flex-start" }}>
        {SWINGS.map((s) => <SwingListView key={s.letter} letter={s.letter} list={lists[s.letter] || null} />)}
      </div>

      {!admin && (
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.7, marginTop: 14 }}>
          The lists are uploaded by an admin.
        </div>
      )}
    </div>
  );
}

/**
 * Who on the roster each name on a list answers to.
 *
 * The list has people's full names on it and the roster carries the name the
 * crew use, so the two are matched the same way a dropped certificate folder is.
 * A name that fits nobody is a newcomer; a name that fits somebody already
 * claimed is left to the first, rather than putting one person on the list twice.
 */
function matchSwingList(entries, people) {
  const names = entries.map((e) => e.name);
  const claimed = new Map(); // person id -> the name the document used
  const taken = new Set();

  people.filter((p) => p.active).forEach((p) => {
    const hit = matchRoster(p.name, names);
    if (hit && !taken.has(hit)) { taken.add(hit); claimed.set(p.id, hit); }
  });

  return { claimed, newcomers: entries.filter((e) => !taken.has(e.name)) };
}

/**
 * The crew rosters page: two columns, and the two things that move people
 * between them.
 *
 * What was here before was the roster the calendar says we should be running —
 * eight swings across the page, worked out from the anchor date. It was never
 * what anybody wanted to know. The question is who is on the vessel now and
 * which watch they are on, and the answer to that is not a calculation: people
 * swap, come out early, stay an extra week, and a fill-in is flown up for one
 * trip. So the board is held as what somebody put there, and the two ordinary
 * ways it moves — a crew change, and the swing lists the office sends — are a
 * button each.
 *
 * Who belongs to which swing is not worked out here either. Alpha and Bravo each
 * arrive as a document, and each is shown exactly as it was written.
 */
/* The rank headings the swing board is read under, in the order a swing list
   is written: bridge first, engine room after, galley last. A person's rank is
   the position the matrix holds against their name — the roster's departments
   are too broad for this page, where a Chief Engineer and an Assistant
   Engineer are different lines on the list. */
const RANK_GROUPS = [
  ["Masters", /master/i],
  ["Chief Officers", /chief (officer|mate)/i],
  ["Second Officers", /second (officer|mate)/i],
  ["Chief Engineer", /chief engineer/i],
  ["First Engineer", /first engineer/i],
  ["Assistant Engineers", /assistant engineer/i],
  ["GPH", /\bgph\b|general purpose/i],
  ["Chefs", /cook|chef|steward/i],
];

function CrewRosters({ people, setPeople, board, setBoard, log, currentUser, viewSwing, overrides, onShowNow }) {
  const admin = isAdmin(currentUser);
  const { swingLists, setSwingLists, swingDates, swingBoards, setSwingBoards, quals: MATRIX, setQuals } = usePortal();

  // The roster is typed in shorthand — "Arthur", "Ruwan" — but the crew have
  // one full name each on the matrix, so that is the name shown: whoever a
  // shorthand answers to unambiguously wears their matrix name here. A name
  // the matrix can't place stays as typed. Two entries that resolve to the
  // same person — or two identical placeholders — are flagged as duplicates.
  const fullNames = useMemo(() => {
    const names = MATRIX.rows.map((r) => r[0]);
    const m = {};
    // A name already in SURNAME, First form is shown exactly as stored. The
    // matrix match only fills out old shorthand entries ("Brenton") — it must
    // never swallow a new person who shares a given name with somebody.
    people.forEach((p) => {
      m[p.id] = p.name.includes(",") ? p.name : (matchRoster(p.name, names) || p.name);
    });
    return m;
  }, [people, MATRIX]);
  const fullName = (p) => fullNames[p.id] || p.name;
  const isDup = useMemo(() => {
    const counts = {};
    people.filter((p) => p.active).forEach((p) => {
      const k = (fullNames[p.id] || p.name).trim().toUpperCase();
      counts[k] = (counts[k] || 0) + 1;
    });
    return (p) => (counts[(fullNames[p.id] || p.name).trim().toUpperCase()] || 0) > 1;
  }, [people, fullNames]);

  // Which rank heading each person sits under: the matrix's position for their
  // name, read against RANK_GROUPS. Anyone the matrix can't place keeps their
  // roster department as the heading instead of dropping off the page.
  const rankGroup = useMemo(() => {
    const posByName = Object.fromEntries(MATRIX.rows.map((r) => [r[0], r[1] || ""]));
    const m = {};
    people.forEach((p) => {
      const pos = posByName[fullNames[p.id]] || "";
      const hit = RANK_GROUPS.find(([, re]) => re.test(pos));
      m[p.id] = hit ? hit[0] : null;
    });
    return m;
  }, [people, fullNames, MATRIX]);
  const groupOf = (p) => rankGroup[p.id] || p.dept;
  const lists = swingLists || { A: null, B: null };
  const [sub, setSub] = useState("board");
  const [editing, setEditing] = useState(null);
  const [confirmSwitch, setConfirmSwitch] = useState(false);

  const crew = people.filter((p) => p.active);
  const onboard = crew.filter((p) => boardSide(p, board) === "on");
  const off = crew.filter((p) => boardSide(p, board) === "off");
  const gone = people.filter((p) => !p.active);

  /* A coming swing picked on the compliance cards above is shown with a board
     of its own, kept against the swing number — the same side-and-shift shape
     as the live board, and worked with the same buttons: people put on and off
     the swing, watches set, crew added and removed. Anyone that swing's board
     doesn't mention yet follows the rotation and its one-off changes, and
     nothing done here touches the live board — who is on the vessel today is
     the swingBoard, and only the swingBoard. A pick that isn't ahead of today
     (the swing that is on, or one gone stale while the page sat open) is the
     board itself. */
  const looking = viewSwing != null && viewSwing > currentSwingIndex();
  const ahead = looking ? swingWithDates(viewSwing, swingDates) : null;
  const aheadHeld = looking ? (swingBoards || {})[viewSwing] || { side: {}, shift: {} } : null;
  const aheadSide = (p) => {
    if (!p.active) return "off";
    const held = (aheadHeld.side || {})[p.id];
    if (held === "on" || held === "off") return held;
    return swingStatusFor(p, viewSwing, overrides);
  };
  const sideOf = (p) => (looking ? aheadSide(p) : boardSide(p, board));
  const shiftOf = (p) => (looking ? (aheadHeld.shift || {})[p.id] || "" : boardShift(p, board));

  /* A change to the picked swing's board, with the board written out in full
     first — the same settling the live board gets, so moving one person can't
     leave everybody else drifting with the rotation. Boards for swings already
     gone are dropped on the way through rather than kept forever. */
  const putAhead = (change) => {
    setSwingBoards((all) => {
      const held = (all || {})[viewSwing] || { side: {}, shift: {} };
      const out = { side: {}, shift: { ...(held.shift || {}) } };
      people.forEach((p) => {
        if (!p.active) return;
        const h = (held.side || {})[p.id];
        out.side[p.id] = h === "on" || h === "off" ? h : swingStatusFor(p, viewSwing, overrides);
      });
      change(out);
      const next = {};
      Object.keys(all || {}).forEach((k) => { if (Number(k) > currentSwingIndex()) next[k] = all[k]; });
      next[viewSwing] = out;
      return next;
    });
  };

  const shownOn = crew.filter((p) => sideOf(p) === "on");
  const shownOff = crew.filter((p) => sideOf(p) !== "on");

  const onDay = shownOn.filter((p) => shiftOf(p) === "day").length;
  const onNight = shownOn.filter((p) => shiftOf(p) === "night").length;
  const noWatch = shownOn.length - onDay - onNight;

  // Every rank heading in the order above, with the department of anyone the
  // matrix can't place on the end rather than dropped off the page.
  const rankNames = RANK_GROUPS.map(([g]) => g);
  const depts = [
    ...rankNames,
    ...Array.from(new Set(crew.filter((p) => !rankGroup[p.id]).map((p) => p.dept)))
      .filter((d) => !rankNames.includes(d)).sort(),
  ];

  const savePerson = (updated) => {
    if (updated.id) {
      const before = people.find((p) => p.id === updated.id);
      const diffs = ["name", "dept", "crew", "active"]
        .filter((k) => before[k] !== updated[k])
        .map((k) => `${k}: ${before[k] ?? "—"} → ${updated[k] ?? "—"}`);
      setPeople(people.map((p) => (p.id === updated.id ? updated : p)));
      if (diffs.length) log("Crew Rosters", `Updated ${before.name}`, diffs.join(", "));
    } else {
      const p = { ...updated, id: "p-" + Date.now() };
      setPeople([...people, p]);
      // Somebody added while a coming swing is on screen was added FOR that
      // swing, so they go straight onto it — the live board is left alone.
      if (looking) putAhead((b) => { b.side[p.id] = "on"; });
      log("Crew Rosters", `Added ${p.name} to the roster`,
        `${p.dept}, ${p.crew ? "Crew " + p.crew : "not on rotation"}${looking ? ` · onto ${swingLabel(ahead)}` : ""}`);
    }
    setEditing(null);
  };

  const removePerson = (p) => {
    setPeople(people.filter((x) => x.id !== p.id));
    log("Crew Rosters", `Removed ${p.name} from the roster`, `${p.dept}`);
    setEditing(null);
  };

  /* An ad hoc move: this person, to the other column, now. On a coming swing
     the move lands on that swing's own board; the live board is untouched. */
  const move = (p, side) => {
    if (looking) {
      putAhead((b) => { b.side[p.id] = side; });
      log("Crew Rosters", `${p.name} moved ${side === "on" ? "onto" : "off"} ${swingLabel(ahead)}`,
        `Crew ${ahead.crew} · ${p.dept}`);
      return;
    }
    setBoard((b) => {
      const next = settledBoard(people, b);
      next.side[p.id] = side;
      return next;
    });
    log("Crew Rosters", `${p.name} moved to the ${side === "on" ? "onboard" : "off"} swing`, p.dept);
  };

  /* Which watch somebody is on while they are here. Pressing the one they are
     already on takes it off again, for a person whose watch isn't settled yet.
     On a coming swing the watch is written on that swing's board. */
  const chooseShift = (p, shift) => {
    const next = shiftOf(p) === shift ? "" : shift;
    if (looking) {
      putAhead((b) => { if (next) b.shift[p.id] = next; else delete b.shift[p.id]; });
      log("Crew Rosters", next ? `${p.name} on the ${next} shift` : `${p.name}'s shift cleared`,
        `${swingLabel(ahead)} · ${p.dept}`);
      return;
    }
    setBoard((b) => {
      const out = settledBoard(people, b);
      if (next) out.shift[p.id] = next; else delete out.shift[p.id];
      return out;
    });
    log("Crew Rosters", next ? `${p.name} on the ${next} shift` : `${p.name}'s shift cleared`, p.dept);
  };

  /* A crew change. Everyone onboard goes ashore and the off swing comes on.
     Only people on a rotation are carried across: a fill-in or somebody
     shore-based belongs to neither swing, so they stay where they were put and
     are moved by hand. */
  const goingAshore = onboard.filter((p) => p.crew);
  const comingOn = off.filter((p) => p.crew);

  const switchSwings = () => {
    setBoard((b) => {
      const next = settledBoard(people, b);
      goingAshore.forEach((p) => { next.side[p.id] = "off"; });
      comingOn.forEach((p) => { next.side[p.id] = "on"; });
      return next;
    });
    log("Crew Rosters", "Switched the swings",
      `${goingAshore.length} ashore · ${comingOn.length} onboard`);
    setConfirmSwitch(false);
    setSub("board");
  };

  /**
   * A swing list, applied.
   *
   * The document is kept whole and shown as it was written — that is the swing.
   * The roster is then brought into line with it so the board, the compliance
   * check and everything else are talking about the same people: anybody the
   * list names is on that swing, anybody new to the roster is added under the
   * rank the document gave them, and anybody who was on the swing and isn't on
   * the new list is left on the roster with no swing against them rather than
   * deleted. They are still crew; they are just not on that rotation.
   */
  const applySwingList = ({ letter, filename, entries }) => {
    const { claimed, newcomers } = matchSwingList(entries, people);
    const stamp = Date.now();

    const kept = people.map((p) => {
      if (claimed.has(p.id)) return p.crew === letter ? p : { ...p, crew: letter };
      if (p.crew === letter) return { ...p, crew: null };
      return p;
    });
    const added = newcomers.map((e, i) => ({
      id: `p-${stamp}-${i}`,
      name: e.name,
      dept: deptForRank(e.rank),
      crew: letter,
      active: true,
    }));

    setPeople([...kept, ...added]);
    setSwingLists({ ...lists, [letter]: { filename, uploaded: new Date().toISOString().slice(0, 10), entries } });
    log("Crew Rosters", `${swingNamed(letter)} set from a list`,
      `${filename} · ${entries.length} crew · ${added.length} new to the roster`);
  };

  const TABS = [
    { id: "board", label: "Onboard and off swing" },
    { id: "lists", label: "Swing Alpha and Bravo" },
    ...(admin ? [{ id: "switch", label: "Switch swings" }] : []),
  ];

  const shiftButton = (p, id, label) => {
    const on = shiftOf(p) === id;
    const fg = id === "day" ? T.bYellow : T.accent;
    const bg = id === "day" ? T.bYellowBg : T.accentSoft;
    return (
      <button key={id} className="um-btn" disabled={!admin} onClick={() => chooseShift(p, id)}
        title={admin ? `Put ${p.name} on the ${id} shift` : ""}
        style={{ background: on ? bg : "transparent", color: on ? fg : T.muted,
          border: `1px solid ${on ? fg : T.rule}`, borderRadius: 2, padding: "5px 9px",
          fontSize: 10, fontWeight: 700, cursor: admin ? "pointer" : "default" }}>
        {label}
      </button>
    );
  };

  const row = (p, side) => (
    <div key={p.id} style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap",
      padding: "9px 0", borderBottom: `1px solid ${T.rule}` }}>
      <button className="um-btn" onClick={() => admin && setEditing(p)} disabled={!admin}
        style={{ background: "transparent", color: T.text, padding: 0, letterSpacing: 0,
          textTransform: "none", textAlign: "left", flex: "1 1 130px", minWidth: 0,
          cursor: admin ? "pointer" : "default" }}>
        <span style={{ fontFamily: T.body, fontSize: 15, fontWeight: 600 }}>{fullName(p)}</span>
        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginLeft: 8 }}>
          {p.crew ? p.crew : "—"}
        </span>
        {isDup(p) && (
          <span style={{ fontFamily: T.mono, fontSize: 9.5, fontWeight: 700, background: T.bOrangeBg,
            color: T.bOrange, padding: "2px 6px", borderRadius: 2, marginLeft: 8, whiteSpace: "nowrap" }}
            title="Another roster entry answers to this same name — press the name to edit or remove one of them">
            DUPLICATE
          </span>
        )}
      </button>

      {side === "on" && (
        <div style={{ display: "flex", gap: 5 }}>
          {SHIFTS.map((s) => shiftButton(p, s.id, s.label))}
        </div>
      )}

      {admin && (
        <button className="um-btn" onClick={() => move(p, side === "on" ? "off" : "on")}
          title={side === "on" ? `Send ${p.name} to the off swing` : `Bring ${p.name} onboard`}
          style={{ background: "transparent", color: T.muted, border: `1px solid ${T.rule}`,
            borderRadius: 2, padding: "5px 9px", fontSize: 10, fontWeight: 700 }}>
          {side === "on" ? "Send ashore" : "Bring onboard"}
        </button>
      )}
    </div>
  );

  const column = (title, list, side, colour, blurb) => (
    <div style={{ flex: "1 1 330px", minWidth: 0, background: T.panel, border: `1px solid ${T.rule}`,
      borderTop: `4px solid ${colour}`, borderRadius: 2, padding: "14px 16px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
        <Eyebrow color={colour}>{title}</Eyebrow>
        <span style={{ fontFamily: T.mono, fontSize: 12, color: T.muted }}>{list.length}</span>
      </div>
      <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, lineHeight: 1.6, marginTop: 7 }}>
        {blurb}
      </div>

      {list.length === 0 ? (
        <Empty>Nobody.</Empty>
      ) : (
        depts.map((d) => {
          const group = list.filter((p) => groupOf(p) === d);
          if (!group.length) return null;
          return (
            <div key={d} style={{ marginTop: 16 }}>
              <Eyebrow>{d}</Eyebrow>
              {group.map((p) => row(p, side))}
            </div>
          );
        })
      )}
    </div>
  );

  return (
    <div>
      <SectionHead title="Swing Roster"
        meta={looking
          ? `${swingLabel(ahead)} · Crew ${ahead.crew} · ${shownOn.length} on the swing · ${shownOff.length} off`
          : `${onboard.length} onboard · ${off.length} off swing`} />

      {/* The swing lists are what the crew came here to read, so the tabs are
          shown to everybody. Only an admin gets the crew change on the end of
          them, and only an admin gets the upload buttons on the lists page. */}
      <div className="um-scroll" style={{ display: "flex", gap: 6, margin: "16px 0 22px", paddingBottom: 2 }}>
        {TABS.map((x) => {
          const on = sub === x.id;
          return (
            <button key={x.id} className="um-btn um-tab" onClick={() => { setSub(x.id); setConfirmSwitch(false); }}
              style={{ background: on ? T.accent : T.panel, color: on ? "#FFF" : T.muted,
                border: `1px solid ${on ? T.accent : T.rule}`, fontSize: 11, fontWeight: 700,
                padding: "9px 14px", borderRadius: 2 }}>
              {x.label}
            </button>
          );
        })}
      </div>

      {sub === "lists" && (
        <SwingListUploads lists={lists} people={people} admin={admin} onApply={applySwingList} />
      )}

      {sub === "board" && (
        <>
          {/* The look ahead is said out loud rather than worn quietly — a board
              that has silently stopped being today's is how somebody gets sent
              ashore on the wrong swing. */}
          {looking && (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center",
              gap: 12, flexWrap: "wrap", background: T.panel, border: `1px solid ${T.rule}`,
              borderLeft: `4px solid ${T.accent}`, borderRadius: 2, padding: "12px 15px",
              marginBottom: 16 }}>
              <span style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.6,
                flex: "1 1 260px" }}>
                Working on <strong style={{ fontWeight: 700 }}>Crew {ahead.crew} ·{" "}
                {swingLabel(ahead)}</strong> — picked on the cards above. Watches set here, crew
                moved on or off, and anyone added belong to this swing only; the live board — who
                is on the vessel today — is untouched. Anyone not moved by hand follows the
                rotation.
              </span>
              <Button variant="quiet" onClick={onShowNow}>Back to the swing that is on</Button>
            </div>
          )}

          {admin && (
            <div style={{ display: "flex", gap: 10, marginBottom: 18, flexWrap: "wrap", alignItems: "center" }}>
              <Button onClick={() => setEditing({})}>Add crew member</Button>
              <span style={{ fontFamily: T.body, fontSize: 13, color: T.muted }}>
                {onDay} on days · {onNight} on nights
                {noWatch ? ` · ${noWatch} without a watch` : ""}
              </span>
            </div>
          )}

          {editing && admin && (
            <PersonEditor person={editing} onSave={savePerson} onRemove={removePerson}
              onCancel={() => setEditing(null)}
              matrix={(() => {
                const names = MATRIX.rows.map((r) => r[0]);
                const name = editing.name ? matchRoster(editing.name, names) : null;
                const row = name ? MATRIX.rows.find((r) => r[0] === name) : null;
                return {
                  name,
                  rank: row ? String(row[1] || "") : "",
                  options: Array.from(new Set(MATRIX.rows.map((r) => String(r[1] || "").trim()).filter(Boolean))),
                };
              })()}
              onRank={(matrixName, value, personName) => {
                const rows = MATRIX.rows.map((row) => [row[0], row[1], row[2], (row[3] || []).slice()]);
                if (matrixName) {
                  const i = rows.findIndex((r) => r[0] === matrixName);
                  if (i < 0) return;
                  const before = rows[i][1] || "—";
                  if (before === value) return;
                  rows[i][1] = value;
                  setQuals({ cols: MATRIX.cols, rows });
                  log("Crew Matrix", `${matrixName}'s rank changed`, `${before} → ${value}`);
                } else {
                  // Not on the matrix yet: the rank puts them there — one
                  // empty row, which the readings and spreadsheets fill in
                  // from here on. From that moment the checker, the swing
                  // pages and the shift checks all know them.
                  rows.push([personName, value, "", MATRIX.cols.map(() => "")]);
                  setQuals({ cols: MATRIX.cols, rows });
                  log("Crew Matrix", `${personName} added to the crew matrix`, `Rank ${value}`);
                }
              }} />
          )}

          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "flex-start" }}>
            {column("Onboard swing", shownOn, "on", T.green,
              looking
                ? "Rostered onto this swing. Set each one to days or nights, or send them off it — this swing only, the live board keeps reading today."
                : admin
                  ? "On the vessel now. Set each one to days or nights, or send them to the off swing."
                  : "On the vessel now.")}
            {column("Off swing", shownOff, "off", T.muted,
              looking
                ? "Not rostered onto this swing. Bring anyone onto it who is filling in or swapping on."
                : admin
                  ? "Ashore. Bring anyone onboard who has come out early or is filling in."
                  : "Ashore.")}
          </div>

          {gone.length > 0 && !looking && (
            <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.7, marginTop: 18 }}>
              Not on the roster at the moment: {gone.map((p) => fullName(p)).join(", ")}.
              {admin ? " Add them back from Add crew member." : ""}
            </div>
          )}
        </>
      )}

      {sub === "switch" && admin && (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.accent}`,
          borderRadius: 2, padding: "15px 17px" }}>
          <Eyebrow color={T.accent}>Switch swings</Eyebrow>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 10 }}>
            Crew change. Everyone on the onboard swing goes to the off swing, and the off swing comes
            onboard. Only people on a rotation are carried across — a fill-in or anybody without a crew
            letter stays where they are and is moved by hand.
          </div>
          <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.7, marginTop: 9 }}>
            Watches are left alone, so somebody who was on nights last trip comes back on nights and can
            be changed on the board. By the pattern the next changeover is{" "}
            {fmtDate(swingAt(currentSwingIndex()).flyHome)}, but the button is what moves the crew — press
            it when the change actually happens.
          </div>

          <div style={{ background: T.raised, borderRadius: 2, padding: "11px 13px", margin: "14px 0",
            fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.7 }}>
            <div><strong style={{ fontWeight: 600 }}>Going ashore ({goingAshore.length}):</strong>{" "}
              {goingAshore.length ? goingAshore.map((p) => fullName(p)).join(", ") : "nobody"}</div>
            <div style={{ marginTop: 6 }}><strong style={{ fontWeight: 600 }}>Coming onboard ({comingOn.length}):</strong>{" "}
              {comingOn.length ? comingOn.map((p) => fullName(p)).join(", ") : "nobody"}</div>
          </div>

          {confirmSwitch ? (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
              <span style={{ fontFamily: T.body, fontSize: 13.5, color: T.text }}>
                Switch them now?
              </span>
              <Button onClick={switchSwings}>Yes — switch the swings</Button>
              <Button variant="quiet" onClick={() => setConfirmSwitch(false)}>Cancel</Button>
            </div>
          ) : (
            <Button onClick={() => setConfirmSwitch(true)}
              disabled={!goingAshore.length && !comingOn.length}>
              Switch the swings
            </Button>
          )}
        </div>
      )}
    </div>
  );
}

function DocumentationHub({ docs, addDoc, removeDoc, currentUser, people, setPeople, overrides, setOverrides, log }) {
  const [sub, setSub] = useState("insurance");

  const SUBS = [
    { id: "insurance", label: "Insurance" },
    { id: "travel", label: "Hotel and Flight Bookings" },
    { id: "templates", label: "Templates" },
    { id: "agreements", label: "Partnership Agreements" },
    { id: "documents", label: "Misc Documents" },
  ];

  return (
    <div>
      <div className="um-scroll" style={{ display: "flex", gap: 6, marginBottom: 30, paddingBottom: 2 }}>
        {SUBS.map((x) => {
          const on = sub === x.id;
          return (
            <button key={x.id} className="um-btn um-tab" onClick={() => setSub(x.id)}
              style={{ background: on ? T.accent : T.panel, color: on ? "#FFF" : T.muted, border: `1px solid ${on ? T.accent : T.rule}`, fontSize: 11, fontWeight: 700, padding: "9px 14px", borderRadius: 2 }}>
              {x.label}
            </button>
          );
        })}
      </div>


      {sub === "insurance" && (
        <DocLibrary title="Insurance" docs={docs.insurance} currentUser={currentUser} tagHint="P&I" bucket="insurance"
          onAdd={(d) => addDoc("insurance", d, "Insurance")}
          onRemove={(d) => removeDoc("insurance", d, "Insurance")}
          note="Certificates of entry, cover notes and claims procedures." />
      )}
      {sub === "travel" && (
        <DocLibrary title="Hotel and Flight Bookings" docs={docs.travel} currentUser={currentUser} tagHint="Travel" bucket="travel"

// ---------------------------------------------------------------------------
// AI CHECKER
// A free-form conversation with the model behind the portal's analysis tools.
// The other AI on the portal is all narrow questions with fixed answers; this
// is the open end of it — ask whatever needs asking, with a file attached
// where the question is about one: an image, a PDF, or an Excel workbook, picked
// with the button or dropped onto the box. Lives on the Admin tab. The
// conversation lives in this browser for this visit and is sent up whole with
// every question, so nothing anyone asks is saved on the server or shown to
// anyone else.
//
// The AI can read the portal as well: the shared record, the file index, the
// certificates and their scans, and the answers the portal's own checks have
// made. It does that on the server, in `lib/portal.ts`, which is why an answer
// can take a minute before any words arrive — and why the waiting bubble shows
// what is being looked at rather than a bare "Thinking...". Nothing it does
// changes anything on the portal.
// ---------------------------------------------------------------------------
const AI_CHECKER_API = "/api/ai-checker";

// A question is not answered by the request that asks it. Answering is one long
// question to the model — often with a PDF on it — and a request that waited for
// it was cut off by the platform partway and came back as a bare 504 with
// nothing in it. So the server writes the question down, a background function
// answers it, and the answer is read out of the job as the model writes it,
// which is why it still arrives a few words at a time.
//
// The worker is given fifteen minutes and a question over a long document can
// take minutes of them, so the wait is generous. The poll is quick, because
// reading the answer as it is written is the whole point of it.
const AI_POLL_MS = 800;
const AI_WAIT_MS = 14 * 60 * 1000;

/** One call to the AI Checker endpoint, with its own words on a refusal. */
async function askChecker(body) {
  const r = await fetch(AI_CHECKER_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && data.error) || `The AI couldn't be reached (${r.status}).`);
  if (!data) throw new Error("The AI answered with something that couldn't be read. Ask again.");
  return data;
}

/**
 * Read an answer as it is written, handing each new piece to `onText`.
 *
 * A poll that fails is not an answer that failed — the worker is writing it
 * either way — so a dropped request is tried again and only several in a row are
 * taken as the connection having gone.
 *
 * `onStep` is given what the checker is looking at on the portal while it works
 * something out — reading someone's certificates, opening a document. It arrives
 * before any of the answer does and stops the moment words start, so a question
 * that has the AI going through several records doesn't sit there looking stuck.
 */
async function readCheckerAnswer(jobId, onText, onStep) {
  const startedAt = Date.now();
  let answer = "";
  let misses = 0;
  let step = "";

  while (Date.now() - startedAt < AI_WAIT_MS) {
    await sleep(AI_POLL_MS);

    let poll;
    try {
      poll = await askChecker({ jobId, have: answer.length });
      misses = 0;
    } catch (e) {
      if (++misses >= 3) throw e;
      continue;
    }

    if (poll.text) {
      answer += poll.text;
      onText(answer);
    }
    // Only on a change, so a poll every eight-tenths of a second doesn't set
    // React redrawing the thread for a line that hasn't moved.
    const said = poll.step || "";
    if (said !== step) {
      step = said;
      if (onStep) onStep(step);
    }
    if (poll.state === "error") {
      throw new Error(poll.error || "The AI stopped without saying why. Ask again.");
    }
    if (poll.state === "done") {
      if (!answer.trim()) throw new Error("The AI sent nothing back. Ask again.");
      // Where the answer stopped before the model had finished, the reason is
      // put on the end of it rather than thrown over what did arrive.
      return poll.note ? `${answer.trim()}\n\n${poll.note}` : answer.trim();
    }
  }

  throw new Error(
    "The answer is taking longer than it should. Ask again — something shorter, or without the attachment, if it happens twice.",
  );
}

// What can ride along with a question: the images the model can look at and
// PDFs it can read. Sizes are bounded by the request the function will take
// (about 6MB after base64), not by what the model could hold.
const AI_ATTACH_TYPES = {
  pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg",
  gif: "image/gif", webp: "image/webp",
};

// Spreadsheets go up a different way. A .xlsx is a zip, so there is nothing in
// one for a model to look at: the workbook is opened here instead, with the same
// reader the portal already uses for its own uploads, and what the sheets say is
// sent as text. Which means an Excel file costs the request its words rather
// than its megabytes, and a 20MB workbook of mostly empty cells sends very
// little.
const AI_SHEET_TYPES = {
  xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  xlsm: "application/vnd.ms-excel.sheet.macroEnabled.12",
  xls: "application/vnd.ms-excel",
  csv: "text/csv",
};
const AI_SHEET_MAX_BYTES = 20 * 1024 * 1024;   // what will be opened in the browser
const AI_SHEET_MAX_CHARS = 60000;              // text kept from one workbook
const AI_SHEET_PAYLOAD_BUDGET = 120000;        // sheet text per request

const AI_ATTACH_MAX_FILES = 4;                    // per question
const AI_ATTACH_MAX_BYTES = 3 * 1024 * 1024;      // per question, before base64
// The whole conversation is resent with every follow-up, attachments included.
// This is how much attachment data one request will carry: the newest files
// are kept and older ones are dropped from the payload (never from the
// screen), so a long thread never grows past what the function accepts.
const AI_ATTACH_PAYLOAD_BUDGET = 4200000;         // base64 characters per request

const AI_ATTACH_ACCEPT = ".pdf,.png,.jpg,.jpeg,.gif,.webp,.xlsx,.xlsm,.xls,.csv";
const AI_ATTACH_REJECTED =
  "isn't a file the AI can look at. It takes images (PNG, JPG, GIF, WebP), PDFs and spreadsheets (XLSX, XLSM, XLS, CSV).";

// What kind of attachment a picked file is: a spreadsheet to be read here, a
// file to be sent as bytes, or nothing this page takes. Extension decides for
// spreadsheets, because what a browser calls a .csv or a .xls varies by machine.
const aiAttachKind = (file) => {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (AI_SHEET_TYPES[ext]) return { type: AI_SHEET_TYPES[ext], sheet: true };
  if (Object.values(AI_SHEET_TYPES).includes(file.type)) return { type: file.type, sheet: true };
  const byMime = Object.values(AI_ATTACH_TYPES).includes(file.type) ? file.type : null;
  const type = byMime || AI_ATTACH_TYPES[ext] || null;
  return type ? { type, sheet: false } : null;
};

// A workbook as text, sheet by sheet, the same way the portal reads the matrices
// it holds: every sheet under its own heading with the rows as CSV, cut off at
// what one question can carry with a line saying so.
async function aiSheetText(file) {
  const XLSX = await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });

  let text = "";
  for (const name of wb.SheetNames) {
    const csv = XLSX.utils.sheet_to_csv(wb.Sheets[name], { blankrows: false, dateNF: "yyyy-mm-dd" });
    if (!csv.trim()) continue;
    text += `### SHEET: ${name}\n${csv}\n\n`;
    if (text.length > AI_SHEET_MAX_CHARS) break;
  }
  if (!text.trim()) throw new Error("every sheet in it is empty.");

  return text.length > AI_SHEET_MAX_CHARS
    ? `${text.slice(0, AI_SHEET_MAX_CHARS)}\n\n[This is where the file was cut off — it is too long to send whole, so anything below this point is missing.]`
    : text;
}

const readFileAsB64 = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => { const s = String(r.result || ""); res(s.slice(s.indexOf(",") + 1)); };
  r.onerror = () => rej(new Error(`${file.name} couldn't be read.`));
  r.readAsDataURL(file);
});

function AiChecker({ log }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [files, setFiles] = useState([]);   // staged for the next question
  const [busy, setBusy] = useState(false);
  const [step, setStep] = useState("");            // what it is reading on the portal
  const [reading, setReading] = useState(false);   // opening a dropped workbook
  const [error, setError] = useState(null);
  const endRef = useRef(null);
  const boxRef = useRef(null);
  const pickRef = useRef(null);

  // Keep the newest words in view while an answer is arriving, but only when
  // the reader is already at the bottom — someone scrolled up to re-read an
  // earlier answer shouldn't be dragged back down by the stream.
  React.useEffect(() => {
    const box = boxRef.current;
    if (!box || !endRef.current) return;
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    if (nearBottom) endRef.current.scrollIntoView({ block: "nearest" });
  }, [messages]);

  const attach = async (list) => {
    const picked = Array.from(list || []);
    if (!picked.length) return;
    setError(null);
    setReading(true);
    const staged = [...files];
    for (const f of picked) {
      const kind = aiAttachKind(f);
      if (!kind) {
        setError(`${f.name} ${AI_ATTACH_REJECTED}`);
        continue;
      }
      if (staged.length >= AI_ATTACH_MAX_FILES) {
        setError(`A question carries up to ${AI_ATTACH_MAX_FILES} files. Send these, then attach the rest to a follow-up.`);
        break;
      }
      // A spreadsheet is read here and goes up as the text of its sheets, so it
      // is measured by what the browser will open rather than by what the
      // request carries.
      if (kind.sheet) {
        if (f.size > AI_SHEET_MAX_BYTES) {
          setError(`${f.name} is too big to open here — spreadsheets are limited to ${Math.floor(AI_SHEET_MAX_BYTES / 1024 / 1024)}MB.`);
          continue;
        }
        try {
          staged.push({ name: f.name, type: kind.type, size: f.size, text: await aiSheetText(f) });
        } catch (e) {
          setError(`${f.name} couldn't be read as a spreadsheet: ${e.message || e}`);
        }
        continue;
      }
      const total = staged.reduce((n, x) => n + (x.data ? x.size : 0), 0) + f.size;
      if (f.size > AI_ATTACH_MAX_BYTES || total > AI_ATTACH_MAX_BYTES) {
        setError(`Images and PDFs are limited to ${Math.floor(AI_ATTACH_MAX_BYTES / 1024 / 1024)}MB per question, and ${f.name} takes it past that. Send it on its own, or use a smaller copy.`);
        continue;
      }
      try {
        staged.push({ name: f.name, type: kind.type, size: f.size, data: await readFileAsB64(f) });
      } catch (e) {
        setError(e.message || String(e));
      }
    }
    setFiles(staged);
    setReading(false);
  };

  // The messages as sent up: everything said, plus as much attachment data as
  // one request can carry, newest first. Sheet text is budgeted apart from the
  // bytes, since it costs the request something quite different. Older files
  // fall back to name-only markers so the model knows they existed even once
  // their contents are gone.
  const payloadFrom = (history) => {
    let left = AI_ATTACH_PAYLOAD_BUDGET;
    let sheetLeft = AI_SHEET_PAYLOAD_BUDGET;
    const out = history.map((m) => ({ role: m.role, content: m.content, attachments: m.attachments }));
    for (let i = out.length - 1; i >= 0; i--) {
      if (!out[i].attachments || !out[i].attachments.length) continue;
      out[i] = {
        ...out[i],
        attachments: out[i].attachments.map((f) => {
          if (f.text) {
            if (f.text.length <= sheetLeft) { sheetLeft -= f.text.length; return { name: f.name, type: f.type, text: f.text }; }
            return { name: f.name, type: f.type };
          }
          if (f.data && f.data.length <= left) { left -= f.data.length; return { name: f.name, type: f.type, data: f.data }; }
          return { name: f.name, type: f.type };
        }),
      };
    }
    return out;
  };

  const send = async () => {
    const q = input.trim();
    if ((!q && !files.length) || busy) return;
    const mine = { role: "user", content: q };
    if (files.length) mine.attachments = files;
    const history = [...messages, mine];
    setMessages([...history, { role: "assistant", content: "" }]);
    setInput("");
    setFiles([]);
    setBusy(true);
    setStep("");
    setError(null);
    const line = q || files.map((f) => f.name).join(", ");
    log("AI Checker", files.length ? `Question with ${files.length} file${files.length > 1 ? "s" : ""} put to the AI` : "Question put to the AI",
      line.slice(0, 90) + (line.length > 90 ? "..." : ""));

    try {
      // The question is written down on the server and answered by a background
      // worker, which has fifteen minutes where this request has sixty seconds.
      const started = await askChecker({ messages: payloadFrom(history) });
      if (!started.jobId) throw new Error("The AI didn't take the question. Ask again.");

      // The server sets the worker going itself unless the portal's password
      // protection turned its own call away — then it says where, and this
      // browser, which has the password answer, starts it instead.
      if (started.startPath) await startAnalysisWorker(started.startPath, started.jobId, "question");

      // The answer is read out of the job a few words at a time, so it still
      // types itself out however long the model takes over it.
      const answer = await readCheckerAnswer(
        started.jobId,
        (sofar) => setMessages([...history, { role: "assistant", content: sofar }]),
        (line) => setStep(line),
      );
      setMessages([...history, { role: "assistant", content: answer }]);
    } catch (e) {
      setError(e.message || String(e));
      // The question stays in the thread so it can be sent again; only the
      // empty answer bubble comes off.
      setMessages(history);
    } finally {
      setBusy(false);
      setStep("");
    }
  };

  return (
    <div>
      <SectionHead title="AI Checker" meta={messages.length ? `${messages.filter((m) => m.role === "user").length} asked this visit` : "Ask anything"} />
      <div style={{ fontFamily: T.body, fontSize: 14, color: T.muted, marginBottom: 18, lineHeight: 1.6 }}>
        Ask the AI whatever you want — check a calculation, draft a message, explain a procedure,
        or hand it something to read: paste text in, or attach a file and ask about it. It takes
        images, PDFs and Excel spreadsheets (XLSX, XLSM, XLS, CSV) — drag them onto the box below
        or use the button. A spreadsheet is opened here and its sheets go up as rows the AI can read.
        It can also see the portal: the roster, notes, correspondence, comments, the crew matrix,
        every file that has been uploaded and every certificate on file — including the scans
        themselves — along with the answers the portal's own checks have already produced. So you can
        ask it about a person, a document or a date and it will go and look. It reads the portal and
        never changes anything on it, and it can't run the checks on the other pages — it reads the
        answers those pages have already made, and will tell you when one is old.
        The conversation isn't kept: it belongs to this browser, this visit, and the server
        holds a question only for as long as it takes to answer it.
      </div>

      {messages.length > 0 && (
        <div ref={boxRef} style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 2,
          padding: 16, marginBottom: 14, maxHeight: "55vh", overflowY: "auto" }}>
          {messages.map((m, i) => (
            <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start",
              marginBottom: i === messages.length - 1 ? 0 : 12 }}>
              <div style={{ maxWidth: "82%", borderRadius: 2, padding: "10px 13px",
                background: m.role === "user" ? T.accentSoft : T.raised,
                border: `1px solid ${m.role === "user" ? "transparent" : T.rule}` }}>
                <div style={{ marginBottom: 5 }}>
                  <Eyebrow color={m.role === "user" ? T.accent : T.teal}>{m.role === "user" ? "You" : "AI"}</Eyebrow>
                </div>
                {m.attachments && m.attachments.length > 0 && (
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: m.content ? 7 : 0 }}>
                    {m.attachments.map((f, j) => (
                      <Chip key={j} fg={T.accent} bg={T.panel}>{f.text ? "▦" : "📎"} {f.name}</Chip>
                    ))}
                  </div>
                )}
                <div style={{ ...tx.para, fontSize: 14,
                  ...(!m.content && busy ? { color: T.muted, fontStyle: "italic" } : null) }}>
                  {m.content || (busy && i === messages.length - 1 && m.role === "assistant" ? (step || "Thinking...") : "")}
                </div>
              </div>
            </div>
          ))}
          <div ref={endRef} />
        </div>
      )}

      {error && (
        <div style={{ background: T.bRedBg, border: `1px solid ${T.bRed}`, borderRadius: 2, padding: "10px 13px",
          marginBottom: 14, fontFamily: T.body, fontSize: 14, color: T.bRed }}>
          {error}
        </div>
      )}

      {/* Files can be dropped anywhere on the box below, or picked with the
          button in it. Nothing is filtered on the way in: everything dropped
          goes to attach(), which says by name what it can't take. */}
      <DropSpot onFiles={attach} disabled={busy || reading}
        style={{ background: T.panel, border: `1px solid ${T.rule}`, padding: 16 }}>
        <div style={{ marginBottom: 11 }}><Eyebrow color={T.accent}>{messages.length ? "Ask a follow-up" : "Ask the AI"}</Eyebrow></div>
        <div style={{ display: "grid", gap: 10 }}>
          <textarea className="um-in" rows={3} value={input} disabled={busy}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
            }}
            style={{ resize: "vertical", lineHeight: 1.55 }}
            placeholder="Anything at all. Enter sends it; Shift+Enter starts a new line." />
          {files.length > 0 && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {files.map((f, i) => (
                <span key={i} style={{ display: "inline-flex", alignItems: "center", gap: 7,
                  background: T.raised, border: `1px solid ${T.rule}`, borderRadius: 2, padding: "5px 9px",
                  fontFamily: T.mono, fontSize: 11, color: T.text }}>
                  {f.text ? "▦" : "📎"} {f.name}
                  <span style={{ color: T.muted }}>
                    {f.text
                      ? `${Math.max(1, Math.round(f.text.length / 1000))}k of rows`
                      : f.size > 1024 * 1024 ? `${(f.size / 1024 / 1024).toFixed(1)}MB` : `${Math.max(1, Math.round(f.size / 1024))}KB`}
                  </span>
                  <button className="um-btn" disabled={busy} title={`Remove ${f.name}`}
                    onClick={() => setFiles(files.filter((_, j) => j !== i))}
                    style={{ background: "transparent", color: T.muted, padding: 0, fontSize: 13, lineHeight: 1 }}>
                    ✕
                  </button>
                </span>
              ))}
            </div>
          )}
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            <Button onClick={send} disabled={busy || reading || (!input.trim() && !files.length)}>{busy ? "Answering..." : "Ask"}</Button>
            <input ref={pickRef} type="file" multiple accept={AI_ATTACH_ACCEPT}
              style={{ display: "none" }}
              onChange={(e) => { attach(e.target.files); e.target.value = ""; }} />
            <Button variant="quiet" disabled={busy || reading || files.length >= AI_ATTACH_MAX_FILES}
              onClick={() => pickRef.current && pickRef.current.click()}>
              {reading ? "Reading the file..." : "Attach a file"}
            </Button>
            {messages.length > 0 && !busy && (
              <Button variant="quiet" onClick={() => { setMessages([]); setFiles([]); setError(null); }}>Start over</Button>
            )}
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
              or drop files anywhere on this box
            </span>
            <span style={{ marginLeft: "auto", fontFamily: T.mono, fontSize: 11, color: T.muted }}>
              Answers come from an AI and can be wrong — check anything that matters.
            </span>
          </div>
        </div>
      </DropSpot>
    </div>
  );
}

/* ==================================================================== */
/*  Upload Crew Certificates — one folder per person under certification */
/* ==================================================================== */

// The same slug the server files a certificate under, so the folder a file is
// about to land in can be shown before it is sent.
const certFolder = (person) =>
  (person || "")
    .normalize("NFKD")
    .replace(/[^A-Za-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .toLowerCase()
    .slice(0, 80) || "unnamed";

// SHA-256 of the bytes, so a certificate already filed under a different name is
// spotted on the page before anything is uploaded. Where the browser won't do it,
