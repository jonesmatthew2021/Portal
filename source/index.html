    // a wall - the model is unreachable or over its limit. Stop and say so
    // rather than sit in the loop for ten minutes.
    if (r.remaining > 0 && r.extracted === 0) {
      const why = (r.failures && r.failures[0] && r.failures[0].error) || "";
      throw new Error(`${r.read} of ${r.total} certificates were read, then the reading stopped. ${why}`.trim());
    }
  }

  return progress;
}

/**
 * Read every certificate on file, file each one under the person it names, and
 * hold the lot against the matrix and the spreadsheet — with the validity
 * periods matrix read first where one is filed, so a certificate that prints an
 * issue date and no expiry still comes back with the date it runs to.
 */
async function readEverything({ quals, certSheet, validityMatrix = null, fresh, onPhase = () => {} }) {
  const progress = await readCertificates({ quals, fresh, onPhase });

  // Now that every certificate has been read, the name printed on each one is
  // known — so anything filed under the wrong person is moved before it is
  // compared, or it would be held against the wrong row of the matrix. A folder
  // move failing is not worth losing the reading over: the comparison still
  // runs and the mismatch is reported as a note, as it was before.
  let moved = [];
  try {
    onPhase({ phase: "filing", read: progress.read, total: progress.total });
    const r = await analyse({ action: "refile", names: quals.rows.map((row) => row[0]) });
    moved = r.moved || [];
  } catch (e) {
    moved = [];
  }

  // The validity periods matrix, read before the comparison so the server holds
  // a reading of it — that is what turns "issued March 2024, runs two years"
  // into an expiry date on the spreadsheet. Read once per filed document and
  // remembered, so this costs nothing after the first run. It failing is not
  // worth losing the run over: the comparison then works from the dates printed
  // on the certificates alone, which is what it always did.
  let validityProblem = "";
  if (validityMatrix) {
    try {
      onPhase({ phase: "validity", read: progress.read, total: progress.total });
      const { text, problem } = await matrixSheetText(validityMatrix);
      if (problem) validityProblem = problem;
      await analyse({ action: "matrix-read", which: "validity", text });
    } catch (e) {
      validityProblem = `The validity periods could not be read off the skills matrix, so expiry dates were taken from the certificates alone. ${e.message || e}`;
    }
  }

  onPhase({ phase: "comparing", read: progress.read, total: progress.total });
  const { sheet, problem } = await readFiledSheet(certSheet, quals);
  const res = await analyse({ action: "compare", cols: quals.cols, rows: quals.rows, sheet });

  return {
    res,
    sheetProblem: [problem, validityProblem].filter(Boolean).join(" "),
    moved,
    progress,
  };
}

/**
 * Write differences into a copy of the matrix.
 *
 * Nothing is written where the matrix already says it, and a person or an item
 * the matrix doesn't have is skipped rather than invented — the matrix is the
 * roster, and a certificate for someone who has left is not a reason to put them
 * back on it.
 */
function applyDifferences(quals, differences) {
  const rows = quals.rows.map((r) => [r[0], r[1], r[2], (r[3] || []).slice()]);
  const rowAt = new Map(rows.map((r, i) => [String(r[0]).trim().toUpperCase(), i]));
  const colAt = new Map(quals.cols.map((c, i) => [c[0], i]));

  const applied = [];
  differences.forEach((it) => {
    const r = rowAt.get(String(it.person || "").trim().toUpperCase());
    const c = colAt.get(it.code);
    if (r === undefined || c === undefined) return;
    const before = rows[r][3][c] == null ? "" : rows[r][3][c];
    if (before === it.proposed) return;
    rows[r][3][c] = it.proposed;
    applied.push({ id: it.id, person: rows[r][0], code: it.code, title: it.title, from: before, to: it.proposed });
  });

  return { next: { cols: quals.cols, rows }, applied };
}

/**
 * Bring the spreadsheet on file up to date and file it back.
 *
 * The workbook that is already on the portal is the one that comes back out of
 * here, with the figures that moved written into it and nothing else disturbed
 * — so the latest matrix and the spreadsheet the next analysis compares against
 * are the same document, and it is still the document the vessel recognises.
 * The download stands whether or not the filing worked, so a failure to file is
 * reported rather than thrown.
 */
async function fileLatestMatrix(next, role, certSheet) {
  const on = todayISO();
  const { file, filename, report } = await latestMatrixFile(next, on, certSheet);

  let filed = null;
  try {
    const res = await uploadCertificateSheet(
      file, { uploadedBy: role, filedOn: on, session: SESSION }, "replace",
    );
    filed = res.record
      ? res.record
      // Byte-for-byte the same file is already there, which happens when nothing
      // was marked correct and the matrix hasn't moved since.
      : { failed: "It is the same file as the one already on the portal, so nothing was filed again." };
  } catch (e) {
    filed = { failed: `It couldn't be filed on the portal: ${e.message || String(e)} The download below is still the updated spreadsheet.` };
  }

  return { filename, file, on, filed, report };
}

/* ==================================================================== */
/*  Generating the latest matrix                                        */
/* ==================================================================== */

/**
 * One button that brings the matrix up to date with the certificates on file.
 *
 * Certificates go up one at a time, and between one review and the next the
 * matrix quietly falls behind the folder of scans sitting underneath it — a
 * ticket renewed in March is on the portal as a PDF and still expired on the
 * grid. This reads every certificate that hasn't been read yet, reads the
 * validity periods matrix where one is filed — so a certificate that prints an
 * issue date and no expiry still comes back with the date it runs to — writes
 * in what the certificates say, and files the spreadsheet that comes out in
 * place of the one on the portal, so the matrix, the spreadsheet and the scans
 * are the same account of the crew.
 *
 * Only what a certificate settles is written. A date the filed spreadsheet
 * disagrees with and no scan covers is not evidence about anything — those are
 * left exactly as they are and put on the certificate review to be answered by
 * hand, which is the one thing this button deliberately doesn't do for you.
 */
function GenerateLatestMatrix({ variant = "solid", label = "Generate latest training matrix" }) {
  const {
    quals: QUALS, setQuals, certSheet, setCertSheet, setCertAnalysis,
    refileCertificates, setMatrixUpdated, validityMatrix, log, role,
  } = usePortal();

  const [run, setRun] = useState(null);   // null | { phase, read, total } | { phase: "failed", message }
  const [done, setDone] = useState(null); // what the last run produced
  const [err, setErr] = useState("");
  // The run is watched from a window over the page, like every other analysis.
  // It can be put away — the run carries on, and the line by the button still
  // says where it is up to.
  const [hidden, setHidden] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const startedAt = useRef(0);

  const running = !!run && run.phase !== "failed";

  // How far through the run is. Reading the certificates is the length of it —
  // the filing, the comparison and the building that follow are a call each —
  // so the bar tracks the reading and stands full for the rest.
  const pct = !run || run.phase === "failed" ? 0
    : run.phase === "reading"
      ? (run.total ? Math.min(100, Math.round((run.read / run.total) * 100)) : 0)
      : 100;

  // A batch of certificates takes the best part of a minute, so without a clock
  // of its own the window would sit unchanged long enough to look stuck.
  React.useEffect(() => {
    if (!running) return;
    const tick = () => setElapsed(Math.round((Date.now() - startedAt.current) / 1000));
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, [running]);

  // Reading the scans is minutes rather than seconds, so the button has to say
  // where it is up to or it reads as a button that did nothing.
  const where = !run ? ""
    : run.phase === "reading"
      ? run.total
        ? `Reading the certificates — ${run.read} of ${run.total}.`
        : "Looking at what is on file."
    : run.phase === "filing" ? "Filing each certificate under the person named on it."
    : run.phase === "validity" ? "Reading the validity periods off the skills matrix."
    : run.phase === "comparing" ? "Holding the certificates against the matrix."
    : run.phase === "building" ? "Building the spreadsheet."
    : "Working…";

  const go = async () => {
    setErr(""); setDone(null); setHidden(false);
    startedAt.current = Date.now();
    setRun({ phase: "reading", read: 0, total: 0 });
    let progress = { read: 0, total: 0 };
    try {
      // `fresh: false` — a certificate already read is not read again, so this
      // costs the new ones only and can be pressed as often as anyone likes.
      const { res, sheetProblem, moved, progress: got } = await readEverything({
        quals: QUALS, certSheet, validityMatrix, fresh: false,
        onPhase: (p) => { setRun(p); progress = { read: p.read, total: p.total }; },
      });
      progress = got;
      if (moved.length) refileCertificates(moved);

      const items = res.items || [];
      const settled = items.filter((it) => it.source === "certificate" && it.proposed);
      const { next, applied } = applyDifferences(QUALS, settled);
      const left = items.length - settled.length;

      setRun({ phase: "building", read: progress.read, total: progress.total });
      const { filename, file, on, filed, report } = await fileLatestMatrix(next, role, certSheet);

      if (filed && filed.id) setCertSheet(filed);
      if (applied.length) {
        setQuals(next);
        setMatrixUpdated(on);
        log("Crew Matrix", "Generated the latest matrix from the certificates",
          `${applied.length} ${applied.length === 1 ? "date" : "dates"} written in from the certificates on file`);
      }

      // The reading is worth keeping whichever screen paid for it: what the
      // certificates settled is answered already, and what is left goes to the
      // certificate review as the open questions it is.
      setCertAnalysis({
        at: res.at,
        by: role,
        model: res.model,
        items,
        notes: res.notes || [],
        summary: { ...(res.summary || {}), sheetProblem, refiled: moved.length },
        verdicts: Object.fromEntries(settled.map((it) => [it.id, "yes"])),
        generated: {
          at: new Date().toISOString(),
          by: role,
          filename,
          applied: applied.length,
          dismissed: 0,
          fileId: filed && filed.id ? filed.id : null,
          failed: filed && filed.failed ? filed.failed : "",
        },
      });

      setDone({
        filename, download: URL.createObjectURL(file), applied: applied.length, left,
        read: progress.read, total: progress.total, on,
        refiled: moved.length,
        derived: (res.summary || {}).derived || 0,
        validitySheet: (res.summary || {}).validitySheet || null,
        failed: filed && filed.failed ? filed.failed : "",
        report,
      });
      log("Admin", "Generated the latest matrix",
        `${filename} · ${progress.read} of ${progress.total} certificates read · ${applied.length} ${applied.length === 1 ? "date" : "dates"} changed`);
      setRun(null);
    } catch (e) {
      const message = e.message || String(e);
      setErr(message);
      // The window comes back if it had been put away — a run that stopped is
      // the one thing worth interrupting for. Closing it leaves the same message
      // under the button.
      setHidden(false);
      setRun({ phase: "failed", message });
    }
  };

  // The button sits in a row with others until it has something to say, and then
  // takes the width it needs for the line underneath rather than stretching the
  // row it is in from the start.
  const wide = !!(run || err || done);

  return (
    <div style={{ width: wide ? "100%" : "auto" }}>
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
        <Button variant={variant} onClick={go} disabled={running}>
          {running ? "Generating…" : label}
        </Button>
        {running && (
          <span style={{ fontFamily: T.mono, fontSize: 11.5, color: T.muted }}>{where}</span>
        )}
      </div>

      {/* The run is watched from a window over the page, like every other
          analysis: the figure and the clock both climb while it works. */}
      {run && !hidden && (
        <AnalysisWindow
          eyebrow="Generating the latest training matrix"
          pct={pct}
          elapsed={elapsed}
          failed={run.phase === "failed"}
          message={run.message}
          failNote="Every certificate already read was kept, so running it again carries on from there rather than starting over."
          body={<>
            {run.phase === "reading" && (run.total
              ? `${run.read} of ${run.total} certificates read. Only the ones not read before are read now.`
              : "Looking at what is on file.")}
            {run.phase === "filing" && `All ${run.total} certificates read. Putting each one in the folder of the person named on it.`}
            {run.phase === "validity" && "Reading the validity periods off the skills matrix — how long each item stays valid."}
            {run.phase === "comparing" && "Holding what the certificates say against the matrix."}
            {run.phase === "building" && "Building the spreadsheet and filing it on the portal."}
            {run.phase === "clearing" && "Clearing what was read before."}
          </>}
          note="Leave the page open. Every certificate reading is kept as it is made, so a run that stops partway picks up where it left off rather than starting over."
          onHide={() => setHidden(true)}
          onClose={() => setRun(null)}
        />
      )}

      {err && (
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, lineHeight: 1.6, marginTop: 8 }}>
          The matrix couldn't be brought up to date. {err}
        </div>
      )}

      {done && (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
          borderLeft: `4px solid ${done.applied ? T.accent : T.teal}`, borderRadius: 2,
          padding: "13px 15px", marginTop: 12 }}>
          <Eyebrow color={done.applied ? T.accent : T.teal}>
            {done.applied ? "Matrix updated" : "Matrix already up to date"}
          </Eyebrow>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 7 }}>
            {done.read} of {done.total} {done.total === 1 ? "certificate" : "certificates"} on file were read.{" "}
            {done.applied
              ? `${done.applied} ${done.applied === 1 ? "date was" : "dates were"} written into the matrix from the certificates behind them.`
              : "Nothing the certificates say disagrees with the matrix, so nothing was changed."}
            {done.derived > 0 && ` ${done.derived} ${done.derived === 1 ? "expiry was" : "expiries were"} worked out from ${done.validitySheet || "the validity periods matrix"} — certificates that print an issue date but no expiry.`}
            {done.refiled > 0 && ` ${done.refiled} ${done.refiled === 1 ? "certificate was" : "certificates were"} filed under the wrong crew member and ${done.refiled === 1 ? "has" : "have"} been moved.`}
            {done.left > 0 && ` ${done.left} ${done.left === 1 ? "difference has" : "differences have"} no certificate behind them — they are on the certificate review under Certification Checker, to be answered by hand.`}
          </div>
          <div style={{ marginTop: 9 }}>
            <a href={done.download} download={done.filename}
              style={{ fontFamily: T.mono, fontSize: 12, color: T.accent, textDecoration: "none" }}>
              Download {done.filename}
            </a>
          </div>
          {/* What happened to the workbook itself — updated in place, or
              rebuilt, and anything on the matrix it had no room for. */}
          {workbookNotes(done.report).map((note, i) => (
            <div key={i} style={{ fontFamily: T.body, fontSize: 13, lineHeight: 1.6, marginTop: 8,
              color: done.report && done.report.rebuilt ? T.bOrange : T.muted }}>
              {note}
            </div>
          ))}
          {done.failed && (
            <div style={{ fontFamily: T.body, fontSize: 13, color: T.bOrange, lineHeight: 1.6, marginTop: 8 }}>
              {done.failed}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/**
 * Bring the training matrix spreadsheet up to what the certificates say.
 *
 * The button at the bottom of Required Documents For Upload. It reviews the
 * certificates on file — each one is read once by the model and the reading
 * kept, so only new uploads cost anything — takes the expiry date where the
 * certificate prints one, and where it prints an issue date and no expiry,
 * holds the issue date against the validity periods matrix to work out when it
 * runs to. Those dates are then written into the training matrix workbook on
 * the portal, in place: its colours, formulas, column widths, layout and every
 * other sheet in it stay exactly as they are, and only the cells a certificate
 * settles are touched. Cells no certificate speaks to are left alone entirely.
 *
 * The OPMS spreadsheet is deliberately no part of this. Nothing here reads it
 * and nothing here writes it — it belongs to OPMS and is replaced by their
 * weekly export, not by this button.
 *
 * The workbook itself is the one thing this never gives up on: it is either
 * handed back exactly as it was with only those dates changed, or left alone
 * entirely and the reason put on screen. It never comes back stripped.
 */
function UpdateTrainingMatrixInPlace({ variant = "solid", label = "Update the spreadsheet" }) {
  const {
    quals: QUALS, setQuals, trainingMatrix, setTrainingMatrix,
    refileCertificates, setMatrixUpdated, validityMatrix, log, role,
  } = usePortal();

  const [run, setRun] = useState(null);   // null | { phase, read, total } | { phase: "failed", message }
  const [done, setDone] = useState(null);
  const [err, setErr] = useState("");
  // The run is watched from a window over the page, like every other analysis.
  // It can be put away — the run carries on, and the line by the button still
  // says where it is up to.
  const [hidden, setHidden] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const startedAt = useRef(0);

  const running = !!run && run.phase !== "failed";

  // Reading the certificates is the length of the run — the filing, the
  // validity read, the comparison and the writing that follow are a call each
  // — so the bar tracks the reading and stands nearly full for the rest.
  const pct = !run || run.phase === "failed" ? 0
    : run.phase === "reading"
      ? (run.total ? Math.min(90, Math.round((run.read / run.total) * 90)) : 0)
      : run.phase === "filing" ? 91
      : run.phase === "validity" ? 93
      : run.phase === "comparing" ? 95
      : 98;

  React.useEffect(() => {
    if (!running) return;
    const tick = () => setElapsed(Math.round((Date.now() - startedAt.current) / 1000));
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, [running]);

  const where = !run ? ""
    : run.phase === "reading"
      ? run.total
        ? `Reading the certificates — ${run.read} of ${run.total}.`
        : "Looking at what is on file."
    : run.phase === "filing" ? "Filing each certificate under the person named on it."
    : run.phase === "validity" ? "Reading the validity periods off the skills matrix."
    : run.phase === "comparing" ? "Working out each expiry date."
    : run.phase === "writing" ? "Writing the dates into the training matrix workbook."
    : "Working…";

  const go = async () => {
    if (running) return;
    setErr(""); setDone(null); setHidden(false);
    startedAt.current = Date.now();
    setRun({ phase: "reading", read: 0, total: 0 });
    let progress = { read: 0, total: 0 };
    try {
      if (!trainingMatrix || !trainingMatrix.url) {
        throw new Error("No training matrix is filed on the portal yet. Upload it in the boxes above, and this button will keep it up to date.");
      }
      if (!/\.xls[xm]$/i.test(trainingMatrix.filename || "")) {
        throw new Error(`${trainingMatrix.filename} isn't an .xlsx workbook, so it can't be updated in place. Nothing was changed.`);
      }
      if (!zipCapable()) {
        throw new Error("This browser can't open the workbook on file. Chrome, Edge, Firefox or Safari can. Nothing was changed.");
      }

      // Read every certificate that hasn't been read yet. Readings are kept as
      // they are made, so this costs the new uploads only and can be pressed as
      // often as anyone likes.
      progress = await readCertificates({
        quals: QUALS, fresh: false,
        onPhase: (p) => { setRun(p); progress = { read: p.read, total: p.total }; },
      });

      // Certificates filed under the wrong person are moved before comparing,
      // or they would be held against the wrong row. Failing is not worth
      // losing the run over.
      let moved = [];
      try {
        setRun({ phase: "filing", read: progress.read, total: progress.total });
        const r = await analyse({ action: "refile", names: QUALS.rows.map((row) => row[0]) });
        moved = r.moved || [];
      } catch (e) {
        moved = [];
      }
      if (moved.length) refileCertificates(moved);

      // The validity periods matrix is what turns "issued March 2024, runs two
      // years" into an expiry date. It failing to read only means the dates
      // come from what the certificates print, which is what it always meant.
      let validityProblem = "";
      if (validityMatrix) {
        try {
          setRun({ phase: "validity", read: progress.read, total: progress.total });
          const { text, problem } = await matrixSheetText(validityMatrix);
          if (problem) validityProblem = problem;
          await analyse({ action: "matrix-read", which: "validity", text });
        } catch (e) {
          validityProblem = `The validity periods could not be read off the skills matrix, so expiry dates were taken from the certificates alone. ${e.message || e}`;
        }
      }

      // What the certificates settle, cell by cell. The OPMS spreadsheet is
      // passed to none of this — the comparison is certificates against the
      // crew matrix, nothing else.
      setRun({ phase: "comparing", read: progress.read, total: progress.total });
      const res = await analyse({ action: "compare", cols: QUALS.cols, rows: QUALS.rows, sheet: null });
      const settled = res.settled || [];
      const derived = (res.summary || {}).derived || 0;

      // The settled dates, laid over the crew matrix, and the exact cells they
      // belong to — the write is narrowed to those cells and no others.
      const rowAt = new Map(QUALS.rows.map((r, i) => [String(r[0]).trim().toUpperCase(), i]));
      const colAt = new Map(QUALS.cols.map((c, i) => [c[0], i]));
      const rows = QUALS.rows.map((r) => [r[0], r[1], r[2], (r[3] || []).slice()]);
      const only = new Set();
      let applied = 0;
      settled.forEach((s) => {
        const r = rowAt.get(String(s.person || "").trim().toUpperCase());
        const c = colAt.get(s.code);
        if (r === undefined || c === undefined || !s.value) return;
        if (String(rows[r][3][c] == null ? "" : rows[r][3][c]).trim() !== s.value) applied++;
        rows[r][3][c] = s.value;
        only.add(`${String(s.person).trim().toUpperCase()}|${s.code}`);
      });
      const next = { cols: QUALS.cols, rows };

      if (!only.size) {
        setDone({ nothing: true, read: progress.read, total: progress.total, refiled: moved.length, validityProblem });
        setRun(null);
        return;
      }

      // The workbook itself, updated in place — only the settled cells.
      setRun({ phase: "writing", read: progress.read, total: progress.total });
      const resp = await fetch(trainingMatrix.url);
      if (!resp.ok) throw new Error(`The training matrix on file couldn't be downloaded (${resp.status}). Nothing was changed.`);
      const { blob, report } = await updateFiledWorkbook(await resp.arrayBuffer(), next, only);

      // The crew matrix keeps step with what the certificates settled, so the
      // certification screens and the workbook stay the same account.
      const on = todayISO();
      if (applied) {
        setQuals(next);
        setMatrixUpdated(on);
      }

      if (!blob) {
        setDone({ report, unchanged: true, read: progress.read, total: progress.total,
          settled: only.size, derived, refiled: moved.length, validityProblem });
        setRun(null);
        return;
      }

      const file = new File([blob], trainingMatrix.filename, { type: XLSX_MIME });
      let failed = "";
      try {
        const up = await uploadSingleDocument(
          file, "training-matrix", { uploadedBy: role, filedOn: on, session: SESSION }, "replace",
        );
        if (up.record) setTrainingMatrix(up.record);
      } catch (e) {
        failed = `It couldn't be filed on the portal: ${e.message || String(e)} The download below is still the updated workbook.`;
      }

      log("Admin", "Updated the training matrix from the certificates",
        `${trainingMatrix.filename} · ${report.written} ${report.written === 1 ? "cell" : "cells"} changed on "${report.sheet}"`);
      setDone({ report, filename: trainingMatrix.filename, download: URL.createObjectURL(file), failed,
        read: progress.read, total: progress.total, settled: only.size, derived,
        refiled: moved.length, validityProblem });
      setRun(null);
    } catch (e) {
      const message = e.message || String(e);
      setErr(message);
      setHidden(false);
      setRun({ phase: "failed", message });
    }
  };

  return (
    <div style={{ width: run || err || done ? "100%" : "auto" }}>
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
        <Button variant={variant} onClick={go} disabled={running}>
          {running ? "Updating…" : label}
        </Button>
        {running && (
          <span style={{ fontFamily: T.mono, fontSize: 11.5, color: T.muted }}>{where}</span>
        )}
      </div>

      {run && !hidden && (
        <AnalysisWindow
          eyebrow="Updating the training matrix spreadsheet"
          pct={pct}
          elapsed={elapsed}
          failed={run.phase === "failed"}
          message={run.message}
          failNote="Every certificate already read was kept, so running it again carries on from there rather than starting over. Nothing was written into the spreadsheet."
          body={<>
            {run.phase === "reading" && (run.total
              ? `${run.read} of ${run.total} certificates read. Only the ones not read before are read now.`
              : "Looking at what is on file.")}
            {run.phase === "filing" && `All ${run.total} certificates read. Putting each one in the folder of the person named on it.`}
            {run.phase === "validity" && "Reading the validity periods off the skills matrix — how long each item stays valid once it has been done."}
            {run.phase === "comparing" && "Taking the expiry date each certificate prints, and working one out from the issue date and the validity period where it doesn't."}
            {run.phase === "writing" && "Writing the dates into the training matrix workbook, in place. Everything else in it stays as it is."}
          </>}
          note="Leave the page open. Every certificate reading is kept as it is made, so a run that stops partway picks up where it left off rather than starting over."
          onHide={() => setHidden(true)}
          onClose={() => setRun(null)}
        />
      )}

      {err && (
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, lineHeight: 1.6, marginTop: 8 }}>
          The spreadsheet couldn't be updated. {err}
        </div>
      )}

      {done && (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
          borderLeft: `4px solid ${done.nothing || done.unchanged ? T.teal : T.accent}`, borderRadius: 2,
          padding: "13px 15px", marginTop: 12 }}>
          <Eyebrow color={done.nothing || done.unchanged ? T.teal : T.accent}>
            {done.nothing ? "Nothing to write yet"
              : done.unchanged ? "Spreadsheet already up to date"
              : "Spreadsheet updated"}
          </Eyebrow>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 7 }}>
            {done.read} of {done.total} {done.total === 1 ? "certificate" : "certificates"} on file were read.{" "}
            {done.nothing
              ? "None of them settles an expiry date for anyone on the crew matrix yet, so the training matrix was left exactly as it is."
              : `${done.settled} ${done.settled === 1 ? "expiry was" : "expiries were"} settled by the certificates.`}
            {done.derived > 0 && ` ${done.derived} of those ${done.derived === 1 ? "was" : "were"} worked out from the issue date and the validity periods matrix — certificates that print an issue date but no expiry.`}
            {done.refiled > 0 && ` ${done.refiled} ${done.refiled === 1 ? "certificate was" : "certificates were"} filed under the wrong crew member and ${done.refiled === 1 ? "has" : "have"} been moved.`}
            {" "}The OPMS spreadsheet was not touched.
          </div>
          {workbookNotes(done.report).map((note, i) => (
            <div key={i} style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 8 }}>
              {note}
            </div>
          ))}
          {done.download && (
            <div style={{ marginTop: 9 }}>
              <a href={done.download} download={done.filename}
                style={{ fontFamily: T.mono, fontSize: 12, color: T.accent, textDecoration: "none" }}>
                Download {done.filename}
              </a>
            </div>
          )}
          {done.validityProblem && (
            <div style={{ fontFamily: T.body, fontSize: 13, color: T.bOrange, lineHeight: 1.6, marginTop: 8 }}>
              {done.validityProblem}
            </div>
          )}
          {done.failed && (
            <div style={{ fontFamily: T.body, fontSize: 13, color: T.bOrange, lineHeight: 1.6, marginTop: 8 }}>
              {done.failed}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/**
 * Download the matrix as it stands, and open it.
 *
 * The sibling of Generate: where that one reads the certificates and moves the
 * matrix before writing it out, this one writes out exactly what is on the
 * screen now — no reading, no filing, nothing changed on the portal. The same
 * file is handed to a new tab as well as to the downloads, so the browser
 * opens it with whatever reads spreadsheets on the machine.
 */
function DownloadLatestMatrix({ variant = "quiet", label = "Download latest matrix" }) {
  const { quals: QUALS, certSheet, log } = usePortal();
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [note, setNote] = useState("");

  const go = async () => {
    setErr(""); setNote("");
    setBusy(true);
    // Opened inside the click itself, so the popup blocker sees a window the
    // user asked for — by the time the workbook is built the click is history.
    const opened = window.open("", "_blank");
    try {
      // The same file the Update button would file: the workbook on the portal
      // with today's figures in it, rather than a fresh grid of dates. A
      // download that doesn't look like the spreadsheet on file is the thing
      // somebody prints and hands over.
      const { file, filename, report } = await latestMatrixFile(QUALS, todayISO(), certSheet);
      const url = URL.createObjectURL(file);

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      if (opened) opened.location = url;
      setNote(report && report.rebuilt ? report.rebuilt : "");
      log("Crew Matrix", "Downloaded the latest matrix", filename);
    } catch (e) {
      if (opened) opened.close();
      setErr(e.message || String(e));
    }
    setBusy(false);
  };

  return (
    <div>
      <Button variant={variant} onClick={go} disabled={busy}>
        {busy ? "Preparing…" : label}
      </Button>
      {err && (
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, lineHeight: 1.6, marginTop: 8 }}>
          The matrix couldn't be downloaded. {err}
        </div>
      )}
      {note && (
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.bOrange, lineHeight: 1.6, marginTop: 8 }}>
          {note}
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// The training matrix, the skills matrix and the validity periods matrix
//
// Two documents the portal is required to hold at all times: the training matrix,
// which is where the crew's training stands now, and the skills matrix, which is
// what they are required to hold — the items, the shift allocations and the rest of
// what has to be abided by. A third sits with the skills matrix where the office
// keeps it separately: the validity periods matrix, which says how long each item
// lasts once it has been done. None of them says much alone, so the analysis is
// always of them together.
// ---------------------------------------------------------------------------

// Only these can be turned into text in the browser. Anything else is sent to the
// server as the file itself.
const WORKBOOK_EXTS = ["xlsx", "xlsm", "xls", "csv"];

// A workbook read as text runs long, and the server caps what it sends the model
// anyway. Cutting it here as well keeps a document that is mostly blank columns
// from filling the request with commas.
const MAX_MATRIX_CHARS = 60000;

/**
 * A filed matrix turned into text, sheet by sheet, in the browser.
 *
 * A model can't be handed a .xlsx — it is a zip — so the portal opens the workbook
 * where it already has a reader and sends what the sheets say. A PDF or a scan
 * needs none of this: `null` comes back and the server reads the file itself.
 * Anything going wrong here is reported rather than thrown, because a matrix the
 * browser can't parse is still a matrix the server may be able to read.
 */
async function matrixSheetText(record) {
  if (!record || !record.url) return { text: null, problem: "" };

  const ext = (record.filename || "").split(".").pop().toLowerCase();
  if (!WORKBOOK_EXTS.includes(ext)) return { text: null, problem: "" };

  try {
    const XLSX = await loadXLSX();
    const res = await fetch(record.url);
    if (!res.ok) throw new Error(`It couldn't be downloaded (${res.status}).`);
    const wb = XLSX.read(await res.arrayBuffer(), { type: "array", cellDates: true });

    let text = "";
    for (const name of wb.SheetNames) {
      const csv = XLSX.utils.sheet_to_csv(wb.Sheets[name], { blankrows: false, dateNF: "yyyy-mm-dd" });
      if (!csv.trim()) continue;
      text += `### SHEET: ${name}\n${csv}\n\n`;
      if (text.length > MAX_MATRIX_CHARS) break;
    }

    if (!text.trim()) throw new Error("Every sheet in it is empty.");
    return { text: text.slice(0, MAX_MATRIX_CHARS), problem: "" };
  } catch (e) {
    // The server is asked to read the file itself, which for a workbook it can't
    // — so this is said on the page rather than swallowed.
    return { text: null, problem: `${record.filename} couldn't be opened as a workbook. ${e.message || e}` };
  }
}

/**
 * Read the matrices and hold them against one another.
 *
 * A call per document plus one for the comparison, because a whole workbook
 * through a model is more than one request has time for: each document is read and
 * the reading kept, then the readings are compared. The server refuses every one
 * of them unless the training matrix and the skills matrix are both on file. The
 * validity periods matrix is read as well wherever one has been filed, and simply
 * skipped where it hasn't.
 */
async function analyseMatrices({ trainingMatrix, skillsMatrix, validityMatrix, fresh = false, onPhase = () => {} }) {
  const problems = [];

  if (fresh) {
    onPhase({ phase: "clearing" });
    await analyse({ action: "matrix-reset" });
  }

  const documents = [
    ["training", trainingMatrix],
    ["skills", skillsMatrix],
    ["validity", validityMatrix],
  ];

  for (const [which, record] of documents) {
    if (!record) continue;
    onPhase({ phase: which });
    const { text, problem } = await matrixSheetText(record);
    if (problem) problems.push(problem);

    const started = await analyse({ action: "matrix-read", which, text, force: fresh });

    // Same 504-avoiding handoff as the OPMS comparison: a large crew's reading
    // can outrun a single request, so the server hands back a job instead and
    // this waits after it rather than the request itself.
    if (started && started.pending && started.jobId && started.startPath) {
      await startAnalysisWorker(started.startPath, started.jobId);
    }
    if (started && started.pending && started.jobId) {
      await waitForAnalysisJob("matrix-read-job", started.jobId, (waited) =>
        onPhase({ phase: which, waited }));
    }
  }

  onPhase({ phase: "checking" });
  const started = await analyse({ action: "matrix-check", force: fresh });

  if (started && started.pending && started.jobId && started.startPath) {
    await startAnalysisWorker(started.startPath, started.jobId);
  }

  const res = started && started.pending && started.jobId
    ? await waitForAnalysisJob("matrix-check-job", started.jobId, (waited) =>
        onPhase({ phase: "checking", waited }))
    : started;

  return { ...res, problems };
}

// ---------------------------------------------------------------------------
// The OPMS export against our own records
// ---------------------------------------------------------------------------

/**
 * Compare the OPMS spreadsheet with our skills matrix and our certificates.
 *
 * OPMS belongs to somebody else, and when it disagrees with the portal one of the
 * two is wrong. Which one decides who has to fix it, so the answer comes back in
 * two columns: what we have wrong, and what OPMS has wrong. The certificates are
 * what tells them apart — a scan is the document itself, so the side that
 * disagrees with the scan is the side with the mistake.
 *
 * The certificates are read first, because a certificate nobody has read settles
 * nothing. That is the long part of the run; every reading is kept, so a second
 * run, or the certification checker afterwards, pays for none of it again.
 */
async function analyseOPMS({ quals, opmsSheet, fresh = false, onPhase = () => {} }) {
  const problems = [];

  if (fresh) {
    onPhase({ phase: "clearing", read: 0, total: 0 });
    await analyse({ action: "opms-reset" });
  }

  // Not `fresh`: clearing the certificate readings as well would mean reading
  // every scan again to answer a question about a spreadsheet. "Run it again"
  // here means ask the question again, not read the certificates again.
  const progress = await readCertificates({ quals, fresh: false, onPhase });

  onPhase({ phase: "sheet", read: progress.read, total: progress.total });
  const { text, problem } = await matrixSheetText(opmsSheet);
  if (problem) problems.push(problem);

  onPhase({ phase: "comparing", read: progress.read, total: progress.total, waited: 0 });
  const started = await analyse({
    action: "opms-check", cols: quals.cols, rows: quals.rows, text, force: fresh,
  });

  // The comparison itself is one long question over the whole crew, and it runs
  // as a job on the server rather than as the answer to this request — a request
  // that waited for it would be cut off partway and arrive back as a 504 with
  // nothing in it. So the server hands back a job, and we ask after it.
  //
  // Normally the server would set the worker going itself. It can't: a worker
  // can't call itself, and every request has to carry a signed-in session,
  // which a call the server makes to itself has none of. This browser does
  // have one — it is how the page in front of you was fetched — so when the
  // server says it couldn't hand the run over, it is handed over from here.
  if (started && started.pending && started.jobId && started.startPath) {
    await startAnalysisWorker(started.startPath, started.jobId);
  }

  const res = started && started.pending && started.jobId
    ? await waitForAnalysisJob("opms-job", started.jobId, (waited) =>
        onPhase({ phase: "comparing", read: progress.read, total: progress.total, waited }))
    : started;

  return { ...res, problems, progress };
}

/**
 * Set a worker going from the browser, where the server couldn't.
 *
 * A background function answers as soon as it has the request, so an answer in
 * the two hundreds means the run was picked up and anything else means it wasn't
 * — and a job nobody is running is one the portal would otherwise sit and ask
 * after until it gave up minutes later.
 */
async function startAnalysisWorker(path, jobId, what = "comparison") {
  // On the old host this returned in a breath — the background function took
  // the job and answered straight away. On Cloudflare the same request IS the
  // run and stays open until the work is done, so waiting for it here would
  // hold the polling up for the whole run. Give it a moment to fail fast (a
  // bad path, the server unreachable), then let it carry on in the background
  // — the polls read the job record while this request is still open.
  const attempt = fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jobId }),
  });
  attempt.catch(() => {});
  const soon = await Promise.race([
    attempt.then((r) => r, () => "failed"),
    new Promise((res) => setTimeout(() => res("running"), 1500)),
  ]);
  if (soon === "failed") {
    throw new Error(`The ${what} couldn't be started — the server couldn't be reached. Try again in a moment.`);
  }
  if (soon !== "running" && !soon.ok) {
    throw new Error(`The ${what} couldn't be started (${soon.status}). Try again in a moment.`);
  }
}

// How long to keep asking after a comparison running as a job on the server, and
// how often. The workers are given fifteen minutes and a long run can take
// several of them, so the wait is generous. What it isn't is silent: the panel
// is told how long it has been.
const JOB_WAIT_MS = 14 * 60 * 1000;
const JOB_POLL_MS = 2500;

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/**
 * Ask after a comparison until it has an answer. `pollAction` names the kind of
 * job — "opms-job" or "shift-job".
 *
 * A poll that fails is not a run that failed — the job is on the server either
 * way — so a dropped request is tried again and only several in a row are taken
 * as the connection having gone. The answer comes back exactly as it used to
 * when the comparison was the response to the request itself.
 */
async function waitForAnalysisJob(pollAction, jobId, onWait = () => {}) {
  const startedAt = Date.now();
  let misses = 0;

  while (Date.now() - startedAt < JOB_WAIT_MS) {
    await sleep(JOB_POLL_MS);

    let job;
    try {
      job = await analyse({ action: pollAction, jobId });
      misses = 0;
    } catch (e) {
      if (++misses >= 3) throw e;
      continue;
    }

    if (job.state === "done") {
      if (!job.result) throw new Error("The comparison finished without an answer. Run it again.");
      return job.result;
    }
    if (job.state === "error") {
      throw new Error(job.error || "The comparison stopped without saying why.");
    }

    onWait(Math.round((Date.now() - startedAt) / 1000));
  }

  throw new Error(
    "The comparison is taking longer than it should. It may yet finish on the server — run it again in a few minutes and the answer will be there if it did.",
  );
}

/**
 * Step 2 — read the certificates, hold them against the spreadsheets, and let
 * an admin decide what the spreadsheet should say.
 *
 * The portal holds two accounts of the same thing: a folder of scanned
 * certificates per crew member, and the crew qualification spreadsheet the
 * matrix is built from. They drift apart — a renewal is filed and the
 * spreadsheet isn't touched, or a date is typed a year out — and until now the
 * only way to find the drift was to open fifty PDFs alongside the spreadsheet.
 *
 * So the reading is done for them. A certificate that is plainly at odds with the
 * matrix is taken at its word — uploading one already brings the matrix and the
 * spreadsheet up to date on its own — and what is left over is where the
 * certificates say nothing and the two spreadsheets disagree between themselves.
 * Those are put up as rows to be answered yes or no, and only the rows answered
 * yes are written. The AI reads; an admin decides what it couldn't.
 */
// How long a run has been going, for the window that watches it: "1m 12s".
const elapsedLabel = (secs) =>
  secs < 60 ? `${secs}s` : `${Math.floor(secs / 60)}m ${String(secs % 60).padStart(2, "0")}s`;

/**
 * The window a run is watched from.
 *
 * Every analysis on the portal takes minutes and none of them can be hurried, so
 * all three are watched the same way: a window over the page saying how far
 * through it is, how long it has been going and what it is doing at this moment.
 * It can be put away — the run carries on either way, and the line under the
 * buttons still says where it is up to.
 *
 * A run that stopped holds the window open with the reason in it rather than
 * closing on its own, since that is the one thing worth interrupting for.
 */
function AnalysisWindow({
  eyebrow, pct, elapsed, body, note,
  failed = false, message = "", failNote = "",
  onHide, onClose,
}) {
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 80, background: "rgba(18,41,61,0.45)",
      display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 3,
        padding: 20, width: "100%", maxWidth: 420 }}>

        {failed ? (
          <>
            <div style={{ marginBottom: 5 }}><Eyebrow color={T.bRed}>The analysis stopped</Eyebrow></div>
            <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginBottom: 12 }}>
              {message}
            </div>
            <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 15 }}>
              {failNote}
            </div>
            <Button onClick={onClose}>Close</Button>
          </>
        ) : (
          <>
            <div style={{ marginBottom: 5 }}><Eyebrow color={T.accent}>{eyebrow}</Eyebrow></div>

            <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginTop: 12 }}>
              <div style={{ fontFamily: T.display, fontSize: 40, fontWeight: 700, color: T.text, lineHeight: 1 }}>
                {pct}%
              </div>
              <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
                {elapsedLabel(elapsed)} elapsed
              </div>
            </div>

            <div className="um-bar" style={{ margin: "14px 0 11px" }}>
              <i style={{ width: `${pct}%` }} />
            </div>

            <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7 }}>
              {body}
            </div>

            <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 10, marginBottom: 15 }}>
              {note}
            </div>

            <Button variant="quiet" onClick={onHide}>Hide this window</Button>
          </>
        )}
      </div>
    </div>
  );
}

/**
 * The window over whichever page is open while the crew matrix brings itself
 * up to date, and — where the run was set off by a spreadsheet — the outcome.
 *
 * The run can be set going from more than one place: filing certificates,
 * replacing the crew certificates spreadsheet, or replacing the validity
 * periods matrix. It is watched from here, once, rather than from a window per
 * screen — the admin may have moved on by the time it lands. A run that
 * followed a filing of certificates reports its outcome on that screen, under
 * the filing summary, as it always did, so this window simply goes when one of
 * those lands. A run that followed a spreadsheet has no screen of its own, so
 * its outcome is said here and closed by hand.
 */
function MatrixAutoWindow() {
  const { matrixAuto: auto, clearMatrixAuto } = usePortal();
  const [hidden, setHidden] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const startedAt = useRef(0);

  const running = !!auto && auto.phase !== "done" && auto.phase !== "failed";

  React.useEffect(() => {
    if (!running) {
      // Ready for the next run: its window starts shown, on a fresh clock.
      startedAt.current = 0;
      setHidden(false);
      return;
    }
    if (!startedAt.current) startedAt.current = Date.now();
    const tick = () => setElapsed(Math.round((Date.now() - startedAt.current) / 1000));
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, [running]);

  if (!auto) return null;

  const fromSheet = auto.origin !== "certificates";
  const fromButton = auto.origin === "update-table";

  if (running) {
    if (hidden) return null;
    // Reading the certificates is the length of the run — the filing, comparing
    // and writing that follow are a call each — so the bar tracks the reading
    // and stands full for the rest.
    const pct = auto.phase === "reading"
      ? (auto.total ? Math.min(100, Math.round((auto.read / auto.total) * 100)) : 0)
      : 100;
    return (
      <AnalysisWindow
        eyebrow={fromButton ? "Updating the table" : fromSheet ? "Updating the crew matrix" : "Reading what was just filed"}
        pct={pct}
        elapsed={elapsed}
        body={<>
          {auto.phase === "reading" && (auto.total
            ? `Reading the certificates — ${auto.read} of ${auto.total} done.`
            : "Looking for certificates to read...")}
          {auto.phase === "filing" && "Putting each certificate in the folder of the person named on it..."}
          {auto.phase === "validity" && "Reading the validity periods off the skills matrix — how long each item stays valid..."}
          {auto.phase === "comparing" && "Holding what was read against the crew matrix and the spreadsheet on file..."}
          {auto.phase === "writing" && "Updating the crew matrix..."}
        </>}
        note={fromButton
          ? "Every certificate on file is checked against the spreadsheets and the validity periods, and the lists follow what they settle. Certificates already read are answered from what is kept, so this costs the new ones only."
          : fromSheet
          ? "The spreadsheet is filed already — this is the crew matrix following it. Leave the page open; each certificate reading is kept as it lands, so a lost connection costs a batch rather than the run."
          : "This takes a few minutes on a large batch. Leave the page open — each certificate is kept as it is read, so a lost connection costs the batch it was in rather than the whole run."}
        onHide={() => setHidden(true)}
      />
    );
  }

  // The outcome of a run the certificates screen isn't reporting.
  if (!fromSheet) return null;

  if (auto.phase === "failed") {
    return (
      <AnalysisWindow
        failed
        message={auto.message}
        failNote={fromButton
          ? "Nothing has been lost. The certificates already read are kept, so pressing Update table again carries on from here rather than starting over."
          : "The spreadsheet is filed and nothing has been lost. The certificates already read are kept, so the next run — the next upload, or Generate latest training matrix — carries on from here rather than starting over."}
        onClose={clearMatrixAuto}
      />
    );
  }

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 80, background: "rgba(18,41,61,0.45)",
      display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 3,
        padding: 20, width: "100%", maxWidth: 460 }}>
        <div style={{ marginBottom: 7 }}>
          <Eyebrow color={T.green}>{fromButton ? "Table brought up to date" : "Crew matrix brought up to date"}</Eyebrow>
        </div>
        <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7 }}>
          {auto.read} of {auto.total} certificates were held against the {fromButton ? "spreadsheets on file" : "new spreadsheet"}
          {auto.moved.length ? `, and ${auto.moved.length} ${auto.moved.length === 1 ? "was" : "were"} refiled under the person named on ${auto.moved.length === 1 ? "it" : "them"}` : ""}.{" "}
          {auto.applied.length
            ? `${auto.applied.length} ${auto.applied.length === 1 ? "date" : "dates"} on the crew matrix ${auto.applied.length === 1 ? "was" : "were"} brought up to what the certificates say.`
            : "Nothing on the matrix disagreed with the certificates, so the matrix is as it was."}
        </div>

        {auto.applied.length > 0 && (
          <div style={{ marginTop: 10, maxHeight: 190, overflowY: "auto" }}>
            {auto.applied.map((a, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 12,
                flexWrap: "wrap", padding: "4px 0", borderBottom: `1px solid ${T.rule}` }}>
                <span style={{ fontFamily: T.body, fontSize: 13, color: T.text }}>
                  {a.person} <span style={{ color: T.muted }}>· {a.code} {a.title}</span>
                </span>
                <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
                  {valueReads(a.from)} → <span style={{ color: T.green }}>{valueReads(a.to)}</span>
                </span>
              </div>
            ))}
          </div>
        )}

        {auto.left > 0 && (
          <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 10 }}>
            {auto.left} {auto.left === 1 ? "difference is" : "differences are"} left where no certificate
            settles it — those are on the certificate review to be answered by hand.
          </div>
        )}

        <div style={{ marginTop: 15 }}>
          <Button onClick={clearMatrixAuto}>Close</Button>
        </div>
      </div>
    </div>
  );
}

function CertAnalysis() {
  const {
    quals: QUALS, setQuals, certSheet, setCertSheet, certAnalysis, setCertAnalysis,
    refileCertificates, validityMatrix, log, role, setMatrixUpdated,
  } = usePortal();

  const [run, setRun] = useState(null);       // null | { phase, read, total, message }
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null); // what the last Generate produced
  const [show, setShow] = useState("all");   // open | all — everything is shown unless narrowed
  // The run is watched from a window over the page. It can be put away — the run
  // carries on either way, and the line under the buttons still says where it is.
  const [hidden, setHidden] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const startedAt = useRef(0);

  // A failed run stays on screen to be read, so "there is a run" and "a run is
  // still going" are two different questions.
  const running = !!run && run.phase !== "failed";

  // How far through the run is. Reading the certificates is the length of it —
  // the filing and the comparison that follow are a call each — so the bar tracks
  // the reading and stands full for the rest.
  const pct = !run ? 0
    : run.phase === "comparing" || run.phase === "filing" || run.phase === "validity" ? 100
    : run.total ? Math.min(100, Math.round((run.read / run.total) * 100))
    : 0;

  // A batch of certificates takes the best part of a minute, so without a clock
  // of its own the window would sit unchanged long enough to look stuck.
  React.useEffect(() => {
    if (!running) return;
    const tick = () => setElapsed(Math.round((Date.now() - startedAt.current) / 1000));
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, [running]);

  const items = (certAnalysis && certAnalysis.items) || [];
  const notes = (certAnalysis && certAnalysis.notes) || [];
  const summary = (certAnalysis && certAnalysis.summary) || {};
  const verdicts = (certAnalysis && certAnalysis.verdicts) || {};

  const answered = items.filter((i) => verdicts[i.id]).length;
  const left = items.length - answered;
  const accepted = items.filter((i) => verdicts[i.id] === "yes");
  const ready = !!certAnalysis && left === 0;

  // Reading fifty scans takes far longer than one request is allowed to run, so
  // the reading is done a few at a time on the server. `readEverything` is the
  // same sequence an upload sets off on its own — read, put every certificate in
  // the right folder, then compare.
  const runAnalysis = async (fresh) => {
    setErr(""); setResult(null); setBusy(true); setHidden(false);
    startedAt.current = Date.now();
    // Held out here so a run that stops partway can say how far it got.
    let progress = { read: 0, total: 0, remaining: 1 };
    try {
      const { res, sheetProblem, moved, progress: got } = await readEverything({
        quals: QUALS, certSheet, validityMatrix, fresh,
        onPhase: (p) => { setRun(p); progress = { ...progress, read: p.read, total: p.total }; },
      });
      progress = got;

      if (moved.length) refileCertificates(moved);

      setCertAnalysis({
        at: res.at,
        by: role,
        model: res.model,
        items: res.items || [],
        notes: res.notes || [],
        summary: { ...(res.summary || {}), sheetProblem, refiled: moved.length },
        verdicts: {},
        generated: null,
      });
      log("Admin", "Analysed the crew certificates",
        `${(res.summary || {}).read || 0} certificates read · ${(res.items || []).length} differences to review${
          moved.length ? ` · ${moved.length} refiled under the person named on them` : ""}`);
      setRun(null);
    } catch (e) {
      const message = e.message || String(e);
      setErr(message);
      // The window stays up with the reason in it — and comes back if it had been
      // put away, since a run that stopped is the one thing worth interrupting
      // for. Closing it leaves the same message under the buttons.
      setHidden(false);
      setRun({ phase: "failed", read: progress.read, total: progress.total, message });
    }
    setBusy(false);
  };

  const answer = (id, verdict) =>
    setCertAnalysis((a) => (a ? {
      ...a,
      verdicts: { ...(a.verdicts || {}), [id]: a.verdicts && a.verdicts[id] === verdict ? undefined : verdict },
      // An answer changed after a spreadsheet was generated means that
      // spreadsheet no longer matches the review. Offer it again.
      generated: null,
    } : a));

  const clearAnswers = () => {
    setResult(null);
    setCertAnalysis((a) => (a ? { ...a, verdicts: {}, generated: null } : a));
  };

  /**
   * Write the review into the matrix and hand back a spreadsheet.
   *
   * Only rows answered yes are written. The matrix is changed for everyone —
   * that is the point of the exercise — and the same figures go out as a
   * workbook, which is filed on the portal in place of the spreadsheet that was
   * there and offered as a download.
   */
  const generate = async () => {
    setBusy(true); setErr("");
    try {
      const { next, applied } = applyDifferences(QUALS, accepted);
      const { filename, file, on, filed, report } = await fileLatestMatrix(next, role, certSheet);

      if (filed && filed.id) setCertSheet(filed);

      if (applied.length) {
        setQuals(next);
        setMatrixUpdated(on);
        log("Crew Matrix", "Updated from the certificate analysis",
          `${applied.length} ${applied.length === 1 ? "date" : "dates"} changed to match the certificates on file`);
      }

      setCertAnalysis((a) => (a ? {
        ...a,
        generated: {
          at: new Date().toISOString(),
          by: role,
          filename,
          applied: applied.length,
          dismissed: items.filter((i) => (a.verdicts || {})[i.id] === "no").length,
          fileId: filed && filed.id ? filed.id : null,
          failed: filed && filed.failed ? filed.failed : "",
        },
      } : a));

      setResult({ filename, download: URL.createObjectURL(file), applied, filed, report });
      log("Admin", "Generated an updated crew spreadsheet",
        `${filename} · ${applied.length} ${applied.length === 1 ? "date" : "dates"} changed`);
    } catch (e) {
      setErr(e.message || String(e));
    }
    setBusy(false);
  };

  // How an answer reads on paper. Unanswered is said out loud rather than left
  // blank, so a printed review can't be mistaken for a finished one.
  const verdictChip = (v) =>
    v === "yes" ? { status: "Correct", fg: T.bGreen, bg: T.bGreenBg }
    : v === "no" ? { status: "Leave as is", fg: T.bRed, bg: T.bRedBg }
    : { status: "Unanswered", fg: T.bOrange, bg: T.bOrangeBg };

  /**
   * The review as it stands, on paper. It is described when the button is
   * pressed, so it carries the answers given so far, and it keeps the same
   * shape as the screen: the differences by what they have been answered, then
   * what was noted with nothing to change.
   */
  const asPDF = () => {
    const line = (it) => ({
      code: it.code,
      title: `${it.person} - ${it.title}. ${it.detail} ${it.certificate
        ? `From ${it.certificate.filename}.`
        : "From the filed spreadsheet."}`,
      date: valueReads(it.proposed),
      ...verdictChip(verdicts[it.id]),
    });

    const open = items.filter((i) => !verdicts[i.id]);
    const kept = items.filter((i) => verdicts[i.id] === "no");

    // The caveats that sit under the tiles on screen: they decide nothing, but
    // they say what the review couldn't cover, which matters most on paper.
    const caveats = [
      summary.sheetProblem || "",
      summary.refiled > 0
        ? `${summary.refiled} ${summary.refiled === 1 ? "certificate was" : "certificates were"} filed under the wrong crew member and ${summary.refiled === 1 ? "has" : "have"} been moved into the folder of the person named on ${summary.refiled === 1 ? "it" : "them"}.`
        : "",
      summary.sheetCapped > 0
        ? `The filed spreadsheet differs from the matrix in ${summary.sheetTotal} places. The first ${summary.fromSheet} are listed here - answer these, generate the spreadsheet, and run the analysis again for the rest.`
        : "",
      summary.uncertified > 0
        ? `${summary.uncertified} dated items on the matrix have no certificate on file behind them. Those were left exactly as they are - a missing scan is not evidence about a date.`
        : "",
    ].filter(Boolean).map((text) => ({ code: "", title: text }));

    return {
      title: "Certificate review - differences found",
      subtitle: `${VESSEL.name} ${VESSEL.nameAccent} · analysed ${
        certAnalysis ? new Date(certAnalysis.at).toLocaleString("en-AU", {
          day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit",
        }) : fmtDate(TODAY)}${certAnalysis && certAnalysis.by ? ` by ${certAnalysis.by}` : ""} · ${
        summary.read || 0} of ${summary.certificates || 0} certificates read · ${
        items.length} ${items.length === 1 ? "difference" : "differences"} · ${
        left} still to answer · against ${certSheet ? certSheet.filename : "the crew matrix alone"}`,
      filename: `certificate-differences-${TODAY}.pdf`,
      empty: "Nothing disagreed. Every certificate that could be matched to an item says what the spreadsheet says.",
      groups: [
        { heading: "Still to answer", meta: `${open.length} of ${items.length}`, items: open.map(line) },
        { heading: "Marked correct - to be written into the matrix", meta: `${accepted.length} of ${items.length}`, items: accepted.map(line) },
        { heading: "Marked leave as is", meta: `${kept.length} of ${items.length}`, items: kept.map(line) },
        {
          heading: "Noted, with nothing to change",
          meta: `${notes.length} ${notes.length === 1 ? "note" : "notes"}`,
          items: notes.map((n) => ({ code: "", title: `${n.person ? `${n.person} - ` : ""}${n.detail}` })),
        },
        { heading: "Worth knowing", items: caveats },
      ],
    };
  };

  const tile = (label, value, colour) => (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `3px solid ${colour}`,
      borderRadius: 2, padding: "10px 13px", flex: "1 1 130px" }}>
      <Eyebrow>{label}</Eyebrow>
      <div style={{ fontFamily: T.display, fontSize: 25, fontWeight: 700, color: colour, marginTop: 5, lineHeight: 1 }}>{value}</div>
    </div>
  );

  const shown = show === "open" ? items.filter((i) => !verdicts[i.id]) : items;

  const yesNo = (it) => {
    const v = verdicts[it.id];
    const btn = (label, key, colour) => (
      <button className="um-btn" onClick={() => answer(it.id, key)}
        title={key === "yes"
          ? "Yes - this is a real difference, and the spreadsheet should say what the certificate says"
          : "No - leave the spreadsheet as it is"}
        style={{ background: v === key ? colour : "transparent", color: v === key ? "#fff" : colour,
          border: `1px solid ${colour}`, borderRadius: 2, padding: "5px 12px", fontSize: 11, fontWeight: 700 }}>
        {label}
      </button>
    );
    return (
      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
        {btn("Yes", "yes", T.green)}
        {btn("No", "no", T.bRed)}
      </div>
    );
  };

  return (
    <div>
      {/* What this screen does, and the spreadsheet it is comparing against. */}
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.accent}`,
        borderRadius: 2, padding: "15px 17px", marginBottom: 16 }}>
        <Eyebrow color={T.accent}>Analyse files</Eyebrow>
        <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 10 }}>
          Every certificate filed on the portal is read, each one is put in the folder of the person
          whose name it carries, and what it says is held against the crew matrix and against the
          certificates spreadsheet on file. Uploading a certificate does all of this on its own and
          updates the matrix from what the certificates say. What is left here is what no certificate
          settles — where the filed spreadsheet and the matrix disagree between themselves — listed
          below for you to answer yes or no, one at a time.
        </div>

        <div style={{ background: T.raised, borderRadius: 2, padding: "9px 11px", marginTop: 13,
          display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ marginBottom: 4 }}><Eyebrow>Spreadsheet on file</Eyebrow></div>
            <div style={{ fontFamily: T.body, fontSize: 13, color: certSheet ? T.text : T.muted, wordBreak: "break-word" }}>
              {certSheet ? certSheet.filename : "No spreadsheet has been filed yet - upload it under Required Documents For Upload"}
            </div>
            {certSheet && (
              <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 2 }}>
                {certSheet.uploaded ? `${fmtDate(certSheet.uploaded)} · ` : ""}{certSheet.size}
              </div>
            )}
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            {certSheet && <OpenLink url={certSheet.url} />}
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 14, alignItems: "center" }}>
          <Button onClick={() => runAnalysis(false)} disabled={busy}>
            {running ? "Working..." : certAnalysis ? "Analyse again" : "Analyse files"}
          </Button>
          {certAnalysis && (
            <Button variant="quiet" onClick={() => runAnalysis(true)} disabled={busy}
              title="Read every certificate again from the file itself, rather than using what was read last time">
              Re-read every certificate
            </Button>
          )}
          {running && hidden && (
            <Button variant="quiet" onClick={() => setHidden(false)}>Show progress</Button>
          )}
          {certAnalysis && !running && (
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
              Last run {new Date(certAnalysis.at).toLocaleString("en-AU", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}
              {certAnalysis.by ? ` · ${certAnalysis.by}` : ""}
            </span>
          )}
        </div>

        {/* Behind the window, and on its own once the window is put away. */}
        {running && (
          <div style={{ fontFamily: T.body, fontSize: 13, color: T.accent, marginTop: 12, lineHeight: 1.6 }}>
            {run.phase === "clearing" && "Clearing what was read before..."}
            {run.phase === "reading" && (run.total
              ? `Reading the certificates - ${run.read} of ${run.total} done. This takes a few minutes; leave this page open.`
              : "Looking for certificates to read...")}
            {run.phase === "filing" && "Filing each certificate under the person named on it..."}
            {run.phase === "validity" && "Reading the validity periods off the skills matrix..."}
            {run.phase === "comparing" && "Comparing what was read against the spreadsheets..."}
          </div>
        )}

        {err && (
          <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, marginTop: 12, lineHeight: 1.6 }}>{err}</div>
        )}
      </div>

      {!certAnalysis ? (
        <Empty>Nothing has been analysed yet. Analyse files reads every certificate on file and lists what doesn't match the spreadsheets.</Empty>
      ) : (
        <>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
            {tile("Certificates read", `${summary.read || 0}/${summary.certificates || 0}`, T.accent)}
            {tile("Match the spreadsheet", summary.agree || 0, T.green)}
            {tile("Differences", items.length, items.length ? T.bOrange : T.green)}
            {tile("Still to answer", left, left ? T.bRed : T.green)}
          </div>

          {(summary.sheetProblem || summary.sheetCapped > 0 || summary.uncertified > 0 || summary.refiled > 0) && (
            <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.7, marginBottom: 14 }}>
              {summary.sheetProblem ? <div>{summary.sheetProblem}</div> : null}
              {summary.refiled > 0 ? (
                <div>
                  {summary.refiled} {summary.refiled === 1 ? "certificate was" : "certificates were"} filed under
                  the wrong crew member and {summary.refiled === 1 ? "has" : "have"} been moved into the folder of
                  the person named on {summary.refiled === 1 ? "it" : "them"}.
                </div>
              ) : null}
              {summary.sheetCapped > 0 ? (
                <div>
                  The filed spreadsheet differs from the matrix in {summary.sheetTotal} places. The first{" "}
                  {summary.fromSheet} are listed - answer these, generate the spreadsheet, and run it again for the rest.
                </div>
              ) : null}
              {summary.uncertified > 0 ? (
                <div>
                  {summary.uncertified} dated items on the matrix have no certificate on file behind them. Those are
                  left exactly as they are - a missing scan is not evidence about a date.
                </div>
              ) : null}
            </div>
          )}

          {/* The differences, and the yes or no against each one. */}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 12 }}>
            <Eyebrow color={T.accent}>Differences found</Eyebrow>
            <div style={{ flex: 1 }} />
            <DownloadPDF build={asPDF} variant="quiet" />
            {items.length > 0 && (
              <>
                <button className="um-btn" onClick={() => setShow(show === "open" ? "all" : "open")}
                  style={{ background: "transparent", color: T.accent, border: `1px solid ${T.rule}`,
                    borderRadius: 2, padding: "5px 10px", fontSize: 11, fontWeight: 700 }}>
                  {show === "open" ? `Show all ${items.length}` : `Show the ${left} unanswered`}
                </button>
                {answered > 0 && (
                  <button className="um-btn" onClick={clearAnswers}
                    style={{ background: "transparent", color: T.muted, border: `1px solid ${T.rule}`,
                      borderRadius: 2, padding: "5px 10px", fontSize: 11, fontWeight: 700 }}>
                    Clear answers
                  </button>
                )}
              </>
            )}
          </div>

          {items.length === 0 ? (
            <Empty>Nothing disagreed. Every certificate that could be matched to an item says what the spreadsheet says.</Empty>
          ) : shown.length === 0 ? (
            <Empty>Every difference has an answer. The spreadsheet can be generated below.</Empty>
          ) : (
            <div style={{ marginBottom: 18 }}>
              <div style={{ display: "flex", gap: 10, padding: "0 0 6px",
                borderBottom: `1px solid ${T.rule}`, flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 220 }}><Eyebrow>Crew member and item</Eyebrow></div>
                <div style={{ minWidth: 120 }}><Eyebrow>Matrix now</Eyebrow></div>
                <div style={{ minWidth: 120 }}><Eyebrow>Should read</Eyebrow></div>
                <div style={{ minWidth: 96 }}><Eyebrow>Is this correct?</Eyebrow></div>
              </div>

              {shown.map((it) => {
                const v = verdicts[it.id];
                return (
                  <div key={it.id} style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap",
                    padding: "10px 0", borderBottom: `1px solid ${T.rule}`,
                    background: v ? "transparent" : undefined }}>
                    <div style={{ flex: 1, minWidth: 220 }}>
                      <div style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text }}>{it.person}</div>
                      <div style={{ display: "flex", gap: 8, alignItems: "baseline", flexWrap: "wrap", marginTop: 3 }}>
                        <span style={{ fontFamily: T.mono, fontSize: 10, color: T.accent }}>{it.code}</span>
                        <span style={{ fontFamily: T.body, fontSize: 13, color: T.text }}>{it.title}</span>
                      </div>
                      <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, lineHeight: 1.6, marginTop: 4 }}>
                        {it.detail}
                      </div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginTop: 5 }}>
                        <Chip fg={it.source === "certificate" ? T.accent : T.bOrange}
                          bg={it.source === "certificate" ? T.accentSoft : T.raised}>
                          {it.source === "certificate" ? "from the certificate" : "from the filed spreadsheet"}
                        </Chip>
                        {it.certificate && (
                          <>
                            <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.muted, wordBreak: "break-word" }}>
                              {it.certificate.filename}
                            </span>
                            <OpenLink url={it.certificate.url} />
                          </>
                        )}
                      </div>
                    </div>
                    <div style={{ minWidth: 120, fontFamily: T.mono, fontSize: 11.5, color: T.muted }}>
                      {valueReads(it.sheetValue)}
                    </div>
                    <div style={{ minWidth: 120, fontFamily: T.mono, fontSize: 11.5, color: T.text }}>
                      {valueReads(it.proposed)}
                    </div>
                    <div style={{ minWidth: 96 }}>{yesNo(it)}</div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Nothing to decide, but worth knowing: what couldn't be read, what
              couldn't be matched to a person or an item, and the renewals. */}
          {notes.length > 0 && (
            <div style={{ marginBottom: 18 }}>
              <div style={{ marginBottom: 8 }}><Eyebrow>Noted, with nothing to change</Eyebrow></div>
              {notes.map((n, i) => (
                <div key={i} style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
                  padding: "6px 0", borderBottom: `1px solid ${T.rule}` }}>
                  <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, minWidth: 150 }}>{n.person || "—"}</span>
                  <span style={{ fontFamily: T.body, fontSize: 13, color: T.muted, flex: 1, minWidth: 220, lineHeight: 1.6 }}>{n.detail}</span>
                  {n.certificate && <OpenLink url={n.certificate.url} />}
                </div>
              ))}
            </div>
          )}

          {/* The gate: a spreadsheet is only offered once every difference has
              been answered, because a spreadsheet built from half a review is
              worse than no spreadsheet at all. */}
          {ready ? (
            <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.green}`,
              borderRadius: 2, padding: "15px 17px" }}>
              <Eyebrow color={T.green}>Every difference has been answered</Eyebrow>
              <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 9 }}>
                {items.length === 0
                  ? "Nothing needed changing. Generating the spreadsheet writes out the matrix as it stands and files it on the portal."
