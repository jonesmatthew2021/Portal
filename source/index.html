      {attention.length === 0 && (
        <div style={{ marginTop: 20, fontFamily: T.body, fontSize: 13, color: T.bGreen }}>
          Everything else is in order — spreadsheets fresh, files where they belong, no open questions.
        </div>
      )}
    </div>
  );
}

/* Crew Marine Certificates and Certificates Required, one tab. The same
   figures read two ways — by person, or by certificate — so they live behind
   one entry in the strip with the direction picked at the top of the page. */
const RANK_TO_PORTWAYS = VESSEL.rankToPortways;


/* Access grants — who may enter the portal and at what level.

   Three levels, enforced by the server on every request: IT Help runs
   everything including the maintenance machinery, Management runs everything
   but that machinery, and Crew reads and comments. Granting access here is
   all a new person needs — they sign in with their email and the code it
   receives; there is no password to hand out. Disabling a grant signs their
   devices out on the spot. */
const ACCESS_LEVELS = [
  { id: "crew", label: "Crew", blurb: "Reads everything, comments on posts. No Admin tab." },
  { id: "management", label: "Management", blurb: "Everything — uploads, checkers, rosters — except the portal's maintenance machinery." },
  { id: "it", label: "IT Help", blurb: "Everything, the machinery included. Only IT Help can grant IT Help." },
];


/* The company's SharePoint library, browsed live — the United Operations
   Team's real folders and files exactly as Teams holds them, one folder per
   request through the worker's Graph connection. */

/* What the phone's panel says when the reading after an upload failed.
   The file is on the books either way. A failure about the model's
   account - no credit, the rate, a busy model, the key - is nothing the
   crew member can act on and nothing wrong with the photo: the hour reads
   it once the account is in order, and that is all the panel says. Any
   other failure is said as it came. `kind` is read-one's word for it. */
function crewUploadNote(kind, message) {
  if (kind === "credit" || kind === "key" || kind === "rate" || kind === "busy") {
    return { phase: "Uploaded — will be read on the hour", note: "" };
  }
  return { phase: "Uploaded — not renamed", note: message || "" };
}

/* Upload Crew Certificates — the crew's own door. A name and a drop, and the
   file is filed into the company SharePoint under them, read, converted to
   PDF and named the way OPMS wants it; the window then hands the finished
   file back to save and upload to OPMS. */
function CrewCertificateUpload() {
  const { quals: QUALS, people } = usePortal();
  const names = useMemo(() => QUALS.rows.map((r) => r[0]), [QUALS]);
  /* Whose certificate this is, taken from who is signed in.
   *
   * A crew member reached this page with his own email, so there is nothing to
   * ask him: it is his certificate. It used to be a box he typed his name into,
   * seeded from his login and editable, so a certificate could be filed against
   * a man who was not the one uploading it - by a slip, or by somebody helping
   * a mate out - and nothing downstream could tell.
   *
   * The name is read through the crew register, so however the login spells him
   * he reaches the one name the portal knows him by. */
  const [typed, setTyped] = useState(SESSION_USER.name || "");
  const filedAs = useMemo(() => {
    const reg = crewRegister(people);
    const mine = reg.nameOf(SESSION_USER.name) || reg.nameOf(typed);
    if (mine) return mine;
    const c = canonicalName(typed);
    return c ? (matchRoster(c, names) || c) : "";
  }, [typed, names, people]);
  const [jobs, setJobs] = useState([]);
  const [open, setOpen] = useState(false);
  const [hot, setHot] = useState(false);
  const [nameErr, setNameErr] = useState("");
  const fileRef = useRef(null);
  const camRef = useRef(null);
  const [shots, setShots] = useState([]);
  const [retake, setRetake] = useState("");
  const patchJob = (key, p) => setJobs((js) => js.map((j) => (j.key === key ? { ...j, ...p } : j)));

  /* A photo straight off the phone: turned the right way up, brought down to
     a size that uploads quickly, re-saved as a JPEG, and measured for
     sharpness so a blurred shot is caught before it goes anywhere. */
  const takeIn = async (file) => {
    const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
    const scale = Math.min(1, 2200 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const small = document.createElement("canvas");
    const sw = 400, sh = Math.max(1, Math.round(canvas.height * (400 / canvas.width)));
    small.width = sw; small.height = sh;
    small.getContext("2d").drawImage(canvas, 0, 0, sw, sh);
    const px = small.getContext("2d").getImageData(0, 0, sw, sh).data;
    const g = new Float32Array(sw * sh);
    for (let i = 0; i < sw * sh; i++) g[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
    let sum = 0, sum2 = 0, n = 0;
    for (let y = 1; y < sh - 1; y++) for (let x = 1; x < sw - 1; x++) {
      const i = y * sw + x;
      const v = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - sw] - g[i + sw];
      sum += v; sum2 += v * v; n++;
    }
    const sharpness = n ? sum2 / n - (sum / n) * (sum / n) : 0;
    const blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.86));
    return { key: Date.now() + "-" + Math.random().toString(36).slice(2, 7), blob, preview: URL.createObjectURL(blob),
      blurry: sharpness < 30 };
  };

  const addShots = async (files) => {
    const list = [...files].filter((f) => f && f.size > 0);
    if (!list.length) return;
    setRetake("");
    const taken = [];
    for (const f of list) {
      try { taken.push(await takeIn(f)); } catch (e) { setRetake("That photo couldn't be opened. Take it again."); }
    }
    setShots((s) => [...s, ...taken]);
  };
  const dropShot = (key) => setShots((s) => s.filter((x) => x.key !== key));
  const clearShots = () => { shots.forEach((s) => URL.revokeObjectURL(s.preview)); setShots([]); };

  const uploadOne = (file, key) => new Promise((resolve) => {
    const fd = new FormData();
    if (Array.isArray(file)) {
      file.forEach((s, i) => fd.append("page", s.blob, `page-${i + 1}.jpg`));
      fd.append("pagesName", `${filedAs} - certificate photo`);
    } else {
      fd.append("file", file);
    }
    fd.append("category", "certificate");
    fd.append("person", filedAs);
    fd.append("uploadedBy", SESSION_USER.name || filedAs);
    fd.append("onDuplicate", "skip");
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/files");
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) patchJob(key, { pct: Math.round((e.loaded / e.total) * 45), phase: "Uploading to SharePoint" });
    };
    xhr.onload = () => {
      let body = {};
      try { body = JSON.parse(xhr.responseText || "{}"); } catch (e) {}
      resolve({ status: xhr.status, body });
    };
    xhr.onerror = () => resolve({ status: 0, body: {} });
    xhr.send(fd);
  });

  const run = async (files, fromCamera) => {
    if (!filedAs) { setNameErr("Type your name first."); return; }
    setNameErr("");
    const list = fromCamera ? [files] : [...files].filter((f) => f && f.size > 0);
    if (!list.length) return;
    const start = list.map((f, i) => ({ key: Date.now() + "-" + i,
      name: fromCamera ? `Photo · ${f.length} page${f.length === 1 ? "" : "s"}` : f.name, pct: 0, phase: "Waiting", done: false }));
    setJobs(start); setOpen(true);
    for (let i = 0; i < list.length; i++) {
      const key = start[i].key;
      const up = await uploadOne(list[i], key);
      if (up.status === 200 && up.body.skipped) {
        patchJob(key, { pct: 100, phase: "Already on file", done: true });
        continue;
      }
      if (up.status < 200 || up.status >= 300 || !up.body.record) {
        patchJob(key, { pct: 100, phase: "Failed", done: true, note: up.body.error || `Upload failed (${up.status || "no connection"})` });
        continue;
      }
      const rec = up.body.record;
      if (fromCamera) clearShots();
      patchJob(key, { pct: 50, phase: "Converting and reading the certificate" });
      let creep = 50;
      const timer = setInterval(() => { creep = Math.min(90, creep + 1); patchJob(key, { pct: creep }); }, 700);
      try {
        const r = await fetch("/api/certificates/read-one", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: rec.id, discardUnreadable: !!fromCamera }) });
        const out = await r.json();
        if (!r.ok) {
          clearInterval(timer);
          patchJob(key, { pct: 100, done: true, filename: rec.filename, url: rec.url,
            ...crewUploadNote(out.kind, out.error || `Reading failed (${r.status})`) });
          continue;
        }
        clearInterval(timer);
        if (out.discarded) {
          patchJob(key, { pct: 100, phase: "Not clear — take the photo again", done: true, failed: true, note: out.reason || "" });
          setRetake("The photo wasn't clear enough to read. Take it again.");
          continue;
        }
        patchJob(key, { pct: 100, phase: "Done", done: true, filename: out.filename, url: out.url, code: out.code,
          note: out.readable ? (out.code ? "" : "Certificate type not identified — name kept as uploaded.") : (out.reason || "Couldn't be read.") });
      } catch (e) {
        clearInterval(timer);
        patchJob(key, { pct: 100, phase: "Uploaded — not renamed", done: true, filename: rec.filename, url: rec.url, note: String(e.message || e) });
      }
    }
  };

  const save = async (j) => {
    const r = await fetch(j.url);
    if (!r.ok) throw new Error("The file couldn't be fetched (" + r.status + ").");
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = j.filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  const allDone = jobs.length > 0 && jobs.every((j) => j.done);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <SectionHead title="Upload Crew Certificates" />
        <a className="um-btn" href={VESSEL.links.opms} target="_blank" rel="noreferrer"
          style={{ background: T.accent, color: "#fff", border: `1px solid ${T.accent}`, fontSize: 11, fontWeight: 700,
            padding: "8px 13px", borderRadius: 2, textDecoration: "none", letterSpacing: "0.06em" }}>
          OPEN OPMS
        </a>
      </div>

      {/* Who it is filed against. A crew member signed in with his own email
          is not asked — it is his certificate. Management, and anyone the
          register does not recognise, still says who. */}
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 12 }}>
        {crewRegister(people).nameOf(SESSION_USER.name) ? (
          <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text }}>
            Filed against <b>{filedAs}</b>
          </div>
        ) : (
          <>
            <div style={{ flex: "1 1 260px" }}>
              <Field label="Your name">
                <input className="um-in" value={typed} placeholder="First name and surname"
                  onChange={(e) => setTyped(e.target.value)} />
              </Field>
            </div>
            <div style={{ fontFamily: T.mono, fontSize: 11.5, color: filedAs ? T.text : T.muted, paddingBottom: 9 }}>
              {filedAs ? `Filed as ${filedAs}` : ""}
            </div>
          </>
        )}
      </div>
      {nameErr && <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.bRed, marginBottom: 10 }}>{nameErr}</div>}

      <input ref={fileRef} type="file" multiple accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/*" style={{ display: "none" }}
        onChange={(e) => { run(e.target.files); if (fileRef.current) fileRef.current.value = ""; }} />
      <input ref={camRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }}
        onChange={(e) => { addShots(e.target.files); if (camRef.current) camRef.current.value = ""; }} />

      <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 3, padding: "14px 16px", marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
          <Button onClick={() => camRef.current && camRef.current.click()}>
            {shots.length ? "Take the next page" : "Take a photo"}
          </Button>
          {shots.length > 0 && !shots.some((s) => s.blurry) && (
            <Button variant="ghost" onClick={() => run(shots, true)}>
              Upload {shots.length} page{shots.length === 1 ? "" : "s"} as one certificate
            </Button>
          )}
          {shots.length > 0 && <Button variant="quiet" onClick={clearShots}>Discard photos</Button>}
        </div>
        {retake && <div style={{ fontFamily: T.body, fontSize: 13, fontWeight: 600, color: T.bRed, marginTop: 10 }}>{retake}</div>}
        {shots.length > 0 && (
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 12 }}>
            {shots.map((s, i) => (
              <div key={s.key} style={{ width: 96 }}>
                <div className="um-shot" style={{ outline: s.blurry ? `3px solid ${T.bRed}` : "none" }}>
                  <img src={s.preview} alt="" />
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 10.5, color: s.blurry ? T.bRed : T.muted, marginTop: 4, textAlign: "center" }}>
                  {s.blurry ? "Not clear — retake" : `Page ${i + 1}`}
                </div>
                <div style={{ textAlign: "center", marginTop: 2 }}>
                  <a style={{ fontFamily: T.body, fontSize: 11.5, color: T.accent, cursor: "pointer" }} onClick={() => dropShot(s.key)}>Remove</a>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="um-drop"
        onDragOver={(e) => { e.preventDefault(); setHot(true); }}
        onDragLeave={() => setHot(false)}
        onDrop={(e) => { e.preventDefault(); setHot(false); run(e.dataTransfer.files); }}
        onClick={() => fileRef.current && fileRef.current.click()}
        style={{ border: `2px dashed ${hot ? T.accent : T.rule}`, borderRadius: 3, background: hot ? T.raised : T.panel,
          padding: "34px 16px", textAlign: "center", cursor: "pointer", marginBottom: 18 }}>
        <div className="um-cue" style={{ fontFamily: T.display, fontSize: 14, fontWeight: 700, color: T.text, letterSpacing: "0.04em" }}>
          Drop certificates here
        </div>
        <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 6 }}>or press to choose files · PDF or photo · 5 MB each</div>
      </div>

      {open && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(22,50,74,0.45)", zIndex: 60,
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderTop: `4px solid ${T.accent}`,
            borderRadius: 3, padding: "22px 26px", width: "min(600px, 94vw)", maxHeight: "84vh", overflowY: "auto" }}>
            <Eyebrow color={T.accent}>{allDone ? "Finished" : "Uploading"}</Eyebrow>
            {jobs.map((j) => (
              <div key={j.key} style={{ padding: "12px 0", borderBottom: `1px solid ${T.rule}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12 }}>
                  <span style={{ fontFamily: T.body, fontSize: 13.5, fontWeight: 600, color: T.text, minWidth: 0,
                    overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{j.filename || j.name}</span>
                  <span style={{ fontFamily: T.display, fontSize: 22, fontWeight: 700, color: T.text }}>{j.pct}%</span>
                </div>
                <div style={{ height: 7, background: T.raised, borderRadius: 4, overflow: "hidden", margin: "8px 0 6px" }}>
                  <div style={{ height: "100%", width: `${j.pct}%`, background: j.failed || (j.note && j.phase === "Failed") ? T.bRed : T.accent,
                    transition: "width .4s" }} />
                </div>
                <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted }}>{j.phase}{j.note ? ` · ${j.note}` : ""}</div>
                {j.done && j.url && (
                  <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap", marginTop: 10 }}>
                    <span style={{ fontFamily: T.body, fontSize: 13, color: T.text }}>Save this document for upload to OPMS</span>
                    <Button onClick={() => save(j)}>Save to this device</Button>
                  </div>
                )}
              </div>
            ))}
            {allDone && (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, marginTop: 14 }}>
                <span style={{ fontFamily: T.body, fontSize: 14, fontWeight: 700, color: T.teal }}>Upload successfully completed</span>
                <Button variant="quiet" onClick={() => { setOpen(false); setJobs([]); }}>Close</Button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* The Marine Fauna Observation Log: the phone app at /fauna/, shown here as
   it is, behind the same sign-in. Who may make entries is the app's own rule
   - the Master, the Chief Officer or the Second Officer, by their rank on
   Crew Details - decided on the server for the phone and this tab alike;
   everyone else reads the month and can send it on. The offline preview has
   no worker behind it, so there the tab points at the live portal. */
function FaunaLog() {
  const [there, setThere] = React.useState(null);
  React.useEffect(() => {
    let live = true;
    fetch("/fauna/manifest.webmanifest", { method: "HEAD", cache: "no-store" })
      .then((r) => { if (live) setThere(r.ok); })
      .catch(() => { if (live) setThere(false); });
    return () => { live = false; };
  }, []);
  return (
    <div>
      <SectionHead title="Fauna Log" />
      {there === false ? (
        <Empty>The Fauna Log runs on the live portal: <a href={`https://${VESSEL.domain}/fauna/`} style={{ color: T.accent }}>{VESSEL.domain}/fauna</a></Empty>
      ) : (
        <iframe title="Fauna Log" src="/fauna/"
          style={{ width: "100%", height: "calc(100vh - 150px)", minHeight: 620, border: `1px solid ${T.rule}`,
            borderRadius: 2, background: "#F2F6F9", display: "block" }} />
      )}
    </div>
  );
}

/* The Admin tab's own pages. Kept as a list so the strip that switches between
   them and the page that is rendered can't disagree about what exists. */
const ADMIN_PAGES = [
  { id: "crew-details", label: "Crew Details" },
  { id: "swings", label: "Swings" },
  { id: "documents", label: "Documents" },
  { id: "elearning", label: "E-Learning Status" },
  { id: "opms", label: "OPMS Checker" },
  { id: "portways-docs", label: VESSEL.labels.portwaysDocs },
  { id: "ai-checker", label: "AI Checker" },
  { id: "access", label: "Access Grants" },
];

/* Pages that have been folded into another. The page somebody was on is
   remembered by id, so a browser that remembers one of these lands on the
   page that replaced it rather than on Crew Details. */
const ADMIN_PAGE_MOVED = {
  "swing-allocation": "swings",
  "swing-compliance": "swings",
  "required-docs": "documents",
  "sharepoint": "documents",
  "checker": "access",
};

function Admin({ currentUser, people, setPeople, overrides, setOverrides, swingBoard, setSwingBoard, notes, corrCount, history, allTabs, hiddenTabs, onHideTab, onRestoreTab, onRestoreAllTabs, files, sync, log }) {
  // The Admin tab is eight pages now, not one: the documents the portal has to
  // be given, the certification work it started as, the pages that were being
  // asked for around them, and the AI Checker — moved here from the crew tab
  // bar so it sits with the rest of the admin tooling. The page is remembered
  // here so switching between them doesn't reset the screen underneath.
  // Uploads come first — a portal with nothing filed can do nothing else on
  // this tab.
  // An id is only worth remembering if it is a page, or moved to one — so
  // nothing odd in the browser's storage can leave the tab blank.
  const isPage = (v) => ADMIN_PAGES.some((p) => p.id === v);
  const movedTo = (v) => (Object.prototype.hasOwnProperty.call(ADMIN_PAGE_MOVED, v) ? ADMIN_PAGE_MOVED[v] : null);
  const [heldPage, setPage] = useRemembered("admin-page", "crew-details",
    (v) => isPage(v) || isPage(movedTo(v)));
  const page = isPage(heldPage) ? heldPage : isPage(movedTo(heldPage)) ? movedTo(heldPage) : "crew-details";

  if (!isAdmin(currentUser)) {
    return (
      <div>
        <SectionHead title="Admin" />
        <Empty>You don't have admin access. Ask the Master if you need something changed.</Empty>
      </div>
    );
  }

  const stat = (label, value) => (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 2, padding: "11px 14px", flex: "1 1 150px" }}>
      <Eyebrow>{label}</Eyebrow>
      <div style={{ fontFamily: T.display, fontSize: 28, fontWeight: 700, color: T.text, marginTop: 8, lineHeight: 1 }}>{value}</div>
    </div>
  );

  return (
    <div>
      <SectionHead title="Admin" meta={`Signed in as ${currentUser}`} />

      {/* Sections removed here disappear for the whole crew, and it is the first
          thing anyone asks about when the portal looks empty — so it is said at
          the top of this tab, with the way back next to it, rather than only in
          the list further down. */}
      {hiddenTabs.length > 0 && (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 16, flexWrap: "wrap",
          background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.bOrange}`,
          borderRadius: 2, padding: "14px 16px", marginBottom: 18 }}>
          <span style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.6 }}>
            {hiddenTabs.length === allTabs.length
              ? "Every section is hidden, so the crew are seeing an empty portal. Nothing has been deleted."
              : `${hiddenTabs.length} of ${allTabs.length} sections are hidden from everyone. Nothing in them has been deleted.`}
          </span>
          <Button onClick={onRestoreAllTabs}>Restore all sections</Button>
        </div>
      )}

      {/* The pages of the Admin tab. The documents the portal has to be given
          are the first of them, and the certification work that reads those
          documents follows.

          These wrap onto as many rows as they need rather than scrolling
          sideways. The labels want about 1150px and a phone gives the strip
          about 350px, so as a single scrolling row the last few sat off the
          edge of the screen with nothing to say they were there - and the one
          button still in reach was the page already showing, so tapping it did
          nothing. Seven buttons, none of which appeared to do anything. */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 20,
        borderBottom: `1px solid ${T.rule}` }}>
        {ADMIN_PAGES.map((p) => {
          const on = page === p.id;
          return (
            <button key={p.id} className="um-btn um-tab" onClick={() => setPage(p.id)}
              aria-pressed={on}
              style={{ background: on ? T.panel : "transparent", color: on ? T.text : T.muted,
                fontSize: 11.5, fontWeight: 700, padding: "10px 12px",
                borderBottom: `3px solid ${on ? T.accent : "transparent"}` }}>
              {p.label}
            </button>
          );
        })}
      </div>

      {page === "crew-details" && <CrewDetails />}
      {page === "documents" && <RequiredDocuments />}
      {page === "elearning" && <ELearningStatus />}
      {/* One page for the swing: the legend, the compliance cards — the swing
          that is on and the ones coming — then the board, which follows
          whichever card is clicked, then the compliance details read against
          it and the swing report. */}

function NotifyToggle({ log, on, setOn, count = 0 }) {
  const supported = typeof window !== "undefined" && "Notification" in window;
  const [blocked, setBlocked] = useState(() => supported && Notification.permission === "denied");
  const state = !supported ? "unsupported" : blocked ? "blocked" : on ? "on" : "off";

  const label = { on: "Notifications on", off: "Notifications off", blocked: "Notifications blocked in your browser settings", unsupported: "Notifications aren't supported on this device" }[state];

  const toggle = async () => {
    if (state === "unsupported" || state === "blocked") return;
    if (state === "on") {
      setOn(false);
      log("Admin", "Turned notifications off");
      return;
    }
    let perm = Notification.permission;
    if (perm === "default") {
      try { perm = await Notification.requestPermission(); } catch (e) { perm = "denied"; }
    }
    if (perm === "granted") {
      setOn(true);
      log("Admin", "Turned notifications on");
      try { new Notification(`${VESSEL.name} ${VESSEL.nameAccent}`, { body: "You'll be told when notes are filed or the roster changes." }); } catch (e) {}
    } else {
      setBlocked(true);
    }
  };

  const dim = state === "blocked" || state === "unsupported";

  return (
    <span style={{ position: "relative", display: "inline-block" }}>
    <button className="um-btn" onClick={toggle} title={label} aria-label={label} aria-pressed={state === "on"}
      style={{
        background: state === "on" ? T.accentSoft : "transparent",
        border: `1px solid ${state === "on" ? T.accent : T.rule}`,
        borderRadius: 2, padding: "8px 10px", lineHeight: 0,
        cursor: dim ? "default" : "pointer", opacity: dim ? 0.4 : 1,
      }}>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke={state === "on" ? T.accent : T.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        {state !== "on" && <line x1="3" y1="3" x2="21" y2="21" stroke={T.muted} />}
      </svg>
    </button>
    {count > 0 && (
      <span style={{ position: "absolute", top: -6, right: -7, background: T.bRed, color: "#fff",
                     fontFamily: T.mono, fontSize: 10, fontWeight: 600, minWidth: 17, height: 17,
                     borderRadius: 9, padding: "0 4px", display: "flex", alignItems: "center",
                     justifyContent: "center", border: `2px solid ${T.deep}` }}>
        {count > 99 ? "99+" : count}
      </span>
    )}
    </span>
  );
}

class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return (
        <div style={{ fontFamily: "ui-monospace, monospace", color: "#fff", background: "#8A1E15",
          padding: "18px 22px", fontSize: 13, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
          {"SOMETHING BROKE - screenshot this and send it over\n\n" + String(this.state.err.message)}
        </div>
      );
    }
    return this.props.children;
  }
}

/* A piece of screen state that survives the page reloading itself — which
   main tab is open, which Admin page — so a refresh (or the live preview
   putting an edit up) lands back where the reader was, not on the front page.
   Kept per-tab in sessionStorage, the same as the sign-in; `ok` guards
   against a stored value that no longer names a real page. */
function useRemembered(key, initial, ok) {
  const [v, setV] = useState(() => {
    try {
      const held = sessionStorage.getItem("um-ui-" + key);
      if (held && (!ok || ok(held))) return held;
    } catch (e) {}
    return initial;
  });
  const set = (next) => {
    try { sessionStorage.setItem("um-ui-" + key, next); } catch (e) {}
    setV(next);
  };
  return [v, set];
}

function Portal({ role, onSignOut }) {

    swingDates: {},

    certAnalysis: null,

    // "PERSON::CODE". The certification screens' date columns read from here.
    // Shared, because the dates belong to the certificates rather than to
    // whoever pressed Update matrix.
    certDates: null,

    // what the Module validity column on the E-Learning Status page shows.
    // Shared like the dates above: the periods belong to the document, not to
    // whoever fetched them.
    validityPeriods: null,

    // held against each other. Shared for the same reason: the answer belongs to
    // the vessel, not to whoever happened to press the button.
    matrixAnalysis: null,
