    correspondence: SEED.correspondence,
    pwCorrespondence: SEED.portwaysCorrespondence,
    appSuggestions: SEED.appSuggestions,
    docs: SEED.docs,
    people: SEED.people,
    overrides: {},
    // Who is onboard and which watch they are on, as somebody put it there —
    // side and shift, both keyed by person. Empty until the crew rosters page
    // is first used, and until then the board falls back to the swing pattern.
    swingBoard: { side: {}, shift: {} },
    // Each coming swing's own board, keyed by swing number — the same side and
    // shift shape as the live board, so a swing picked on the Swing Compliance
    // cards can be worked ahead of time: people put on and off it, watches set.
    // Anyone a swing's board doesn't mention follows the rotation and its
    // one-off changes, and a board for a swing already gone is dropped.
    swingBoards: {},
    // The two swing lists as the office sends them — one document each for Alpha
    // and Bravo, kept whole so the crew can be shown exactly as the document
    // wrote them, in order of rank.
    swingLists: { A: null, B: null },
    // The dates the office has given for a swing, kept against the swing number.
    // Empty until somebody types one in on Swing Compliance, and every swing
    // nobody has touched follows the four-week pattern as it always did. Shared,
    // because the dates the check is read against belong to the vessel rather
    // than to whoever typed them.
    swingDates: {},
    // The pattern those swings are worked out from: the first onswing's day out
    // and the days per swing. Four weeks, Wednesday to Wednesday, from
    // 12 Aug 2026 — until somebody moves it on Swing Compliance.
    rosterPattern: { ...ROSTER_DEFAULTS },
    history: SEED.history,
    comments: {},
    hiddenTabs: [],
    quals: QUALS,
    matrixArchive: [],
    certificates: [],
    certSheet: null,
    // The last certificate analysis: what was read off the certificates, where
    // it disagreed with the spreadsheets, and the yes or no an admin has given
    // each disagreement. Shared, so one admin can pick up the review where
    // another left it rather than starting again in their own browser.
    certAnalysis: null,
    // The issue and expiry dates read off the certificates on file, keyed
    // "PERSON::CODE". The certification screens' date columns read from here.
    // Shared, because the dates belong to the certificates rather than to
    // whoever pressed Update table.
    certDates: null,
    // How long each item stays valid, as the validity periods matrix lists it —
    // what the Module validity column on the E-Learning Status page shows.
    // Shared like the dates above: the periods belong to the document, not to
    // whoever fetched them.
    validityPeriods: null,
    // The last reading of the training matrix and the skills matrix, and the two
    // held against each other. Shared for the same reason: the answer belongs to
    // the vessel, not to whoever happened to press the button.
    matrixAnalysis: null,
    // The last comparison of the rostered crew against the office's shift
    // allocation sheet, from the Swing Compliance page. Shared, same as above.
    shiftAnalysis: null,
    // The last swing compliance report generated at the bottom of the Swing
    // Compliance page — one swing's roster read whole against the crew matrix
    // spreadsheets and the certificates on file, written down so the answer is
    // on the page for whoever opens it next. Shared, same as above.
    swingReport: null,
    // The day the matrix was last rebuilt from a spreadsheet. Shared, so it
    // reads the same for everyone rather than per browser.
    matrixUpdated: "",
  });

  const [sync, setSync] = useState({ state: "loading" });
  const [loaded, setLoaded] = useState(false);
  const [files, setFiles] = useState({ state: "loading" });
  const [retry, setRetry] = useState(0);
  const rev = useRef(0);
  const dirty = useRef(new Set());
  const saving = useRef(false);
  const firstLoad = useRef(true);
  const storedFiles = useRef([]);

  // One setter per slice, so the rest of the app is unchanged. Which slices were
  // touched is remembered, not just that something was: if two people save at
  // the same moment, only the parts each of them actually changed are carried
  // over, so a roster edit and a posted note can't wipe each other out.
  const put = (key) => (v) => {
    dirty.current.add(key);
    setStore((s) => ({ ...s, [key]: typeof v === "function" ? v(s[key]) : v }));
  };
  const notes = store.notes,               setNotes = put("notes");
  const suggestions = store.suggestions,   setSuggestions = put("suggestions");
  const correspondence = store.correspondence, setCorrespondence = put("correspondence");
  const pwCorrespondence = store.pwCorrespondence, setPwCorrespondence = put("pwCorrespondence");
  const appSuggestions = store.appSuggestions, setAppSuggestions = put("appSuggestions");
  const people = store.people,             setPeople = put("people");
  const overrides = store.overrides,       setOverrides = put("overrides");
  const swingBoard = store.swingBoard || { side: {}, shift: {} }, setSwingBoard = put("swingBoard");
  const swingBoards = store.swingBoards || {}, setSwingBoards = put("swingBoards");
  const swingLists = store.swingLists || { A: null, B: null }, setSwingLists = put("swingLists");
  const swingDates = store.swingDates || {}, setSwingDates = put("swingDates");
  // The swing pattern, merged over the defaults so a portal saved before the
  // pattern could be moved still runs four weeks from 12 Aug 2026. The two
  // module-level values everything reads (ROSTER_ANCHOR, CYCLE) are re-pointed
  // here — during render, before any child works a swing out — so the whole
  // portal follows a move at once, and falls back to the defaults while a box
  // is half-typed rather than working swings out from nonsense.
  const rosterPattern = { ...ROSTER_DEFAULTS, ...(store.rosterPattern || {}) };
  const setRosterPattern = put("rosterPattern");
  ROSTER_ANCHOR = /^\d{4}-\d{2}-\d{2}$/.test(rosterPattern.anchor || "")
    ? rosterPattern.anchor : ROSTER_DEFAULTS.anchor;
  CYCLE = Number(rosterPattern.cycle) > 0 ? Math.round(Number(rosterPattern.cycle)) : ROSTER_DEFAULTS.cycle;
  const history = store.history,           setHistory = put("history");
  const comments = store.comments,         setComments = put("comments");
  const hiddenTabs = store.hiddenTabs,     setHiddenTabs = put("hiddenTabs");
  // Requirement rows are dropped here rather than on each screen, so the crew
  // are the same forty people wherever they are counted — the matrix, the
  // certificate lists, the reports and what is sent away to be compared.
  const quals = crewRowsOnly(store.quals || QUALS), setQuals = put("quals");
  const docs = store.docs,                 setDocs = put("docs");
  // Matrix spreadsheets filed before the portal kept the date itself. Nothing
  // writes to this any more — it is read only so that a matrix updated back then
  // still shows a date rather than nothing.
  const matrixArchive = store.matrixArchive;
  const certificates = store.certificates || [];
  const certSheet = store.certSheet || null;
  // Falls back to the newest spreadsheet on file, so a matrix updated before
  // this was recorded still shows a date rather than nothing.
  const matrixUpdated =
    store.matrixUpdated || (matrixArchive && matrixArchive[0] ? matrixArchive[0].uploaded : "");
  const setMatrixUpdated = put("matrixUpdated");
  const certAnalysis = store.certAnalysis || null;
  const setCertAnalysis = put("certAnalysis");
  // The dates the certificates on file carry — issued and expires, keyed
  // "PERSON::CODE" — for the date columns on the certification screens. Each
  // entry also carries the issuing authority as it was read off the scan (for
  // the not-Australian flag on the checker) and a link to the scan itself, so
  // the Certificate column on those screens can open the certificate.
  const certDates = store.certDates || null;
  const setCertDates = put("certDates");
  // The standing notes on the certification pages. Held in the shared state so
  // an admin can add or reword one and every device reads the same list; the
  // built-in notes seed it until somebody edits.
  const certNotes = store.certNotes || CERT_PAGE_NOTES;
  const setCertNotes = put("certNotes");
  // What has been done about each OPMS disagreement, keyed by the finding —
  // "sent" (reported to OPMS, with the date) or "fixed" (corrected on our
  // side). Shared, so the same item isn't chased twice by two admins, and so
  // next week's run remembers what was already dealt with.
  const opmsMarks = store.opmsMarks || {};
  const setOpmsMarks = put("opmsMarks");
  // What is being done about each certificate that has gone red — booked,
  // chased, or evidence in hand — keyed "PERSON::CODE". Each mark carries the
  // day it was made, who made it, and a one-line note. Shared, so every admin
  // sees what is already in motion and nothing is chased twice. Marks need no
  // tidying up: once the renewal is filed and the item leaves the red lists,
  // the mark has nowhere left to show.
  const renewalMarks = store.renewalMarks || {};
  const setRenewalMarks = put("renewalMarks");
  const validityPeriods = store.validityPeriods || null;
  const setValidityPeriods = put("validityPeriods");
  const refreshCertDates = async () => {
    // The validity periods ride along with the dates: both are readings the
    // server already holds, and every place that wants one fresh wants the other.
    try {
      const [r, v] = await Promise.all([
        analyse({ action: "dates" }),
        analyse({ action: "validity-periods" }).catch(() => null),
      ]);
      const map = {};
      (r.dates || []).forEach((d) => {
        map[`${d.person}::${d.code}`] = {
          issued: d.issued || null,
          expires: d.expires || null,
          issuer: d.issuer || null,
          url: d.fileId ? `/api/files/${d.fileId}` : null,
        };
      });
      setCertDates({ at: r.at || new Date().toISOString(), map });
      if (v) {
        setValidityPeriods({
          at: new Date().toISOString(),
          filename: v.filename || null,
          read: v.read !== false,
          periods: v.periods || [],
        });
      }
    } catch (e) {
      // The columns keep showing whatever they had; the next run asks again.
    }
  };
  // The two required matrices, the validity periods matrix read alongside them,
  // and the last answer the AI gave on them.
  const trainingMatrix = store.trainingMatrix || null;
  const skillsMatrix = store.skillsMatrix || null;
  // The validity periods ride on the skills matrix — the office folded the old
  // separate validity spreadsheet into it — so whatever skills matrix is on
  // file is also the validity periods document. The newest upload is always
  // the source; there is no second file to keep in step.
  const validityMatrix = store.skillsMatrix || null;
  const matrixAnalysis = store.matrixAnalysis || null;
  const setMatrixAnalysis = put("matrixAnalysis");
  // The latest spreadsheet out of OPMS, which the OPMS Checker reads from, and the
  // last answer the AI gave on it. The answer is kept with everything else the
  // portal shares, so it is on the page for whoever opens it next rather than
  // only for the admin who pressed the button.
  const opmsSheet = store.opmsSheet || null;
  const opmsAnalysis = store.opmsAnalysis || null;
  const setOpmsAnalysis = put("opmsAnalysis");
  // The office's shift allocation sheet, and the last answer the AI gave on it
  // against the swing roster. Shared like the others: the answer belongs to the
  // vessel rather than to whoever pressed the button.
  const shiftAllocation = store.shiftAllocation || null;
  const shiftAnalysis = store.shiftAnalysis || null;
  const setShiftAnalysis = put("shiftAnalysis");
  // The last swing compliance report, generated at the bottom of the Swing
  // Compliance page and shared like every other answer on the portal.
  const swingReport = store.swingReport || null;
  const setSwingReport = put("swingReport");

  // Files are the one thing that is always kept on the server. This used to run
  // once and never again, so a document someone else uploaded stayed invisible
  // until the page was reloaded — on a phone, where the portal is left open in a
  // tab for weeks, that could be days late. It now refreshes on the same footing
  // as everything else, and again the moment the phone comes back to it.
  React.useEffect(() => {
    let alive = true;
    let busy = false;
    let seen = null;

    const pullFiles = async () => {
      if (busy) return;
      busy = true;
      try {
        const items = await fetchStoredFiles();
        if (!alive) return;
        setFiles((f) => (f.state === "ok" && f.count === items.length ? f : { state: "ok", count: items.length }));

        // Most polls find exactly what the last one did. Leaving the page alone
        // in that case keeps a repost from landing on top of someone typing. The
        // fingerprint carries the filename and the folder as well as the id,
        // because a certificate moved into another person's folder is the same
        // file in a different place and has to reach the page as a change.
        const listing = items.map((i) => {
          const r = i.record || {};
          return `${r.id || ""}|${r.filename || ""}|${r.folder || ""}|${r.person || ""}|${r.uploaded || ""}`;
        }).join(",");
        if (listing === seen) return;
        seen = listing;

        storedFiles.current = items;
        setStore((s) => withStoredFiles(s, items));
      } catch (e) {
        if (alive) setFiles({ state: "error", msg: e.message });
      } finally {
        busy = false;
      }
    };

    pullFiles();
    const id = setInterval(pullFiles, FILES_POLL_MS);
    const stopWatching = onWake(pullFiles);
    return () => { alive = false; clearInterval(id); stopWatching(); };
  }, []);

  // Load once, then keep checking for other people's changes.
  React.useEffect(() => {
    let alive = true;
    let busy = false;

    const pull = async () => {
      // A poll and a wake-up can land together. One at a time is enough.
      if (busy) return;
      busy = true;
      try {
        const { rev: serverRev, data } = await loadState();
        if (!alive) return;

        if (data && serverRev > rev.current && dirty.current.size === 0) {
          rev.current = serverRev;
          // Files always come from the file store, never from this document.
          setStore(withStoredFiles(data, storedFiles.current));
        } else if (!data && firstLoad.current) {
          // Nothing has ever been saved — put what the portal starts with on the
          // server so there is something for everyone else to load.
          const seeded = await saveState(withoutStoredFiles(store), 0);
          rev.current = seeded.rev;
          // Somebody beat us to it by a fraction of a second. Theirs wins.
          if (seeded.conflict && seeded.data) {
            setStore(withStoredFiles(seeded.data, storedFiles.current));
          }
        }
        // The server has answered, so what is on screen from here is the shared
        // copy. Until this happens the portal is only holding the content it
        // ships with, which must never be shown as though it were the crew's.
        if (alive) setLoaded(true);
        if (alive) setSync({ state: "ok", at: new Date().toISOString().slice(11, 16) });
      } catch (e) {
        if (alive) setSync({ state: "error", msg: e.message });
      } finally {
        busy = false;
      }
      // Anything changed before the first load finished was held back rather
      // than saved on top of nothing. Let it go up now.
      if (firstLoad.current) {
        firstLoad.current = false;
        if (alive && dirty.current.size > 0) setRetry((n) => n + 1);
      }
    };

    pull();
    const id = setInterval(pull, POLL_MS);
    const stopWatching = onWake(pull);
    return () => { alive = false; clearInterval(id); stopWatching(); };
  }, []);

  // Push local changes up, shortly after they stop coming.
  React.useEffect(() => {
    if (firstLoad.current || dirty.current.size === 0) return;

    const id = setTimeout(async () => {
      // A save is already on its way. Come back once it has landed rather than
      // running two saves at each other.
      if (saving.current) { setRetry((n) => n + 1); return; }
      saving.current = true;

      const touched = [...dirty.current];
      try {
        const mine = withoutStoredFiles(store);
        let res = await saveState(mine, rev.current);

        if (res.conflict) {
          // Someone saved while this was being typed. Rather than throw either
          // version away, take theirs and lay only the slices touched here back
          // on top of it.
          const merged = { ...(res.data || mine) };
          touched.forEach((k) => { merged[k] = store[k]; });
          res = await saveState(withoutStoredFiles(merged), res.rev);

          if (!res.conflict) {
            setStore((s) => {
              const next = { ...merged };
              // Anything edited while the save was in flight stays as it is here.
              dirty.current.forEach((k) => { next[k] = s[k]; });
              return withStoredFiles(next, storedFiles.current);
            });
          }
        }

        if (res.conflict) {
          // Two collisions in a row. The change is still pending, so try again.
          setSync({ state: "error", msg: "Someone else saved at the same moment - trying again" });
          setTimeout(() => setRetry((n) => n + 1), 1200);
          return;
        }

        rev.current = res.rev;
        touched.forEach((k) => dirty.current.delete(k));
        setSync({ state: "ok", at: new Date().toISOString().slice(11, 16) });
      } catch (e) {
        setSync({ state: "error", msg: e.message });
      } finally {
        saving.current = false;
      }
    }, SAVE_MS);

    return () => clearTimeout(id);
  }, [store, retry]);

  // Unread counts per section, so tabs can show a dot and the app icon a number.
  const [unread, setUnread] = useState({});
  const unreadTotal = Object.values(unread).reduce((a, b) => a + b, 0);

  // Paint the number on the installed app's icon, the way any other app does.
  // Only works once the portal is installed to the home screen. On iOS this
  // hands back a promise that is rejected whenever the badge isn't allowed,
  // which try/catch never sees — so it is turned down here rather than left to
  // surface as an unexplained failure.
  React.useEffect(() => {
    if (typeof navigator === "undefined") return;
    const quietly = (p) => { if (p && p.catch) p.catch(() => {}); };
    try {
      if (unreadTotal > 0 && navigator.setAppBadge) quietly(navigator.setAppBadge(unreadTotal));
      else if (navigator.clearAppBadge) quietly(navigator.clearAppBadge());
    } catch (e) {}
  }, [unreadTotal]);
  const admin = isAdmin(currentUser);

  // The date columns on the certification screens fill themselves in on first
  // load where certificates have already been read but nobody has pressed
  // Update table on this portal yet. Once, and only for an admin — the answer
  // is shared, so after that everyone reads what is already held.
  const askedCertDates = useRef(false);
  React.useEffect(() => {
    if (!loaded || !admin || askedCertDates.current || (store.certDates && store.validityPeriods)) return;
    askedCertDates.current = true;
    refreshCertDates();
  }, [loaded, admin]);

  const removeDoc = (key, doc, label) => {
    // A section added after the state was first saved has no list yet, so an
    // absent one reads as empty rather than breaking the page.
    setDocs((d) => ({ ...d, [key]: (d[key] || []).filter((x) => x.id !== doc.id) }));
    deleteStoredFile(doc, currentUser);
    log(label, `Removed "${doc.title}"`, `${doc.from} · restore it from the Admin tab`);
  };

  const addDoc = (key, doc, label) => {
    setDocs((d) => ({ ...d, [key]: [doc, ...(d[key] || [])] }));
    log(label, "Posted a document", `${doc.title} · ${doc.from}`);
  };

  // Certificates live in the file store too, one folder per person. Replacing an
  // existing one takes the old record off the page as the new one goes on.
  const addCertificates = (records, replacedIds = []) =>
    setStore((s) => ({
      ...s,
      certificates: [
        ...records,
        ...(s.certificates || []).filter((c) => !replacedIds.includes(c.id)),
      ],
    }));

  const removeCertificate = (cert) => {
    setStore((s) => ({ ...s, certificates: (s.certificates || []).filter((c) => c.id !== cert.id) }));
    deleteStoredFile(cert, currentUser);
    log("Admin", `Removed a certificate for ${cert.person}`, `${cert.filename} · restore it from the Admin tab`);
  };

  // A certificate whose details were corrected — the code it answers to, the
  // date it expires. The server row has already been changed; this puts the same
  // change on the page rather than waiting for the next poll.
  const updateCertificate = (id, fields) =>
    setStore((s) => ({
      ...s,
      certificates: (s.certificates || []).map((c) => (c.id === id ? { ...c, ...fields } : c)),
    }));

  // A certificate read as belonging to someone else has already been moved on the
  // server. This puts the same move on the page rather than waiting for the next
  // poll to notice a file that has the same id in a different folder.
  const refileCertificates = (moved) =>
    setStore((s) => {
      const by = new Map(moved.map((m) => [m.id, m]));
      return {
        ...s,
        certificates: (s.certificates || []).map((c) => {
          const m = by.get(c.id);
          return m ? { ...c, person: m.to, folder: m.folder, filename: m.filename } : c;
        }),
      };
    });

  // One spreadsheet at a time: a new one takes the place of whatever was there.
  const setCertSheet = (record) => setStore((s) => ({ ...s, certSheet: record }));

  // The same for the two matrices. These are file records rather than typed
  // content, so they are set straight onto the store without being marked dirty —
  // the server already holds them, and the next file poll would say the same.
  const setTrainingMatrix = (record) => setStore((s) => ({ ...s, trainingMatrix: record }));
  const setSkillsMatrix = (record) => setStore((s) => ({ ...s, skillsMatrix: record }));
  const setOpmsSheet = (record) => setStore((s) => ({ ...s, opmsSheet: record }));
  const setShiftAllocation = (record) => setStore((s) => ({ ...s, shiftAllocation: record }));

  // Single place every section reports changes to — and the one hook that
  // fires a notification, so anything logged is something crew can be told about.
  const log = (section, action, detail = "") => {
    setHistory((h) => [
      { id: "h" + Date.now() + Math.random(), at: new Date().toISOString().slice(0, 16), by: currentUser, section, action, detail },
      ...h,
    ].slice(0, HISTORY_LIMIT));
    if (section !== "Admin") {
      setUnread((u) => ({ ...u, [section]: (u[section] || 0) + 1 }));
    }
    if (notifyOn && section !== "Admin" && typeof Notification !== "undefined" && Notification.permission === "granted") {
      try { new Notification(section, { body: action, tag: section }); } catch (e) {}
    }
  };

  // ---- bringing the crew matrix up to date on its own -----------------------
  //
  // One run, shared by everything that changes what the matrix is built from.
  // Filing certificates has always set it going; replacing the crew
  // certificates spreadsheet or the validity periods matrix now does too, so
  // the matrix follows whichever of its inputs moved without anyone running
  // anything. Only what a certificate settles is written — a difference no
  // scan covers still goes to the certificate review to be answered by hand.
  //
  // The run lives here rather than on a screen so any of them can set it
  // going, it keeps going when the admin moves to another tab, and it is
  // watched from the one window (MatrixAutoWindow) wherever they are.
  const [matrixAuto, setMatrixAuto] = useState(null);
  const clearMatrixAuto = () => setMatrixAuto(null);

  // What the run reads is what is on the page at the moment it reads it, not
  // at the moment it was set going several renders earlier.
  const matrixAutoInputs = useRef(null);
  matrixAutoInputs.current = { quals, certSheet, validityMatrix };

  // One run at a time. A change landing mid-run is remembered and run once the
  // current one finishes, because a run that started before the change can't
  // have counted it.
  const matrixAutoState = useRef({ running: false, queued: null });

  const runMatrixAuto = async (input = {}) => {
    if (matrixAutoState.current.running) {
      matrixAutoState.current.queued = { ...(matrixAutoState.current.queued || {}), ...input };
      return;
    }
    matrixAutoState.current.running = true;

    // A record just filed hasn't reached React state yet, so the uploader
    // hands it in rather than waiting a render for it.
    const sheet = "certSheet" in input ? input.certSheet : matrixAutoInputs.current.certSheet;
    const validity = "validityMatrix" in input ? input.validityMatrix : matrixAutoInputs.current.validityMatrix;
    const origin = input.origin || "certificates";

    setMatrixAuto({ phase: "reading", read: 0, total: 0, origin });
    try {
      const { res, sheetProblem, moved } = await readEverything({
        quals: matrixAutoInputs.current.quals, certSheet: sheet, validityMatrix: validity, fresh: false,
        onPhase: (p) => setMatrixAuto({ ...p, origin }),
      });

      if (moved.length) refileCertificates(moved);

      const items = res.items || [];
      const fromCerts = items.filter((i) => i.source === "certificate");
      // Applied against the matrix as it stands now — the run is minutes long,
      // and a cell may have been edited by hand while it read.
      const { next, applied } = applyDifferences(matrixAutoInputs.current.quals, fromCerts);

      if (applied.length) {
        setQuals(next);
        setMatrixUpdated(todayISO());
        log("Crew Matrix",
          origin === "certificates"
            ? "Updated from the certificates just filed"
            : origin === "update-table"
            ? "Updated from an Update table check"
            : "Updated after a spreadsheet was replaced",
          `${applied.length} ${applied.length === 1 ? "date" : "dates"} changed`);
      }

      // The date columns follow the same run: whatever the certificates now say
      // about issue and expiry dates is fetched off the readings just kept.
      refreshCertDates();

      // The review screen picks up where this left off: what the certificates
      // settled is already answered and written, and what is left is the
      // spreadsheet disagreeing with the matrix on its own account.
      setCertAnalysis({
        at: res.at,
        by: role,
        model: res.model,
        items,
        notes: res.notes || [],
        summary: { ...(res.summary || {}), sheetProblem, refiled: moved.length },
        verdicts: Object.fromEntries(applied.map((a) => [a.id, "yes"])),
        generated: null,
      });

      if (moved.length) {
        log("Admin", `Refiled ${moved.length} certificate${moved.length === 1 ? "" : "s"}`,
          moved.map((m) => `${m.filename} → ${m.to}`).join(", "));
      }

      setMatrixAuto({
        phase: "done",
        origin,
        read: (res.summary || {}).read || 0,
        total: (res.summary || {}).certificates || 0,
        moved,
        applied,
        left: items.length - applied.length,
      });
    } catch (e) {
      // Whatever was filed is filed either way. Only the reading that follows
      // can fail here, and the next run carries on from where it stopped.
      setMatrixAuto({ phase: "failed", origin, message: e.message || String(e) });
    } finally {
      matrixAutoState.current.running = false;
      const queued = matrixAutoState.current.queued;
      matrixAutoState.current.queued = null;
      if (queued) runMatrixAuto(queued);
    }
  };

  // Admin can remove anything. Crew can remove what was posted from this browser.
  const canDelete = (item) => admin || (item && item.session === SESSION);

  const addComment = (itemId, text, name) => {
    const c = { id: "c" + Date.now(), text, by: name || (admin ? "Admin" : "Crew"), date: todayISO(), session: SESSION };
    setComments((m) => ({ ...m, [itemId]: [...(m[itemId] || []), c] }));
    log("Comments", "Comment added", text.slice(0, 90) + (text.length > 90 ? "..." : ""));
  };

  const removeComment = (itemId, cid) => {
    setComments((m) => ({ ...m, [itemId]: (m[itemId] || []).filter((c) => c.id !== cid) }));
    log("Comments", "Comment deleted");
  };

  const hideTab = (id, label) => {
    setHiddenTabs((h) => (h.includes(id) ? h : [...h, id]));
    // Landing on a tab that has itself been removed is what left the portal
    // showing an empty section with nothing in the bar above it. Move to
    // whatever is still there instead.
    if (tab === id) {
      const left = ALL_TABS.find((t) => t.id !== id && !hiddenTabs.includes(t.id));
      setTab(left ? left.id : "admin");
    }
    log("Admin", `Removed the ${label} tab`, "Restore it from the Admin tab");
  };

  const restoreTab = (id, label) => {
    setHiddenTabs((h) => h.filter((x) => x !== id));
    log("Admin", `Restored the ${label} tab`);
  };

  const restoreAllTabs = () => {
    setHiddenTabs([]);
    log("Admin", "Restored every section", "All tabs are back for everyone");
  };

  // A tab clears its dot when opened; History clears everything.
  const SECTIONS_FOR_TAB = {
    handover: ["Handover Notes"],
    correspondence: ["Partnership Correspondence", "PortWays Correspondence", "Vessel Safety Minutes", "Partnership Quarterly Safety"],
    documentation: ["Misc Documents", "Insurance", "Hotel and Flight Bookings", "Templates", "Partnership Agreements"],
    suggestions: ["Crew Suggestions"],
    "app-suggestions": ["App / Portal Suggestions"],
  };

  const openTab = (id) => {
    setTab(id);
    setUnread((u) => {
      const next = { ...u };
      if (id === "history") return {};
      (SECTIONS_FOR_TAB[id] || []).forEach((sec) => delete next[sec]);
      return next;
    });
  };

  const countFor = (id) =>
    id === "history"
      ? unreadTotal
      : (SECTIONS_FOR_TAB[id] || []).reduce((n, sec) => n + (unread[sec] || 0), 0);

  const ALL_TABS = [
    { id: "correspondence", label: "Partnership Correspondence" },
    { id: "handover", label: "Handover Notes" },
    { id: "training", label: "Crew Matrix" },
    { id: "documentation", label: "Documentation" },
    { id: "upload-certs", label: "Upload Crew Certificates" },
    { id: "suggestions", label: "Crew Suggestions" },
    { id: "history", label: "History" },
    { id: "app-suggestions", label: "App / Portal Suggestions" },
  ];

  // The hidden-sections state is shared and outlives the code: the AI Checker
  // was a tab here before it moved onto the Admin tab, and anyone who had
  // hidden it would otherwise carry a hidden section that no longer exists —
  // counted in the Admin banner, restorable only by "Restore all". Ids that no
  // longer name a tab are ignored everywhere.
  const hiddenNow = hiddenTabs.filter((id) => ALL_TABS.some((t) => t.id === id));

  const TABS = [
    ...ALL_TABS,
    ...(admin ? [{ id: "admin", label: "Admin" }] : []),
  ].filter((t) => !hiddenNow.includes(t.id) || t.id === "admin");

  // Every section can be removed from the Admin tab, and removing all of them
  // used to leave the portal looking as though everything in it had been lost:
  // an empty bar, and below it whichever section happened to be open, still
  // rendered even though it had been taken away. The tab that is shown is now
  // always one that is actually there.
  const shown = TABS.some((t) => t.id === tab) ? tab : (TABS[0] ? TABS[0].id : null);

  const views = {
    handover: <HandoverNotes notes={notes} setNotes={setNotes} log={log} />,
    correspondence: <PartnershipHub data={correspondence} setData={setCorrespondence} currentUser={currentUser} log={log} docs={docs} addDoc={addDoc} removeDoc={removeDoc} pwData={pwCorrespondence} setPwData={setPwCorrespondence} />,
    training: <TrainingMatrix />,

    documentation: <DocumentationHub docs={docs} addDoc={addDoc} removeDoc={removeDoc} currentUser={currentUser}
      people={people} setPeople={setPeople} overrides={overrides} setOverrides={setOverrides} log={log} />,
    "upload-certs": <CrewCertificateUpload />,
    suggestions: <SuggestionBoard data={suggestions} setData={setSuggestions} log={log} currentUser={currentUser}
      title="Crew Suggestions" logLabel="Crew Suggestions"
      placeholder="Anything that would make the job safer, quicker or less painful." />,
    "app-suggestions": <SuggestionBoard data={appSuggestions} setData={setAppSuggestions} log={log} currentUser={currentUser}
      title="App / Portal Suggestions" logLabel="App / Portal Suggestions"
      blurb="Ideas for the portal itself - what's missing, what's awkward, what would make it more useful."
      placeholder="What would you change about this portal?" />,
    history: <History entries={history} />,
    admin: <Admin currentUser={currentUser} people={people} notes={notes} files={files} sync={sync}
      setPeople={setPeople} overrides={overrides} setOverrides={setOverrides} log={log}
      swingBoard={swingBoard} setSwingBoard={setSwingBoard}
      corrCount={correspondence.length} history={history}
      allTabs={ALL_TABS} hiddenTabs={hiddenNow} onHideTab={hideTab}
      onRestoreTab={restoreTab} onRestoreAllTabs={restoreAllTabs} />,
  };

  const ctx = { role, admin, session: SESSION, comments, addComment, removeComment, canDelete, log, quals, setQuals, certificates, addCertificates, removeCertificate, refileCertificates, updateCertificate, certSheet, setCertSheet, matrixUpdated, setMatrixUpdated, certAnalysis, setCertAnalysis, certDates, refreshCertDates, validityPeriods, certNotes, setCertNotes, opmsMarks, setOpmsMarks, renewalMarks, setRenewalMarks, trainingMatrix, setTrainingMatrix, skillsMatrix, setSkillsMatrix, validityMatrix, matrixAnalysis, setMatrixAnalysis, opmsSheet, setOpmsSheet, opmsAnalysis, setOpmsAnalysis, shiftAllocation, setShiftAllocation, shiftAnalysis, setShiftAnalysis, swingLists, setSwingLists, swingDates, setSwingDates, rosterPattern, setRosterPattern, swingBoard, swingBoards, setSwingBoards, swingReport, setSwingReport, matrixAuto, runMatrixAuto, clearMatrixAuto };

  return (
    <Ctx.Provider value={ctx}>
    <div className="um" style={{ background: T.deep, minHeight: "100vh", fontFamily: T.body }}>
      <style>{STYLES}</style>
      <div style={{ height: 3, background: `linear-gradient(90deg, ${T.accent} 0%, ${T.teal} 100%)` }} />
      <div style={{ margin: "0 auto", padding: "0 18px 44px" }}>
        <header className="um-head" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 24, padding: "16px 0 12px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
            <Roundel />
            <div>
              <div style={{ fontFamily: T.display, fontSize: 34, fontWeight: 700, letterSpacing: "0.03em", textTransform: "uppercase", lineHeight: 1 }}>
                <span style={{ color: T.text }}>{VESSEL.name} </span>
                <span style={{ color: T.accent }}>{VESSEL.nameAccent}</span>
              </div>
              <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 7, letterSpacing: "0.04em" }}>Crew Portal · {VESSEL.operator}</div>
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontFamily: T.display, fontSize: 11, fontWeight: 700, letterSpacing: "0.16em", textTransform: "uppercase", color: T.muted, marginBottom: 10 }}>{VESSEL.strapline}</div>
            {/* Prototype only — stands in for a real login. */}
            <div style={{ display: "flex", gap: 10, alignItems: "center", justifyContent: "flex-end" }}>
              <span title={sync.state === "error" ? sync.msg : sync.state === "ok" ? `Saved - last checked ${sync.at}` : "Connecting"}
                style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: T.mono, fontSize: 10,
                  color: sync.state === "error" ? T.bRed : sync.state === "ok" ? T.teal : T.muted,
                  textTransform: "uppercase", letterSpacing: "0.08em" }}>
                <span style={{ width: 7, height: 7, borderRadius: "50%",
                  background: sync.state === "error" ? T.bRed : sync.state === "ok" ? T.teal : T.muted }} />
                {sync.state === "ok" ? "Saved" : sync.state === "error" ? "Not saving" : "..."}
              </span>
              <NotifyToggle log={log} on={notifyOn} setOn={setNotifyOn} count={unreadTotal} />
              {/* Chris's FIT TO SAIL, one click away — the address comes from the
                  server with the sign-in, so the button only shows when it's set. */}
              {SESSION_USER.fitToSail && (
                <a className="um-btn" href={SESSION_USER.fitToSail} target="_blank" rel="noreferrer"
                  style={{ background: T.accent, color: "#fff", border: `1px solid ${T.accent}`, fontSize: 11,
                    fontWeight: 700, padding: "7px 11px", borderRadius: 2, textDecoration: "none",
                    letterSpacing: "0.06em" }}>
                  FIT TO SAIL
                </a>
              )}
              <Chip fg={admin ? T.accent : T.muted} bg={admin ? T.accentSoft : T.raised}>{currentUser}</Chip>
              <button className="um-btn" onClick={onSignOut}
                style={{ background: "transparent", color: T.muted, border: `1px solid ${T.rule}`,
                  fontSize: 11, fontWeight: 700, padding: "7px 11px", borderRadius: 2 }}>
                Sign out
              </button>
            </div>
          </div>
        </header>

        <nav className="um-nav um-scroll" style={{ display: loaded ? "flex" : "none", gap: 4, borderBottom: `1px solid ${T.rule}`, marginBottom: 22 }}>
          {TABS.map((t) => {
            const on = shown === t.id;
            return (
              <button key={t.id} className="um-btn um-tab" onClick={() => openTab(t.id)}
                style={{ background: on ? T.panel : "transparent", color: on ? T.text : T.muted, fontSize: 11.5, fontWeight: 700, padding: "10px 12px", borderBottom: `3px solid ${on ? T.accent : "transparent"}`, marginBottom: -1, display: "inline-flex", alignItems: "center", gap: 7 }}>
                {t.label}
                {countFor(t.id) > 0 && (
                  <span style={{ background: T.bRed, color: "#fff", fontFamily: T.mono, fontSize: 10, fontWeight: 600,
                                 minWidth: 17, height: 17, borderRadius: 9, padding: "0 5px", letterSpacing: 0,
                                 display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                    {countFor(t.id)}
                  </span>
                )}
              </button>
            );
          })}
        </nav>

        {!loaded
          ? <NotLoadedYet error={sync.state === "error" ? sync.msg : null} />
          : shown ? views[shown] : <EverythingHidden admin={admin} onRestoreAll={restoreAllTabs} />}

        <footer style={{ marginTop: 34, paddingTop: 13, borderTop: `1px solid ${T.rule}`, fontFamily: T.mono, fontSize: 11, color: T.muted, lineHeight: 1.8 }}>
          <div>Prototype for crew review — not a controlled record under the SMS.</div>
          <div>Entries and uploads are saved on the server and shared with everyone.</div>
        </footer>
      </div>

      {/* The crew matrix bringing itself up to date, watched from over whichever
          screen is open — the run can be set going from more than one of them. */}
      <MatrixAutoWindow />
    </div>
    </Ctx.Provider>
  );
}

function App() {
  // Who this is comes from the server: the page only ever loads behind a
  // real sign-in (email plus a code sent to it), and /api/me says the name
  // and the level. The old name-picker (SignIn, kept above unused) and the
  // per-tab remembering are superseded — the session cookie is the memory,
  // and it holds for ninety days per device. On the local preview, where no
  // server sign-in exists, /api/me answers 404/failed and the page falls
  // back to the picker so the preview keeps working.
  const [me, setMe] = useState(null);
  const [noServer, setNoServer] = useState(false);
  React.useEffect(() => {
    (async () => {
      try {
        const r = await fetch("/api/me");
        if (r.status === 401) { window.location.href = "/login"; return; }
        if (!r.ok) { setNoServer(true); return; }
        const who = await r.json();
        SESSION_USER = { name: who.name, role: who.role, email: who.email || "", fitToSail: who.fitToSail || "" };
        setMe(who);
      } catch (e) {
        setNoServer(true);
      }
    })();
  }, []);

  // Preview fallback: the honour-system picker, exactly as it always was.
  const [picked, setPicked] = useState(() => {
    try { return sessionStorage.getItem("um-signed-in") || null; } catch (e) { return null; }
  });
  if (noServer) {
    if (picked) {
      // Restored from the tab's memory: keep the role map in step.
      SESSION_USER = { name: picked, role: picked === IT_SUPPORT_ACCOUNT_NAME ? "it" : ADMINS.includes(picked) ? "management" : "crew", email: "" };
    }
    if (!picked) {
      return (
        <Boundary>
          <SignIn onSignIn={(r) => {
            try { sessionStorage.setItem("um-signed-in", r); } catch (e) {}
            SESSION_USER = { name: r, role: r === IT_SUPPORT_ACCOUNT_NAME ? "it" : ADMINS.includes(r) ? "management" : "crew", email: "" };
            setPicked(r);
          }} />
        </Boundary>
      );
    }
    return (
      <Boundary>
        <CoolibahPortal role={picked} onSignOut={() => {
          try { sessionStorage.removeItem("um-signed-in"); } catch (e) {}
          setPicked(null);
        }} />
      </Boundary>
    );
  }

  if (!me) {
    return (
      <Boundary>
        <div style={{ minHeight: "60vh", display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: "system-ui", color: "#5b6b7a", fontSize: 14 }}>Signing you in...</div>
      </Boundary>
    );
  }

  return (
    <Boundary>
      <CoolibahPortal role={me.name} onSignOut={() => { window.location.href = "/logout"; }} />
    </Boundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
