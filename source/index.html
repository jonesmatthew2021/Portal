  // "STEWART, Ryan" shouldn't cost a line its dates.
  const nameKey = (s_) => normTitle(s_).split(" ").filter(Boolean).sort().join(" ");
  const rowByNorm = {};
  const rowByParts = {};
  QUALS.rows.forEach((r) => {
    rowByNorm[normTitle(r[0])] = r;
    rowByParts[nameKey(r[0])] = r;
  });
  const matrixRowFor = (who) =>
    rowByName[who] || rowByNorm[normTitle(who)] || rowByParts[nameKey(who)] || null;

  // The matrix columns one requirement names. The sheet writes an item the way
  // the matrix does — code then title — and a requirement can list alternatives,
  // so every column the row names is matched: by code where one is written, by
  // title where it isn't.
  const colsForItem = (item) => {
    const up = String(item || "").toUpperCase();
    const norm = normTitle(item);
    const found = [];
    QUALS.cols.forEach((c, i) => {
      const code = String(c[0] || "").trim().toUpperCase();
      const title = normTitle(c[1]);
      const byCode = !!code
        && new RegExp(`(^|[^A-Z0-9])${code.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^A-Z0-9]|$)`).test(up);
      // Short titles match too much of the sheet's own wording to be trusted.
      const byTitle = title.length >= 8 && norm.includes(title);
      if (byCode || byTitle) found.push({ code: c[0], title: c[1], i });
    });
    return found;
  };

  // One line per name counted: the item they hold it under, their position, the
  // validity period, the two dates, and the scan. Where a requirement lists
  // alternatives, the line carries the one that made them count.
  const countedLines = (r) => {
    const cols = colsForItem(r.item);
    return (Array.isArray(r.holders) ? r.holders : []).map((who) => {
      const row = matrixRowFor(who);
      const name = row ? row[0] : who;
      const filed = certHeld[String(name).trim().toUpperCase()] || {};
      const options = cols.map((c) => {
        const band = row ? bandFor(row[3][c.i]) : null;
        const so = filed[String(c.code).trim().toUpperCase()] || null;
        const read = certDateFor(certDates, name, c.code);
        // The latest date anything on the portal holds for this item — the
        // matrix cell, the certificate filed against it, or the reading of the
        // scan itself.
        const expires = [band && band.date, so && so.date, read && read.expires]
          .filter((d) => /^\d{4}-\d{2}-\d{2}/.test(String(d || "")))
          .map((d) => String(d).slice(0, 10))
          .sort()
          .pop() || null;
        return {
          code: c.code, title: c.title,
          band: expires ? bandFor(expires) : band,
          neverExpires: !!noExpiryPeriod(c.code) || !!(so && so.held) || !!(band && band.key === "held"),
          issued: (read && read.issued) || null,
          expires,
          validity: validityFor({ code: c.code, title: c.title }),
          url: certLinkFor(certDates, certificates, name, c.code),
        };
      });
      // An item held for good first, then the one running out latest — the
      // standing that carried the requirement.
      const rank = (o) => (o.neverExpires ? 0 : o.expires ? 1 : o.band ? 2 : 3);
      const best = options.slice().sort((a, b) =>
        rank(a) - rank(b) || String(b.expires || "").localeCompare(String(a.expires || "")))[0] || null;
      return {
        who: name, position: row ? row[1] : null, onMatrix: !!row,
        code: best ? best.code : null, title: best ? best.title : null,
        band: best ? best.band : null, neverExpires: !!(best && best.neverExpires),
        issued: best ? best.issued : null, expires: best ? best.expires : null,
        validity: best ? best.validity : null, url: best ? best.url : null,
      };
    });
  };

  // The headings the counted lines sit under, and the dress each line shares
  // with the certification screens' own holder lists.
  const cHead = { fontFamily: T.display, fontSize: 9.5, fontWeight: 700, letterSpacing: "0.1em",
    textTransform: "uppercase", color: T.muted, minWidth: 78 };
  const cLine = { display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
    padding: "5px 0", borderBottom: `1px solid ${T.rule}` };

  /* ---- the shift allocation matrix, position by position ------------------ */
  /* The guideline names positions as often as it names numbers — "GPH", "Any
     Position", "Chief Officer or Second Mate" — and a requirement counts only
     the positions it names. So the office's own shift allocation matrix is laid
     out beside it: every position it carries and the shift each one stands, the
     Master, Second Mate, Assistant Engineer and GPH on both, the two Chief
     Officers split A on Shift 1 and B on Shift 2, the Chief Engineer on Shift 1
     and the First Engineer on Shift 2, and the Cook on neither. All nine are on
     the page whether the swing carries anybody in them or not, so a berth
     nobody is standing reads as exactly that.

     Who fills each one is worked off the roster and the matrix rather than asked
     of the model: the position is the one the training matrix writes against the
     person's name, the watch is the one set on the roster above, and for anyone
     the matrix doesn't carry the roster's own department stands in, said as that
     rather than passed off as a rank. A position the office matrix doesn't carry
     keeps a line of its own underneath rather than being folded into one. */
  const onboardCrew = [
    ...here.checked.map((c) => ({ id: c.person.id, name: c.name,
      rank: c.position || null, onMatrix: true, watch: watchOf(c.person) })),
    ...here.unchecked.map((p) => ({ id: p.id, name: p.name,
      rank: p.dept || null, onMatrix: false, watch: watchOf(p) })),
  ];

  // The two shifts, as the office matrix names them and as the vessel works
  // them, and the column for anyone without a watch. A watch is set on the
  // roster; anyone without one counts toward the swing as a whole rather than
  // toward either shift, which is the same way the comparison itself treats
  // them.
  const WATCHES = [
    { id: "day", title: "Day Shift", sheet: "Shift 1", hours: "1200 – 2400" },
    { id: "night", title: "Night Shift", sheet: "Shift 2", hours: "2400 – 1200" },
    { id: null, title: "No watch set", sheet: null, hours: null },
  ];
  const inWatch = (list, w) =>
    list.filter((c) => (w ? c.watch === w : c.watch !== "day" && c.watch !== "night"));

  /* Everybody onboard sorted into the office matrix's positions by the title
     written against their name. Two spellings that differ only in casing or
     punctuation are the one position, and a title the matrix doesn't carry is
     kept aside for a line of its own under the matrix. */
  const pooled = {};
  const extraRows = [];
  const extraAt = {};
  onboardCrew.forEach((c) => {
    const label = c.rank || "No position given";
    const pool = c.rank ? shiftMatrixPool(label) : null;
    if (pool) { (pooled[pool] || (pooled[pool] = [])).push(c); return; }
    const key = normTitle(label) || label.toLowerCase();
    let row = extraAt[key];
    if (!row) {
      row = extraAt[key] = { key, label, named: !!c.rank, fromMatrix: !!(c.onMatrix && c.rank),
        onMatrixSheet: false, shifts: [], crew: [] };
      extraRows.push(row);
    }
    if (!row.fromMatrix && c.onMatrix && c.rank) { row.label = label; row.fromMatrix = true; }
    row.crew.push(c);
  });

  /* One line per position on the office matrix, in the matrix's own order. A
     berth stood on one shift takes the crew standing that watch — which is what
     tells Chief Officer (A) from Chief Officer (B) — and where a pool has a
     berth on each shift, anybody in it without a watch set fills neither and is
     said once, against the first of the two, so nobody is counted twice. */
  const matrixRows = SHIFT_MATRIX.map((m) => {
    const pool = pooled[m.pool] || [];
    const berths = SHIFT_MATRIX.filter((x) => x.pool === m.pool);
    const split = berths.length > 1;
    const firstOfPool = berths[0].key === m.key;
    const mine = !split ? pool : pool.filter((c) =>
      m.shifts.includes(c.watch) || (firstOfPool && !berths.some((b) => b.shifts.includes(c.watch))));
    const day = mine.filter((c) => c.watch === "day");
    const night = mine.filter((c) => c.watch === "night");
    const none = mine.filter((c) => c.watch !== "day" && c.watch !== "night");
    return { key: m.key, label: m.label, pool: m.pool, shifts: m.shifts, onMatrixSheet: true, split,
      fromMatrix: true, named: true, day, night, none, crew: mine };
  });
  const rankRows = [...matrixRows, ...extraRows];

  /* The certifications the guideline requires of each position, read off the
     comparison's own requirement list: a requirement counts on a row when the
     positions it names include this one (or it names any position), and when
     its shift is the row's own, or covers both. Nothing until a comparison has
     been run — the requirements are the sheet's words, read by the model, and
     inventing them here would be guessing at the office's document. */
  const isAnyPosition = (r) => {
    const who = String(r.positions || "").trim();
    return !who || /\bany\b/i.test(who);
  };
  // Requirements naming a position sit on that position's row; the ones that
  // count anybody are said once above the table instead of on every row. A
  // day and a night entry asking the same of the same item fold into one
  // "per shift" line.
  const reqsFor = (row) => {
    if (!row.onMatrixSheet || !reqs.length) return [];
    return reqs.filter((r) => {
      if (isAnyPosition(r)) return false;
      if ((r.shift === "day" || r.shift === "night") && row.shifts.length && !row.shifts.includes(r.shift)) return false;
      const pools = String(r.positions).split(/,|\/|\bor\b|\band\b|&/i).map((x) => shiftMatrixPool(x)).filter(Boolean);
      return pools.includes(row.pool);
    });
  };
  const reqSay = (r, perShift) => {
    const n = String(r.required || "").trim();
    const count = /^\d+$/.test(n) ? (Number(n) > 1 || perShift ? ` × ${n}` : "") : "";
    return `${r.item}${count}${perShift ? " per shift" : r.shift === "day" ? " (Shift 1)" : r.shift === "night" ? " (Shift 2)" : ""}`;
  };
  const foldShifts = (list) => {
    const byItem = {};
    list.forEach((r) => { (byItem[r.item] || (byItem[r.item] = [])).push(r); });
    const out = [];
    Object.values(byItem).forEach((group) => {
      const day = group.find((r) => r.shift === "day");
      const night = group.find((r) => r.shift === "night");
      if (day && night && String(day.required).trim() === String(night.required).trim()) {
        out.push(reqSay(day, true));
        group.filter((r) => r !== day && r !== night).forEach((r) => out.push(reqSay(r)));
      } else group.forEach((r) => out.push(reqSay(r)));
    });
    return out;
  };
  const swingReqs = foldShifts(reqs.filter(isAnyPosition));

  // A berth the matrix allocates that nobody is standing, and anybody standing a
  // shift their position isn't allocated to — the two things worth saying out
  // loud above the table.
  const rowOn = (row, w) => (w === "day" ? row.day : w === "night" ? row.night : row.none) || [];
  const unfilled = matrixRows.reduce((n, r) =>
    n + r.shifts.filter((w) => rowOn(r, w).length === 0).length, 0);
  const offAllocation = (row) => (row.onMatrixSheet ? ["day", "night"] : [])
    .filter((w) => !row.shifts.includes(w) && rowOn(row, w).length > 0);
  const misplaced = matrixRows.reduce((n, r) =>
    n + offAllocation(r).reduce((m, w) => m + rowOn(r, w).length, 0), 0);

  const onboardTotals = Object.fromEntries(
    WATCHES.map((w) => [w.id || "none", inWatch(onboardCrew, w.id).length]));
  const noWatch = onboardTotals.none || 0;

  return (
    <div>
      {/* The sheet the comparison runs against, and the spot a newer one goes. */}
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.teal}`,
        borderRadius: 2, padding: "13px 15px", marginBottom: 10 }}>
        <Eyebrow color={T.teal}>The sheet on file</Eyebrow>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center",
          gap: 10, flexWrap: "wrap", marginTop: 8 }}>
          <div style={{ minWidth: 0, flex: "1 1 200px" }}>
            <div style={{ fontFamily: T.body, fontSize: 13, wordBreak: "break-word",
              color: shiftAllocation ? T.text : T.muted }}>
              {shiftAllocation ? shiftAllocation.filename : "No shift allocation sheet has been filed yet."}
            </div>
            {shiftAllocation && (
              <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 2 }}>
                {shiftAllocation.uploaded ? `${fmtDate(shiftAllocation.uploaded)} · ` : ""}{shiftAllocation.size}
              </div>
            )}
          </div>
          <span style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            {shiftAllocation && shiftAllocation.url && <OpenLink url={shiftAllocation.url} />}
            <SingleDocumentUpload
              category="shift-allocation"
              noun="shift allocation sheet"
              eyebrow="Shift allocation sheet"
              blurb="One sheet is kept on the portal — the latest the office sent. It is a guideline rather than a crew list: how many holders of certain certificates each shift must carry, for this swing and the ones after it. The comparison on the Swing Compliance page runs against whichever is on file."
              current={shiftAllocation || null}
              onFiled={(record) => {
                setShiftAllocation(record);
                // A new sheet makes the old answer about a document that is no
                // longer on the portal, so it goes with it.
                setShiftAnalysis(null);
              }}
              logAction="Shift allocation sheet uploaded"
              label={shiftAllocation ? "Upload a newer sheet" : "Upload the sheet"}
            />
          </span>
        </div>
      </div>

      {/* The berth manning now lives inside each shift's own column below,
          so the page reads shift by shift rather than as a second wide table.
          The counts worth shouting stay here, one line. */}
      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", marginBottom: 10 }}>
        <Chip fg={T.accent} bg={T.raised}>{onboardCrew.length} onboard · {swingLabel(here.swing)}</Chip>
        {unfilled > 0 && (
          <Chip fg={T.bRed} bg={T.bRedBg}>{unfilled} berth{unfilled === 1 ? "" : "s"} unfilled</Chip>
        )}
        {misplaced > 0 && (
          <Chip fg={T.bOrange} bg={T.bOrangeBg}>{misplaced} standing a shift the matrix doesn't allocate</Chip>
        )}
        {noWatch > 0 && <Chip fg={T.bOrange} bg={T.bOrangeBg}>{noWatch} no watch set</Chip>}
      </div>

      {/* The comparison reads the guideline against what the crew hold — the
          training matrix overlaid with the certificates on file, so a scan
          filed a moment ago counts without a matrix run or a regenerated
          spreadsheet in between. A sheet on file is all it needs. */}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center",
        gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
        <Button onClick={() => run(!!check)} disabled={!shiftAllocation || busy}>
          {busy
            ? (run_ && run_.phase === "sheet" ? "Reading the sheet..." : "Comparing...")
            : check ? (stale ? "Compare this swing" : "Compare again") : "Compare with AI"}
        </Button>
        {shiftAnalysis && !busy && (
          <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
            Last run {new Date(shiftAnalysis.at).toLocaleString("en-AU", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}
            {shiftAnalysis.by ? ` · ${shiftAnalysis.by}` : ""}
            {shiftAnalysis.swing ? ` · against ${shiftAnalysis.swing}` : ""}
          </span>
        )}
      </div>

      {/* A run takes a minute or two and is watched from a window over the page,
          like every other analysis: the figure and the clock both climb while
          the server works. It can be put away — the run carries on either way. */}
      {run_ && !hidden && (
        <AnalysisWindow
          eyebrow="Comparing the shift allocation sheet"
          pct={pct}
          elapsed={elapsed}
          failed={run_.phase === "failed"}
          message={run_.message}
          failNote="Nothing on the portal has changed. The sheet and the roster are both still here, so it can be run again."
          body={<>
            {run_.phase === "sheet" && "Opening the sheet on file."}
            {run_.phase === "comparing" && ((run_.waited || 0) > 20
              ? "Holding the guideline against the rostered crew's training matrix standing. It is one long question over the whole swing and it runs on the server, so it takes a minute or two."
              : "Holding the guideline against the rostered crew's training matrix standing.")}
          </>}
          note="Leave the page open. The comparison runs on the server, so a dropped connection doesn't lose it — the answer is picked up when the page asks again."
          onHide={() => setHidden(true)}
          onClose={() => setRun(null)}
        />
      )}

      {err && (
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, lineHeight: 1.6, marginBottom: 10 }}>{err}</div>
      )}
      {caveats.map((p, i) => (
        <div key={i} style={{ fontFamily: T.body, fontSize: 12.5, color: T.bOrange, lineHeight: 1.6, marginBottom: 10 }}>{p}</div>
      ))}

      {!check ? (
        <Empty>
          {shiftAllocation
            ? "Not compared yet. The AI reads the guideline on file — how many holders of each certificate every shift must carry — against what this swing's crew hold: the training matrix, overlaid with the certificates on file."
            : "Upload the office's shift allocation sheet and the AI checks each shift of this swing carries the certificates it requires."}
        </Empty>
      ) : check.readable === false ? (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `3px solid ${T.bRed}`,
          borderRadius: 2, padding: "13px 15px" }}>
          <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.7 }}>
            The sheet couldn't be read. {check.reason || ""}
          </div>
        </div>
      ) : (
        <>
          {stale && (
            <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
              borderLeft: `4px solid ${T.bOrange}`, borderRadius: 2, padding: "12px 15px",
              marginBottom: 10 }}>
              <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, lineHeight: 1.6 }}>
                This answer was made against{" "}
                <strong style={{ fontWeight: 700 }}>{madeFor}</strong>. The swing picked above is{" "}
                <strong style={{ fontWeight: 700 }}>{swingLabel(here.swing)}</strong> — press
                "Compare this swing" and the guideline is read against its crew instead.
              </span>
            </div>
          )}
          <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
            borderLeft: `4px solid ${wrong ? T.bRed : T.teal}`, borderRadius: 2,
            padding: "13px 15px", marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline",
              gap: 10, flexWrap: "wrap" }}>
              <span style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.6, flex: "1 1 220px" }}>
                {check.headline || (wrong ? "The swing doesn't meet the guideline everywhere." : "The swing meets the guideline.")}
              </span>
              <span style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                {nShort > 0 && <Chip fg={T.bRed} bg={T.bRedBg}>{nShort} short</Chip>}
                {nUnclear > 0 && <Chip fg={T.muted} bg={T.raised}>{nUnclear} unclear</Chip>}
                {reqs.length > 0 && <Chip fg={T.teal} bg={T.raised}>{nMet} met</Chip>}
                {reqs.length === 0 && (
                  <Chip fg={wrong ? T.bRed : T.teal} bg={wrong ? T.bRedBg : T.raised}>
                    {wrong ? `${wrong} to look at` : "All met"}
                  </Chip>
                )}
              </span>
            </div>
            {nShort > 0 && (() => {
              const where = SHIFT_GROUPS.filter((g) =>
                reqs.some((r) => g.takes(r.shift) && r.verdict === SHIFT_STATUS.short &&
                  (g.id === "swing" || r.shift !== "swing")))
                .map((g) => g.title);
              return where.length ? (
                <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.bRed, marginTop: 5 }}>
                  Short on: {where.join(" and ")}.
                </div>
              ) : null;
            })()}
            {check.what && (
              <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 5 }}>{check.what}</div>
            )}
          </div>

          {/* The verdicts broken up by shift: Day Shift (1200 – 2400) first,
              Night Shift (2400 – 1200) under it, and anything the sheet didn't
              split by shift in a whole-swing group at the end. A requirement
              with one number each shift must meet alike sits under both shifts.
              Within a group the rows read short first. The stripe and the
              status chip say how a row stands, the two counts say by how much,
              and the circles draw it — one per holder the sheet asks for,
              filled for each the swing carries. Who was counted sits in the
              open under every row — a line per name, with the certificate's
              issue date, when it runs out, how long the item stays valid and a
              way into the scan on file — followed by the sentence the model
              wrote about the row, so the tables stay tables. */}
          {reqs.length > 0 && (
            <>
              {/* One compact row per requirement: the item, the circles, the
                  verdict, and who was counted in a muted line — with the full
                  dates-and-scans table behind Names & dates for whoever wants
                  it. The whole-swing rules sit first, full width; the two
                  shifts sit side by side, each carrying its own berth manning
                  underneath, so a shift is read top to bottom in one place. */}
              {(() => {
                const reqRow = (g, r, i) => {
                  const key = `${g.id}-${r.item || ""}-${i}`;
                  const openThis = openReq === key;
                  const holders = Array.isArray(r.holders) ? r.holders : [];
                  return (
                    <React.Fragment key={key}>
                      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap",
                        padding: "8px 12px", borderTop: `1px solid ${T.rule}` }}>
                        <span style={{ flex: "1 1 190px", minWidth: 0 }}>
                          <span style={{ fontFamily: T.body, fontSize: 12.5, fontWeight: 600, color: T.text }}>{r.item}</span>
                          <span style={{ display: "block", fontFamily: T.mono, fontSize: 10, color: T.muted, marginTop: 1 }}>
                            {[r.positions, r.shift === "both" && g.id !== "swing" ? "each shift alike" : null,
                              /^\d+$/.test(String(r.required || "").trim()) ? `${r.required} required` : null]
                              .filter(Boolean).join(" · ") || (r.required || "")}
                          </span>
                        </span>
                        <ShiftMeter required={r.required} have={r.have} />
                        <Chip fg={r.verdict.fg()} bg={r.verdict.bg()}>
                          {r.verdict.label}{r.have != null && /^\d+$/.test(String(r.required || "").trim())
                            ? ` · ${r.have} of ${String(r.required).trim()}` : ""}
                        </Chip>
                        {(holders.length > 0 || r.detail) && (
                          <button className="um-btn" onClick={() => setOpenReq(openThis ? null : key)}
                            style={{ background: "transparent", color: T.muted, fontSize: 9.5,
                              fontWeight: 700, padding: "2px 0" }}>
                            {openThis ? "Close" : "Names & dates"}
                          </button>
                        )}
                        {(holders.length > 0 || r.detail) && (
                          <span style={{ width: "100%", fontFamily: T.mono, fontSize: 9.5, color: T.muted,
                            lineHeight: 1.6, paddingLeft: 2 }}>
                            {holders.length > 0 ? holders.join(" · ") : null}
                            {r.detail && r.verdict !== SHIFT_STATUS.met ? (holders.length ? " — " : "") + r.detail : null}
                          </span>
                        )}
                      </div>
                      {openThis && (
                        <div style={{ padding: "6px 12px 10px", background: T.raised }}>
                          {holders.length > 0 && (
                            <>
                              <div style={{ display: "flex", gap: 10, alignItems: "baseline",
                                padding: "4px 0", borderBottom: `2px solid ${T.rule}` }}>
                                <span style={{ ...cHead, minWidth: 46 }}>Item</span>
                                <span style={{ ...cHead, flex: 1, minWidth: 160 }}>Crew member</span>
                                <span style={cHead}>Issue date</span>
                                <span style={cHead}>Expiry date</span>
                                <span style={{ ...cHead, textAlign: "right" }}>Certificate</span>
                              </div>
                              {countedLines(r).map((h, n) => (
                                <div key={`${h.who}-${n}`} style={cLine}>
                                  <span style={{ fontFamily: T.mono, fontSize: 10, color: h.code ? T.accent : T.muted,
                                    minWidth: 46 }}>{h.code || "—"}</span>
                                  <span style={{ flex: 1, minWidth: 160, fontFamily: T.body, fontSize: 12.5,
                                    fontWeight: 600, color: T.text }}>{h.who}</span>
                                  <DateCols issued={h.issued} expires={h.expires} />
                                  <CertCell url={h.url} person={h.who} code={h.code} title={h.title} />
                                </div>
                              ))}
                            </>
                          )}
                          {r.detail && (
                            <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.text, opacity: 0.9,
                              lineHeight: 1.6, marginTop: holders.length ? 8 : 0 }}>{r.detail}</div>
                          )}
                        </div>
                      )}
                    </React.Fragment>
                  );
                };

                const groupBox = (g, full) => {
                  const rows = reqs.filter((r) => g.takes(r.shift));
                  const gShort = rows.filter((r) => r.verdict === SHIFT_STATUS.short).length;
                  const manned = g.id !== "swing"
                    ? matrixRows.filter((r) => r.shifts.includes(g.id))
                    : [];
                  const alsoStanding = g.id !== "swing"
                    ? [
                        ...matrixRows.filter((r) => r.onMatrixSheet && !r.shifts.includes(g.id))
                          .flatMap((r) => rowOn(r, g.id).map((c) => `${c.name} (${r.label} — allocated ${shiftMatrixWords(r.shifts)})`)),
                        ...extraRows.flatMap((r) => rowOn(r, g.id).map((c) => r.named ? `${c.name} (${r.label})` : c.name)),
                      ]
                    : [];
                  if (rows.length === 0 && manned.length === 0) return null;
                  return (
                    <div key={g.id} style={{ background: T.panel, border: `1px solid ${T.rule}`,
                      borderRadius: 2, marginBottom: full ? 10 : 0, overflow: "hidden" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline",
                        gap: 10, flexWrap: "wrap", padding: "10px 12px",
                        borderBottom: `2px solid ${gShort ? T.bRed : T.teal}` }}>
                        <span style={{ display: "flex", gap: 9, alignItems: "baseline", flexWrap: "wrap" }}>
                          <Eyebrow color={gShort ? T.bRed : T.teal}>{g.title}</Eyebrow>
                          <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.muted }}>
                            {g.id === "swing" ? "any shift counts"
                              : `${g.id === "day" ? "Shift 1" : "Shift 2"} · ${g.hours} · ${inWatch(onboardCrew, g.id).length} standing`}
                          </span>
                        </span>
                        {gShort > 0
                          ? <Chip fg={T.bRed} bg={T.bRedBg}>{gShort} short</Chip>
                          : rows.length > 0 && <Chip fg={T.teal} bg={T.raised}>all met</Chip>}
                      </div>
                      {rows.length > 0 && (
                        <div style={{ padding: "3px 12px 2px", fontFamily: T.display, fontSize: 9.5,
                          fontWeight: 700, letterSpacing: "0.11em", textTransform: "uppercase", color: T.muted }}>
                          Must carry
                        </div>
                      )}
                      {rows.map((r, i) => reqRow(g, r, i))}
                      {manned.length > 0 && (
                        <>
                          <div style={{ padding: "8px 12px 2px", fontFamily: T.display, fontSize: 9.5,
                            fontWeight: 700, letterSpacing: "0.11em", textTransform: "uppercase", color: T.muted }}>
                            Standing this shift
                          </div>
                          {manned.map((row) => {
                            const names = rowOn(row, g.id);
                            const otherSide = g.id === "day" ? "night" : "day";
                            const elsewhere = names.length === 0 ? rowOn(row, otherSide) : [];
                            return (
                              <div key={row.key} style={{ display: "flex", gap: 10, alignItems: "baseline",
                                flexWrap: "wrap", padding: "5px 12px", borderTop: `1px solid ${T.rule}` }}>
                                <span style={{ fontFamily: T.display, fontSize: 10.5, fontWeight: 700,
                                  letterSpacing: "0.07em", textTransform: "uppercase", minWidth: 118,
                                  color: names.length ? T.text : T.bRed }}>{row.label}</span>
                                <span style={{ flex: 1, fontFamily: T.body, fontSize: 12.5,
                                  color: names.length ? T.text : T.bRed }}>
                                  {names.length
                                    ? names.map((c) => c.name).join(" · ")
                                    : elsewhere.length
                                      ? `Nobody standing — ${elsewhere.map((c) => c.name).join(", ")} ${elsewhere.length === 1 ? "is" : "are"} on ${otherSide}s`
                                      : "Nobody standing — berth unfilled"}
                                </span>
                              </div>
                            );
                          })}
                          {alsoStanding.length > 0 && (
                            <div style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
                              padding: "5px 12px", borderTop: `1px solid ${T.rule}` }}>
                              <span style={{ fontFamily: T.display, fontSize: 10.5, fontWeight: 700,
                                letterSpacing: "0.07em", textTransform: "uppercase", minWidth: 118, color: T.bOrange }}>
                                Also standing
                              </span>
                              <span style={{ flex: 1, fontFamily: T.body, fontSize: 12.5, color: T.text }}>
                                {alsoStanding.join(" · ")}
                              </span>
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  );
                };

                const swingGroup = SHIFT_GROUPS.find((g) => g.id === "swing");
                return (
                  <>
                    {groupBox(swingGroup, true)}
                    <div className="um-swing2" style={{ display: "grid", gap: 10, marginBottom: 10,
                      gridTemplateColumns: "repeat(auto-fit, minmax(330px, 1fr))" }}>
                      {SHIFT_GROUPS.filter((g) => g.id !== "swing").map((g) => groupBox(g, false))}
                    </div>
                    {noWatch > 0 && (
                      <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
                        borderLeft: `4px solid ${T.bOrange}`, borderRadius: 2, padding: "9px 13px",
                        marginBottom: 10, fontFamily: T.body, fontSize: 12.5, color: T.text }}>
                        <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 700, color: T.bOrange,
                          letterSpacing: "0.06em", marginRight: 8 }}>NO WATCH SET</span>
                        {inWatch(onboardCrew, null).map((c) => c.rank ? `${c.name} (${c.rank})` : c.name).join(" · ")}
                        {" — they count toward the swing but toward neither shift until a watch is set on the roster."}
                      </div>
                    )}
                  </>
                );
              })()}
            </>
          )}

          {notes.length > 0 && (
            <div style={{ background: T.raised, borderRadius: 2, padding: "10px 13px", marginTop: 10 }}>
              <div style={{ marginBottom: 6 }}><Eyebrow>What the reading itself said</Eyebrow></div>
              {notes.map((n, i) => (
                <div key={i} style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, lineHeight: 1.7 }}>{n}</div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* The two columns the OPMS check comes back in. Which column a disagreement is
   in is the whole point of the check - it says whose job it is to fix - so each
   carries a colour and a sentence rather than only a heading. */
const OPMS_SIDES = [
  {
    key: "ours",
    title: "Mistakes on our end",
    blurb: "OPMS says what the certificate on file says, and our matrix says something else. Our own spreadsheets are the ones to correct.",
    fg: T.bOrange, bg: T.bOrangeBg,
  },
  {
    key: "opms",
    title: "OPMS mistakes",
    blurb: "Our matrix says what the certificate on file says, and OPMS says something else. OPMS is the one to correct.",
    fg: T.teal, bg: T.raised,
  },
];

/* The rule that decides fault, in one place because it is printed in three: on
   the page above the columns, at the top of the PDF, and in the instruction the
   comparison itself is run under. The certificates are the documents themselves,
   so they are what settles it - the spreadsheet that disagrees with the scan is
   the one with the mistake, and where no scan covers the item neither side is
   blamed rather than one of them guessed at. */
const OPMS_RULE =
  "The certificates settle it. Where our matrix says what the certificates say and OPMS says something " +
  "else, OPMS is wrong. Where OPMS says what the certificates say and our matrix says something else, " +
  "our own spreadsheets are wrong. Where no certificate on file covers the item, neither side is blamed.";

/* Who is at fault, read off the two columns rather than asked for separately, so
   the sentence at the top and the lists underneath can never tell two stories. */
function opmsVerdict(ours, opms, unattributed) {
  const items = (n) => `${n} ${n === 1 ? "disagreement" : "disagreements"}`;
  const left = unattributed
    ? ` ${items(unattributed)} couldn't be put on either side, because no certificate on file covers the item.`
    : "";

  if (!ours && !opms) {
    return {
      who: unattributed ? "Neither side could be shown wrong" : "The three accounts agree",
      line: unattributed
        ? `${items(unattributed)} ${unattributed === 1 ? "was" : "were"} found and no certificate on file covers any of them, so which side is wrong isn't something the documents answer.`
        : "Our matrix, the certificates on file and the OPMS export say the same thing wherever they could be compared.",
      fg: unattributed ? T.muted : T.green,
    };
  }
  if (opms && !ours) {
    return {
      who: "OPMS is at fault",
      line: `${items(opms)} where our matrix agrees with the certificates on file and OPMS does not. Nothing on our end could be shown wrong.${left}`,
      fg: T.teal,
    };
  }
  if (ours && !opms) {
    return {
      who: "Our spreadsheets are at fault",
      line: `${items(ours)} where OPMS agrees with the certificates on file and our matrix does not. Nothing in OPMS could be shown wrong.${left}`,
      fg: T.bOrange,
    };
  }
  return {
    who: "Both sides have mistakes",
    line: `Of ${items(ours + opms)}, ${opms} ${opms === 1 ? "is" : "are"} OPMS's and ${ours} ${ours === 1 ? "is" : "are"} ours, each settled by the certificates on file.${left}`,
    fg: T.accent,
  };
}

// What the AI was leaning on. A disagreement a scanned certificate settles is a
// different thing from one it worked out from the two spreadsheets alone.
const OPMS_CONFIDENCE = {
  high: "settled by a certificate",
  medium: "no certificate covers it",
  low: "worth checking by hand",
};

// The same three, short enough for the chip the PDF writer has room for.
const OPMS_PDF_CONFIDENCE = {
  high: "certificate",
  medium: "no certificate",
  low: "check by hand",
};

// Where the bar in the progress window stands through an OPMS run. Reading the
// certificates is the long part of it, so it is given the first three fifths and
// climbs with the count; opening the export and putting the whole crew through in
// one question can't be counted the same way, so each is shown half done while it
// is under way rather than jumping to full.
const OPMS_READ_BAND = 60;
const OPMS_PHASE_PCT = { clearing: 0, sheet: 63, comparing: 82 };

/* The OPMS export, read straight off the spreadsheet in the browser. Its Data
   sheet carries one row per person per competency, and the competency names
   carry our own matrix codes on the front — "QL-01 AMSA Master II/2
   (Unlimited)" — so the two systems can be laid side by side without guessing.
   Rows whose code the matrix doesn't carry keep the sheet's own words. */
function readOPMSExport(XLSX, buf) {
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const day = (v) => {
    if (v == null || v === "") return "";
    if (v instanceof Date && !isNaN(v)) return new Intl.DateTimeFormat("en-CA").format(v);
    const n = Number(v);
    if (isFinite(n) && n > 20000 && n < 60000)
      return new Date(Date.UTC(1899, 11, 30) + n * 86400000).toISOString().slice(0, 10);
    return String(v);
  };
  // The sheet whose header carries FullName, Required Competency AND Expiry is
  // the data — the summary pivot and its list carry the first two without the
  // dates. Where more than one qualifies, the one with the most rows wins.
  let best = null;
  for (const name of wb.SheetNames) {
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true });
    const h = grid.findIndex((row) => (row || []).some((c) => String(c || "").trim() === "Required Competency"));
    if (h === -1) continue;
    const heads = grid[h].map((c) => String(c || "").trim().toLowerCase());
    // The status column wears a different name on each sheet of the workbook —
    // "Status" on the data, "Status in OPMS" on the list, "StatusName" on the
    // pivot — and "StatusKey" is none of them.
    const cName = heads.indexOf("fullname"), cComp = heads.indexOf("required competency"),
      cExp = heads.indexOf("expiry"), cIss = heads.indexOf("issued");
    const cStatus = ["status", "status in opms", "statusname"].map((w) => heads.indexOf(w)).find((i) => i !== -1);
    if (cName === -1 || cComp === -1 || cExp === -1 || cStatus === undefined) continue;
    const rows = [];
    for (let i = h + 1; i < grid.length; i++) {
      const r = grid[i] || [];
      const person = String(r[cName] || "").trim();
      const comp = String(r[cComp] || "").trim();
      if (!person || !comp) continue;
      const m = comp.match(/^([A-Z]{2}-\d{2})\s*(.*)$/);
      rows.push({
        person,
        code: m ? m[1] : "",
        item: m ? m[2] : comp,
        status: String(r[cStatus] || "").trim(),
        expiry: day(r[cExp]),
        issued: cIss === -1 ? "" : day(r[cIss]),
      });
    }
    if (rows.length && (!best || rows.length > best.length)) best = rows;
  }
  return best;
}

/* OPMS Checker. Holds the latest spreadsheet exported from OPMS, and holds it
   against our own skills matrix and the certificates we have scanned. */
function OPMSChecker() {
  const { opmsSheet, setOpmsSheet, quals, opmsAnalysis, setOpmsAnalysis, log, role,
    opmsMarks, setOpmsMarks } = usePortal();

  // A finding's identity across weekly runs: side + person + code-or-item,
  // normalised — so a mark made this week still holds when next week's run
  // reports the same disagreement.
  const markKey = (sideKey, f) =>
    `${sideKey}::${String(f.person || "crew").trim().toUpperCase()}::${String(f.code || f.item || "").trim().toUpperCase()}`;
  const markOf = (sideKey, f) => (opmsMarks || {})[markKey(sideKey, f)] || null;
  const setMark = (sideKey, f, status) => {
    const k = markKey(sideKey, f);
    const next = { ...(opmsMarks || {}) };
    if (next[k] && next[k].status === status) delete next[k];
    else next[k] = { status, on: todayISO(), by: role || "admin" };
    setOpmsMarks(next);
  };
  const [onlyOpen, setOnlyOpen] = useState(true);
  const [draftOpen, setDraftOpen] = useState(false);
  // Which finding's Details is open.
  const [detailFor, setDetailFor] = useState(null);

  // The export itself, read off the sheet in the browser, so every certificate
  // can be laid side by side — not only the disagreements the comparison
  // reported. A sheet that can't be read leaves the page to the findings.
  const [opmsRows, setOpmsRows] = useState(null);
  React.useEffect(() => {
    let dead = false;
    setOpmsRows(null);
    if (!opmsSheet || !opmsSheet.url) return;
    (async () => {
      try {
        const XLSX = await loadXLSX();
        const buf = await (await fetch(opmsSheet.url)).arrayBuffer();
        const rows = readOPMSExport(XLSX, buf);
        if (!dead) setOpmsRows(rows);
      } catch (e) {
        if (!dead) setOpmsRows(null);
      }
    })();
    return () => { dead = true; };
  }, [opmsSheet && opmsSheet.url]);

  const [run, setRun] = useState(null);       // null | { phase, read, total } | { phase: "failed", message }
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [problems, setProblems] = useState([]);
  // The run is watched from a window over the page. It can be put away — the run
  // carries on either way, and the panel under the buttons says where it is.
  const [hidden, setHidden] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const startedAt = useRef(0);

  const running = !!run && run.phase !== "failed";
  const ready = !!opmsSheet && !!(quals && quals.rows && quals.rows.length);

  // A sheet newer than the answer on file — uploaded from another page, or by
  // somebody else — starts the comparison on its own when this page opens.
  // Once per sheet per visit, and never over a run already going.
  const autoRan = useRef(null);
  React.useEffect(() => {
    if (!ready || busy || !opmsSheet || !opmsSheet.id) return;
    if (!opmsAnalysis || !opmsAnalysis.sheetId) return; // first-ever run stays a choice
    if (opmsAnalysis.sheetId === opmsSheet.id) return;
    if (autoRan.current === opmsSheet.id) return;
    autoRan.current = opmsSheet.id;
    runAnalysis(true);
  }, [ready, busy, opmsSheet && opmsSheet.id]);

  // How far through the run is: the certificates counted as they are read, and
  // the two steps after them held at the point they start from.
  const pct = !run || run.phase === "failed" ? 0
    : run.phase === "reading"
      ? (run.total ? Math.min(OPMS_READ_BAND, Math.round((run.read / run.total) * OPMS_READ_BAND)) : 0)
      : (OPMS_PHASE_PCT[run.phase] || 0);

  React.useEffect(() => {
    if (!running) return;
    const tick = () => setElapsed(Math.round((Date.now() - startedAt.current) / 1000));
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, [running]);

  const runAnalysis = async (fresh) => {
    if (!ready) return;
    setErr(""); setBusy(true); setProblems([]); setRun(null); setHidden(false);
    startedAt.current = Date.now();
    try {
      const res = await analyseOPMS({
        quals, opmsSheet, fresh, onPhase: (p) => setRun(p),
      });

      setOpmsAnalysis({
        at: res.at || new Date().toISOString(),
        by: role,
        model: res.model || "",
        sheetId: opmsSheet ? opmsSheet.id : null,
        sheet: res.sheet || null,
        certificates: res.certificates || null,
        check: res.check || null,
        truncated: res.truncated === true,
        problems: res.problems || [],
      });
      setProblems(res.problems || []);

      // Counted off the lists, so the log line and the page can never differ.
      const sizeOf = (v) => (Array.isArray(v) ? v.length : 0);
      log("Admin", "Compared OPMS against our matrix and certificates",
        `${sizeOf(res.check && res.check.ours)} on our end · ${sizeOf(res.check && res.check.opms)} OPMS · ${
          sizeOf(res.check && res.check.unattributed)} unattributed`);
      setRun(null);
    } catch (e) {
      const message = e.message || String(e);
      setErr(message);
      // The window comes back if it had been put away — a run that stopped is the
      // one thing worth interrupting for. Closing it leaves the same message on
      // the panel below.
      setHidden(false);
      setRun({ phase: "failed", message });
    }
    setBusy(false);
  };

  const check = (opmsAnalysis && opmsAnalysis.check) || null;
  const counts = (check && check.counts) || {};
  // The lists come back from a model, so a missing key or the wrong shape is
  // something to render around rather than throw on.
  const listOf = (v) => (Array.isArray(v) ? v : []);
  const notes = listOf(check && check.notes);
  const unattributed = listOf(check && check.unattributed);
  // A model's own tally can disagree with the list it just wrote, so the three
  // attribution figures are counted off the findings on the page. Agreed and
  // compared have nothing on the page to count, so they stay as reported.
  const ours = listOf(check && check.ours);
  const opms = listOf(check && check.opms);
  const disagreements = ours.length + opms.length;
  const certs = (opmsAnalysis && opmsAnalysis.certificates) || null;
  const caveats = problems.length ? problems : listOf(opmsAnalysis && opmsAnalysis.problems);
  const verdict = check ? opmsVerdict(ours.length, opms.length, unattributed.length) : null;

  /* The results as a PDF, so the answer can be sent to whoever has to act on it
     without asking them to log in and run it themselves. It is described when the
     button is clicked, so it is always the check on the screen at that moment.

     The rule that decides fault goes at the top and the verdict under it, because
     a list of somebody else's mistakes is only worth reading alongside the reason
     each one was put on their side of the page. */
  const asPDF = () => {
    const findingItem = (f, side) => ({
      code: f.code || "",
      title: `${f.person || "The crew as a whole"} - ${f.item || "unnamed item"}`,
      status: OPMS_PDF_CONFIDENCE[f.confidence] || "",
      fg: f.confidence === "high" ? side.fg : T.muted,
      bg: f.confidence === "high" ? side.bg : T.raised,
      notes: [
        { text: `OPMS: ${f.opmsSays || "nothing"}`, fg: T.text },
        { text: `Ours: ${f.weSay || "nothing"}`, fg: T.text },
        { text: f.detail, fg: T.muted },
        { text: f.evidence, fg: side.fg },
        { text: f.action ? `To fix: ${f.action}` : "", fg: T.text },
      ],
    });

    const sheet = (opmsAnalysis && opmsAnalysis.sheet) || null;
    const ran = opmsAnalysis && opmsAnalysis.at
      ? new Date(opmsAnalysis.at).toLocaleString("en-AU", {
          day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit",
        })
      : fmtDate(TODAY);

    return {
      title: "OPMS Checker - who is at fault",
      subtitle: [
        `${VESSEL.name} ${VESSEL.nameAccent}`,
        `run ${ran}`,
        sheet ? sheet.filename : "no OPMS export on file",
        certs ? `${certs.read} of ${certs.total} certificates read` : null,
        `${ours.length} ours · ${opms.length} OPMS · ${unattributed.length} unattributed`,
      ].filter(Boolean).join(" · "),
      intro: `${verdict.who}. ${verdict.line}\n\n${OPMS_RULE}`,
      filename: `opms-check-${TODAY}.pdf`,
      empty: "Nothing to report - our matrix, the certificates on file and the OPMS export agree.",
      groups: [
        ...OPMS_SIDES.map((side) => ({
          heading: side.title,
          meta: `${listOf(check[side.key]).length}`,
          blurb: side.blurb,
          items: listOf(check[side.key]).map((f) => findingItem(f, side)),
        })),
        {
          heading: "Couldn't be put on either side",
          meta: `${unattributed.length}`,
          blurb: "The two systems disagree and no certificate on file covers the item, so which of them is wrong isn't something the documents answer.",
          items: unattributed.map((f) => findingItem(f, { fg: T.muted, bg: T.raised })),
        },
        {
          heading: "What couldn't be compared",
          meta: "",
          items: notes.map((n) => ({ code: "", title: String(n) })),
        },
      ],
    };
  };

  const tile = (label, value, colour) => (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `3px solid ${colour}`,
      borderRadius: 2, padding: "10px 13px", flex: "1 1 130px" }}>
      <Eyebrow>{label}</Eyebrow>
      <div style={{ fontFamily: T.display, fontSize: 25, fontWeight: 700, color: colour, marginTop: 5, lineHeight: 1 }}>{value}</div>
    </div>
  );

  // One disagreement as a row under its person's name: the item, then the two
  // accounts side by side — ours in the first column, OPMS's in the second,
  // both in red because they differ — whose mistake it is on the end, the
  // model's sentences behind Details, and the mark that says what has been
  // done about it. `side` is null where no certificate on file could put the
  // disagreement on either side.
  const findingRow = (f, i, side) => {
    const dKey = `${(side && side.key) || "un"}-${i}-${f.person || ""}-${f.code || f.item || ""}`;
    const openThis = detailFor === dKey;
    const val = { fontFamily: T.mono, fontSize: 11.5, color: T.bRed, flex: "1 1 150px",
      minWidth: 0, lineHeight: 1.6, overflowWrap: "anywhere" };
    return (
    <div key={dKey} style={{ padding: "8px 0", borderBottom: `1px solid ${T.rule}` }}>
      <div style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap" }}>
        <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, flex: "1 1 200px", minWidth: 0 }}>
          {f.item || "unnamed item"}
          {f.code ? <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.accent }}> {f.code}</span> : null}
        </span>
        <span style={val}>{f.weSay || "nothing"}</span>
        <span style={val}>{f.opmsSays || "nothing"}</span>
        <span style={{ display: "flex", gap: 6, alignItems: "baseline", justifyContent: "flex-end",
          flexWrap: "wrap", minWidth: 150 }}>
          {side
            ? <Chip fg={side.fg} bg={side.bg}>{side.key === "ours" ? "ours to fix" : "OPMS to fix"}</Chip>
            : <Chip fg={T.muted} bg={T.raised}>no certificate</Chip>}
          {side && OPMS_CONFIDENCE[f.confidence] && f.confidence !== "high" && (
            <Chip fg={T.muted} bg={T.raised}>{OPMS_CONFIDENCE[f.confidence]}</Chip>
          )}
          {(f.detail || f.evidence || f.action) && (
            <button className="um-btn" onClick={() => setDetailFor(openThis ? null : dKey)}
              style={{ background: "transparent", color: T.muted, fontSize: 9.5, fontWeight: 700, padding: "2px 0" }}>
              {openThis ? "Close" : "Details"}
            </button>
          )}
        </span>
      </div>
      {openThis && (
        <div style={{ background: T.raised, borderRadius: 2, padding: "8px 11px", marginTop: 6 }}>
          {f.detail && (
            <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, lineHeight: 1.6 }}>{f.detail}</div>
          )}
          {f.evidence && (
            <div style={{ fontFamily: T.body, fontSize: 12.5, color: side ? side.fg : T.muted, lineHeight: 1.6, marginTop: 4 }}>{f.evidence}</div>
          )}
          {f.action && (
            <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.text, lineHeight: 1.6, marginTop: 4 }}>{f.action}</div>
          )}
        </div>
      )}
      {/* What has been done about it — Sent to OPMS for their mistakes, Fixed
          for ours; the mark keeps its date and holds across weekly runs. A
          finding still coming back after being marked fixed is called out:
          somebody re-imported the old data. */}
      {side && side.key && (() => {
        const mk = markOf(side.key, f);
        const steps = side.key === "opms"
          ? [{ st: "sent", label: "Sent to OPMS" }, { st: "fixed", label: "Settled" }]
          : [{ st: "fixed", label: "Fixed on our side" }];
        return (
          <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", marginTop: 7 }}>
            {steps.map(({ st, label }) => {
              const on = mk && mk.status === st;
              return (
                <button key={st} className="um-btn" onClick={() => setMark(side.key, f, st)}
                  title={on ? `${label} ${fmtDate(mk.on)} — press to clear` : `Mark as ${label.toLowerCase()}`}
                  style={{ background: on ? T.accentSoft : "transparent", color: on ? T.accent : T.muted,
                    border: `1px solid ${on ? T.accent : T.rule}`, borderRadius: 2,
                    padding: "2px 8px", fontSize: 9.5, fontWeight: 700 }}>
                  {label}{on ? ` · ${fmtDate(mk.on)}` : ""}
                </button>
              );
            })}
            {mk && mk.status === "fixed" && (
              <span style={{ fontFamily: T.mono, fontSize: 9.5, fontWeight: 700, background: T.bRedBg,
                color: T.bRed, padding: "2px 7px", borderRadius: 2 }}
                title="Marked fixed, yet this run still reports it — the correction didn't land, or old data was re-imported">
                STILL APPEARING
              </span>
            )}
          </div>
        );
      })()}
    </div>
    );
  };

  return (
    <div>
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
        borderLeft: `4px solid ${opmsSheet ? T.green : T.bOrange}`, borderRadius: 2,
        padding: "15px 17px", marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 8,
          alignItems: "baseline", flexWrap: "wrap" }}>
          <Eyebrow color={opmsSheet ? T.accent : T.bOrange}>Latest OPMS spreadsheet</Eyebrow>
          <Chip fg={opmsSheet ? T.bGreen : T.bOrange} bg={opmsSheet ? T.bGreenBg : T.raised}>
            {opmsSheet ? "on file" : "not on file"}
          </Chip>
        </div>

        <div style={{ fontFamily: T.body, fontSize: 13.5, color: opmsSheet ? T.text : T.muted,
          marginTop: 10, wordBreak: "break-word" }}>
          {opmsSheet ? opmsSheet.filename : "Not on file"}
        </div>
        {opmsSheet && (
          <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 3 }}>
            {opmsSheet.uploaded ? `${fmtDate(opmsSheet.uploaded)} · ` : ""}{opmsSheet.size}
            {opmsSheet.by ? ` · ${opmsSheet.by}` : ""}
          </div>
        )}

        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginTop: 12 }}>
          {opmsSheet && <OpenLink url={opmsSheet.url} />}
          <SingleDocumentUpload
            category="opms-sheet"
            noun="OPMS spreadsheet"
            eyebrow="Upload latest spreadsheet from OPMS"
            current={opmsSheet}
            onFiled={(record) => {
              setOpmsSheet(record);
              // A new export is the whole reason to compare: the run starts
              // itself the moment the sheet lands, instead of waiting for the
              // button to be remembered.
              setTimeout(() => runAnalysis(true), 100);
            }}
            logAction="OPMS spreadsheet uploaded"
            label="Upload latest spreadsheet from OPMS"
            accept=".xlsx,.xlsm,.xls,.csv"
            variant={opmsSheet ? "quiet" : "solid"}
          />
        </div>
      </div>

      {/* The check itself. Three accounts of the same crew go in - our skills
          matrix, the certificates we have scanned, and the OPMS export - and what
          comes back is split by whose mistake each disagreement is. */}
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
        borderLeft: `4px solid ${T.accent}`, borderRadius: 2, padding: "15px 17px", marginBottom: 16 }}>
        <Eyebrow color={T.accent}>Compare the three against each other</Eyebrow>
        <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.7, marginTop: 9 }}
          title={OPMS_RULE}>
          The OPMS export, our matrix, and the certificates on file, held against one another — the
          certificates settle every disagreement, and the answer says whose mistake each one is.
          A new upload compares itself.
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginTop: 13 }}>
          <Button onClick={() => runAnalysis(false)} disabled={busy || !ready}>
            {running ? "Working..." : "Analyse spreadsheets and certificates"}
          </Button>
          {opmsAnalysis && ready && (
            <Button variant="quiet" onClick={() => runAnalysis(true)} disabled={busy}
              title="Ask the question again from the documents as they stand now, rather than showing the answer from last time">
              Run it again
            </Button>
          )}
          {running && hidden && (
            <Button variant="quiet" onClick={() => setHidden(false)}>Show progress</Button>
          )}
          {opmsAnalysis && !running && (
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
              Last run {new Date(opmsAnalysis.at).toLocaleString("en-AU", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}
              {opmsAnalysis.by ? ` · ${opmsAnalysis.by}` : ""}
            </span>
          )}
        </div>
        {!opmsSheet && (
          <div style={{ fontFamily: T.body, fontSize: 13, color: T.bOrange, lineHeight: 1.6, marginTop: 10 }}>
            Upload the latest export from OPMS first. There is nothing to compare against until it is on file.
          </div>
        )}
      </div>

      {running && (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.accent}`,
          borderRadius: 2, padding: "13px 15px", marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap", alignItems: "baseline" }}>
            <Eyebrow color={T.accent}>Analysing</Eyebrow>
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{elapsedLabel(elapsed)} elapsed</span>
          </div>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 8 }}>
            {run.phase === "clearing" && "Forgetting the last answer, so the question is asked again from the documents as they stand now."}
            {run.phase === "reading" && (run.total
              ? `Reading the certificates — ${run.read} of ${run.total}. A certificate nobody has read settles nothing, so this comes first.`
              : "Reading the certificates on file. A certificate nobody has read settles nothing, so this comes first.")}
            {run.phase === "sheet" && "Opening the OPMS export."}
            {run.phase === "comparing" && (run.waited > 20
              ? "Holding the OPMS export against our matrix and our certificates. It is one long question over the whole crew and it runs on the server, so it takes a few minutes."
              : "Holding the OPMS export against our matrix and our certificates.")}
          </div>
          {run.phase === "reading" && run.total > 0 && (
            <div className="um-bar" style={{ marginTop: 10 }}>
              <i style={{ width: `${Math.min(100, Math.round((run.read / run.total) * 100))}%` }} />
            </div>
          )}
          <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 7 }}>
            Leave the page open. Every certificate reading is kept as it is made, so a run that stops
            partway picks up where it left off rather than starting over.
          </div>
        </div>
      )}

      {/* A run takes minutes and the page underneath it can't be used until it
          finishes, so it is watched from a window rather than a panel that
          scrolls away. The figure and the clock both climb while it works. */}
      {run && !hidden && (
        <AnalysisWindow
          eyebrow="Comparing OPMS against our records"
          pct={pct}
          elapsed={elapsed}
          failed={run.phase === "failed"}
          message={run.message}
          failNote={run.read > 0
            ? `The ${run.read} ${run.read === 1 ? "certificate" : "certificates"} already read ${run.read === 1 ? "was" : "were"} kept, so running it again carries on from there rather than starting over.`
            : "Nothing was read, so nothing has changed. Running it again starts from the beginning."}
          body={<>
            {run.phase === "clearing" && "Forgetting the last answer, so the question is asked again from the documents as they stand now."}
            {run.phase === "reading" && (run.total
              ? `${run.read} of ${run.total} certificates read. A certificate nobody has read settles nothing, so this comes first.`
              : "Looking for certificates to read. A certificate nobody has read settles nothing, so this comes first.")}
            {run.phase === "sheet" && "Every certificate read. Opening the OPMS export."}
            {run.phase === "comparing" && (run.waited > 20
              ? "Holding the OPMS export against our matrix and our certificates. It is one long question over the whole crew and it runs on the server, so it takes a few minutes."
              : "Holding the OPMS export against our matrix and our certificates.")}
          </>}
          note="Leave the page open. Every certificate reading is kept as it is made, so a run that stops partway picks up where it left off rather than starting over."
          onHide={() => setHidden(true)}
          onClose={() => setRun(null)}
        />
      )}

      {(err || (run && run.phase === "failed")) && (
        <div style={{ background: T.bRedBg, border: `1px solid ${T.bRed}`, borderRadius: 2,
          padding: "13px 15px", marginBottom: 16 }}>
          <Eyebrow color={T.bRed}>The analysis stopped</Eyebrow>
          <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.7, marginTop: 8 }}>
            {err || (run && run.message)}
          </div>
        </div>
      )}

      {caveats.length > 0 && (
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.bOrange, lineHeight: 1.7, marginBottom: 14 }}>
          {caveats.map((p, i) => <div key={i}>{p}</div>)}
        </div>
      )}

      {!check ? (
        <Empty>
          {ready
            ? "Nothing has been compared yet. Analyse spreadsheets and certificates reads the certificates on file, then holds the OPMS export against them and against our skills matrix."
            : "The OPMS export has to be on file before anything can be compared."}
        </Empty>
      ) : (
        <>
          {/* Who is at fault, first and in its own words, because it is the
              question the page is here to answer. The rule it was decided by is
              underneath it rather than left on the columns further down. */}
          <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
            borderLeft: `4px solid ${verdict.fg}`,
            borderRadius: 2, padding: "15px 17px", marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", gap: 10,
              alignItems: "baseline", flexWrap: "wrap" }}>
              <Eyebrow color={verdict.fg}>
                {disagreements === 0 ? "Nothing to apportion" : "Who is at fault"}
              </Eyebrow>
              <span style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                <Chip fg={verdict.fg} bg={T.raised}>
                  {disagreements === 0 ? "no disagreements" : `${disagreements} to answer for`}
                </Chip>
                <Chip fg={T.accent} bg={T.raised}>{counts.agree || 0} agreed of {counts.compared || 0} compared</Chip>
                {unattributed.length > 0 && <Chip fg={T.muted} bg={T.raised}>{unattributed.length} unattributed</Chip>}
              </span>
            </div>
            <div style={{ fontFamily: T.display, fontSize: 20, fontWeight: 700, color: verdict.fg,
              marginTop: 9, lineHeight: 1.3 }}>
              {verdict.who}
            </div>
            <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 6 }}>
              {verdict.line}
            </div>
            <div style={{ fontFamily: T.body, fontSize: 15, color: T.text, lineHeight: 1.7, marginTop: 9 }}>
              {check.headline}
            </div>
            <details style={{ marginTop: 9, borderTop: `1px solid ${T.rule}`, paddingTop: 7 }}>
              <summary style={{ fontFamily: T.mono, fontSize: 10.5, color: T.muted, cursor: "pointer" }}>
                How this was decided
                {opmsAnalysis.sheet ? ` · ${opmsAnalysis.sheet.filename}` : ""}
                {certs ? ` · ${certs.read}/${certs.total} certificates read` : ""}
              </summary>
              <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, lineHeight: 1.6, marginTop: 6 }}>
                {OPMS_RULE}
              </div>
            </details>
            {certs && certs.unread > 0 && (
              <div style={{ fontFamily: T.body, fontSize: 13, color: T.bOrange, lineHeight: 1.6, marginTop: 8 }}>
                {certs.unread} {certs.unread === 1 ? "certificate has" : "certificates have"} not been read, so
                nothing they carry settled anything here. Run it again to take them in.
              </div>
            )}
            {/* An answer that filled the room it was given is still an answer —
                everything on the page was compared properly — but it is the top
                of the comparison rather than all of it, and nobody should read
                an empty column underneath as "nothing wrong on that side". */}
            {opmsAnalysis.truncated && (
              <div style={{ fontFamily: T.body, fontSize: 13, color: T.bOrange, lineHeight: 1.6, marginTop: 8 }}>
                This comparison was cut short before it reached the end of the crew. What is below was
                compared in full and is the most serious of what was found, but there may be more that
                wasn't reached. Take out the crew already dealt with, or split the export, and run it again.
              </div>
            )}
            {/* Everything on this page, on paper, for whoever has to act on it. */}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginTop: 13 }}>
              <DownloadPDF build={asPDF} label="Save the results as a PDF" />
            </div>
          </div>


          {/* The two columns the whole page is for. Side by side where there is
              room, and stacked on a phone, where they read as two lists. */}
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 10 }}>
            <Button variant={onlyOpen ? "solid" : "quiet"}
              title="Hide findings already marked sent or fixed, so the columns show only what still needs somebody"
              onClick={() => setOnlyOpen(!onlyOpen)}>
              Unresolved only
            </Button>
            {opms.length > 0 && (
              <Button variant="quiet" onClick={() => setDraftOpen(!draftOpen)}>
                {draftOpen ? "Close the email draft" : "Draft the email to OPMS"}
              </Button>
            )}
          </div>

          {/* The email to OPMS, written from the findings on their side: what
              their export has wrong, what the certificate on file shows, one
              block per item. Copy it, attach the PDF above, send. */}
          {draftOpen && (() => {
            const openOnes = opms.filter((f) => { const m = markOf("opms", f); return !m || m.status !== "fixed"; });
            const body = [
              `Hi PK,`,
              ``,
              `Our weekly check of the TR02 export against the certificates on file has found ${openOnes.length} item${openOnes.length === 1 ? "" : "s"} where the export doesn't match the certificate. Details below — scans are on file with us if you need copies.`,
              ``,
              ...openOnes.flatMap((f, n) => [
                `${n + 1}. ${f.person || "Crew-wide"} — ${f.item}${f.code ? ` (${f.code})` : ""}`,
                `   OPMS shows: ${f.opmsSays || "nothing"}`,
                `   Certificate on file: ${f.evidence || f.weSay || "see scan"}`,
                ...(f.action ? [`   Please: ${f.action}`] : []),
                ``,
              ]),
              `Could these be corrected before next week's export? Happy to send the scans through.`,
              ``,
              `Thanks,`,
              `${role || ""}`,
            ].join("\n");
            return (
              <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.teal}`,
                borderRadius: 2, padding: "13px 15px", marginBottom: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "baseline", flexWrap: "wrap" }}>
                  <Eyebrow color={T.teal}>Email to OPMS · {openOnes.length} item{openOnes.length === 1 ? "" : "s"}</Eyebrow>
                  <span style={{ display: "flex", gap: 8 }}>
                    <Button variant="quiet" onClick={() => {
                      const ta = document.getElementById("opms-email-draft");
                      if (ta) { ta.select(); try { navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand("copy"); } }
                    }}>Copy</Button>
                    <Button variant="quiet" onClick={() => {
                      const next = { ...(opmsMarks || {}) };
                      openOnes.forEach((f) => { const k = markKey("opms", f);
                        if (!next[k]) next[k] = { status: "sent", on: todayISO(), by: role || "admin" }; });
                      setOpmsMarks(next);
                    }}>Mark all as sent</Button>
                  </span>
                </div>
                <textarea id="opms-email-draft" readOnly value={body} rows={Math.min(18, 6 + openOnes.length * 4)}
                  style={{ width: "100%", marginTop: 10, fontFamily: T.mono, fontSize: 11.5, lineHeight: 1.6,
                    color: T.text, background: T.raised, border: `1px solid ${T.rule}`, borderRadius: 2, padding: 10 }} />
                <div style={{ fontFamily: T.body, fontSize: 12, color: T.muted, marginTop: 6 }}>
                  Copy this into an email to PK, attach the PDF from above for the detail, and press
                  Mark all as sent so next week's run remembers.
                </div>
              </div>
            );
          })()}

          {/* Every certificate side by side, filed under its person. Each crew
              member on the matrix is a fold holding every item either system
              carries: our expiry in the first column, the OPMS export's in the
              second, and the rows — and names — where the two disagree in red.
              The comparison's findings ride on their rows: whose mistake it
              is, the model's sentences behind Details, and the marks. */}
          {(() => {
            const withSide = [
              ...ours.map((f) => ({ f, side: OPMS_SIDES[0] })),
              ...opms.map((f) => ({ f, side: OPMS_SIDES[1] })),
              ...unattributed.map((f) => ({ f, side: null })),
            ];
            const shown = withSide.filter(({ f, side }) => !onlyOpen || !side || !markOf(side.key, f));
            const keyOf = (p) => String(p || "").trim().toUpperCase();
            // The model and the export write names their own way ("Ryan
            // Stewart") and the matrix its way ("STEWART, Ryan"), so the same
            // matching a dropped certificate folder gets decides who each row
            // is about.
            const names = quals && quals.rows ? quals.rows.map((r) => r[0]) : [];
            const canon = (p) => (p ? matchRoster(p, names) || p : "");
            const known = new Set(names.map(keyOf));
            const extras = [];
            shown.forEach(({ f }) => {
              const k = keyOf(canon(f.person));
              if (k && !known.has(k) && !extras.some((e) => keyOf(e) === k)) extras.push(canon(f.person));
            });
            const findsFor = (n) => shown.filter(({ f }) => keyOf(canon(f.person)) === keyOf(n));
            const crewWide = shown.filter(({ f }) => !keyOf(f.person));

            // The export's rows filed under the same names.
            const opmsBy = {};
            (opmsRows || []).forEach((r) => {
              const k = keyOf(canon(r.person));
              (opmsBy[k] = opmsBy[k] || []).push(r);
            });

            /* One person's certificates, both accounts side by side: every
               matrix item either side carries, then whatever the export has
               that the matrix doesn't. What each side says is reduced to a
               date, "held" or "not held" so the two can be compared without
               guessing; a side that says nothing comparable is never called a
               difference, and an item held once and for good keeping a date in
               one system and "held" in the other blames neither. */
            const sideBySide = (n) => {
              const row = (quals.rows || []).find((r) => r[0] === n);
              const vals = row ? row[3] : null;
              const mine = opmsBy[keyOf(n)] || [];
              const used = new Set();
              const items = [];
              (quals.cols || []).forEach((c, i) => {
                const code = c[0];
                const ourRaw = vals && vals[i] != null ? String(vals[i]).trim() : "";
                const o = mine.find((r) => r.code === code && !used.has(r)) || null;
                if (o) used.add(o);
                if (!ourRaw && !o) return;
                const ourKey = !ourRaw ? null
                  : /^y$/i.test(ourRaw) ? "held"
                  : /^n$/i.test(ourRaw) ? "not held"
                  : ourRaw === "?" ? null : ourRaw;
                const opmsKey = !o ? (mine.length ? "not carried" : null)
                  // "Perpetual" and its kin are an expiry column's way of
                  // saying held for good, not a date to disagree over.
                  : o.expiry ? (/^\d{4}-/.test(o.expiry) ? o.expiry : "held")
                  : /in date|about to expire|overridden/i.test(o.status) ? "held"
                  : /missing|outstanding|expired/i.test(o.status) ? "not held" : null;
                const diff = ourKey != null && opmsKey != null && ourKey !== opmsKey
                  && !(ourKey === "held" && /^\d{4}-/.test(opmsKey))
                  && !(opmsKey === "held" && /^\d{4}-/.test(ourKey));
                items.push({ code, title: c[1], ourRaw, o, diff, inExport: mine.length > 0 });
              });
              mine.forEach((r) => {
                if (!used.has(r)) items.push({ code: r.code, title: r.item, ourRaw: "", o: r,
                  diff: false, offMatrix: true, inExport: true });
              });
              return items;
            };

            const ourText = (it) => !it.ourRaw ? "—"
              : /^y$/i.test(it.ourRaw) ? "Held (no expiry)"
              : /^n$/i.test(it.ourRaw) ? "Not held"
              : it.ourRaw === "?" ? "Unknown" : colDate(it.ourRaw);
            const opmsText = (it) => !it.o
              ? (it.inExport ? "not carried" : "—")
              : [it.o.expiry ? (/^\d{4}-/.test(it.o.expiry) ? colDate(it.o.expiry) : it.o.expiry) : "",
                 it.o.status && !/^in date$/i.test(it.o.status) ? it.o.status : ""]
                  .filter(Boolean).join(" · ") || (it.o.status || "—");

            const head = { fontFamily: T.display, fontSize: 9.5, fontWeight: 700,
              letterSpacing: "0.1em", textTransform: "uppercase", color: T.muted };

            // One item's row: the two accounts in red where they differ or the
            // comparison flagged them, with that finding's verdict and marks.
            const dataRow = (n, it, i, finds) => {
              const fr = finds.find(({ f }) => it.code && keyOf(f.code) === keyOf(it.code)) || null;
              const hot = it.diff || !!fr;
              const cell = { fontFamily: T.mono, fontSize: 11, flex: "1 1 130px", minWidth: 0,
                lineHeight: 1.6, overflowWrap: "anywhere",
                color: hot ? T.bRed : (it.offMatrix || !it.ourRaw || !it.o) ? T.muted : T.text };
              const dKey = `data-${n}-${it.code || it.title}-${i}`;
              const openThis = detailFor === dKey;
              const f = fr && fr.f, side = fr && fr.side;
              return (
                <div key={dKey} style={{ padding: "6px 0", borderBottom: `1px solid ${T.rule}` }}>
                  <div style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap" }}>
                    <span style={{ fontFamily: T.body, fontSize: 12.5, color: hot ? T.bRed : T.text,
                      flex: "1 1 220px", minWidth: 0 }}>
                      {it.title || "unnamed item"}
                      {it.code ? <span style={{ fontFamily: T.mono, fontSize: 10, color: T.accent }}> {it.code}</span> : null}
