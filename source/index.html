        fontFamily: T.mono, fontSize: 9.5, lineHeight: 1.25,
        cursor: openable ? "pointer" : undefined }}>{b.text}</div>
  );
}

/* ---- the position somebody works in, against the ticket they hold -------- */
/* Crew don't always work in the position their certificate of competency is
   for. A Master's ticket sails a swing as Chief Officer to cover a rotation, an
   Assistant Engineer holds an Engineer Class 2, a GPH holds a Master <45m. None
   of that is wrong — it is how a two-crew rotation gets filled — but the matrix
   hides it, because every hatched cell on the grid means "not required for this
   position" and the position is the only thing that is worked out from. Read
   against a position that isn't the one the person is ticketed for, somebody's
   requirements are the wrong set, and nothing on the grid says so.

   So the two are held against each other and the difference is put on the
   table in a colour of its own. Nothing is decided here and nothing is marked
   wrong: whether a person may fill a position is the office's call, on the
   vessel's manning approval. This only says the two don't line up, and which
   way. */

/* Every certificate of competency the matrix carries, on one ladder.
   The grade is the size of job the ticket covers — 1 a rating, 6 unlimited
   command or chief engineer — so a ticket and a position can be compared. The
   stream is the department it belongs to: a deck ticket says nothing about
   whether somebody can stand an engine room watch. */
const TICKETS = {
  "QL-01": { grade: 6, stream: "deck", short: "Master" },
  "QL-02": { grade: 5, stream: "deck", short: "Chief Mate" },
  "QL-03": { grade: 4, stream: "deck", short: "Master <100m NC" },
  "QL-04": { grade: 3, stream: "deck", short: "Master <45m NC" },
  "QL-08": { grade: 2, stream: "deck", short: "Master <24m NC" },
  "QL-05": { grade: 6, stream: "engine", short: "Engineer Class 1" },
  "QL-06": { grade: 5, stream: "engine", short: "Engineer Class 2" },
  "QL-07": { grade: 3, stream: "engine", short: "Engineer Class 3 NC" },
  "QL-09": { grade: 2, stream: "engine", short: "Marine Engine Driver 2" },
  // A rating's ticket covers both sides of the vessel - Able Seafarer Deck and
  // Able Seafarer Engineer are the one certificate - so it counts either way.
  "QL-10": { grade: 1, stream: "both", short: "Integrated Rating" },
  "QL-11": { grade: 1, stream: "catering", short: "Marine Cook" },
};

/* What each position is normally held against: the department it sits in, the
   lowest ticket that covers the job, and the highest the job is ordinarily
   filled by. Positions are spelled by whoever typed the spreadsheet, so they
   are matched loosely and the first line that matches settles it - which is why
   "Chief Officer - 100m" is asked before the general Chief Officer line, and
   why Chief Engineer is asked before Assistant Engineer's catch-all. */
const POSITION_TICKET = [
  [/^\s*master/i, { stream: "deck", min: 6, upto: 6, expects: "a Master's ticket" }],
  [/chief\s*(officer|mate).*unlimited/i,
    { stream: "deck", min: 5, upto: 5, expects: "Chief Mate or a Master's ticket" }],
  [/chief\s*(officer|mate)/i,
    { stream: "deck", min: 4, upto: 5, expects: "Master <100m NC or Chief Mate" }],
  [/(second|third)\s*(mate|officer)/i,
    { stream: "deck", min: 3, upto: 4, expects: "Master <45m NC or Master <100m NC" }],
  [/chief\s*engineer/i, { stream: "engine", min: 6, upto: 6, expects: "Engineer Class 1" }],
  [/(first|second)\s*engineer/i, { stream: "engine", min: 5, upto: 5, expects: "Engineer Class 2" }],
  [/engineer|engine\s*driver/i,
    { stream: "engine", min: 2, upto: 3, expects: "Marine Engine Driver 2 or Engineer Class 3 NC" }],
  [/\b(gph|general\s*purpose|integrated\s*rating|deck\s*hand|deckhand|able\s*seafarer)\b/i,
    { stream: "deck", min: 1, upto: 2, expects: "an Integrated Rating ticket" }],
  [/\b(cook|chef|caterer|steward)\b/i, { stream: "catering", min: 1, upto: 1, expects: "Marine Cook" }],
];

// How a department reads in a sentence.
const STREAM_WORD = { deck: "deck", engine: "engine room", catering: "catering", both: "rating's" };

/**
 * Where somebody's ticket sits against the position they work in.
 *
 * Nothing comes back when the two line up, or when the position isn't one the
 * portal holds an expectation for - there is nothing to say and nothing to
 * colour. Otherwise it says which way they differ:
 *
 *   strong  - the tickets on the matrix don't reach the position, or the only
 *             ones on it belong to another department. Somebody is filling a job
 *             their certificate doesn't cover, which is the one worth a look.
 *   quiet   - they hold a ticket for a bigger job than the one they are in. Not
 *             a problem in itself, but the matrix reads their requirements off
 *             the position, so the higher ticket's items are never asked of
 *             them - and it is worth knowing who can step up when a swing is
 *             short.
 *
 * A ticket counts as held when its cell holds anything other than "N". Whether
 * it is still in date is the expiry bands' business, not this one - the band
 * comes back with each ticket so the panel can show it either way. A "?" is
 * carried through too, so what isn't confirmed can be said out loud.
 */
function ticketStandingFor(row, QUALS) {
  // A matrix filed with its competency columns coded some other way carries no
  // ticket this can read, and every name on it would come back "no ticket" -
  // a page of violet saying nothing. Where the sheet has no ticket column at
  // all, it isn't a matrix that records tickets and there is nothing to say.
  if (!QUALS.cols.some((c) => TICKETS[c[0]])) return null;

  const hit = POSITION_TICKET.find(([re]) => re.test(row[1] || ""));
  if (!hit) return null;
  const want = hit[1];
  const position = row[1];

  const held = QUALS.cols
    .map((c, i) => ({ code: c[0], title: c[1], value: row[3][i] }))
    .filter((x) => TICKETS[x.code] && x.value && String(x.value).trim().toUpperCase() !== "N")
    .map((x) => ({ ...x, ...TICKETS[x.code], band: bandFor(x.value),
      unconfirmed: String(x.value).trim() === "?" }))
    .sort((a, b) => b.grade - a.grade);

  // Only the tickets that count for the department the position sits in.
  const mine = held.filter((x) => x.stream === want.stream || x.stream === "both");
  const top = mine.length ? mine[0].grade : 0;
  const base = { position, expects: want.expects, held, mine };
  const list = (xs) => xs.map((x) => x.short).join(", ");

  if (held.length === 0) return {
    ...base, way: "none", strong: true, label: "No ticket on the matrix",
    note: `Works as ${position}. No certificate of competency is recorded against this name -`
      + ` the position is normally held against ${want.expects}.`,
  };

  if (mine.length === 0) return {
    ...base, way: "aside", strong: true, label: "Ticket is another department's",
    note: `Works as ${position}, ${STREAM_WORD[want.stream]} side, and holds ${list(held)} -`
      + ` no ${STREAM_WORD[want.stream]} ticket. The position is normally held against ${want.expects}.`,
  };

  if (top < want.min) return {
    ...base, way: "above", strong: true, label: "Working above the ticket held",
    note: `Works as ${position} and holds ${list(mine)}. The position is normally held against`
      + ` ${want.expects}, so this is a bigger job than the ticket covers.`,
  };

  if (top > want.upto) return {
    ...base, way: "higher", strong: false, label: "Holds a higher ticket than the position",
    note: `Works as ${position} and holds ${list(mine)}. The position is normally held against`
      + ` ${want.expects}, so the matrix only asks this person for the ${position} items -`
      + ` what the higher ticket carries is not tracked here.`,
  };

  return null;
}

// Reads the crew qualification workbook in the browser. SheetJS is fetched on
// demand rather than loaded on every visit.
function loadXLSX() {
  if (typeof window === "undefined") return Promise.reject(new Error("no browser"));
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    // Only needed for a spreadsheet upload, and the failure is reported on the
    // page that asked for it — so the fatal banner leaves this one alone.
    el.setAttribute("data-optional", "1");
    el.crossOrigin = "anonymous";
    el.onload = () => (window.XLSX ? res(window.XLSX) : rej(new Error("SheetJS failed to load")));
    el.onerror = () => rej(new Error("Couldn't download the spreadsheet reader - check the connection"));
    document.head.appendChild(el);
  });
}

const isoOf = (v) => {
  if (v instanceof Date && !isNaN(v)) {
    return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
  return null;
};

// Pull the same shape out of the workbook that the portal already holds.
// Only crew and their dates are taken - the columns already on the page stay as they are.
function parseWorkbook(XLSX, buf, current) {
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const name = wb.SheetNames.find((n) => n.toUpperCase().includes("CREW EXPIRY")) || wb.SheetNames[0];
  const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true });

  // row 14 holds the item codes, row 15 the titles, crew start on row 16
  const codes = (grid[13] || []).map((c) => (c == null ? "" : String(c).trim()));
  if (!codes.some((c) => /^[A-Z]{2}-\d/.test(c))) {
    throw new Error(`Couldn't find the item codes on sheet "${name}" - is this the right workbook?`);
  }

  // map each column the portal already knows about to its column in the file
  const colFor = {};
  current.cols.forEach((c, idx) => {
    const at = codes.indexOf(c[0]);
    if (at >= 0) colFor[idx] = at;
  });

  const incoming = [];
  for (let r = 15; r < grid.length; r++) {
    const row = grid[r] || [];
    const nm = row[1] == null ? "" : String(row[1]).trim();
    if (!nm) continue;
    const vals = current.cols.map((_, idx) => {
      const at = colFor[idx];
      if (at === undefined) return null;
      const raw = row[at];
      if (raw == null || raw === "") return "";
      const iso = isoOf(raw);
      return iso || String(raw).trim();
    });
    incoming.push({ name: nm, pos: String(row[2] || "").trim(), sam: String(row[3] || "").trim(), vals });
  }
  if (!incoming.length) throw new Error("No crew rows found in that file.");
  return incoming;
}

/**
 * A document the portal keeps exactly one of.
 *
 * One file is kept on the server per document — the crew certificates spreadsheet,
 * the training matrix, the skills matrix — and uploading a new one replaces it.
 * Because that takes the old one out of the portal, the replacement is never
 * silent: the first attempt writes nothing and comes back with the file that is
 * already there, which is put in front of the uploader to accept.
 *
 * `onFiled` is handed the new record once it is down, so the caller can put it on
 * the page and act on it — filing a matrix is what sets the analysis going.
 */
function SingleDocumentUpload({
  category,
  noun,
  eyebrow,
  blurb = "",
  current,
  onFiled,
  logAction,
  label,
  footnote = "",
  accept = ".xlsx,.xlsm,.xls,.csv,.pdf",
  variant = "quiet",
}) {
  const { log, role } = usePortal();
  const [step, setStep] = useState(null);      // null | "file" | "overwrite" | "done"
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [pending, setPending] = useState(null);
  const [result, setResult] = useState(null);
  const fileRef = useRef(null);

  const close = () => { setStep(null); setErr(""); setPending(null); setResult(null); };

  const send = async (file, decide) => {
    setBusy(true); setErr("");
    try {
      const res = await uploadSingleDocument(
        file, category, { uploadedBy: role, filedOn: todayISO(), session: SESSION }, decide,
      );

      if (res.overwrite) {
        // Nothing was written. Show what would go, and ask.
        setPending({ file, existing: res.existing || [] });
        setStep("overwrite");
      } else if (res.record) {
        const replaced = res.replaced || [];
        onFiled(res.record, replaced);
        setResult({ record: res.record, replaced });
        setStep("done");
        log("Admin", logAction,
          replaced.length ? `${res.record.filename} - replaced ${replaced[0].filename}` : res.record.filename);
      }
    } catch (e) {
      setErr(e.message || String(e));
      setStep("file");
    }
    setBusy(false);
    if (fileRef.current) fileRef.current.value = "";
  };

  const onPick = (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) send(f, "ask");
  };

  return (
    <>
      <button className="um-btn um-tab" onClick={() => { close(); setStep("file"); }}
        style={{ background: variant === "solid" ? T.accent : T.panel,
          color: variant === "solid" ? "#FFF" : T.text,
          border: `1px solid ${variant === "solid" ? T.accent : T.rule}`,
          fontSize: 11, fontWeight: 700, padding: "9px 14px", borderRadius: 2, whiteSpace: "nowrap" }}>
        {label}
      </button>

      {step && (
        <div style={{ position: "fixed", inset: 0, zIndex: 80, background: "rgba(18,41,61,0.45)",
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 3,
            padding: 20, width: "100%", maxWidth: 460 }}>

            {step === "file" && (
              <DropSpot disabled={busy} accept={accept}
                onFile={(f) => send(f, "ask")}
                onReject={(f) => setErr(`${f.name} isn't a file type this takes (${accept.replaceAll(",", ", ")}).`)}>
                <div style={{ marginBottom: 5 }}><Eyebrow color={T.accent}>{eyebrow}</Eyebrow></div>
                {blurb && (
                  <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 14 }}>
                    {blurb}
                  </div>
                )}

                {current ? (
                  <div style={{ background: T.raised, borderRadius: 2, padding: "9px 11px", marginBottom: 14,
                    display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ marginBottom: 4 }}><Eyebrow>On file now</Eyebrow></div>
                      <div style={{ fontFamily: T.body, fontSize: 13, color: T.text, wordBreak: "break-word" }}>
                        {current.filename}
                      </div>
                      <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 2 }}>
                        {current.uploaded ? `${fmtDate(current.uploaded)} · ` : ""}{current.size}
                      </div>
                    </div>
                    <OpenLink url={current.url} />
                  </div>
                ) : (
                  <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, marginBottom: 14 }}>
                    No {noun} has been filed yet.
                  </div>
                )}

                <input ref={fileRef} type="file" accept={accept}
                  style={{ display: "none" }} onChange={onPick} />
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                  <Button onClick={() => fileRef.current && fileRef.current.click()}>
                    {busy ? "Uploading..." : current ? `Choose a newer ${noun}` : `Choose ${noun}`}
                  </Button>
                  <Button variant="quiet" onClick={close}>Cancel</Button>
                  <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>or drag it onto this box</span>
                </div>
                {err && (
                  <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, marginTop: 14, lineHeight: 1.6 }}>{err}</div>
                )}
              </DropSpot>
            )}

            {step === "overwrite" && pending && (
              <>
                <div style={{ marginBottom: 5 }}><Eyebrow color={T.bOrange}>There is already a {noun} on file</Eyebrow></div>
                <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginBottom: 14 }}>
                  Only one {noun} is kept, so uploading{" "}
                  <strong style={{ fontWeight: 600 }}>{pending.file.name}</strong> replaces the one
                  that is there. Nothing has been saved yet.
                </div>

                <div style={{ background: T.raised, borderRadius: 2, padding: "9px 11px", marginBottom: 16 }}>
                  <div style={{ marginBottom: 7 }}><Eyebrow>Would be overwritten</Eyebrow></div>
                  {pending.existing.map((e) => (
                    <div key={e.id} style={{ display: "flex", justifyContent: "space-between", gap: 10,
                      alignItems: "center", flexWrap: "wrap", padding: "4px 0" }}>
                      <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, wordBreak: "break-word" }}>
                        {e.filename}
                        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
                          {" "}· {e.size}{e.uploaded ? ` · filed ${fmtDate(e.uploaded)}` : ""}
                          {e.by ? ` · ${e.by}` : ""}
                        </span>
                      </span>
                      <OpenLink url={e.url} />
                    </div>
                  ))}
                </div>

                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <Button onClick={() => send(pending.file, "replace")}>
                    {busy ? "Overwriting..." : "Overwrite it"}
                  </Button>
                  <Button variant="quiet" onClick={() => { setPending(null); setStep("file"); }}>
                    Keep the one on file
                  </Button>
                </div>
                {err && (
                  <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, marginTop: 14, lineHeight: 1.6 }}>{err}</div>
                )}
              </>
            )}

            {step === "done" && result && (
              <>
                <div style={{ marginBottom: 5 }}><Eyebrow color={T.green}>{noun} uploaded</Eyebrow></div>
                <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginBottom: 6 }}>
                  {result.record.filename}
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginBottom: 14, wordBreak: "break-all" }}>
                  {result.record.path}
                </div>
                <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 16 }}>
                  {result.replaced.length
                    ? `It overwrote ${result.replaced[0].filename}, which is no longer on the portal — it is kept in the removed list.`
                    : `It is the first ${noun} filed, so nothing was overwritten.`}
                  {footnote ? ` ${footnote}` : ""}
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <Button onClick={close}>Done</Button>
                  <OpenLink url={result.record.url} />
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </>
  );
}

/**
 * The crew certificates spreadsheet, as a single-file upload.
 *
 * Filing one also moves the "matrix updated" date the certification screens read
 * from, because that date is about the spreadsheet rather than about the portal.
 */
function UpdateSpreadsheet({ label = "Upload or replace the spreadsheet", variant = "quiet" }) {
  const { certSheet, setCertSheet, setMatrixUpdated, runMatrixAuto } = usePortal();
  return (
    <SingleDocumentUpload
      category="certificate-sheet"
      noun="spreadsheet"
      eyebrow="Crew certificates spreadsheet"
      blurb="One spreadsheet is kept on the portal - the latest. Uploading a newer one replaces it, and the certification screens read from whichever is on file."
      current={certSheet || null}
      onFiled={(record) => {
        setCertSheet(record);
        setMatrixUpdated(todayISO());
        // The crew matrix follows the new spreadsheet on its own: it is held
        // against the certificates on file and whatever they settle is written
        // in — the same run that follows a filing of certificates.
        runMatrixAuto({ certSheet: record, origin: "spreadsheet" });
      }}
      logAction="Spreadsheet uploaded"
      label={label}
      footnote={`Date last updated now reads ${fmtDate(TODAY)}.`}
      variant={variant}
    />
  );
}

// Every item for one person that isn't blank, soonest first.

function itemsFor(row, QUALS) {
  return QUALS.cols
    .map((c, i) => ({ code: c[0], title: c[1], group: c[2], value: row[3][i], band: bandFor(row[3][i]) }))
    .filter((x) => x.band)
    .sort((a, b) => {
      const ad = a.band.date ? daysTo(a.band.date) : 9e5;
      const bd = b.band.date ? daysTo(b.band.date) : 9e5;
      return ad - bd;
    });
}

// How a band reads as a short status - on screen and on the printed page.
function bandLabel(band) {
  if (!band.date) return band.text;
  const d = daysTo(band.date);
  return d < 0 ? `Expired ${Math.abs(d)} days ago` : `${d} days`;
}

function BandTag({ band }) {
  return (
    <span style={{ background: band.bg, color: band.fg, fontFamily: T.mono, fontSize: 10.5,
      fontWeight: 600, padding: "3px 7px", borderRadius: 2, whiteSpace: "nowrap" }}>{bandLabel(band)}</span>
  );
}

/* ---- the issue date and expiry date columns ------------------------------ */
/* The certification screens carry two date columns per item. The expiry is
   what the matrix cell itself holds; the issue date only exists on the
   certificates, so it comes from the readings the portal keeps of every scan
   on file — fetched once, shared, and refreshed by Update table. */

const colDate = (iso) =>
  iso && /^\d{4}-\d{2}-\d{2}/.test(String(iso)) ? String(iso).slice(0, 10).split("-").reverse().join("/") : "—";

// The dates held for one person and matrix code, out of the shared store.
const certDateFor = (dates, person, code) => {
  const d =
    (dates && dates.map &&
      dates.map[`${String(person || "").trim().toUpperCase()}::${String(code || "").trim().toUpperCase()}`]) || null;
  // An item that never lapses keeps its issue date but hands back no expiry,
  // whatever an old reading wrote down.
  if (d && d.expires != null && noExpiryPeriod(code)) return { ...d, expires: null };
  return d;
};

// The certificate behind one line, as a link. First choice is the scan the
// last Update table run settled the dates from; where that run predates the
// link being kept (or hasn't run yet), the scan filed under that person with
// that code picked at upload answers instead.
const certLinkFor = (dates, certificates, person, code) => {
  const d = certDateFor(dates, person, code);
  if (d && d.url) return d.url;
  const P = String(person || "").trim().toUpperCase();
  const C = String(code || "").trim().toUpperCase();
  const f = (certificates || []).find(
    (c) => c.url && String(c.person || "").trim().toUpperCase() === P
      && String(c.qualCode || "").trim().toUpperCase() === C,
  );
  return f ? f.url : null;
};

/* Matrix items that carry no expiry date at all, for every crew member.

   The validity periods matrix is a document the office files and the model
   reads, so anything it doesn't list leaves the column blank. A handful of items
   don't need asking: they are sat once and never lapse, which is a fact about
   the item rather than something to be read off a scan. Written down here they
   read as "Doesn't expire" for the whole crew whether or not a validity periods
   matrix is on file, and they are what the certificate comparison settles them
   against too.

   The same list is in lib/analysis.ts as NO_EXPIRY_CODES, for the comparison
   that runs on the server. This page has no bundler and can't import it, so the
   two are kept in step by hand — change one and change the other.

     VS-04  Helm CONNECT - Crew Basic + Jobs — e-learning, completed once, no expiry. */
const NO_EXPIRY_CODES = ["VS-04"];

/* Items whose expiry is printed on the certificate itself and only there. The
   AMSA medical says on its own face whether it runs one year or two, so no
   validity period is ever used to work its expiry out, and the validity column
   says to read the certificate rather than printing the sheet's general guide.
   Mirrored in lib/analysis.ts as CERT_STATED_CODES for the server. */
const CERT_STATED = { "QL-17": "1 or 2 years — as printed on the certificate" };

/* Notes shown at the bottom of the crew certificates page. Add the next note
   as another line here. The first is also enforced in the checker: VS-04 is on
   NO_EXPIRY_CODES above (and in lib/analysis.ts for the server's comparison),
   so it reads as "Doesn't expire" everywhere rather than as a missing date. */
const CERT_PAGE_NOTES = [
  "VS-04 Helm CONNECT - Crew Basic + Jobs has no expiry date. The checker treats it as held once completed - it never lapses and is never counted as expired.",
  "QL-18 Provide First Aid: crew already aboard as at 29 Jun 2026 keep their existing 5-year expiry; anyone joining after that date holds it on a 3-year expiry (skills matrix roll-out sheet).",
  "QL-19 Advanced Resuscitation: existing crew keep their 2-year expiry; new starters after 29 Jun 2026 hold it on a 1-year expiry (skills matrix roll-out sheet).",
  "PT-03 Work Safely at Heights: Assistant Engineers and GPHs must comply by 29 Dec 2026; new starters from commencement (skills matrix roll-out sheet).",
];

/* The Notes panel the certification pages share. Read plainly by default; Edit
   turns each note into a text box, with Add and Delete beside them. Saving
   writes the list to the shared state, so every admin reads the same notes. */
function NotesPanel({ compact = false }) {
  const { certNotes, setCertNotes, admin } = usePortal();
  const [draft, setDraft] = useState(null);   // null = reading; array = editing

  const save = () => {
    const cleaned = draft.map((t) => String(t || "").trim()).filter(Boolean);
    setCertNotes(cleaned);
    setDraft(null);
  };

  return (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 2,
      padding: compact ? "11px 15px" : "13px 15px", marginTop: compact ? 0 : 14,
      marginBottom: compact ? 16 : 0 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
        <Eyebrow color={T.accent}>Notes</Eyebrow>
        {admin && draft === null && (
          <button className="um-btn" onClick={() => setDraft(certNotes.slice())}
            style={{ background: "transparent", color: T.muted, fontSize: 10, fontWeight: 700, padding: "2px 0" }}>
            Edit
          </button>
        )}
      </div>

      {draft === null ? (
        certNotes.length === 0 ? (
          <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, marginTop: 6 }}>No notes yet.</div>
        ) : (
          <ol style={{ margin: "8px 0 0", paddingLeft: 20 }}>
            {certNotes.map((n, i) => (
              <li key={i} style={{ fontFamily: T.body, fontSize: compact ? 12.5 : 13.5, color: T.muted,
                lineHeight: compact ? 1.6 : 1.7, marginBottom: compact ? 3 : 4 }}>{n}</li>
            ))}
          </ol>
        )
      ) : (
        <div style={{ marginTop: 10 }}>
          {draft.map((n, i) => (
            <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 8 }}>
              <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, paddingTop: 9, minWidth: 16 }}>{i + 1}.</span>
              <textarea className="um-in" rows={2} value={n}
                onChange={(e) => setDraft(draft.map((x, j) => (j === i ? e.target.value : x)))}
                style={{ flex: 1, fontFamily: T.body, fontSize: 13, lineHeight: 1.5, resize: "vertical" }} />
              <button className="um-btn" title="Delete this note"
                onClick={() => setDraft(draft.filter((_, j) => j !== i))}

            <Button onClick={save}>Save</Button>
            <Button variant="quiet" onClick={() => setDraft(null)}>Cancel</Button>

      )}
    </div>
  );
}

const noExpiryPeriod = (code) =>
  NO_EXPIRY_CODES.includes(String(code || "").trim().toUpperCase())
    ? { code, neverExpires: true }
    : null;

/* How long an item stays valid, off the skills matrix — matched by
   matrix code where the sheet gives one, and by the item's name where it
   doesn't. Items on the no-expiry list above answer first, without a sheet.
   Null where the sheet doesn't list the item, and null throughout where no
   validity periods matrix has been read yet.

   Every certification screen carries this column, and so does every PDF they
   hand over, so the lookup is built once here rather than per screen. */
function useValidityLookup() {
  const { validityPeriods } = usePortal();
  return useMemo(() => {
    const list = (validityPeriods && validityPeriods.periods) || [];
    const byCode = new Map();
    const byTitle = new Map();
    list.forEach((p) => {
      if (p.code) byCode.set(String(p.code).trim().toUpperCase(), p);
      if (p.item) byTitle.set(normTitle(p.item), p);
    });
    return (m) =>
      CERT_STATED[String(m.code || "").trim().toUpperCase()] ||
      periodText(
        noExpiryPeriod(m.code)
          || byCode.get(String(m.code).trim().toUpperCase())
          || byTitle.get(normTitle(m.title)),
      );
  }, [validityPeriods]);
}

// The Certificate column: a way into the scan itself, or word that none is
// filed. Sits at the end of the line, under its own heading. Open shows the
// certificate right here, over the page, rather than sending it for download —
// the scan itself, with a way out to a full tab where it is wanted bigger.
function CertViewer({ url, filename, person, code, title, onClose }) {
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 90, background: "rgba(18,41,61,0.55)",
      display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}
      onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}
        style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 3,
          width: "100%", maxWidth: 960, height: "min(88vh, 860px)", display: "flex",
          flexDirection: "column", overflow: "hidden" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center",
          gap: 12, flexWrap: "wrap", padding: "12px 15px", borderBottom: `1px solid ${T.rule}` }}>
          <div style={{ minWidth: 0 }}>
            <Eyebrow color={T.accent}>Certificate on file</Eyebrow>
            <div style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text, marginTop: 3 }}>
              {code ? `${code} · ` : ""}{title || filename || "Certificate"}
            </div>
            <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 2, wordBreak: "break-word" }}>
              {[person, filename].filter(Boolean).join(" · ")}
            </div>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <a href={url} target="_blank" rel="noopener noreferrer"
              style={{ fontFamily: T.display, fontSize: 11, fontWeight: 700, letterSpacing: "0.12em",
                textTransform: "uppercase", color: T.accent, textDecoration: "none" }}>
              Open in new tab
            </a>
            <Button variant="quiet" onClick={onClose}>Close</Button>
          </div>
        </div>
        {/* An iframe shows both shapes a scan arrives in — a PDF and an image —
            without having to know which this one is. */}
        <iframe src={url} title={filename || "Certificate"}

      </div>
    </div>

}

function CertCell({ url, person, code, title }) {
  const { certificates } = usePortal();
  const [open, setOpen] = useState(false);
  // The filename for the viewer's header, off the filed record the link points
  // at — cosmetic, so a link with no matching record still opens fine.
  const filed = url ? (certificates || []).find((c) => c.url === url) : null;
  return (
    <span style={{ minWidth: 78, textAlign: "right" }}>
      {url ? (
        <>
          <button className="um-btn" onClick={() => setOpen(true)}
            title={`Open the certificate${person ? ` filed for ${person}` : ""}`}
            style={{ background: "transparent", border: 0, padding: 0, cursor: "pointer",
              fontFamily: T.display, fontSize: 11, fontWeight: 700, letterSpacing: "0.12em",
              textTransform: "uppercase", color: T.accent }}>
            Open
          </button>
          {open && (
            <CertViewer url={url} filename={filed && filed.filename} person={person}
              code={code} title={title} onClose={() => setOpen(false)} />
          )}
        </>
      ) : (
        <span style={{ fontFamily: T.mono, fontSize: 10, color: T.muted }}>No scan</span>
      )}
    </span>
  );
}

function DateCols({ issued, expires }) {
  return (
    <>
      <span style={{ fontFamily: T.mono, fontSize: 10.5, color: issued ? T.text : T.muted, minWidth: 78 }}>
        {colDate(issued)}
      </span>
      <span style={{ fontFamily: T.mono, fontSize: 10.5, color: expires ? T.text : T.muted, minWidth: 78 }}>
        {colDate(expires)}
      </span>
    </>
  );
}

// The headings those columns sit under. `trail` reserves the width of whatever
// follows them on each line — the status tag, and on some screens a group
// label — so the headings stand over their columns rather than the right edge.
function DateColsHead({ trail = 150, validity = false }) {
  const head = { fontFamily: T.display, fontSize: 9.5, fontWeight: 700, letterSpacing: "0.1em",
    textTransform: "uppercase", color: T.muted, minWidth: 78 };
  return (
    <div className="um-datehead" style={{ display: "flex", gap: 10, alignItems: "baseline",
      padding: "6px 0 4px", borderBottom: `2px solid ${T.rule}` }}>
      <span style={{ minWidth: 46 }} />
      <span style={{ flex: 1, minWidth: 180 }} />
      {validity && <span style={{ ...head, minWidth: 92 }}>Module validity</span>}
      <span style={head}>Issue date</span>
      <span style={head}>Expiry date</span>
      <span style={{ ...head, minWidth: 78, textAlign: "right" }}>Certificate</span>
      <span style={{ minWidth: trail }} />
    </div>
  );
}

/* Lives on Required Documents For Upload, beside the crew certificates it
   works on. One press runs the
   same AI check the portal runs after an upload: every certificate on file is
   read (ones already read are answered from the cache, so pressing it again
   costs nothing), each is refiled under the person named on it, the validity
   periods matrix is read so a certificate printing an issue date and no expiry
   still gets the date it runs to, everything is held against the crew matrix
   and the certificates spreadsheet, and what the certificates settle — the
   validity dates included — is written into the lists on these screens. */
function UpdateTableButton() {
  const { matrixAuto, runMatrixAuto } = usePortal();
  const running = !!matrixAuto && matrixAuto.phase !== "done" && matrixAuto.phase !== "failed";
  return (
    <Button variant="solid" disabled={running}
      title="Check every certificate and expiry date against the spreadsheets and bring this list up to date"
      onClick={() => { if (!running) runMatrixAuto({ origin: "update-table" }); }}>
      {running ? "Syncing…" : "Sync with SharePoint certification"}
    </Button>
  );
}

function ItemLine({ x, person, dates, validity }) {
  const { certificates } = usePortal();
  // With a person given, the line carries the two date columns: the issue date
  // read off that person's certificate, and the expiry the matrix holds (or,
  // where the matrix has none, the one the certificate itself carries) — and a
  // way to open the certificate those dates were read from. `validity` — how
  // long the item stays valid, off the skills matrix — is a column
  // only on the screens that pass it.
  if (person !== undefined) {
    const d = certDateFor(dates, person, x.code);
    return (
      <div style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
        padding: "5px 0", borderBottom: `1px solid ${T.rule}` }}>
        <span style={{ fontFamily: T.mono, fontSize: 10, color: T.accent, minWidth: 46 }}>{x.code}</span>
        <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, flex: 1, minWidth: 180 }}>{x.title}</span>
        {validity !== undefined && (
          <span style={{ fontFamily: T.mono, fontSize: 10.5, color: validity ? T.text : T.muted, minWidth: 92 }}>
            {validity || "—"}
          </span>
        )}
        <DateCols issued={d && d.issued} expires={x.band.date || (d && d.expires)} />
        <CertCell url={certLinkFor(dates, certificates, person, x.code)}
          person={person} code={x.code} title={x.title} />
        <span style={{ minWidth: 150, display: "flex", justifyContent: "flex-end" }}>
          <BandTag band={x.band} />
        </span>
      </div>
    );
  }
  return (
    <div style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
      padding: "5px 0", borderBottom: `1px solid ${T.rule}` }}>
      <span style={{ fontFamily: T.mono, fontSize: 10, color: T.accent, minWidth: 46 }}>{x.code}</span>
      <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, flex: 1, minWidth: 190 }}>{x.title}</span>
      <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.muted, minWidth: 74 }}>
        {x.band.date ? x.band.date.split("-").reverse().join("/") : ""}
      </span>
      <BandTag band={x.band} />
    </div>
  );
}

/* ==================================================================== */
/*  Reports as a PDF file                                               */
/* ==================================================================== */

// The PDF writer, like the spreadsheet reader, is fetched the first time
// someone asks for a file rather than on every visit. The promise is kept so a
// second click while it is still coming down doesn't start another download.
let pdfLib = null;
function loadPDF() {
  if (typeof window === "undefined") return Promise.reject(new Error("no browser"));
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (pdfLib) return pdfLib;
  pdfLib = new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    // Asked for on demand and reported on the screen that asked, so the fatal
    // banner leaves this one alone - same as the spreadsheet reader.
    el.setAttribute("data-optional", "1");
    el.crossOrigin = "anonymous";
    el.onload = () => (window.jspdf && window.jspdf.jsPDF
      ? res(window.jspdf.jsPDF)
      : rej(new Error("The PDF writer failed to load")));
    el.onerror = () => {
      pdfLib = null;
      rej(new Error("Couldn't download the PDF writer - check the connection and try again"));
    };
    document.head.appendChild(el);
  });
  pdfLib.catch(() => { pdfLib = null; });
  return pdfLib;
}

const rgbOf = (hex) => {
  const h = String(hex || "#000000").replace("#", "");
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
};

const slugOf = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

/* One matrix item as a line on the page: its code, what it is, the three
   columns the certification screens carry against it — how long it stays valid,
   when it was issued, when it runs out — and how that expiry reads today in its
   own colour.

   `ctx` is what the screen knows and the item on its own doesn't: whose line
   this is, the shared store of dates read off the certificates, and how to look
   up a validity period. Give it none and the line is what it always was — code,
   title, expiry, status — so a report with nothing to fill those columns with
   prints exactly as before. */
const pdfLineIn = (ctx = {}) => (x) => {
  const d = ctx.person != null ? certDateFor(ctx.dates, ctx.person, x.code) : null;
  // The expiry the matrix holds, or where it holds none, the one the
  // certificate itself carries — the same order of preference the screens use.
  // A date the reader can't parse is left off the line rather than printed as a
  // dash, which on paper would read as "there isn't one".
  const col = (v) => {
    const s = v ? colDate(v) : "";
    return s === "—" ? "" : s;
  };
  return {
    code: x.code,
    title: x.title,
    validity: (ctx.validityFor && ctx.validityFor(x)) || "",
    issued: col(d && d.issued),
    date: col(x.band.date || (d && d.expires)),
    status: bandLabel(x.band),
    fg: x.band.fg,
    bg: x.band.bg,
  };
};

/**
 * Every report on the portal is the same thing on paper: a title block, then
 * groups of items with a status against each. So there is one writer, and a
 * report only has to describe itself:
 *
 *   { title, subtitle, intro, filename, empty,
 *     groups: [{ heading, meta, blurb, items }] }
 *
 * An item is a line - code, title, date, status - and may carry `notes`, a few
 * short lines printed under the title in their own colour. A matrix report has
 * no use for them; a report that says why something is on the page can't be read
 * without them.
 *
 * A line off a certification screen carries two more columns as well - `validity`,
 * how long the item stays valid, and `issued`, the date it was issued - which
 * print to the left of the expiry date under their own headings, in the order
 * they sit in on screen. Room is only kept for the columns a report actually
 * fills, so a report with neither prints at the width it always did.
 *
 * The text is written into the PDF rather than photographed off the screen, so
 * it stays sharp at any zoom, can be searched, and the file is a few kilobytes.
 */
async function saveReportPDF(report) {
  const jsPDF = await loadPDF();
  const doc = new jsPDF({ unit: "pt", format: "a4", compress: true });

  const PW = doc.internal.pageSize.getWidth();
  const PH = doc.internal.pageSize.getHeight();
  const M = 42;                    // margin
  const W = PW - M * 2;
  const FLOOR = PH - 52;           // where the body has to stop for the footer
  let page = 1;
  let y = M;

  const ink = (hex) => doc.setTextColor(...rgbOf(hex));
  const fill = (hex) => doc.setFillColor(...rgbOf(hex));
  const stroke = (hex) => doc.setDrawColor(...rgbOf(hex));

  const footer = () => {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    ink(T.muted);
    doc.text(`${VESSEL.name} ${VESSEL.nameAccent} - ${report.title}`, M, PH - 28);
    doc.text(String(page), PW - M, PH - 28, { align: "right" });
  };

  // Keeps a block whole: if it won't fit under what is already on the page,
  // start a new one rather than split it across the fold.
  const room = (h) => {
    if (y + h <= FLOOR) return;
    footer();
    doc.addPage();
    page += 1;
    y = M;
  };

  // Title block
  doc.setFont("helvetica", "bold");
  doc.setFontSize(15);
  ink(T.text);
  doc.splitTextToSize(String(report.title).toUpperCase(), W).forEach((line) => {
    doc.text(line, M, y + 12);
    y += 18;
  });
  if (report.subtitle) {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    ink(T.muted);
    doc.splitTextToSize(report.subtitle, W).forEach((line) => {
      doc.text(line, M, y + 9);
      y += 12;
    });
  }
  y += 6;
  stroke(T.text);
  doc.setLineWidth(1.2);
  doc.line(M, y, PW - M, y);
  y += 18;

  // The standing to read the rest by - on a report that apportions fault, the
  // columns underneath mean nothing without the rule that put a finding in one.
  if (report.intro) {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    ink(T.text);
    doc.splitTextToSize(report.intro, W).forEach((line) => {
      doc.text(line, M, y + 8);
      y += 12;
    });
    y += 10;
  }

  const groups = (report.groups || []).filter((g) => g && g.items && g.items.length);

  /* The columns the certification screens carry against each item, on paper in
     the order they read in on screen: how long it stays valid, when it was
     issued, when it runs out. Room is only kept for the ones something in this
     report actually fills, and the expiry column stays where the single date
     column has always sat - so a report carrying none of the new columns comes
     out at the width and in the place it always did. */
  const COL_STATUS = 100;   // room kept at the right edge for the status tag
  const COL_DATE = 48;      // issue date and expiry date
  const COL_VALID = 60;     // module validity, which is words rather than a date

  const filled = (k) => groups.some((g) => g.items.some((it) => it[k]));
  const dateCols = [];
  let colX = PW - M - COL_STATUS;
  [
    { key: "date", head: "Expiry date", w: COL_DATE, fg: T.text },
    { key: "issued", head: "Issue date", w: COL_DATE, fg: T.text },
    { key: "validity", head: "Module validity", w: COL_VALID, fg: T.muted },
  ].forEach((c) => {
    if (!filled(c.key)) return;
    dateCols.push({ ...c, x: colX });
    colX -= c.w;
  });

  // Headings go over the columns only where the headings say what the column
  // holds. A report that puts its own reading in the date column - the
  // certificate review's proposed value, say - fills neither of the other two,
  // and keeps its bare lines rather than being labelled an expiry date.
  const heads = filled("validity") || filled("issued");
  const titleW = Math.max(120, colX - M - 52 - 8);

  if (groups.length === 0) {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    ink(T.muted);
    doc.text(report.empty || "Nothing to report.", M, y + 9);
  }

  groups.forEach((g) => {
    // Enough room for the heading band, the column headings under it where
    // there are any, and the first line - so a group never starts at the very
    // foot of a page with its contents on the next.
    room(heads ? 66 : 52);

    fill(T.raised);
    doc.rect(M, y, W, 18, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    ink(T.text);
    doc.text(g.heading, M + 7, y + 12.5);
    if (g.meta) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      ink(T.muted);
      doc.text(g.meta, PW - M - 7, y + 12.5, { align: "right" });
    }
    y += 25;

    if (g.blurb) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      ink(T.muted);
      const blurb = doc.splitTextToSize(g.blurb, W);
      room(blurb.length * 10 + 4);
      blurb.forEach((line) => {
        doc.text(line, M, y + 7);
        y += 10;
      });
      y += 4;
    }

    // The column headings sit over each group rather than once at the top of
    // the report, so a group carried onto a new page still says what the
    // figures down its right-hand side are.
    if (heads) {
      room(16);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(6.5);
      ink(T.muted);
      dateCols.forEach((c) => doc.text(c.head.toUpperCase(), c.x, y + 6, { align: "right" }));
      y += 9;
      stroke(T.rule);
      doc.setLineWidth(0.7);
      doc.line(M, y, PW - M, y);
      y += 4;
    }

    g.items.forEach((it) => {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      const lines = doc.splitTextToSize(it.title, titleW);

      // Wrapped at the size they are drawn at, and measured before anything is
      // drawn, so the block is either whole on this page or whole on the next.
      doc.setFontSize(8);
      const notes = (it.notes || [])
        .filter((n) => n && n.text)
        .map((n) => ({ fg: n.fg || T.muted, lines: doc.splitTextToSize(String(n.text), titleW) }));
      const notesH = notes.reduce((h, n) => h + n.lines.length * 9.5, 0);

      const h = Math.max(15, lines.length * 11 + 4 + (notesH ? notesH + 4 : 0));
      room(h);

      doc.setFontSize(7);
      ink(T.accent);
      doc.text(it.code, M, y + 9);

      doc.setFontSize(9);
      ink(T.text);
      lines.forEach((line, i) => doc.text(line, M + 52, y + 9 + i * 11));

      if (notes.length) {
        doc.setFontSize(8);
        let ny = y + 9 + lines.length * 11;
        notes.forEach((n) => {
          ink(n.fg);
          n.lines.forEach((line) => {
            doc.text(line, M + 52, ny);
            ny += 9.5;
          });
        });
      }

      if (dateCols.length) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(7.5);
        dateCols.forEach((c) => {
          if (!it[c.key]) return;
          ink(heads ? c.fg : T.muted);
          doc.text(String(it[c.key]), c.x, y + 9, { align: "right" });
        });
      }

      if (it.status) {
        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.5);
        const tw = Math.min(96, doc.getTextWidth(it.status) + 11);
        fill(it.bg || T.raised);
        doc.roundedRect(PW - M - tw, y, tw, 12.5, 2, 2, "F");
        ink(it.fg || T.muted);
        doc.text(it.status, PW - M - tw / 2, y + 8.7, { align: "center" });
      }

      y += h;
      stroke(T.rule);
      doc.setLineWidth(0.5);
      doc.line(M, y - 3, PW - M, y - 3);
    });

    y += 11;
  });

  footer();
  doc.save(report.filename);
}

/**
 * The button that turns whatever is on screen into a PDF. The report is only
 * described when it is clicked, so it always matches the filters in force at
 * that moment, and anything that goes wrong is said next to the button rather
 * than in a browser alert.
 */
function DownloadPDF({ build, label = "Download PDF", variant = "solid" }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const go = async () => {
    setBusy(true);
    setErr("");
    try {
      await saveReportPDF(build());
    } catch (e) {
      setErr(e.message || String(e));
    }
    setBusy(false);
  };

  return (
    <>
      <Button variant={variant} onClick={go} disabled={busy}>
        {busy ? "Making the PDF..." : label}
      </Button>
      {err && (
        <div style={{ flexBasis: "100%", width: "100%", fontFamily: T.body, fontSize: 13,
          color: T.bRed, lineHeight: 1.6 }}>{err}</div>
      )}
    </>
  );
}

function CrewReport({ onClose }) {
  const { quals: QUALS, certDates } = usePortal();
  const validityFor = useValidityLookup();
  // The whole matrix, spelled out: every crew member and everything held
  // against them - not just what falls due soon. itemsFor puts each person's
  // soonest date first, so what needs attention still leads their list.
  const crew = QUALS.rows
    .map((r) => ({ row: r, items: itemsFor(r, QUALS) }))
    .filter((x) => x.items.length > 0);

  const soonOf = (items) => items.filter((x) => x.band.date && daysTo(x.band.date) <= 90);
  const total = crew.reduce((n, a) => n + a.items.length, 0);
  const due = crew.reduce((n, a) => n + soonOf(a.items).length, 0);
  const expired = crew.reduce((n, a) => n + a.items.filter((i) => i.band.date && daysTo(i.band.date) < 0).length, 0);

  const heading = "Crew Report - every item on the matrix";
  const standfirst = `${VESSEL.name} ${VESSEL.nameAccent} · as at ${fmtDate(TODAY)} · ${crew.length} crew · ${total} items · ${due} due within 90 days${expired ? ` · ${expired} already expired` : ""}`;

  // Each person's line on the report says the same as their line on the table:
  // how much they hold, how much of it is a problem today, and — because the
  // items underneath are the ones their position asks for — whether the position
  // is the one their ticket is actually for.
  const metaOf = (row, items) => {
    const soon = soonOf(items).length;
    const stand = ticketStandingFor(row, QUALS);
    return `${row[1]} · ${row[2]} · ${items.length} item${items.length === 1 ? "" : "s"}`
      + (soon ? ` · ${soon} due within 90 days` : "")
      + (stand ? ` · ${stand.label.toLowerCase()}` : "");
  };

  const asPDF = () => ({
    title: heading,
    subtitle: standfirst,
    filename: `crew-report-${TODAY}.pdf`,
    empty: "Nothing is held on the matrix.",
    groups: crew.map(({ row, items }) => ({
      heading: row[0],
      meta: metaOf(row, items),
      items: items.map(pdfLineIn({ person: row[0], dates: certDates, validityFor })),
    })),
  });

  return (
    <div className="um-report">
      <div className="um-noprint" style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
        <DownloadPDF build={asPDF} />
        <Button variant="quiet" onClick={() => window.print()}>Print</Button>
        <Button variant="quiet" onClick={onClose}>Back to the matrix</Button>
      </div>

      <div style={{ borderBottom: `2px solid ${T.text}`, paddingBottom: 8, marginBottom: 14 }}>
        <div style={{ fontFamily: T.display, fontSize: 22, fontWeight: 700, letterSpacing: "0.04em",
          textTransform: "uppercase", color: T.text }}>{heading}</div>
        <div style={{ fontFamily: T.mono, fontSize: 11.5, color: T.muted, marginTop: 5 }}>
          {standfirst}
        </div>
      </div>

      {crew.length === 0 ? <Empty>Nothing is held on the matrix.</Empty> : crew.map(({ row, items }) => (
        <div key={row[0] + row[2]} style={{ marginBottom: 16, breakInside: "avoid" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline",
            gap: 12, flexWrap: "wrap", background: T.raised, padding: "5px 9px", borderRadius: 2 }}>
            <span style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text }}>{row[0]}</span>
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{metaOf(row, items)}</span>
          </div>
          {items.map((x) => <ItemLine key={x.code} x={x} />)}
        </div>
      ))}
    </div>
  );
}

function IndividualReport({ onClose }) {
  const { quals: QUALS, certDates } = usePortal();
  const validityFor = useValidityLookup();
  const [who, setWho] = useState("");
  const row = QUALS.rows.find((r) => r[0] === who);
  const items = row ? itemsFor(row, QUALS) : [];
  const soon = items.filter((x) => (x.band.date && daysTo(x.band.date) <= 90) || x.band.key === "not");

  const standfirst = row
    ? `${row[1]} · ${row[2]} · as at ${fmtDate(TODAY)} · ${items.length} items held · ${soon.length ? `${soon.length} due within 90 days or not held` : "nothing due within 90 days"}`
    : "";

  const asPDF = () => {
    const line = pdfLineIn({ person: row[0], dates: certDates, validityFor });
    return {
      title: row[0],
      subtitle: standfirst,
      filename: `${slugOf(row[0])}-${TODAY}.pdf`,
      empty: "Nothing is held against this name.",
      groups: [
        ...(soon.length ? [{ heading: "Needs attention", meta: `${soon.length} within 90 days or not held`, items: soon.map(line) }] : []),
        ...Array.from(new Set(items.map((x) => x.group))).map((g) => ({
          heading: g,
          meta: "",
          items: items.filter((x) => x.group === g).map(line),
        })),
      ],
    };
  };

  return (
    <div className="um-report">
      <div className="um-noprint" style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          {row && <DownloadPDF build={asPDF} />}
          {row && <Button variant="quiet" onClick={() => window.print()}>Print</Button>}
          <Button variant="quiet" onClick={onClose}>Back to the matrix</Button>
        </div>
        <ChoiceField label="Your name — every name on the matrix">
          <Choices value={who} onPick={setWho} compact
            options={QUALS.rows.map((r) => ({ value: r[0], label: r[0] }))} />
        </ChoiceField>
      </div>

      {!row ? (
        <Empty>Pick a name to see everything held, and what falls due next.</Empty>
      ) : (
        <>
          <div style={{ borderBottom: `2px solid ${T.text}`, paddingBottom: 8, marginBottom: 14 }}>
            <div style={{ fontFamily: T.display, fontSize: 22, fontWeight: 700, letterSpacing: "0.04em",
              textTransform: "uppercase", color: T.text }}>{row[0]}</div>
            <div style={{ fontFamily: T.mono, fontSize: 11.5, color: T.muted, marginTop: 5 }}>
              {standfirst}
            </div>
          </div>

          {soon.length > 0 && (
            <div style={{ marginBottom: 18, breakInside: "avoid" }}>
              <div style={{ marginBottom: 7 }}><Eyebrow color={T.bRed}>Needs attention</Eyebrow></div>
              {soon.map((x) => <ItemLine key={x.code} x={x} />)}
            </div>
          )}

          {Array.from(new Set(items.map((x) => x.group))).map((g) => (
            <div key={g} style={{ marginBottom: 16, breakInside: "avoid" }}>
              <div style={{ marginBottom: 7 }}><Eyebrow>{g}</Eyebrow></div>
              {items.filter((x) => x.group === g).map((x) => <ItemLine key={x.code} x={x} />)}
            </div>
          ))}
        </>
      )}
    </div>
  );
}

/* Everything held against one person, opened by clicking their name in the
   matrix and shown underneath the table.

   The grid can only give an item a colour and a cramped date. This spells each
   one out: what the code stands for, the date behind the colour, how that date
   reads today, and whether a scan of the certificate has been filed against it.

   It deliberately ignores the category filter above the table. That filter is
   there to get the columns down to a readable width; opening a name is the
   opposite question - what does this person hold, all of it, in one place. */
function MatrixPerson({ row, onClose }) {
  const { certificates, quals: QUALS, certDates } = usePortal();
  const validityFor = useValidityLookup();

  const items = itemsFor(row, QUALS);
  // Whether this person is working in the position their ticket is for. The
  // table marks it with a dot; here there is room to say which ticket it is.
  const stand = ticketStandingFor(row, QUALS);
  // Categories in the order the matrix puts its columns in, so reading down the
  // panel and reading across the table meet the same items in the same order.
  // itemsFor has already sorted within each one, soonest first.
  const groups = Array.from(new Set(QUALS.cols.map((c) => c[2])))
    .filter((g) => items.some((x) => x.group === g));

  // Certificates are filed under the name on the matrix, so a person's scans
  // are whatever sits in their folder. A scan carries the code it was filed
  // against, which is what puts it on the right line.
  const files = certificates.filter((c) => c.person === row[0]);
  const scansFor = (code) => files.filter((f) => f.qualCode === code);

  const dated = (test) => items.filter((x) => x.band.date && test(daysTo(x.band.date)));
  const expired = dated((d) => d < 0);
  const soon = dated((d) => d >= 0 && d <= 90);
  const notHeld = items.filter((x) => x.band.key === "not");
  const unconfirmed = items.filter((x) => x.band.key === "unknown");
  // A blank cell means the item was never asked of this position, so it is
  // counted rather than listed - an empty line per item would bury the rest.
  const notRequired = QUALS.cols.length - items.length;

  // What someone opening a name is usually looking for, pulled to the top so it
  // isn't hunted for down a category it happens to sit in. Everything appears
  // again in its own category below, which is the point - this is the shortlist,
  // not a separate set of facts.
  const attention = items.filter(
    (x) => (x.band.date && daysTo(x.band.date) <= 90) || x.band.key === "not",
  );

  const standfirst = `${row[1]} · ${row[2]} · as at ${fmtDate(TODAY)} · ${items.length} item${items.length === 1 ? "" : "s"} held`
    + ` · ${files.length} scan${files.length === 1 ? "" : "s"} on file`
    + (notRequired ? ` · ${notRequired} not required for this position` : "");

  // One certificate, spelled out: the code, what the code stands for, the date
  // itself, how that date reads today, and a way into the scan filed for it.
  const line = (x, prefix) => {
    const scans = scansFor(x.code);
    return (
      <div key={prefix + x.code} className="um-row" style={{ display: "flex", gap: 10, alignItems: "baseline",
        flexWrap: "wrap", padding: "6px 0", borderBottom: `1px solid ${T.rule}` }}>
        <span style={{ fontFamily: T.mono, fontSize: 10, color: T.accent, minWidth: 46 }}>{x.code}</span>
        <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, flex: 1, minWidth: 190 }}>{x.title}</span>
        <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.muted, minWidth: 74 }}>
          {x.band.date ? x.band.date.split("-").reverse().join("/") : ""}
        </span>
        <BandTag band={x.band} />
        <span style={{ minWidth: 62, textAlign: "right" }}>
          {scans.length === 0 ? (
            <span style={{ fontFamily: T.mono, fontSize: 10, color: T.muted }}>No scan</span>
          ) : scans.map((f) => (
            <span key={f.id} title={f.filename} style={{ marginLeft: 8 }}><OpenLink url={f.url} /></span>
          ))}
        </span>
      </div>
    );
  };

  const asPDF = () => {
    const line = pdfLineIn({ person: row[0], dates: certDates, validityFor });
    return {
      title: row[0],
      subtitle: standfirst,
      filename: `${slugOf(row[0])}-${TODAY}.pdf`,
      empty: "Nothing is held against this name.",
      groups: [
        ...(stand
          ? [{ heading: "Position and ticket", meta: stand.label, blurb: stand.note,
              items: stand.held.map((t) => ({ code: t.code, title: t.short, validity: "", issued: "",
                date: t.band.date ? colDate(t.band.date) : "", status: bandLabel(t.band),
                fg: t.band.fg, bg: t.band.bg })) }]
          : []),
        ...(attention.length
          ? [{ heading: "Needs attention", meta: `${attention.length} expired, due within 90 days or not held`,
              items: attention.map(line) }]
          : []),
        ...groups.map((g) => ({
          heading: g,
          meta: "",
          items: items.filter((x) => x.group === g).map(line),
        })),
      ],
    };
  };

  return (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
      borderLeft: `3px solid ${expired.length + notHeld.length ? T.bRed : soon.length ? T.bOrange : T.teal}`,
      borderRadius: 2, padding: "14px 15px", marginTop: 18 }}>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline",
        gap: 12, flexWrap: "wrap", borderBottom: `1px solid ${T.rule}`, paddingBottom: 10, marginBottom: 12 }}>
        <div style={{ minWidth: 220 }}>
          <div style={{ fontFamily: T.display, fontSize: 18, fontWeight: 700, letterSpacing: "0.04em",
            textTransform: "uppercase", color: T.text }}>{row[0]}</div>
          <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 5 }}>{standfirst}</div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <DownloadPDF build={asPDF} label="Download PDF" variant="quiet" />
          <Button variant="quiet" onClick={onClose}>Close</Button>
        </div>
      </div>

      <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginBottom: 14 }}>
        {expired.length > 0 && <Chip fg={T.bRed} bg={T.bRedBg}>{expired.length} expired</Chip>}
        {notHeld.length > 0 && <Chip fg={T.bRed} bg={T.bRedBg}>{notHeld.length} not held</Chip>}
        {soon.length > 0 && <Chip fg={T.bOrange} bg={T.bOrangeBg}>{soon.length} within 90 days</Chip>}
        {unconfirmed.length > 0 && <Chip fg={T.muted} bg={T.raised}>{unconfirmed.length} unconfirmed</Chip>}
        {expired.length + notHeld.length + soon.length + unconfirmed.length === 0 && items.length > 0 && (
          <Chip fg={T.green} bg={T.bGreenBg}>Everything in date</Chip>
        )}
      </div>

      {/* Ahead of the certificates, because it changes how the rest of the panel
          should be read: the items below are the ones the position asks for, and
          if the position isn't the one the ticket is for then that is the wrong
          set to be reading. Filled where the ticket doesn't reach the position,
          outlined where it goes past it — the same two marks as the table. */}
      {stand && (
        <div style={{ background: stand.strong ? T.violetBg : T.panel, border: `1px solid ${T.violet}`,
          borderLeft: `3px solid ${T.violet}`, borderRadius: 2, padding: "11px 13px", marginBottom: 16 }}>
          <div style={{ display: "flex", gap: 9, alignItems: "center", flexWrap: "wrap", marginBottom: 6 }}>
            <Eyebrow color={T.violet}>Position and ticket</Eyebrow>
            <Chip fg={T.violet} bg={stand.strong ? T.panel : T.violetBg}>{stand.label}</Chip>
          </div>
          <div style={{ fontFamily: T.body, fontSize: 13, color: T.text, lineHeight: 1.65 }}>{stand.note}</div>
          {stand.held.length > 0 && (
            <div style={{ marginTop: 9 }}>
              {stand.held.map((t) => (
                <div key={t.code} style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
                  padding: "5px 0", borderTop: `1px solid ${T.rule}` }}>
                  <span style={{ fontFamily: T.mono, fontSize: 10, color: T.accent, minWidth: 46 }}>{t.code}</span>
                  <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, flex: 1, minWidth: 170 }}>
                    {t.short}
                    <span style={{ color: T.muted }}>
                      {" · "}{t.stream === "both" ? "deck or engine room" : STREAM_WORD[t.stream]}
                      {t.unconfirmed ? " · not confirmed" : ""}
                    </span>
                  </span>
                  <BandTag band={t.band} />
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {items.length === 0 ? (
        <Empty>Nothing on the matrix against this name.</Empty>
      ) : (
        <>
          {attention.length > 0 && (
            <div style={{ marginBottom: 18 }}>
              <div style={{ marginBottom: 6 }}><Eyebrow color={T.bRed}>Needs attention</Eyebrow></div>
              {attention.map((x) => line(x, "a-"))}
            </div>
          )}

          {groups.map((g) => (
            <div key={g} style={{ marginBottom: 16 }}>
              <div style={{ marginBottom: 6 }}><Eyebrow>{g}</Eyebrow></div>
              {items.filter((x) => x.group === g).map((x) => line(x, g + "-"))}
            </div>
          ))}
        </>
      )}

      <div style={{ marginTop: 16, marginBottom: 6 }}>
        <Eyebrow color={T.accent}>Certificates on file · {files.length}</Eyebrow>
      </div>
      {files.length === 0 ? (
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6 }}>
          Nothing has been uploaded for {row[0]} yet. Scans are filed from the Admin
          tab, under Required Documents For Upload.
        </div>
      ) : files.map((f) => (
        <div key={f.id} className="um-row" style={{ display: "flex", gap: 12, alignItems: "center",
          flexWrap: "wrap", padding: "7px 0", borderTop: `1px solid ${T.rule}` }}>
          <div style={{ flex: "1 1 220px", minWidth: 0 }}>
            <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, wordBreak: "break-word" }}>
              {f.filename}
            </div>
            <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 3 }}>
              {[f.qualCode, f.size, f.expires ? `expires ${fmtDate(f.expires)}` : null,
                f.uploaded ? `filed ${fmtDate(f.uploaded)}` : null].filter(Boolean).join(" · ")}
            </div>
          </div>
          <OpenLink url={f.url} />
        </div>
      ))}
    </div>
  );
}

// Matrix column widths, in pixels. Both are pinned because the table would
// otherwise hand its spare width to the crew column - it stretched past 800px
// and pushed the grid so far right that only nine items were on screen. Fixed
// widths keep the qualifications hard up against the names, so as many columns
// as the screen can hold are visible at once.
const MX_NAME_W = 184;
const MX_COL_W = 64;

function TrainingMatrix() {
  const { quals: QUALS, setQuals, log, matrixUpdated, certSheet, certificates, certDates } = usePortal();
  const [report, setReport] = useState(null);
  // The scan behind a pressed cell, opened in the same viewer the checker uses.
  const [cellScan, setCellScan] = useState(null);
  const [group, setGroup] = useState("All");
  const frame = useRef(null);
  const bar = useRef(null);
  const inner = useRef(null);
  const lock = useRef(false);

  // A scrollbar that floats at the bottom of the screen and drives the table,
  // so it's reachable wherever you are on the page.
  React.useEffect(() => {
    const f = frame.current, b = bar.current, i = inner.current;
    if (!f || !b || !i) return;
    const size = () => {
      i.style.width = f.scrollWidth + "px";
      b.style.display = f.scrollWidth > f.clientWidth + 4 ? "block" : "none";
      const r = f.getBoundingClientRect();
      b.style.left = r.left + "px";
      b.style.width = r.width + "px";
    };
    const fromTable = () => { if (lock.current) return; lock.current = true; b.scrollLeft = f.scrollLeft; lock.current = false; };
    const fromBar = () => { if (lock.current) return; lock.current = true; f.scrollLeft = b.scrollLeft; lock.current = false; };
    size();
    f.addEventListener("scroll", fromTable);
    b.addEventListener("scroll", fromBar);
    window.addEventListener("resize", size);
    const t = setTimeout(size, 200);
    return () => {
      f.removeEventListener("scroll", fromTable);
      b.removeEventListener("scroll", fromBar);
      window.removeEventListener("resize", size);
      clearTimeout(t);
    };
  });

  const [q, setQ] = useState("");
  const [only, setOnly] = useState("all");

  // Whose certificates are open underneath the table. Held as name and seafarer
  // number together, so two people sharing a surname and initial can't open
  // each other's. Nothing is open until a name is pressed.
  const [picked, setPicked] = useState("");
  const detail = useRef(null);
  const keyOf = (r) => r[0] + "|" + r[2];

  // The table is taller than the screen, so a name pressed near the top would
  // open a panel nobody can see. Bring it into view when it opens, and leave
  // the page alone once it is already there.
  React.useEffect(() => {
    if (picked && detail.current) detail.current.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, [picked]);

  const groups = ["All", ...Array.from(new Set(QUALS.cols.map((c) => c[2])))];
  // Hide the columns that don't apply to anybody on screen. With one person
  // searched, their 54-column row collapses to just the items their position
  // is tracked against — the single biggest readability gain the grid has.
  const [onlyTracked, setOnlyTracked] = useState(false);
  const colIdxAll = QUALS.cols.map((c, i) => i).filter((i) => group === "All" || QUALS.cols[i][2] === group);

  // Where each person's ticket sits against the position they work in. Worked
  // out once for the whole table rather than per row, and keyed the same way the
  // open panel is so a row and its panel can never disagree.
  const standings = useMemo(
    () => new Map(QUALS.rows.map((r) => [r[0] + "|" + r[2], ticketStandingFor(r, QUALS)])
      .filter(([, v]) => v)),
    [QUALS],
  );
  const offTicket = Array.from(standings.values());
  const offTicketStrong = offTicket.filter((x) => x.strong).length;

  const rows = QUALS.rows.filter((r) => {
    if (q) {
      // Several names at once, comma-separated — a first name is enough.
      const hay = (r[0] + " " + r[1]).toLowerCase();
      const words = hay.split(/[^a-z0-9]+/).filter(Boolean);
      const terms = q.toLowerCase().split(",").map((t) => t.trim()).filter(Boolean);
      if (terms.length && !terms.some((t) => hay.includes(t) || words.some((w) => w.startsWith(t)))) return false;
    }
    if (only === "all") return true;
    // Not a band, so it can't be asked of the cells - it is asked of the person.
    if (only === "ticket") return standings.has(keyOf(r));
    return colIdxAll.some((i) => {
      const b = bandFor(r[3][i]);
      return b && (only === "attention"
        ? ["red", "orange", "yellow", "not"].includes(b.key)
        : b.key === only);
    });
  });

  const colIdx = onlyTracked
    ? colIdxAll.filter((i) => rows.some((r) => String((r[3] || [])[i] || "").trim() !== ""))
    : colIdxAll;

  // The open row, if it is still on the table. Filtering it out closes the
  // panel rather than leaving a name on screen that the table no longer shows.
  const pickedRow = rows.find((r) => keyOf(r) === picked) || null;

  const tally = { red: 0, orange: 0, yellow: 0, green: 0 };
  QUALS.rows.forEach((r) => r[3].forEach((v) => {
    const b = bandFor(v);
    if (b && tally[b.key] !== undefined) tally[b.key]++;
  }));

  const chip = (label, colour, n, key) => (
    <button className="um-btn"
      onClick={() => {
        const turningOn = only !== key;
        setOnly(turningOn ? key : "all");
        // Filtering happens below the fold, so a press that changes the list
        // also goes to it — otherwise the button reads as doing nothing.
        if (turningOn) {
          setTimeout(() => {
            const el = document.getElementById("matrix-grid");
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 60);
        }
      }}
      style={{ background: only === key ? colour : "transparent", color: only === key ? "#fff" : colour,
        border: `1px solid ${colour}`, borderRadius: 2, padding: "8px 12px", fontSize: 11, fontWeight: 700 }}>
      {n} {label}
    </button>
  );

  if (report === "crew") return <CrewReport onClose={() => setReport(null)} />;
  if (report === "individual") return <IndividualReport onClose={() => setReport(null)} />;

  return (
    <div>
      <SectionHead title="Crew Matrix" meta={
        <div style={{ textAlign: "right" }}>
          <div>{QUALS.rows.length} crew · {QUALS.cols.length} items</div>
          <div style={{ marginTop: 3, color: matrixUpdated ? T.text : T.muted }}>
            Matrix updated {matrixUpdated ? fmtDate(matrixUpdated) : "-"}
          </div>
          {/* The matrix and the spreadsheet on file are the same figures, so the
              latest one is offered from here rather than only from the Admin tab. */}
          {certSheet && certSheet.url && (
            <div style={{ marginTop: 3 }}>
              <a href={certSheet.url} target="_blank" rel="noreferrer"
                style={{ fontFamily: T.mono, fontSize: 11, color: T.accent, textDecoration: "none" }}>
                Latest matrix · {certSheet.filename}
              </a>
            </div>
          )}
        </div>
      } />

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 13 }}>
        {chip("expired or within 30 days", T.bRed, tally.red, "red")}
        {chip("30-60 days", T.bOrange, tally.orange, "orange")}
        {chip("60-90 days", T.bYellow, tally.yellow, "yellow")}
        {chip("beyond 90 days", T.bGreen, tally.green, "green")}
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 20 }}>
        <input className="um-in" style={{ flex: 1, minWidth: 200 }} value={q}
          onChange={(e) => setQ(e.target.value)} placeholder="Search crew or position" />
        <Button variant={only === "attention" ? "solid" : "quiet"}
          onClick={() => setOnly(only === "attention" ? "all" : "attention")}>
          Needs attention
        </Button>
        <Button variant={onlyTracked ? "solid" : "quiet"}
          title="Hide the columns that don't apply to anybody shown — search one person and the grid collapses to just their items"
          onClick={() => setOnlyTracked(!onlyTracked)}>
          Only their items
        </Button>
        {/* Only offered when there is somebody to show. On a matrix where every
            position and ticket line up the button would filter to nothing. */}
        {offTicket.length > 0 && (
          <Button variant={only === "ticket" ? "solid" : "quiet"}
            title="Crew whose ticket is not the one their position is normally held against"
            onClick={() => setOnly(only === "ticket" ? "all" : "ticket")}>
            Position differs from ticket · {offTicket.length}
          </Button>
        )}
      </div>

      <div style={{ marginBottom: 20 }}>
        <Choices value={group} onPick={setGroup} options={groups} compact />
      </div>

      {/* Nothing on the grid says the names can be pressed, and a colour block
          with no explanation is where most questions about the matrix start. */}
      <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 14 }}>
        Press a name to see every certificate held against that person underneath the table — what each
        code stands for, the date behind the colour, and the scan on file for it.
      </div>

      {/* The grid works out what it asks of somebody from their position alone,
          so a person working in a position their ticket isn't for is read against
          the wrong set of requirements — and nothing on the grid used to say so.
          Now their name carries it, in a colour that is nothing to do with a
          date falling due. */}
      {offTicket.length > 0 && (
        <div style={{ background: T.violetBg, border: `1px solid ${T.violet}`, borderLeft: `3px solid ${T.violet}`,
          borderRadius: 2, padding: "11px 13px", marginBottom: 16 }}>
          <div style={{ marginBottom: 5 }}><Eyebrow color={T.violet}>Position and ticket</Eyebrow></div>
          <div style={{ fontFamily: T.body, fontSize: 13, color: T.text, lineHeight: 1.65 }}>
            {offTicket.length} of {QUALS.rows.length} crew work in a position their certificate of competency
            is not the usual one for{offTicketStrong > 0
              ? `, and ${offTicketStrong} of those are filling a job the ticket on the matrix does not cover`
              : " — each of them holds a bigger ticket than the position asks for"}.
            Their names are marked in violet below: a filled dot where the ticket does not reach the position,
            an outlined one where it goes past it. What the matrix asks of somebody is worked out from their
            position, so the items the other ticket carries are not tracked here. Press a name to read which
            ticket it is. Whether a person may fill a position is the office's call on the vessel's manning
            approval — this only says the two do not line up.
          </div>
        </div>
      )}

      {rows.length === 0 ? (
        <div id="matrix-grid"><Empty>No crew match that filter.</Empty></div>
      ) : (
        <div className="um-matrix" id="matrix-grid" ref={frame}>
          <table style={{ width: MX_NAME_W + colIdx.length * MX_COL_W, minWidth: "100%", tableLayout: "fixed" }}>
