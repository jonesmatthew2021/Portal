              <b style={{ wordBreak: "break-word" }}>{dup.item.file.name}</b><br />
              {dup.info.reason === "content"
                ? `This exact file is already in ${dup.info.person}'s folder.`
                : `A certificate with this name is already in ${dup.info.person}'s folder.`}
              {" "}Nothing has been uploaded.
            </div>

            <div style={{ background: T.deep, border: `1px solid ${T.rule}`, borderRadius: 2,
              padding: "9px 11px", marginBottom: 14 }}>
              <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginBottom: 6 }}>
                certification/{dup.info.folder}/
              </div>
              {dup.info.existing.map((e) => (
                <div key={e.id} style={{ display: "flex", justifyContent: "space-between", gap: 10,
                  alignItems: "center", flexWrap: "wrap", padding: "4px 0" }}>
                  <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, wordBreak: "break-word" }}>
                    {e.filename}
                    <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
                      {" "}· {e.size}{e.uploaded ? ` · filed ${fmtDate(e.uploaded)}` : ""}
                      {e.sameBytes ? " · identical" : ""}
                    </span>
                  </span>
                  <OpenLink url={e.url} />
                </div>
              ))}
            </div>

            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <Button onClick={() => respond("replace")}>Replace it</Button>
              <Button variant="ghost" onClick={() => respond("keep")}>Keep both</Button>
              <Button variant="quiet" onClick={() => respond("skip")}>Skip this file</Button>
            </div>

            {queue.length > 1 && (
              <label style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 14,
                fontFamily: T.body, fontSize: 13, color: T.muted }}>
                <input type="checkbox" checked={dupAll} onChange={(e) => setDupAll(e.target.checked)} />
                Do the same with the rest of this batch
              </label>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* Whether the authority that issued a certificate reads as Australian.

   Goes off the issuing authority the portal read from each scan when the dates
   were last brought up to date (Update table) — nothing here re-reads a
   certificate. The markers are generous on purpose: a line is only flagged
   when its issuer names nothing Australian at all, and the issuer is printed
   on the flag itself so a wrongly flagged line gives itself away at a glance.
   A certificate whose issuer hasn't been read yet says nothing either way, so
   it is never flagged. */
const AU_ISSUER = new RegExp([
  "australia", "amsa", "\\.gov\\.au", "\\brto\\b", "tafe", "austswim",
  "new south wales", "\\bnsw\\b", "queensland", "\\bqld\\b", "victoria", "\\bvic\\b",
  "tasmania", "western australia", "\\bwa\\b", "south australia", "northern territory",
  "worksafe", "safework", "st john", "surf life saving", "royal life saving",
  "maritime safety queensland", "australian maritime college", "\\bamc\\b",
  "mineral resources", "\\bminres\\b", "\\bmrl\\b", "united marine", "helm connect",
].join("|"), "i");

// The issuer to flag a line with — the issuer as read, where it doesn't read
// as Australian; null where it does, or where none has been read.
const foreignIssuerOf = (d) => {
  const issuer = d && d.issuer ? String(d.issuer).trim() : "";
  return issuer && !AU_ISSUER.test(issuer) ? issuer : null;
};

/* The renewal loop. A red item looks the same whether it is being ignored or
   the course is booked for Tuesday — these marks are the difference. Each
   expired, expiring, or not-held certificate can be marked Booked, Chased, or
   Evidence in, with the day the mark was made and a one-line note on where it
   stands. Set from the Certification Checker or the Today screen; shared, so
   two admins never chase the same item twice. */
const renewalKeyOf = (person, code) =>
  `${String(person || "").trim().toUpperCase()}::${String(code || "").trim().toUpperCase()}`;
const renewalMarkFor = (marks, person, code) => (marks || {})[renewalKeyOf(person, code)] || null;
const RENEWAL_STEPS = [
  { st: "booked", label: "Booked", hint: "The course or renewal is booked" },
  { st: "chased", label: "Chased", hint: "The provider or the crew member has been chased" },
  { st: "evidence", label: "Evidence in", hint: "The certificate is in hand, waiting to be filed" },
];
const renewalStepOf = (st) => RENEWAL_STEPS.find((s) => s.st === st) || null;

/* The note beside a mark. Kept as a draft while it is being typed and written
   to the shared state when the field is left, so a save isn't sent per
   keystroke. */
function RenewalNote({ value, onSave }) {
  const [draft, setDraft] = useState(value || "");
  React.useEffect(() => { setDraft(value || ""); }, [value]);
  return (
    <input className="um-in" value={draft} onChange={(e) => setDraft(e.target.value)}
      onBlur={() => { if (draft !== (value || "")) onSave(draft); }}
      onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
      placeholder="One line on where it stands — course date, who was emailed"
      style={{ flex: "1 1 200px", minWidth: 150, fontSize: 11.5, padding: "3px 8px" }} />
  );
}

/* The three mark buttons for one person-and-certificate, and, once a mark is
   on, its note. Pressing the mark that is already on clears it. */
function RenewalMark({ person, code }) {
  const { renewalMarks, setRenewalMarks, role } = usePortal();
  const k = renewalKeyOf(person, code);
  const mk = renewalMarkFor(renewalMarks, person, code);
  const set = (st) => {
    const next = { ...(renewalMarks || {}) };
    if (next[k] && next[k].status === st) delete next[k];
    else next[k] = { status: st, on: todayISO(), by: role || "admin", note: (next[k] && next[k].note) || "" };
    setRenewalMarks(next);
  };
  return (
    <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap",
      flex: "1 1 100%", padding: "2px 0 4px 56px" }}>
      {RENEWAL_STEPS.map(({ st, label, hint }) => {
        const on = mk && mk.status === st;
        return (
          <button key={st} className="um-btn" onClick={() => set(st)}
            title={on ? `${label} ${fmtDate(mk.on)}${mk.by ? ` by ${mk.by}` : ""} — press to clear` : hint}
            style={{ background: on ? T.accentSoft : "transparent", color: on ? T.accent : T.muted,
              border: `1px solid ${on ? T.accent : T.rule}`, borderRadius: 2,
              padding: "2px 8px", fontSize: 9.5, fontWeight: 700 }}>
            {label}{on ? ` · ${fmtDate(mk.on)}` : ""}
          </button>
        );
      })}
      {mk && (
        <RenewalNote value={mk.note}
          onSave={(note) => setRenewalMarks({ ...(renewalMarks || {}), [k]: { ...mk, note } })} />
      )}
    </div>
  );
}

function CertChecker() {
  const { quals: QUALS, certSheet, certDates, certificates, renewalMarks } = usePortal();
  const validityFor = useValidityLookup();
  const [q, setQ] = useState("");
  // Hiding what is already in motion leaves the true to-do list: red items
  // nothing has been done about yet.
  const [onlyUntouched, setOnlyUntouched] = useState(false);

  // A gap is anything held but not valid: expired, marked N, or unknown.
  const gapsFor = (row) =>
    QUALS.cols.map((c, i) => ({ code: c[0], title: c[1], group: c[2], value: row[3][i], band: bandFor(row[3][i]) }))
      .filter((x) => x.band && (
        (x.band.date && daysTo(x.band.date) < 0) || x.band.key === "not" || x.band.key === "unknown"));

  const kindOf = (x) => (x.band.date ? "expired" : x.band.key === "not" ? "missing" : "unknown");

  const all = QUALS.rows.map((r) => ({ row: r, gaps: gapsFor(r) })).filter((x) => x.gaps.length);

  const count = (k) => all.reduce((n, x) => n + x.gaps.filter((g) => kindOf(g) === k).length, 0);

  // One entry per tile. The tile is the button, and the section it drops open
  // is this list of gaps narrowed by `keep`.
  const SECTIONS = [
    { key: "missing", label: "Not held", colour: T.bRed, value: count("missing"),
      keep: (g) => kindOf(g) === "missing",
      blurb: "Certificates marked as not held." },
    { key: "expired", label: "Expired", colour: T.bOrange, value: count("expired"),
      keep: (g) => kindOf(g) === "expired",
      blurb: "Certificates that are past their expiry date." },
    { key: "unknown", label: "Unconfirmed", colour: T.muted, value: count("unknown"),
      keep: (g) => kindOf(g) === "unknown",
      blurb: "Certificates left with a question mark. Nobody has said yes or no yet." },
  ];

  const sectionFor = (key) => SECTIONS.find((s) => s.key === key) || SECTIONS[0];

  const listWith = (keep) => all
    .map((x) => ({
      row: x.row,
      gaps: x.gaps.filter((g) => keep(g, x.row)),
    }))
    .filter((x) => x.gaps.length)
    .filter((x) => !q || (x.row[0] + " " + x.row[1]).toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => b.gaps.length - a.gaps.length);

  // The unconfirmed section keeps its lines either way — marks are about
  // renewals, and a question mark isn't a renewal.
  const listFor = (key) => listWith((g, row) => sectionFor(key).keep(g)
    && (!onlyUntouched || kindOf(g) === "unknown" || !renewalMarkFor(renewalMarks, row[0], g.code)));

  // How many red items already have a mark against them — what the
  // nothing-done-yet filter would hide.
  const inMotion = all.reduce((n, x) => n + x.gaps.filter((g) =>
    kindOf(g) !== "unknown" && renewalMarkFor(renewalMarks, x.row[0], g.code)).length, 0);

  // Every section is written out in full below the tiles, so the PDF simply
  // carries the whole list.
  const printed = listWith(() => true);

  // Every item whose certificate was issued by an authority that doesn't read
  // as Australian — valid or not, because the flag is about who issued it,
  // not when it runs out.
  const foreign = QUALS.rows
    .map((row) => ({
      row,
      items: QUALS.cols
        .map((c, i) => ({ code: c[0], title: c[1], group: c[2], value: row[3][i], band: bandFor(row[3][i]) }))
        .map((x) => ({ ...x, foreignIssuer: foreignIssuerOf(certDateFor(certDates, row[0], x.code)) }))
        .filter((x) => x.foreignIssuer),
    }))
    .filter((x) => x.items.length)
    .filter((x) => !q || (x.row[0] + " " + x.row[1]).toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => b.items.length - a.items.length);
  const foreignCount = foreign.reduce((n, x) => n + x.items.length, 0);
  // Whether any issuing authorities have been read into the table at all —
  // when none have, the flag has nothing to go on and says so instead.
  const issuersKnown = !!(certDates && certDates.map && Object.values(certDates.map).some((d) => d && d.issuer));

  const tile = (s) => {
    // A plain figure. The lists it counts are always open underneath, so the
    // tile has nothing to press.
    const edge = `1px solid ${T.rule}`;
    return (
      <div key={s.key}
        style={{ background: T.panel,
          borderTop: edge, borderRight: edge, borderBottom: edge,
          borderLeft: `3px solid ${s.colour}`,
          borderRadius: 2, padding: "10px 13px", flex: "1 1 130px", textAlign: "left" }}>
        <Eyebrow color={T.muted}>{s.label}</Eyebrow>
        <div style={{ fontFamily: T.display, fontSize: 25, fontWeight: 700, color: s.colour, marginTop: 5, lineHeight: 1 }}>{s.value}</div>
      </div>
    );
  };

  // Whatever is on screen, filters and all, written out as a PDF to hand over.
  const asPDF = () => ({
    title: "Certification gaps",
    subtitle: `${VESSEL.name} ${VESSEL.nameAccent} · as at ${fmtDate(TODAY)} · ${printed.length} crew · `
      + `${count("expired")} expired · ${count("missing")} not held · ${count("unknown")} unconfirmed`
      + (inMotion ? ` · ${inMotion} in motion` : "")
      + (q ? ` · matching "${q}"` : ""),
    filename: `certification-gaps-${TODAY}.pdf`,
    empty: "No gaps - everything on the matrix is valid.",
    groups: printed.map(({ row, gaps }) => ({
      heading: row[0],
      meta: `${row[1]} · ${gaps.length} ${gaps.length === 1 ? "item" : "items"}`,
      // Each line carries its renewal mark, so the printed list says not just
      // what is red but what is already being done about it.
      items: gaps.map((g) => {
        const line = pdfLineIn({ person: row[0], dates: certDates, validityFor })(g);
        const mk = kindOf(g) !== "unknown" && renewalMarkFor(renewalMarks, row[0], g.code);
        if (mk) line.notes = [{
          text: `${(renewalStepOf(mk.status) || { label: mk.status }).label} ${fmtDate(mk.on)}${mk.note ? ` — ${mk.note}` : ""}`,
          fg: T.accent,
        }];
        return line;
      }),
    })),
  });

  return (
    <div>
      {/* Sits above the far right of the tiles, over Unconfirmed: the day the
          crew certificates spreadsheet was last uploaded. The button that
          re-checks every certificate moved to Required Documents For Upload,
          renamed Sync with SharePoint certification. */}
      <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 14,
        flexWrap: "wrap", marginBottom: 7 }}>
        <div style={{ textAlign: "right" }}>
          <Eyebrow>Date last updated</Eyebrow>
          <div style={{ fontFamily: T.mono, fontSize: 12, marginTop: 4,
            color: certSheet && certSheet.uploaded ? T.text : T.muted }}>
            {certSheet && certSheet.uploaded ? fmtDate(certSheet.uploaded) : "No spreadsheet uploaded yet"}
          </div>
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        {SECTIONS.map(tile)}
        {tile({ key: "foreign", label: "Not Australian", colour: T.violet, value: foreignCount })}
      </div>

      <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 14 }}>
        Anything on the matrix that is past its date, marked as not held, or left with a question mark.
        Upcoming expiries are on the Crew Matrix - this is what is already a problem today.
        Certificates issued by a non-Australian authority are flagged in violet, going off the
        issuer printed on each scan.{!issuersKnown &&
          " No issuing authorities are on record yet - press Update table on the live portal and the flags fill in."}
        {" "}Against each item, mark what has been done — Booked, Chased, or Evidence in — with a
        line on where it stands. The mark shows here and on Today until the renewal is filed.
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        <input className="um-in" style={{ flex: 1, minWidth: 170 }} value={q}
          onChange={(e) => setQ(e.target.value)} placeholder="Search crew or position" />
        <Button variant={onlyUntouched ? "solid" : "quiet"}
          title="Hide items already marked Booked, Chased, or Evidence in — what's left is the to-do list"
          onClick={() => setOnlyUntouched(!onlyUntouched)}>
          Nothing done yet{inMotion ? ` · hides ${inMotion}` : ""}
        </Button>
        <DownloadPDF build={asPDF} variant="quiet" />
      </div>

      {/* The standing rules an expiry can't be judged without — the same notes
          the certificates page carries, editable from either place. */}
      <NotesPanel compact />

      <div id="cert-gap-detail">
        {all.length === 0 ? (
          <Empty>No gaps - everything on the matrix is valid.</Empty>
        ) : SECTIONS.map((s) => {
          const rows = listFor(s.key);
          return (
          <div key={s.key} style={{ marginBottom: 26 }}>
            <div style={{ borderTop: `2px solid ${s.colour}`, paddingTop: 9, marginBottom: 11 }}>
              <div style={{ maxWidth: 640 }}>
                <Eyebrow color={T.text}>{s.label} · {s.value}</Eyebrow>
                <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 3 }}>
                  {s.blurb}
                </div>
              </div>
            </div>

            {rows.length === 0 ? (
              <Empty>{q ? "Nothing in this section matches that search." : "Nothing in this section."}</Empty>
            ) : (
              <>
                <DateColsHead trail={248} validity />
                {rows.map(({ row, gaps }) => (
              <div key={row[0] + row[2]} style={{ marginBottom: 12, breakInside: "avoid" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12,
                  flexWrap: "wrap", background: T.raised, padding: "5px 9px", borderRadius: 2 }}>
                  <span style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text }}>{row[0]}</span>
                  <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
                    {row[1]} · {gaps.length} {gaps.length === 1 ? "item" : "items"}
                  </span>
                </div>
                {gaps.map((x) => {
                  const d = certDateFor(certDates, row[0], x.code);
                  const validity = validityFor(x);
                  const from = foreignIssuerOf(d);
                  return (
                  <div key={x.code} style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
                    padding: "4px 0 4px 4px", borderBottom: `1px solid ${T.rule}`,
                    background: from ? T.violetBg : "transparent",
                    borderLeft: from ? `3px solid ${T.violet}` : "3px solid transparent" }}>
                    <span style={{ fontFamily: T.mono, fontSize: 10, color: T.accent, minWidth: 46 }}>{x.code}</span>
                    <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, flex: 1, minWidth: 180 }}>
                      {x.title}
                      {from && (
                        <span title={`Issued by ${from} — doesn't read as an Australian authority`}
                          style={{ fontFamily: T.mono, fontSize: 9.5, fontWeight: 700, background: T.panel,
                            color: T.violet, border: `1px solid ${T.violet}`, borderRadius: 2,
                            padding: "1px 6px", marginLeft: 8, whiteSpace: "nowrap" }}>
                          NOT AU · {from}
                        </span>
                      )}
                    </span>
                    <span style={{ fontFamily: T.mono, fontSize: 10.5, color: validity ? T.text : T.muted, minWidth: 92 }}>
                      {validity || "—"}
                    </span>
                    <DateCols issued={d && d.issued} expires={x.band.date || (d && d.expires)} />
                    <CertCell url={certLinkFor(certDates, certificates, row[0], x.code)}
                      person={row[0]} code={x.code} title={x.title} />
                    <span style={{ fontFamily: T.mono, fontSize: 10, color: T.muted, minWidth: 88 }}>{x.group}</span>
                    <span style={{ minWidth: 110, display: "flex", justifyContent: "flex-end" }}>
                      <BandTag band={x.band} />
                    </span>
                    {kindOf(x) !== "unknown" && <RenewalMark person={row[0]} code={x.code} />}
                  </div>
                  );
                })}
              </div>
                ))}
              </>
            )}
          </div>
          );
        })}

        {/* Every certificate issued by an authority that doesn't read as
            Australian, valid or not — the flag is about who issued it. */}
        {foreignCount > 0 && (
          <div style={{ marginBottom: 26 }}>
            <div style={{ borderTop: `2px solid ${T.violet}`, paddingTop: 9, marginBottom: 11 }}>
              <div style={{ maxWidth: 640 }}>
                <Eyebrow color={T.text}>Not Australian-certified · {foreignCount}</Eyebrow>
                <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 3 }}>
                  Certificates whose issuing authority doesn't read as Australian, going off the
                  issuer the portal read from each scan. Valid ones are here too — the flag is
                  about who issued the certificate, not when it runs out.
                </div>
              </div>
            </div>
            <DateColsHead trail={248} validity />
            {foreign.map(({ row, items }) => (
              <div key={row[0] + row[2]} style={{ marginBottom: 12, breakInside: "avoid" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12,
                  flexWrap: "wrap", background: T.raised, padding: "5px 9px", borderRadius: 2 }}>
                  <span style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text }}>{row[0]}</span>
                  <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
                    {row[1]} · {items.length} {items.length === 1 ? "item" : "items"}
                  </span>
                </div>
                {items.map((x) => {
                  const d = certDateFor(certDates, row[0], x.code);
                  const validity = validityFor(x);
                  return (
                  <div key={x.code} style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
                    padding: "4px 0 4px 4px", borderBottom: `1px solid ${T.rule}`,
                    background: T.violetBg, borderLeft: `3px solid ${T.violet}` }}>
                    <span style={{ fontFamily: T.mono, fontSize: 10, color: T.accent, minWidth: 46 }}>{x.code}</span>
                    <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, flex: 1, minWidth: 180 }}>
                      {x.title}
                      <span style={{ fontFamily: T.mono, fontSize: 9.5, fontWeight: 700, background: T.panel,
                        color: T.violet, border: `1px solid ${T.violet}`, borderRadius: 2,
                        padding: "1px 6px", marginLeft: 8, whiteSpace: "nowrap" }}>
                        {x.foreignIssuer}
                      </span>
                    </span>
                    <span style={{ fontFamily: T.mono, fontSize: 10.5, color: validity ? T.text : T.muted, minWidth: 92 }}>
                      {validity || "—"}
                    </span>
                    <DateCols issued={d && d.issued} expires={(x.band && x.band.date) || (d && d.expires)} />
                    <CertCell url={certLinkFor(certDates, certificates, row[0], x.code)}
                      person={row[0]} code={x.code} title={x.title} />
                    <span style={{ fontFamily: T.mono, fontSize: 10, color: T.muted, minWidth: 88 }}>{x.group}</span>
                    <span style={{ minWidth: 110, display: "flex", justifyContent: "flex-end" }}>
                      {x.band ? <BandTag band={x.band} /> : null}
                    </span>
                  </div>
                  );
                })}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

// How a matrix cell reads in a sentence. The raw values are a mix of dates,
// "Y", "N", "?" and blank, and a column of those is unreadable next to prose.
function valueReads(v) {
  const s = (v == null ? "" : String(v)).trim();
  if (s === "") return "nothing";
  if (s === "?") return "a question mark";
  if (s.toUpperCase() === "Y") return "held";
  if (s.toUpperCase() === "N") return "not held";
  return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.split("-").reverse().join("/") : s;
}

/* ==================================================================== */
/*  Writing the figures back into the workbook that is already on file  */
/*                                                                      */
/*  The spreadsheet an admin keeps is not a grid of dates. It is a grid */
/*  of dates with the colour bands, the totals down the bottom, the     */
/*  second and third sheets, the print setup and the header the office  */
/*  put on it years ago. Building a fresh workbook out of the matrix    */
/*  hands back the dates and throws all of that away, and what comes    */
/*  back off the portal then no longer looks like the document the      */
/*  vessel works from.                                                  */
/*                                                                      */
/*  So the update is made to the workbook itself rather than to a copy  */
/*  of its figures. A .xlsx is a zip of XML parts: the styles, the      */
/*  conditional formatting that paints the bands, the formulas, every   */
/*  other sheet. Only the handful of value cells that actually moved    */
/*  are rewritten — everything else in the file, down to the bytes, is  */
/*  carried over untouched. A cell keeps the style it was given, so a   */
/*  date written in today is coloured by the same rule that coloured    */
/*  the one it replaced.                                                */
/*                                                                      */
/*  SheetJS can't do this: the free build reads a workbook's values and */
/*  writes a new one, and the styles are gone in between. So the zip is */
/*  opened here, with the browser's own compression, and it stays the   */
/*  fallback for the case where there is nothing on file to update.     */
/* ==================================================================== */

// Nothing here works without the browser's compression streams. They have been
// in every browser for years, but a portal that quietly produced a workbook
// with no colours would be worse than one that says why, so this is checked
// rather than assumed.
const zipCapable = () =>
  typeof CompressionStream === "function" && typeof DecompressionStream === "function";

const pipeBytes = async (bytes, stream) =>
  new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());

const inflateRaw = (bytes) => pipeBytes(bytes, new DecompressionStream("deflate-raw"));
const deflateRaw = (bytes) => pipeBytes(bytes, new CompressionStream("deflate-raw"));

// The zip checksum. Only the parts that are rewritten need one — every other
// part is copied across still compressed, with the checksum it came with.
let CRC_TABLE = null;
function crc32(bytes) {
  if (!CRC_TABLE) {
    CRC_TABLE = new Int32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      CRC_TABLE[n] = c;
    }
  }
  let crc = -1;
  for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xff];
  return (crc ^ -1) >>> 0;
}

/**
 * The parts of a .xlsx, in the order the file holds them.
 *
 * The central directory at the end of the zip is read rather than the local
 * headers, because it is the one place the sizes are always filled in. Each
 * part is kept exactly as it was found — still compressed — so a part nothing
 * asks about is written back out byte for byte.
 */
function readZip(buf) {
  const b = new Uint8Array(buf);
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);

  let eocd = -1;
  for (let i = b.length - 22; i >= 0 && i >= b.length - 22 - 65535; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("it is not a .xlsx — the file has no zip directory in it");

  const count = dv.getUint16(eocd + 10, true);
  let at = dv.getUint32(eocd + 16, true);
  const entries = [];
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(at, true) !== 0x02014b50) throw new Error("the zip directory inside the workbook is damaged");
    const flag = dv.getUint16(at + 8, true);
    const method = dv.getUint16(at + 10, true);
    const csize = dv.getUint32(at + 20, true);
    const usize = dv.getUint32(at + 24, true);
    const nameLen = dv.getUint16(at + 28, true);
    const extraLen = dv.getUint16(at + 30, true);
    const commentLen = dv.getUint16(at + 32, true);
    const local = dv.getUint32(at + 42, true);
    // Zip64 and encrypted parts are both rare enough in a spreadsheet that
    // handling them is not worth the room. Saying so sends the run down the
    // rebuild path rather than writing a workbook nothing can open.
    if (flag & 0x01) throw new Error("the workbook is password protected");
    if (csize === 0xffffffff || usize === 0xffffffff || local === 0xffffffff) throw new Error("the workbook is in the zip64 format");
    if (method !== 0 && method !== 8) throw new Error(`part of the workbook is packed in a way this can't read (method ${method})`);
    const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    entries.push({
      name: new TextDecoder().decode(b.subarray(at + 46, at + 46 + nameLen)),
      method, flag,
      time: dv.getUint16(at + 12, true),
      date: dv.getUint16(at + 14, true),
      crc: dv.getUint32(at + 16, true),
      csize, usize,
      body: b.subarray(start, start + csize),
    });
    at += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

/* The workbook path is the reason this exists, so a .xlsx is what it makes
   unless it is told otherwise. The "download everything" archive in the Admin
   tab is the other caller, and a zip of the whole portal handed over as a
   spreadsheet is one the operating system opens in Excel. */
function writeZip(entries, mime = XLSX_MIME) {
  const enc = new TextEncoder();
  const parts = [];
  const dir = [];
  let offset = 0;

  entries.forEach((e) => {
    const name = enc.encode(e.name);
    // The sizes are written into the local header, so the "sizes follow the
    // data" flag is cleared whether or not the file we read used it.
    const flag = e.flag & ~0x08;

    const local = new Uint8Array(30 + name.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, flag, true);
    lv.setUint16(8, e.method, true);
    lv.setUint16(10, e.time, true);
    lv.setUint16(12, e.date, true);
    lv.setUint32(14, e.crc, true);
    lv.setUint32(18, e.csize, true);
    lv.setUint32(22, e.usize, true);
    lv.setUint16(26, name.length, true);
    local.set(name, 30);

    const cd = new Uint8Array(46 + name.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, flag, true);
    cv.setUint16(10, e.method, true);
    cv.setUint16(12, e.time, true);
    cv.setUint16(14, e.date, true);
    cv.setUint32(16, e.crc, true);
    cv.setUint32(20, e.csize, true);
    cv.setUint32(24, e.usize, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    cd.set(name, 46);

    parts.push(local, e.body);
    dir.push(cd);
    offset += local.length + e.body.length;
  });

  const dirSize = dir.reduce((n, c) => n + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, dirSize, true);
  ev.setUint32(16, offset, true);

  return new Blob([...parts, ...dir, end], { type: mime });
}

/* ==================================================================== */
/*  Taking a copy of the whole portal                                   */
/*                                                                      */
/*  One zip holding everything the portal is and everything it holds:   */
/*  the source it is built from, every file anyone has uploaded, and    */
/*  the shared state with the roster, the notes, the correspondence     */
/*  and the change log in it.                                           */
/*                                                                      */
/*  It is built here, in the browser, rather than by a function. A      */
/*  streamed function response is capped at 20 MB by the platform and   */
/*  the documents alone can be past that, so a server-built archive     */
/*  would work until the day the portal got big enough that it didn't.  */
/*  Assembling it here has no such ceiling, and it means progress can   */
/*  be shown against a real count while it runs — which matters, since  */
/*  this is the one thing in the portal that can take a minute.         */
/*                                                                      */
/*  The zip writer above is the one the crew matrix uses to rewrite a   */
/*  workbook; a .xlsx is a zip, so it was already here.                 */
/* ==================================================================== */

const ARCHIVE_MIME = "application/zip";
// Everything in the zip sits under one folder, so unpacking it on a desktop
// leaves a single tidy folder rather than thirty loose files.
const ARCHIVE_FOLDER = "portal build";
const ARCHIVE_SOURCE = "/review/portal-source.json";

// Zip timestamps are the MS-DOS ones from 1980: the date packed into sixteen
// bits, the time into another sixteen, seconds counted in twos.
function dosStamp(when) {
  const year = Math.max(1980, when.getFullYear());
  return {
    date: ((year - 1980) << 9) | ((when.getMonth() + 1) << 5) | when.getDate(),
    time: (when.getHours() << 11) | (when.getMinutes() << 5) | (when.getSeconds() >> 1),
  };
}

/**
 * One file, ready to be written into the zip.
 *
 * Compression is tried and then kept only if it actually helped. Most of what
 * goes in is text and shrinks to a fraction, but the certificates are PDFs and
 * scans that are compressed already, and deflating those spends time to make
 * them very slightly bigger. Storing those as they are is both faster and
 * smaller.
 */
async function archiveEntry(name, data, stamp) {
  const bytes = typeof data === "string" ? new TextEncoder().encode(data) : new Uint8Array(data);
  const usize = bytes.length;

  let method = 0;
  let body = bytes;
  if (usize > 0) {
    const packed = await deflateRaw(bytes);
    if (packed.length < usize) {
      method = 8;
      body = packed;
    }
  }

  return {
    name,
    method,
    // Bit 11 says the name is UTF-8. Paths are cleaned to ASCII on the way out
    // of the server, but a file named in another alphabet should still unpack
    // under its own name rather than mojibake if one ever gets through.
    flag: /[^\x20-\x7e]/.test(name) ? 0x800 : 0,
    time: stamp.time,
    date: stamp.date,
    crc: crc32(bytes),
    csize: body.length,
    usize,
    body,
  };
}

const archiveJson = async (url) => {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${url} answered ${res.status}`);
  return res.json();
};

/**
 * Fetch a handful of things at once rather than one after another.
 *
 * A portal with two hundred certificates on it is two hundred round trips, and
 * done strictly in turn that is minutes of waiting on latency rather than on
 * bytes. Four at a time is enough to keep the connection busy without opening
 * so many that a phone on ship's wifi starts timing them out.
 */
async function archivePool(items, worker, width = 4) {
  let next = 0;
  const runners = Array.from({ length: Math.min(width, items.length) }, async () => {
    while (next < items.length) {
      const i = next++;
      await worker(items[i], i);
    }
  });
  await Promise.all(runners);
}

/**
 * Build the archive.
 *
 * `onStep` is called as it goes with what is being done and how far along it
 * is, so the button can show progress. Anything that can't be fetched is
 * recorded and the archive is finished without it — a file whose bytes have
 * gone from the store still has a row in the database, and one of those should
 * not cost somebody the copy of everything else.
 */
async function buildPortalArchive(onStep) {
  if (!zipCapable()) {
    throw new Error(
      "This browser can't build a zip — it has no compression support. Try Chrome, Edge, Safari or Firefox.",
    );
  }

  const startedAt = new Date();
  const stamp = dosStamp(startedAt);
  const entries = [];
  const missing = [];
  let bytesIn = 0;

  const add = async (path, data) => {
    const entry = await archiveEntry(`${ARCHIVE_FOLDER}/${path}`, data, stamp);
    bytesIn += entry.usize;
    entries.push(entry);
  };

  onStep({ label: "Reading what's on the portal", done: 0, total: 0, bytes: 0 });

  /* The three lists the archive is built from, fetched together. The manifest
     is every document row and where each belongs in the zip; the source is the
     packaged copy of the portal's own files; the state is the roster, notes,
     correspondence and change log. */
  const [manifest, source, state] = await Promise.all([
    archiveJson("/api/archive"),
    archiveJson(ARCHIVE_SOURCE).catch(() => null),
    archiveJson("/api/state"),
  ]);

  /* index.html is fetched from "/" rather than read out of the packaged source,
     because it is two thirds of the repository and duplicating it into a static
     JSON file would double the size of the deploy for no gain. Fetching it also
     means the copy in the archive is the front end that is actually running,
     not one packaged whenever the script was last run. */
  const frontEnd = await fetch("/", { cache: "no-store" }).then((r) => {
    if (!r.ok) throw new Error(`the portal's own page answered ${r.status}`);
    return r.text();
  });

  const sourceFiles = source && Array.isArray(source.files) ? source.files : [];
  const docs = Array.isArray(manifest.files) ? manifest.files : [];
  const total = sourceFiles.length + docs.length + 1;
  let done = 0;

  const step = (label) => onStep({ label, done, total, bytes: bytesIn });

  await add("source/index.html", frontEnd);
  done++;
  step("Packing the portal's source");

  for (const file of sourceFiles) {
    await add(`source/${file.path}`, file.text);
    done++;
    if (done % 5 === 0) step("Packing the portal's source");
  }

  await add(
    "portal-state.json",
    JSON.stringify({ rev: state.rev, savedAt: startedAt.toISOString(), data: state.data }, null, 2),
  );
  await add("documents/index.json", JSON.stringify(docs, null, 2));

  step("Downloading the files on the portal");

  /* Written into the array by index rather than pushed, so the order of the zip
     matches the order of the manifest however the downloads happen to finish. */
  const fetched = new Array(docs.length).fill(null);

  await archivePool(docs, async (doc, i) => {
    try {
      const res = await fetch(doc.url, { cache: "no-store" });
      if (!res.ok) throw new Error(`answered ${res.status}`);
      fetched[i] = await res.arrayBuffer();
    } catch (e) {
      missing.push({ path: doc.path, filename: doc.filename, why: e.message || String(e) });
    }
    done++;
    step("Downloading the files on the portal");
  });

  for (let i = 0; i < docs.length; i++) {
    if (fetched[i]) await add(`documents/${docs[i].path}`, fetched[i]);
    // Freed as it goes: holding every certificate twice over, once as the
    // download and once compressed into the zip, is what would run a phone out
    // of memory on a big portal.
    fetched[i] = null;
  }

  await add("README.txt", archiveReadme({ startedAt, source, state, docs, missing, frontEnd }));

  onStep({ label: "Writing the zip", done: total, total, bytes: bytesIn });

  return {
    blob: writeZip(entries, ARCHIVE_MIME),
    filename: `${ARCHIVE_FOLDER}.zip`,
    fileCount: entries.length,
    documentCount: docs.length - missing.length,
    sourceCount: sourceFiles.length + 1,
    missing,
    bytesIn,
  };
}

/** The note at the top of the archive, for whoever opens it a year from now. */
function archiveReadme({ startedAt, source, state, docs, missing, frontEnd }) {
  const kb = (n) => `${Math.round(n / 1024).toLocaleString("en-AU")} KB`;
  const frontEndBytes = new TextEncoder().encode(frontEnd).length;
  const lines = [
    "TSV COOLIBAH CREW PORTAL — COMPLETE COPY",
    "=".repeat(60),
    "",
    `Taken:            ${startedAt.toLocaleString("en-AU")}`,
    `Portal state:     revision ${state.rev}`,
    `Files:            ${docs.length - missing.length} of ${docs.length} downloaded`,
    "",
    "WHAT IS IN HERE",
    "-".repeat(60),
    "",
    "source/",
    "    Every file the portal is built from — the front end, the worker",
    "    routes behind it, the database schema and its migrations.",
    `    index.html is the live page as served at the time above (${kb(frontEndBytes)}).`,
    ...(source
      ? [`    The rest was packaged on ${source.packagedOn} by scripts/build-archive-source.mjs.`]
      : [
          "    NOT INCLUDED — review/portal-source.json could not be read. Run",
          "    node scripts/build-archive-source.mjs and take the archive again.",
        ]),
    "",
    "documents/",
    "    Every file anyone has uploaded, laid out the way the portal files",
    "    them: certificates under certification/<person>/, the matrices under",
    "    matrices/, handover notes under notes/<swing>/<rank>/, and so on.",
    "    Anything taken off the portal but not destroyed is under removed/ —",
    "    those are superseded or withdrawn, not current.",
    "",
    "documents/index.json",
    "    What the portal knows about each of those files: who filed it, when,",
    "    which crew member and matrix code a certificate answers to, its expiry",
    "    date, and its checksum.",
    "",
    "portal-state.json",
    "    Everything the portal holds that isn't a file — the roster, the swing",
    "    pattern, handover notes, correspondence, comments, suggestions, the",
    "    crew matrix and the change log.",
    "",
  ];

  if (missing.length) {
    lines.push(
      "FILES THAT COULD NOT BE DOWNLOADED",
      "-".repeat(60),
      "",
      "These are listed in the portal but their contents could not be fetched.",
      "The record of each is still in documents/index.json.",
      "",
      ...missing.map((m) => `    ${m.path} — ${m.why}`),
      "",
    );
  }

  lines.push(
    "PUTTING IT BACK",
    "-".repeat(60),
    "",
    "This is a copy to keep, not a backup the portal can restore from on its",
    "own. The source rebuilds and redeploys as it is. The documents and the",
    "state would have to be uploaded again through the portal.",
    "",
    "Treat the whole archive as internal — it is every crew certificate and",
    "every note on the portal, in one folder.",
    "",
  );

  return lines.join("\n");
}

const archiveMB = (n) => `${(n / (1024 * 1024)).toFixed(1)} MB`;

/**
 * The Admin tab's "download everything" button.
 *
 * Kept as its own component because building the archive is the one thing in
 * the portal that can run for a minute, and a button that looks stuck for a
 * minute is a button people press again. It counts as it goes instead.
 */
function DownloadEverything({ log }) {
  const [busy, setBusy] = useState(false);
  const [step, setStep] = useState(null);
  const [err, setErr] = useState("");
  const [done, setDone] = useState(null);

  const go = async () => {
    setErr("");
    setDone(null);
    setBusy(true);
    try {
      const result = await buildPortalArchive(setStep);

      const url = URL.createObjectURL(result.blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = result.filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      // A zip of a few hundred megabytes takes the browser a moment to start
      // writing, and revoking the URL before it has would cancel the download.
      setTimeout(() => URL.revokeObjectURL(url), 120000);

      setDone(result);
      log(
        "Admin",
        "Downloaded a copy of the whole portal",
        `${result.documentCount} files, ${archiveMB(result.blob.size)}`,
      );
    } catch (e) {
      setErr(e.message || String(e));
    } finally {
      setBusy(false);
      setStep(null);
    }
  };

  return (
    <>
      <div style={{ marginBottom: 10, marginTop: 22 }}><Eyebrow color={T.accent}>Take a copy of everything</Eyebrow></div>
      <div style={{ background: T.panel, border: `1px solid ${err ? T.bOrange : T.rule}`,
        borderLeft: `4px solid ${err ? T.bOrange : T.teal}`, borderRadius: 2, padding: "13px 15px" }}>
        <div style={{ fontFamily: T.body, fontSize: 15, color: T.text, opacity: 0.92, lineHeight: 1.7 }}>
          One zip holding the whole portal: every source file it is built from, every document and
          certificate anyone has uploaded, and the roster, notes, correspondence and change log. It
          unpacks into a single folder called <b>portal build</b>, so you can drop it straight on a
          desktop. Big portals take a minute and the file can run to hundreds of megabytes — do it on
          a computer rather than a phone. Treat it as internal: it is every certificate on the portal
          in one folder.
        </div>

        {busy && step && (
          <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, marginTop: 10 }}>
            {step.label}
            {step.total > 0 && ` · ${step.done} of ${step.total}`}
            {step.bytes > 0 && ` · ${archiveMB(step.bytes)}`}
          </div>
        )}

        {err && (
          <div style={{ fontFamily: T.mono, fontSize: 12, color: T.bOrange, marginTop: 10 }}>
            The copy didn't finish: {err}
          </div>
        )}

        {done && (
          <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, marginTop: 10 }}>
            portal build.zip · {archiveMB(done.blob.size)} · {done.sourceCount} source files,{" "}
            {done.documentCount} documents
            {done.missing.length > 0 && (
              <div style={{ color: T.bOrange, marginTop: 4 }}>
                {done.missing.length} {done.missing.length === 1 ? "file was" : "files were"} listed on
                the portal but couldn't be downloaded — they are named in the README inside the zip.
              </div>
            )}
          </div>
        )}

        <div style={{ marginTop: 12 }}>
          <button className="um-btn" onClick={go} disabled={busy}
            style={{ background: busy ? T.raised : T.accent, color: busy ? T.muted : "#fff",
              fontFamily: T.display, fontSize: 11, fontWeight: 700, letterSpacing: "0.1em",
              textTransform: "uppercase", padding: "9px 15px", borderRadius: 2, border: "none",
              cursor: busy ? "default" : "pointer" }}>
            {busy ? "Building the zip…" : "Download everything"}
          </button>
        </div>
      </div>
    </>
  );
}



const partOf = (entries, name) => entries.find((e) => e.name === name) || null;

async function partText(entry) {
  if (!entry) return "";
  const bytes = entry.method === 0 ? entry.body : await inflateRaw(entry.body);
  return new TextDecoder().decode(bytes);
}

async function setPartText(entry, text) {
  const bytes = new TextEncoder().encode(text);
  entry.usize = bytes.length;
  entry.crc = crc32(bytes);
  entry.body = await deflateRaw(bytes);
  entry.csize = entry.body.length;
  entry.method = 8;
  entry.flag &= ~0x08;
}

// ---------------------------------------------------------------------------
// The little bit of XML the sheet needs
// ---------------------------------------------------------------------------

const xmlEsc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

const xmlUnesc = (s) => String(s == null ? "" : s)
  .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'")
  .replace(/&#x([0-9a-fA-F]+);/g, (_m, n) => String.fromCharCode(parseInt(n, 16)))
  .replace(/&#(\d+);/g, (_m, n) => String.fromCharCode(Number(n)))
  .replace(/&amp;/g, "&");

const colOf = (ref) => {
  let n = 0;
  const letters = String(ref).replace(/\d+$/, "");
  for (let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n;
};

const letterOf = (n) => {
  let s = "";
  let x = n;
  while (x > 0) { const r = (x - 1) % 26; s = String.fromCharCode(65 + r) + s; x = (x - 1 - r) / 26; }
  return s;
};

/**
 * Split a run of XML into the bits a pattern matches and the bits between them.
 *
 * Everything that isn't a row — or, inside a row, isn't a cell — is kept as it
 * was found and put back in the same place, so a workbook written by something
 * other than Excel doesn't lose whatever it puts between them.
 */
function chunk(text, re) {
  const hits = [];
  const gaps = [];
  let last = 0;
  let m;
  re.lastIndex = 0;
  while ((m = re.exec(text))) {
    gaps.push(text.slice(last, m.index));
    hits.push(m[0]);
    last = m.index + m[0].length;
  }
  gaps.push(text.slice(last));
  return { hits, gaps };
}

const ROW_RE = () => /<row\b[^>]*\/>|<row\b[^>]*>[\s\S]*?<\/row>/g;
const CELL_RE = () => /<c\b[^>]*\/>|<c\b[^>]*>[\s\S]*?<\/c>/g;

function readCell(raw) {
  const ref = (raw.match(/\br="([A-Z]+\d+)"/) || [])[1] || "";
  const s = (raw.match(/\bs="(\d+)"/) || [])[1];
  return {
    ref,
    col: colOf(ref),
    s: s === undefined ? null : Number(s),
    t: (raw.match(/\bt="([a-zA-Z]+)"/) || [])[1] || "n",
    hasFormula: /<f[\s/>]/.test(raw),
    v: (raw.match(/<v[^>]*>([\s\S]*?)<\/v>/) || [])[1],
    is: (raw.match(/<is>([\s\S]*?)<\/is>/) || [])[1],
    raw,
  };
}

/** The sheet, split so the value cells can be reached and nothing else moves. */
function readSheet(xml) {
  const at = xml.indexOf("<sheetData");
  if (at < 0) throw new Error("the sheet has no data in it");
  const gt = xml.indexOf(">", at);
  const openTag = xml.slice(at, gt + 1);
  const empty = openTag.endsWith("/>");
  const close = empty ? gt + 1 : xml.indexOf("</sheetData>", gt);
  const body = empty ? "" : xml.slice(gt + 1, close);

  const rowChunks = chunk(body, ROW_RE());
  const rows = rowChunks.hits.map((raw) => {
    const open = raw.match(/^<row\b[^>]*?\/?>/)[0];
    const inner = open.endsWith("/>") ? "" : raw.slice(open.length, raw.length - "</row>".length);
    const cellChunks = chunk(inner, CELL_RE());
    return {
      num: Number((raw.match(/\br="(\d+)"/) || [])[1] || 0),
      open,
      cells: cellChunks.hits.map(readCell),
      gaps: cellChunks.gaps,
      raw,
      dirty: false,
    };
  });

  return {
    head: xml.slice(0, at),
    open: empty ? "<sheetData>" : openTag,
    tail: empty ? xml.slice(gt + 1) : xml.slice(close + "</sheetData>".length),
    rows,
    gaps: rowChunks.gaps,
    added: [],
  };
}

function rowXml(row) {
  if (!row.dirty) return row.raw;
  // `spans` is a hint about which columns the row uses, and a stale one is
  // worse than none, so a row that has been written to loses it.
  const open = row.open.replace(/\s+spans="[^"]*"/, "").replace(/\/>$/, ">");
  let inner = "";
  for (let i = 0; i < row.cells.length; i++) inner += row.gaps[i] + row.cells[i].raw;
  return `${open}${inner + row.gaps[row.cells.length]}</row>`;
}

function writeSheet(sheet) {
  let body = "";
  for (let i = 0; i < sheet.rows.length; i++) body += sheet.gaps[i] + rowXml(sheet.rows[i]);
  body += sheet.added.join("");
  body += sheet.gaps[sheet.rows.length];
  return `${sheet.head}${sheet.open}${body}</sheetData>${sheet.tail}`;
}

// The shared string table, read only. New text is written into the cell itself
// as an inline string, so the table — and every count on it — is left alone.
function sharedStrings(xml) {
  if (!xml) return [];
  const out = [];
  const si = /<si\b[^>]*\/>|<si\b[^>]*>[\s\S]*?<\/si>/g;
  let m;
  while ((m = si.exec(xml))) out.push(textOfRuns(m[0]));
  return out;
}

const textOfRuns = (xml) => {
  let text = "";
  const t = /<t\b[^>]*\/>|<t\b[^>]*>([\s\S]*?)<\/t>/g;
  let m;
  while ((m = t.exec(xml))) text += xmlUnesc(m[1] || "");
  return text;
};

/** What a cell says, as text — the same reading `parseWorkbook` takes. */
function cellText(cell, strings, date1904) {
  if (!cell) return "";
  if (cell.t === "s") { const i = Number(cell.v); return strings[i] == null ? "" : strings[i]; }
  if (cell.t === "inlineStr") return textOfRuns(cell.is || "");
  if (cell.t === "str") return xmlUnesc(cell.v || "");
  if (cell.t === "b") return cell.v === "1" ? "Y" : "N";
  if (cell.v == null || cell.v === "") return "";
  const n = Number(cell.v);
  if (!isFinite(n)) return xmlUnesc(cell.v);
  // A number in this range is a date. Everything the matrix carries in an item
  // column is either a date, a letter or blank, so there is nothing else a
  // five-figure number in one could be.
  return n >= 20000 && n <= 90000 ? isoFromSerial(n, date1904) : String(n);
}

function isoFromSerial(n, date1904) {
  const base = date1904 ? Date.UTC(1904, 0, 1) : Date.UTC(1899, 11, 30);
  return new Date(base + Math.round(n) * 86400000).toISOString().slice(0, 10);
}

function serialFrom(iso, date1904) {
  const [y, m, d] = iso.split("-").map(Number);
  const days = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
  return date1904 ? days - 1462 : days;
}

// A date typed into a column that holds its dates as text, written the way the
// dates already in that column are written.
function textDate(iso, sample) {
  const [y, m, d] = iso.split("-");
  if (/^\d{4}-\d{2}-\d{2}/.test(sample)) return iso;
  const sep = /^\d{1,2}\.\d{1,2}\.\d{2,4}/.test(sample) ? "."
    : /^\d{1,2}-\d{1,2}-\d{2,4}/.test(sample) ? "-" : "/";
  return `${d}${sep}${m}${sep}${y}`;
}

function cellXml(ref, style, val) {
  const s = style == null ? "" : ` s="${style}"`;
  if (val.kind === "blank") return `<c r="${ref}"${s}/>`;
  if (val.kind === "number") return `<c r="${ref}"${s}><v>${val.value}</v></c>`;
  if (val.kind === "shared") return `<c r="${ref}"${s} t="s"><v>${val.value}</v></c>`;
  return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val.value)}</t></is></c>`;
}

function putCell(row, col, ref, style, val) {
  const raw = cellXml(ref, style, val);
  const at = row.cells.findIndex((c) => c.col === col);
  if (at >= 0) {
    row.cells[at] = readCell(raw);
  } else {
    // A blank cell isn't in the file at all, so it is put in at the point the
    // column order says it belongs.
    let idx = row.cells.findIndex((c) => c.col > col);
    if (idx < 0) idx = row.cells.length;
    row.cells.splice(idx, 0, readCell(raw));
    row.gaps.splice(idx, 0, "");
  }
  row.dirty = true;
}

// Ranges that stopped at the last crew member have to reach the ones added
// under them, or a new row sits outside the rule that paints the colour bands.
function extendRanges(xml, fromRow, toRow) {
  const bump = (range) => range.split(/\s+/).filter(Boolean).map((r) =>
    r.replace(/([A-Z]+)(\d+)$/, (whole, c, n) => (Number(n) === fromRow ? `${c}${toRow}` : whole))).join(" ");
  return xml
    .replace(/<(conditionalFormatting|dataValidation)\b[^>]*>/g, (tag) =>
      tag.replace(/sqref="([^"]+)"/, (_w, v) => `sqref="${bump(v)}"`))
    .replace(/<dimension\b[^>]*>/g, (tag) =>
      tag.replace(/ref="([^"]+)"/, (_w, v) => `ref="${bump(v)}"`));
}

/**
 * Which sheet in the workbook the matrix is on, and where its XML lives.
 *
 * The same sheet the portal reads back in is the one written to — the one
 * named for the crew expiry, or the first if the workbook only has one.
 */
function sheetPath(workbookXml, relsXml) {
  const rels = {};
  const rel = /<Relationship\b[^>]*>/g;
  let m;
  while ((m = rel.exec(relsXml))) {
    const id = (m[0].match(/Id="([^"]+)"/) || [])[1];
    const target = (m[0].match(/Target="([^"]+)"/) || [])[1];
    if (id && target) rels[id] = target.replace(/^\//, "").replace(/^xl\//, "");
  }

  const sheets = [];
  const sh = /<sheet\b[^>]*>/g;
  while ((m = sh.exec(workbookXml))) {
    const name = xmlUnesc((m[0].match(/name="([^"]*)"/) || [])[1] || "");
    const id = (m[0].match(/r:id="([^"]+)"/) || [])[1];
    if (id && rels[id]) sheets.push({ name, path: `xl/${rels[id]}` });
  }
  if (!sheets.length) throw new Error("no sheets could be found in the workbook");

  return sheets.find((s) => s.name.toUpperCase().includes("CREW EXPIRY")) || sheets[0];
}

// Excel keeps a list of which formulas to work out in which order. Replacing a
// formula with a figure leaves that list pointing at a cell that no longer has
// one, which Excel reports as a damaged file — so it is dropped and Excel
// builds it again on open.
async function dropCalcChain(entries) {
  const at = entries.findIndex((e) => e.name === "xl/calcChain.xml");
  if (at < 0) return;
  entries.splice(at, 1);

  const types = partOf(entries, "[Content_Types].xml");
  if (types) {
    await setPartText(types, (await partText(types))
      .replace(/<Override[^>]*PartName="\/xl\/calcChain\.xml"[^>]*\/>/g, ""));
  }
  const rels = partOf(entries, "xl/_rels/workbook.xml.rels");
  if (rels) {
    await setPartText(rels, (await partText(rels))
      .replace(/<Relationship[^>]*Target="[^"]*calcChain\.xml"[^>]*\/>/g, ""));
  }
}

// Every formula left in the workbook is worked out again when it is opened.
// Cached answers that depended on a cell this changed would otherwise show the
// figure they had before the update until somebody typed into the sheet.
function recalcOnOpen(xml) {
  if (/<calcPr\b/.test(xml)) {
    return xml.replace(/<calcPr\b[^>]*?\/?>/, (tag) => (/fullCalcOnLoad=/.test(tag)
      ? tag.replace(/fullCalcOnLoad="[^"]*"/, 'fullCalcOnLoad="1"')
      : tag.replace(/\/?>$/, ' fullCalcOnLoad="1"/>')));
  }
  // Where the workbook has no calculation settings at all, they go in at the
  // first place the format allows after the list of sheets.
  const after = ["<oleSize", "<customWorkbookViews", "<pivotCaches", "<smartTagPr",
    "<smartTagTypes", "<webPublishing", "<fileRecoveryPr", "<webPublishObjects",
    "<extLst", "</workbook>"];
  for (const tag of after) {
    const at = xml.indexOf(tag);
    if (at >= 0) return `${xml.slice(0, at)}<calcPr fullCalcOnLoad="1"/>${xml.slice(at)}`;
  }
  return xml;
}

/**
 * The workbook on file, brought up to date in place.
 *
 * Only cells whose figure has actually moved are written. A cell that already
 * says what the matrix says is not touched at all, which is why running this
 * twice in a row produces the same file the second time and the portal reports
 * that there was nothing to file.
 *
 * What it returns alongside the file is what it could not do: crew or items the
 * workbook has no room for. Those are put on screen rather than swallowed —
 * a spreadsheet quietly missing a person is the failure worth being loud about.
 *
 * `only`, where it is given, is a Set of NAME|CODE keys and narrows the write
 * to exactly those cells: every other person and item is left out entirely,
 * even where the workbook and the matrix disagree. It is how the certificate
 * run writes in what the certificates settle without dragging the rest of the
 * matrix over whatever else the workbook says.
 */
async function updateFiledWorkbook(buf, quals, only = null) {
  const entries = readZip(buf);

  const wbPart = partOf(entries, "xl/workbook.xml");
  const relsPart = partOf(entries, "xl/_rels/workbook.xml.rels");
  if (!wbPart || !relsPart) throw new Error("it is not laid out like a .xlsx inside");

  let workbookXml = await partText(wbPart);
  const date1904 = /date1904="(1|true)"/.test(workbookXml);
  const target = sheetPath(workbookXml, await partText(relsPart));

  const sheetPart = partOf(entries, target.path);
  if (!sheetPart) throw new Error(`the sheet "${target.name}" is missing from the workbook`);

  const strings = sharedStrings(await partText(partOf(entries, "xl/sharedStrings.xml")));
  const sharedAt = new Map();
  strings.forEach((s, i) => { if (!sharedAt.has(s)) sharedAt.set(s, i); });

  const sheetXml = await partText(sheetPart);
  const sheet = readSheet(sheetXml);
  const cellAt = (row, col) => row.cells.find((c) => c.col === col) || null;
  const says = (cell) => cellText(cell, strings, date1904);

  // The row the item codes are on. It is looked for rather than assumed to be
  // row 14, so a workbook with a line added to the header still lines up.
  const codes = quals.cols.map((c) => c[0]);
  let header = null;
  sheet.rows.forEach((row) => {
    const found = new Map();
    row.cells.forEach((c) => {
      const text = says(c).trim();
      if (codes.includes(text) && !found.has(text)) found.set(text, c.col);
    });
    if (found.size >= 2 && (!header || found.size > header.found.size)) header = { row, found };
  });
  if (!header) throw new Error("the item codes couldn't be found on it — it isn't laid out like the crew qualification workbook");

  const colForCode = header.found;
  const keyOf = (name, code) => `${String(name).trim().toUpperCase()}|${code}`;
  // Only the people and items the write actually concerns. With no `only`
  // everything on the matrix is in scope, which is what the matrix-driven
  // update has always done.
  const inScope = only
    ? quals.rows.filter((p) => quals.cols.some((c) => only.has(keyOf(p[0], c[0]))))
    : quals.rows;
  const onlyCodes = only ? new Set([...only].map((k) => k.slice(k.indexOf("|") + 1))) : null;
  const missingCols = codes.filter((code) => !colForCode.has(code) && (!onlyCodes || onlyCodes.has(code)));

  // Crew are read from under the codes: a name in column B is a crew member,
  // and the row it is on is the row that person's dates go in. The row directly
  // under the codes is the one carrying the item titles, and "Crew member" in
  // column B is a heading rather than somebody on the roster.
  const NAME_COL = 2, POS_COL = 3, SAM_COL = 4;
  const crewRows = sheet.rows.filter((r) => r.num > header.row.num + 1 && says(cellAt(r, NAME_COL)).trim() !== "");
  const rowForName = new Map();
  crewRows.forEach((r) => {
    const key = says(cellAt(r, NAME_COL)).trim().toUpperCase();
    if (!rowForName.has(key)) rowForName.set(key, r);
  });

  // What each item column holds today — figures or text, and in which style —
  // so a date written into a cell that has never had one in it is written the
  // way the dates already in that column are written, and carries the format
  // that makes a date look like a date rather than a five-figure number.
  const shapeOf = new Map();
  colForCode.forEach((col, code) => {
    let numbers = 0, words = 0, sample = "", style = null;
    const styles = new Map();
    crewRows.forEach((r) => {
      const c = cellAt(r, col);
      if (!c) return;
      if (c.s != null) styles.set(c.s, (styles.get(c.s) || 0) + 1);
      const text = says(c);
      if (text === "") return;
      if (c.t === "n") numbers++; else words++;
      if (!sample && /\d/.test(text)) sample = text;
    });
    styles.forEach((n, s) => { if (style === null || n > (styles.get(style) || 0)) style = s; });
    shapeOf.set(code, { numeric: numbers >= words, sample, style });
  });

  // A column nobody has ever put anything in has no style of its own to copy,
  // so it borrows one from a column that has. Where there is nothing to borrow
  // — an empty sheet — a date goes in as text, because a date serial with no
  // date format on it reads as 46000 and would have to be found and fixed.
  let borrowed = null;
  let borrowedSample = "";
  shapeOf.forEach((shape) => {
    if (borrowed === null && shape.style != null && shape.numeric) borrowed = shape.style;
    if (!borrowedSample && shape.sample) borrowedSample = shape.sample;
  });
  shapeOf.forEach((shape) => {
    if (shape.style == null) shape.style = borrowed;
    if (!shape.sample) shape.sample = borrowedSample;
  });

  const report = {
    sheet: target.name, written: 0, formulas: 0,
    addedRows: [], skippedRows: [], skippedCols: missingCols,
  };

  // The value a cell should end up holding, in the shape that column uses. A
  // date only goes in as a figure where there is a style to render it with;
  // otherwise it is written out in words the way the column already writes them.
  const valueFor = (want, shape, existing, style) => {
    if (want === "") return { kind: "blank" };
    if (/^\d{4}-\d{2}-\d{2}$/.test(want)) {
      const numeric = existing ? existing.t === "n" : shape.numeric;
      if (numeric && style != null) return { kind: "number", value: serialFrom(want, date1904) };
      return textValue(textDate(want, shape.sample));
    }
    return textValue(want);
  };
  const textValue = (text) => (sharedAt.has(text)
    ? { kind: "shared", value: sharedAt.get(text) }
    : { kind: "inline", value: text });

  inScope.forEach((person) => {
    const row = rowForName.get(String(person[0]).trim().toUpperCase());
    if (!row) { report.skippedRows.push(person[0]); return; }

    quals.cols.forEach((col, i) => {
      const at = colForCode.get(col[0]);
      if (at === undefined) return;
      if (only && !only.has(keyOf(person[0], col[0]))) return;

      const want = person[3] && person[3][i] != null ? String(person[3][i]).trim() : "";
      const existing = cellAt(row, at);
      if (says(existing).trim() === want) return;

      const shape = shapeOf.get(col[0]) || { numeric: true, sample: "", style: null };
      const style = existing && existing.s != null ? existing.s : shape.style;
      if (existing && existing.hasFormula) report.formulas++;
      putCell(row, at, `${letterOf(at)}${row.num}`, style, valueFor(want, shape, existing, style));
      report.written++;
    });
  });

  // Anyone on the matrix the workbook has never had a row for. A row can only
  // go on the end — putting one in the middle would move every row under it out
  // from under the formulas and the print ranges that point at them — so it is
  // only done where the crew are the last thing on the sheet. A totals line, a
  // note, anything at all under them and the rows are left to be added by hand.
  const placed = inScope
    .map((p) => rowForName.get(String(p[0]).trim().toUpperCase()))
    .filter(Boolean);
  if (report.skippedRows.length && placed.length) {
    const lastCrew = placed.reduce((a, b) => (b.num > a.num ? b : a));
    const below = sheet.rows.filter((r) => r.num > lastCrew.num && r.cells.some((c) => says(c) !== ""));
    if (!below.length) {
      const template = lastCrew;
      let num = lastCrew.num;
      const adding = report.skippedRows.slice();
      report.skippedRows = [];

      adding.forEach((name) => {
        const person = quals.rows.find((p) => p[0] === name);
        num += 1;

        // The row above is the pattern for the new one, but a column it happens
        // to have left blank isn't in the file at all — so the columns that have
        // to be written are put in alongside it and the lot is laid out in
        // column order, which is the order a sheet has to keep its cells in.
        const styleAt = new Map();
        template.cells.forEach((c) => styleAt.set(c.col, c.s));
        [NAME_COL, POS_COL, SAM_COL].forEach((col) => {
          if (!styleAt.has(col)) styleAt.set(col, null);
        });
        const codeAt = new Map();
        colForCode.forEach((col, code) => {
          codeAt.set(col, code);
          if (!styleAt.has(col)) styleAt.set(col, (shapeOf.get(code) || {}).style ?? null);
        });

        const cells = [...styleAt.keys()].sort((a, b) => a - b).map((col) => {
          const style = styleAt.get(col);
          const ref = `${letterOf(col)}${num}`;
          if (col === NAME_COL) return cellXml(ref, style, textValue(String(person[0] || "")));
          if (col === POS_COL) return cellXml(ref, style, textValue(String(person[1] || "")));
          if (col === SAM_COL) return cellXml(ref, style, textValue(String(person[2] || "")));

          const code = codeAt.get(col);
          if (code) {
            const idx = quals.cols.findIndex((x) => x[0] === code);
            const want = only && !only.has(keyOf(person[0], code))
              ? ""
              : person[3] && person[3][idx] != null ? String(person[3][idx]).trim() : "";
            const shape = shapeOf.get(code) || { numeric: true, sample: "", style };
            return cellXml(ref, style, valueFor(want, shape, null, style));
          }
          // A counter, a total, anything else the sheet keeps its own way: the
          // look is copied, the contents are not invented.
          return cellXml(ref, style, { kind: "blank" });
        }).join("");

        sheet.added.push(`<row r="${num}">${cells}</row>`);
        report.addedRows.push(person[0]);
        report.written++;
      });

      sheet.head = extendRanges(sheet.head, lastCrew.num, num);
      sheet.tail = extendRanges(sheet.tail, lastCrew.num, num);
    }
  }

  if (!report.written) return { blob: null, report };

  await setPartText(sheetPart, writeSheet(sheet));
  if (report.formulas) await dropCalcChain(entries);
  await setPartText(wbPart, recalcOnOpen(workbookXml));

  return { blob: writeZip(entries), report };
}

/**
 * The file the portal hands out and files, however it has to be made.
 *
 * The workbook on file is updated in place wherever there is one to update, so
 * what comes out is the same document with new figures in it. Where there
 * isn't — nothing filed yet, a spreadsheet in a format that isn't a workbook,
 * or a workbook this can't safely write into — it falls back to building one
 * from the matrix, and says so, because a plain grid of dates handed to
 * somebody expecting their own spreadsheet is worth a sentence on screen.
 */
async function latestMatrixFile(quals, on, certSheet) {
  const filename = `${on.replace(/-/g, "")} - CREW QUALIFICATION EXPIRY (portal).xlsx`;
  const zippable = certSheet && certSheet.url && /\.xls[xm]$/i.test(certSheet.filename || "");

  let rebuilt = "";
  if (!certSheet || !certSheet.url) {
    rebuilt = "No spreadsheet is filed on the portal yet, so this one was built from the matrix.";
  } else if (!zippable) {
    rebuilt = `${certSheet.filename} isn't an .xlsx, so it couldn't be updated in place and this was built from the matrix.`;
  } else if (!zipCapable()) {
    rebuilt = "This browser can't open the workbook on file, so the spreadsheet was built from the matrix instead. Chrome, Edge, Firefox or Safari will update the workbook itself.";
  } else {
    try {
      const res = await fetch(certSheet.url);
      if (!res.ok) throw new Error(`it couldn't be downloaded (${res.status})`);
      const buf = await res.arrayBuffer();
      const { blob, report } = await updateFiledWorkbook(buf, quals);
      // Nothing moved, so the file already on the portal is the file — handing
      // the original bytes straight back keeps it exactly what it was, which is
      // also what lets the portal notice there is nothing new to file.
      const bytes = blob || new Blob([buf], { type: XLSX_MIME });
      return { file: new File([bytes], filename, { type: XLSX_MIME }), filename, report: { ...report, rebuilt: "" } };
    } catch (e) {
      rebuilt = `${certSheet.filename} couldn't be updated in place, so the spreadsheet was built from the matrix and its formatting, formulas and other sheets aren't carried over. ${e.message || e}`;
    }
  }

  const XLSX = await loadXLSX();
  return {
    file: new File([buildMatrixWorkbook(XLSX, quals, on)], filename, { type: XLSX_MIME }),
    filename,
    report: { rebuilt, sheet: "CREW EXPIRY", written: 0, formulas: 0, addedRows: [], skippedRows: [], skippedCols: [] },
  };
}

/**
 * What the update did to the workbook, in a sentence or two.
 *
 * Whoever presses the button is answerable for the spreadsheet afterwards, so
 * the parts of it the portal couldn't reach are said plainly rather than left
 * to be found in a month.
 */
function workbookNotes(report) {
  if (!report) return [];
  if (report.rebuilt) return [report.rebuilt];

  const notes = [];
  if (report.written) {
    notes.push(`The spreadsheet on file was updated in place — its colours, formulas, column widths and every other sheet in it are exactly as they were, with ${report.written} ${report.written === 1 ? "cell" : "cells"} changed on "${report.sheet}".`);
  } else {
    notes.push(`Nothing on "${report.sheet}" needed changing, so the spreadsheet on file was left exactly as it is.`);
  }
  if (report.formulas) {
    notes.push(`${report.formulas} of those ${report.formulas === 1 ? "cell held a formula, which has been replaced by the date the certificate gives" : "cells held formulas, which have been replaced by the dates the certificates give"}. Every other formula in the workbook is untouched and is worked out again when it is opened.`);
  }
  if (report.addedRows && report.addedRows.length) {
    notes.push(`${report.addedRows.join(", ")} had no row on the spreadsheet, so ${report.addedRows.length === 1 ? "one was" : "rows were"} added under the last crew member, formatted like the row above. Anything that column works out for itself is left blank on ${report.addedRows.length === 1 ? "it" : "them"}.`);
  }
  if (report.skippedRows && report.skippedRows.length) {
    notes.push(`${report.skippedRows.join(", ")} ${report.skippedRows.length === 1 ? "has no row" : "have no rows"} on the spreadsheet and ${report.skippedRows.length === 1 ? "one couldn't be" : "they couldn't be"} added without moving what sits under the crew, so ${report.skippedRows.length === 1 ? "that person's dates were" : "those dates were"} not written into it. Add the ${report.skippedRows.length === 1 ? "row" : "rows"} in the spreadsheet and press this again.`);
  }
  if (report.skippedCols && report.skippedCols.length) {
    notes.push(`The spreadsheet has no column for ${report.skippedCols.join(", ")}, so ${report.skippedCols.length === 1 ? "that item was" : "those items were"} not written into it. Add the ${report.skippedCols.length === 1 ? "column" : "columns"} to the spreadsheet and press this again.`);
  }
  return notes;
}

/**
 * The matrix written back out as a spreadsheet, built from nothing.
 *
 * This is the fallback, not the usual path: where there is a workbook on file
 * the update is made to that workbook, so it keeps its colours, its formulas
 * and its other sheets. This one is for the case where there is nothing on file
 * to update, or what is on file can't be opened — a plain grid is better than
 * no spreadsheet, and the screen says which one was handed out.
 *
 * It is laid out the way the workbook the portal reads is laid out — codes on
 * row 14, titles on row 15, crew from row 16, names in column B — so the file
 * this hands out is a file the portal can read back in. A spreadsheet that
 * comes out of the portal and can't go back into it is a dead end, and an admin
 * would find that out a month later.
 */
function buildMatrixWorkbook(XLSX, quals, at) {
  const width = 4 + quals.cols.length;
  const blank = () => new Array(width).fill(null);

  const aoa = [];
  for (let i = 0; i < 13; i++) aoa.push(blank());

  aoa[0][1] = `${VESSEL.name} ${VESSEL.nameAccent} — CREW QUALIFICATION EXPIRY`;
  aoa[1][1] = `Generated from the crew portal on ${fmtDate(at)}`;
  aoa[2][1] = "Built from the certificates on file and the review of the differences against the previous spreadsheet.";
  aoa[3][1] = "Dates are the expiry date. Y is held with no expiry, N is not held, OPEN is a module still to be done, ? is unconfirmed, blank is not required.";

  // Row 14 (index 13) is the row the portal looks for the item codes on.
  const codes = blank();
  codes[1] = "NAME";
  codes[2] = "POSITION";
  codes[3] = "SAM #";
  quals.cols.forEach((c, i) => { codes[4 + i] = c[0]; });
  aoa.push(codes);

  const titles = blank();
  titles[1] = "Crew member";
  titles[2] = "Position";
  titles[3] = "SAM number";
  quals.cols.forEach((c, i) => { titles[4 + i] = c[1]; });
  aoa.push(titles);

  quals.rows.forEach((r, n) => {
    const row = blank();
    row[0] = n + 1;
    row[1] = r[0];
    row[2] = r[1];
    row[3] = r[2];
    (r[3] || []).forEach((v, i) => { row[4 + i] = v == null || v === "" ? null : v; });
    aoa.push(row);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{ wch: 5 }, { wch: 28 }, { wch: 24 }, { wch: 11 },
    ...quals.cols.map(() => ({ wch: 12 }))];

  const wb = XLSX.utils.book_new();
  // The name carries "CREW EXPIRY" because that is the sheet the portal reaches
  // for when a workbook holds more than one.
  XLSX.utils.book_append_sheet(wb, ws, "CREW EXPIRY");

  return new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })], { type: XLSX_MIME });
}

// ---------------------------------------------------------------------------
// Reading the certificates and bringing the matrix up to date.
//
// The same few steps are wanted from two places — the Analyse files screen,
// where an admin runs them and answers each difference, and the moment a
// certificate is uploaded, where they run on their own — so they live out here
// rather than inside either screen.
// ---------------------------------------------------------------------------

/**
 * The certificates spreadsheet on file, read in the browser.
 *
 * It is the second account of the same dates, so where it disagrees with the
 * matrix and no certificate settles it, that is worth putting up too. A
 * spreadsheet that isn't in the workbook layout the portal reads is not an
 * error — it just means the comparison is against the matrix alone, which is
 * said on screen.
 */
async function readFiledSheet(certSheet, quals) {
  if (!certSheet || !certSheet.url) {
    return { sheet: null, problem: "No certificates spreadsheet is filed on the portal, so the comparison is against the crew matrix alone." };
  }
  try {
    const XLSX = await loadXLSX();
    const res = await fetch(certSheet.url);
    if (!res.ok) throw new Error(`The spreadsheet on file couldn't be downloaded (${res.status}).`);
    const rows = parseWorkbook(XLSX, await res.arrayBuffer(), quals)
      .map((p) => ({ name: p.name, vals: p.vals }));
    return { sheet: { filename: certSheet.filename, rows }, problem: "" };
  } catch (e) {
    return { sheet: null, problem: `${certSheet.filename} couldn't be read as a crew qualification workbook, so the comparison is against the crew matrix alone. ${e.message || e}` };
  }
}

/**
 * Read every certificate on file that hasn't been read yet.
 *
 * Reading fifty scans takes far longer than one request is allowed to run, so the
 * server reads a few at a time and remembers each reading. This asks for the next
 * few until nothing is left unread, which is also what makes a lost connection
 * cost the batch it was in rather than the whole run. `onPhase` is called as it
 * goes so a screen can show where it is up to.
 *
 * Both things that need the certificates read start here — the comparison against
 * our own spreadsheets, and the comparison against the OPMS export — and because
 * every reading is kept, the second of the two to run pays for nothing.
 */
async function readCertificates({ quals, fresh, onPhase = () => {} }) {
  // Held out here so a run that stops partway can say how far it got.
  const progress = { read: 0, total: 0, remaining: 1 };

  if (fresh) {
    onPhase({ phase: "clearing", read: 0, total: 0 });
    await analyse({ action: "reset" });
  }

  onPhase({ phase: "reading", read: 0, total: 0 });
  let guard = 0;
  while (progress.remaining > 0) {
    if (guard++ > 500) throw new Error("Stopped after 500 batches - something is wrong on the server.");
    const r = await analyse({ action: "extract", cols: quals.cols, limit: 3 });
    progress.read = r.read; progress.total = r.total; progress.remaining = r.remaining;
    onPhase({ phase: "reading", read: r.read, total: r.total });
    // A batch that got through none of what it tried is not slow progress, it is
