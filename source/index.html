                  : `${accepted.length} of ${items.length} ${items.length === 1 ? "difference was" : "differences were"} marked correct. Generating the spreadsheet writes those ${accepted.length === 1 ? "change" : "changes"} into the crew matrix for everyone, files the new spreadsheet on the portal, and hands you a copy to download.`}
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 14 }}>
                <Button onClick={generate} disabled={busy}>
                  {busy ? "Generating..." : "Generate Spreadsheet"}
                </Button>
              </div>
            </div>
          ) : (
            <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.7 }}>
              {left} {left === 1 ? "difference is" : "differences are"} still waiting on a yes or no. Generate
              Spreadsheet appears once every one of them has been answered.
            </div>
          )}

          {/* What the last Generate produced. */}
          {result && (
            <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.accent}`,
              borderRadius: 2, padding: "15px 17px", marginTop: 16 }}>
              <Eyebrow color={T.accent}>Updated spreadsheet</Eyebrow>
              <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 9 }}>
                {result.filename}
              </div>
              <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.7, marginTop: 6 }}>
                {result.applied.length
                  ? `${result.applied.length} ${result.applied.length === 1 ? "date has" : "dates have"} been written into the Crew Matrix, so it now reads the same as the certificates on file for everyone.`
                  : "Nothing was marked correct, so the Crew Matrix is unchanged and the spreadsheet is the matrix as it stands."}
              </div>
              <div style={{ fontFamily: T.body, fontSize: 13, lineHeight: 1.7, marginTop: 6,
                color: result.filed && result.filed.failed ? T.bOrange : T.muted }}>
                {result.filed && result.filed.failed
                  ? result.filed.failed
                  : "It is filed on the portal as the current crew certificates spreadsheet, in place of the one it was compared against."}
              </div>

              {/* What was done to the workbook itself, and anything on the
                  matrix it had no room for. */}
              {workbookNotes(result.report).map((note, i) => (
                <div key={i} style={{ fontFamily: T.body, fontSize: 13, lineHeight: 1.7, marginTop: 6,
                  color: result.report && result.report.rebuilt ? T.bOrange : T.muted }}>
                  {note}
                </div>
              ))}

              {result.applied.length > 0 && (
                <div style={{ maxHeight: 220, overflowY: "auto", marginTop: 12 }}>
                  {result.applied.map((c, i) => (
                    <div key={i} style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
                      padding: "5px 0", borderBottom: `1px solid ${T.rule}` }}>
                      <span style={{ fontFamily: T.body, fontSize: 13, color: T.text, flex: 1, minWidth: 170 }}>{c.person}</span>
                      <span style={{ fontFamily: T.mono, fontSize: 10, color: T.accent, minWidth: 46 }}>{c.code}</span>
                      <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
                        {valueReads(c.from)} → {valueReads(c.to)}
                      </span>
                    </div>
                  ))}
                </div>
              )}

              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 14, alignItems: "center" }}>
                <a className="um-btn" href={result.download} download={result.filename}
                  style={{ background: T.accent, color: "#fff", fontFamily: T.display, fontSize: 11, fontWeight: 700,
                    letterSpacing: "0.1em", textTransform: "uppercase", padding: "9px 15px", borderRadius: 2,
                    textDecoration: "none", display: "inline-block" }}>
                  Download the spreadsheet
                </a>
                {result.filed && result.filed.url && <OpenLink url={result.filed.url} />}
              </div>
            </div>
          )}

          {/* A generation from an earlier visit, so the record of it survives a
              refresh even though the download itself can't. */}
          {!result && certAnalysis.generated && (
            <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.7, marginTop: 14 }}>
              {certAnalysis.generated.filename} was generated from this review
              {certAnalysis.generated.by ? ` by ${certAnalysis.generated.by}` : ""} and{" "}
              {certAnalysis.generated.applied} {certAnalysis.generated.applied === 1 ? "date was" : "dates were"} written
              into the Crew Matrix. It is on file above, and can be opened from there.
            </div>
          )}
        </>
      )}

      {/* A run takes minutes and the page underneath it can't be used until it
          finishes, so it is watched from a window rather than a line of text
          that scrolls away. The count and the clock both climb while it works. */}
      {run && !hidden && (
        <AnalysisWindow
          eyebrow="Analysing certificates"
          pct={pct}
          elapsed={elapsed}
          failed={run.phase === "failed"}
          message={run.message}
          failNote={run.read > 0
            ? `The ${run.read} ${run.read === 1 ? "certificate" : "certificates"} already read ${run.read === 1 ? "was" : "were"} kept, so analysing again carries on from there rather than starting over.`
            : "Nothing was read, so nothing has changed. Analysing again starts from the beginning."}
          body={<>
            {run.phase === "clearing" && "Clearing what was read before, so every certificate is read again from the file itself."}
            {run.phase === "reading" && (run.total
              ? `${run.read} of ${run.total} certificates read.`
              : "Looking for certificates to read.")}
            {run.phase === "filing" && `All ${run.total} certificates read. Putting each one in the folder of the person named on it.`}
            {run.phase === "validity" && "Reading the validity periods off the skills matrix — how long each item stays valid."}
            {run.phase === "comparing" && `All ${run.total} certificates read. Holding them against the crew matrix and the spreadsheet on file.`}
          </>}
          note="This takes a few minutes. Leave the page open — each certificate is kept as it is read, so a lost connection costs the batch it was in rather than the whole run."
          onHide={() => setHidden(true)}
          onClose={() => setRun(null)}
        />
      )}
    </div>
  );
}

/**
 * Step 3 — the matrices about the crew as a whole, and the set of them held
 * together.
 *
 * The skills matrix is what the crew are required to hold: the items, how many of
 * each every shift has to have, and whatever else has to be abided by. The
 * validity periods matrix is its other half — how long each item stays valid once
 * it has been done, and when it has to be done again. The training matrix is where
 * they actually stand. Kept apart they are spreadsheets nobody reads to the end;
 * held against each other they answer the only question that matters — is the
 * vessel crewed the way it is required to be crewed today.
 *
 * The training matrix and the skills matrix are required at all times, so the
 * portal will not run this against one of them: with either missing, the screen
 * asks for it and the server refuses the analysis. The validity periods — how
 * long each item stays valid once it has been done — are read off the skills
 * matrix itself, which carries them; there used to be a third card for a
 * separate validity periods spreadsheet, but the office folded it into the
 * skills matrix, so the latest skills matrix is always the source and there is
 * nothing extra to keep up to date.
 */
const MATRIX_CARDS = [
  {
    key: "training",
    category: "training-matrix",
    noun: "training matrix",
    title: "Training matrix",
    blurb: "Where the crew's training stands at the moment - what each person holds and when it runs out.",
    logAction: "Training matrix uploaded",
    required: true,
  },
  {
    key: "skills",
    category: "skills-matrix",
    noun: "skills matrix",
    title: "Skills matrix",
    blurb: "What the crew are required to hold: the items, who each one applies to, the shift allocations, and anything else to abide by.",
    logAction: "Skills matrix uploaded",
    required: true,
  },
];

// The record on file for each card, and where a newly filed one goes. Kept in one
// place so the three screens that show these documents can't disagree about which
// card is which document.
const matrixRecords = (portal) => ({
  training: portal.trainingMatrix,
  skills: portal.skillsMatrix,
});

const matrixSetters = (portal) => ({
  training: portal.setTrainingMatrix,
  skills: portal.setSkillsMatrix,
});

// Where the bar in the progress window stands at each step of a matrix run. A
// document read is a call apiece and the comparison is another, and the step under
// way is counted half done rather than not started. The validity periods matrix
// may not be there to read, which only means the bar spends longer on the step
// after it.
const MATRIX_PHASE_PCT = { clearing: 0, training: 12, skills: 37, validity: 62, checking: 84 };

// How each kind of finding reads. Severity is the whole of the triage here, so it
// carries a colour and a word rather than only a colour.
const SEVERITIES = {
  breach: { label: "Breach", fg: T.bRed, bg: T.bRedBg,
    blurb: "Required and not being met today." },
  due: { label: "Due", fg: T.bOrange, bg: T.bOrangeBg,
    blurb: "Valid now, inside the renewal window." },
  gap: { label: "Gap", fg: T.teal, bg: T.raised,
    blurb: "The training matrix says nothing about it, or a shift is short." },
  query: { label: "Query", fg: T.muted, bg: T.raised,
    blurb: "The two documents disagree, or one of them is unclear." },
};

function CrewMatrices() {
  const portal = usePortal();
  const {
    trainingMatrix, skillsMatrix, validityMatrix,
    matrixAnalysis, setMatrixAnalysis, log, role,
  } = portal;
  const records = matrixRecords(portal);

  const [run, setRun] = useState(null);       // null | { phase } | { phase: "failed", message }
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [problems, setProblems] = useState([]);
  // The run is watched from a window over the page. It can be put away — the run
  // carries on either way, and the panel under the buttons says where it is.
  const [hidden, setHidden] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const startedAt = useRef(0);
  const ran = useRef(false);

  const running = !!run && run.phase !== "failed";
  const both = !!trainingMatrix && !!skillsMatrix;
  const missing = MATRIX_CARDS.filter((c) => c.required && !records[c.key]);

  // How far through the run is. Reading each document and holding them together
  // is a call apiece, so each is worth about the same, and a step under way
  // counts as half done — the figure moves as each one is picked up rather than
  // sitting at nought until the first of them is finished. Clearing what was read
  // before is a moment, so it sits at the start.
  const pct = !run || run.phase === "failed" ? 0 : (MATRIX_PHASE_PCT[run.phase] || 0);

  React.useEffect(() => {
    if (!running) return;
    const tick = () => setElapsed(Math.round((Date.now() - startedAt.current) / 1000));
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, [running]);

  /**
   * Read the documents, then hold them against each other.
   *
   * They are all filed elsewhere on the tab, so what is read here is whatever the
   * portal holds at the moment the button is pressed.
   */
  const runAnalysis = async (fresh) => {
    const training = trainingMatrix;
    const skills = skillsMatrix;
    const validity = validityMatrix;
    if (!training || !skills) return;

    setErr(""); setBusy(true); setProblems([]); setRun(null); setHidden(false);
    startedAt.current = Date.now();
    try {
      const res = await analyseMatrices({
        trainingMatrix: training, skillsMatrix: skills, validityMatrix: validity, fresh,
        onPhase: (p) => setRun(p),
      });

      setMatrixAnalysis({
        at: res.at || new Date().toISOString(),
        by: role,
        model: res.model || "",
        training: res.training || null,
        skills: res.skills || null,
        validity: res.validity || null,
        check: res.check || null,
        problems: res.problems || [],
      });
      setProblems(res.problems || []);

      const check = res.check || {};
      const counts = check.counts || {};
      log("Admin", validity ? "Analysed the training, skills and validity matrices" : "Analysed the training and skills matrices",
        `${counts.requirements || 0} requirements · ${counts.breaches || 0} ${
          (counts.breaches || 0) === 1 ? "breach" : "breaches"} · ${counts.due || 0} due · ${counts.gaps || 0} gaps`);
      setRun(null);
    } catch (e) {
      const message = e.message || String(e);
      setErr(message);
      // The window stays up with the reason in it — and comes back if it had been
      // put away, since a run that stopped is the one thing worth interrupting
      // for. Closing it leaves the same message on the panel below.
      setHidden(false);
      setRun({ phase: "failed", message });
    }
    setBusy(false);
  };

  // An answer may already be sitting on the server from someone else's run, or
  // from before this browser was opened. Ask once, rather than making an admin
  // press a button to be told what the portal already knows.
  React.useEffect(() => {
    if (matrixAnalysis || ran.current || !both) return;
    ran.current = true;
    let alive = true;
    analyse({ action: "matrix-state" })
      .then((s) => {
        if (!alive || !s || !s.analysis) return;
        const held = s.analysis;
        setMatrixAnalysis({
          at: held.at, by: "", model: held.model || "",
          training: held.training || null, skills: held.skills || null,
          validity: held.validity || null,
          check: held.check || null, problems: [],
        });
      })
      .catch(() => {});
    return () => { alive = false; };
  }, [both, matrixAnalysis]);

  const check = (matrixAnalysis && matrixAnalysis.check) || null;
  const counts = (check && check.counts) || {};
  const findings = (check && check.findings) || [];
  const shifts = (check && check.shiftAllocation) || [];
  const notes = (check && check.notes) || [];
  const caveats = problems.length ? problems : (matrixAnalysis && matrixAnalysis.problems) || [];

  const tile = (label, value, colour) => (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `3px solid ${colour}`,
      borderRadius: 2, padding: "10px 13px", flex: "1 1 130px" }}>
      <Eyebrow>{label}</Eyebrow>
      <div style={{ fontFamily: T.display, fontSize: 25, fontWeight: 700, color: colour, marginTop: 5, lineHeight: 1 }}>{value}</div>
    </div>
  );

  // Every one of these is filed under Required Documents For Upload, so this
  // screen only reads them: what it shows of each is the file it read, and
  // where to go if one of them isn't there.
  const card = (c) => {
    const record = records[c.key];
    return (
      <div key={c.key} style={{ background: T.panel, border: `1px solid ${T.rule}`,
        borderLeft: `4px solid ${record ? T.green : c.required ? T.bRed : T.bOrange}`, borderRadius: 2,
        padding: "13px 15px", flex: "1 1 300px", minWidth: 0 }}>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "baseline", flexWrap: "wrap" }}>
          <Eyebrow color={record ? T.accent : c.required ? T.bRed : T.bOrange}>{c.title}</Eyebrow>
          <Chip fg={record ? T.bGreen : c.required ? T.bRed : T.bOrange}
            bg={record ? T.bGreenBg : c.required ? T.bRedBg : T.bOrangeBg}>
            {record ? "on file" : c.required ? "required - not on file" : "not on file"}
          </Chip>
        </div>
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 8 }}>
          {c.blurb}
        </div>
        <div style={{ fontFamily: T.body, fontSize: 13.5, color: record ? T.text : c.required ? T.bRed : T.bOrange,
          marginTop: 10, wordBreak: "break-word" }}>
          {record ? record.filename : `No ${c.noun} has been filed. Upload it under Required Documents For Upload.`}
        </div>
        {record && (
          <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 3 }}>
            {record.uploaded ? `${fmtDate(record.uploaded)} · ` : ""}{record.size}
            {record.by ? ` · ${record.by}` : ""}
          </div>
        )}
        {record && (
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginTop: 12 }}>
            <OpenLink url={record.url} />
          </div>
        )}
      </div>
    );
  };

  return (
    <div>
      {missing.length > 0 && (
        <div style={{ background: T.bRedBg, border: `1px solid ${T.bRed}`, borderRadius: 2,
          padding: "13px 15px", marginBottom: 16 }}>
          <Eyebrow color={T.bRed}>
            {missing.length === 2 ? "Both documents are missing" : `The ${missing[0].noun} is missing`}
          </Eyebrow>
          <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.7, marginTop: 8 }}>
            {missing.map((m) => `the ${m.noun}`).join(" and ")} {missing.length === 2 ? "are" : "is"} not
            on the portal, and both are required at all times. Nothing is analysed until both are
            filed — an answer built from one of them would read as though it were the whole picture.
            {" "}Both are uploaded under Required Documents For Upload, the first page of this tab.
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 16 }}>
        {MATRIX_CARDS.map(card)}
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 16 }}>
        <Button onClick={() => runAnalysis(false)} disabled={busy || !both}>
          {running ? "Working..." : matrixAnalysis ? "Analyse again" : "Analyse both documents"}
        </Button>
        {both && matrixAnalysis && (
          <Button variant="quiet" onClick={() => runAnalysis(true)} disabled={busy}
            title="Read every document again from the files themselves, rather than using what was read last time">
            Read them again
          </Button>
        )}
        {running && hidden && (
          <Button variant="quiet" onClick={() => setHidden(false)}>Show progress</Button>
        )}
        {matrixAnalysis && !running && (
          <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>
            Last run {new Date(matrixAnalysis.at).toLocaleString("en-AU", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}
            {matrixAnalysis.by ? ` · ${matrixAnalysis.by}` : ""}
          </span>
        )}
      </div>

      {running && (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.accent}`,
          borderRadius: 2, padding: "13px 15px", marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap", alignItems: "baseline" }}>
            <Eyebrow color={T.accent}>Analysing</Eyebrow>
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{elapsedLabel(elapsed)} elapsed</span>
          </div>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7, marginTop: 8 }}>
            {run.phase === "clearing" && "Forgetting what was read before, so every document is read again from the file itself."}
            {run.phase === "training" && "Reading the training matrix."}
            {run.phase === "skills" && "Reading the skills matrix."}
            {run.phase === "validity" && "Reading the validity periods off the skills matrix."}
            {run.phase === "checking" && "Holding the crew's training against what is required of them."}
          </div>
          <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 7 }}>
            This takes a minute or two. Leave the page open — each document's reading is kept as it is
            made, so running it again picks up where this left off rather than starting over.
          </div>
        </div>
      )}

      {/* A run takes minutes and the page underneath it can't be used until it
          finishes, so it is watched from a window rather than a panel that
          scrolls away. The figure and the clock both climb while it works. */}
      {run && !hidden && (
        <AnalysisWindow
          eyebrow="Analysing the matrices"
          pct={pct}
          elapsed={elapsed}
          failed={run.phase === "failed"}
          message={run.message}
          failNote="Whichever documents were read before it stopped were kept, so analysing again carries on from there rather than starting over."
          body={<>
            {run.phase === "clearing" && "Forgetting what was read before, so every document is read again from the file itself."}
            {run.phase === "training" && "Reading the training matrix — where the crew's training stands now."}
            {run.phase === "skills" && "Reading the skills matrix — what the crew are required to hold."}
            {run.phase === "validity" && "Reading the validity periods off the skills matrix — how long each item stays valid."}
            {run.phase === "checking" && "The documents are read. Holding the crew's training against what is required of them."}
          </>}
          note="This takes a minute or two. Leave the page open — each document's reading is kept as it is made, so a run that stops picks up where it left off rather than starting over."
          onHide={() => setHidden(true)}
          onClose={() => setRun(null)}
        />
      )}

      {(err || (run && run.phase === "failed")) && (
        <div style={{ background: T.bRedBg, border: `1px solid ${T.bRed}`, borderRadius: 2,
          padding: "13px 15px", marginBottom: 16 }}>
          <Eyebrow color={T.bRed}>The analysis stopped</Eyebrow>
          <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, lineHeight: 1.7, marginTop: 8 }}>
            {err || (run && run.message)}
          </div>
        </div>
      )}

      {caveats.length > 0 && (
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.bOrange, lineHeight: 1.7, marginBottom: 14 }}>
          {caveats.map((p, i) => <div key={i}>{p}</div>)}
        </div>
      )}

      {!check ? (
        <Empty>
          {both
            ? "Nothing has been analysed yet. Analysing reads the training matrix, the skills matrix and the validity periods matrix where one is on file, and says where the crew stand against the requirements."
            : "The training matrix and the skills matrix both have to be on file before anything can be analysed."}
        </Empty>
      ) : (
        <>
          <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
            borderLeft: `4px solid ${check.compliant ? T.green : T.bRed}`, borderRadius: 2,
            padding: "15px 17px", marginBottom: 14 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              <Eyebrow color={check.compliant ? T.green : T.bRed}>
                {check.compliant ? "Requirements are being met" : "Requirements are not being met"}
              </Eyebrow>
            </div>
            <div style={{ fontFamily: T.body, fontSize: 15, color: T.text, lineHeight: 1.7, marginTop: 9 }}>
              {check.headline}
            </div>
            {matrixAnalysis.training && matrixAnalysis.skills && (
              <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 9, lineHeight: 1.7 }}>
                {[matrixAnalysis.training.filename, matrixAnalysis.skills.filename,
                  matrixAnalysis.validity ? matrixAnalysis.validity.filename : null]
                  .filter(Boolean).join(" · ")}
              </div>
            )}
          </div>

          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
            {tile("Requirements", counts.requirements || 0, T.accent)}
            {tile("Crew", counts.crew || 0, T.accent)}
            {tile("Breaches", counts.breaches || 0, counts.breaches ? T.bRed : T.green)}
            {tile("Due", counts.due || 0, counts.due ? T.bOrange : T.green)}
            {tile("Gaps", counts.gaps || 0, counts.gaps ? T.teal : T.green)}
          </div>

          {/* Worst first, and grouped, because a list of sixty mixed findings is
              read as sixty problems of equal weight. */}
          {findings.length === 0 ? (
            <Empty>Nothing was found against the requirements the two documents share.</Empty>
          ) : (
            Object.keys(SEVERITIES).map((sev) => {
              const group = findings.filter((f) => f.severity === sev);
              if (!group.length) return null;
              const s = SEVERITIES[sev];
              return (
                <div key={sev} style={{ marginBottom: 18 }}>
                  <div style={{ display: "flex", gap: 8, alignItems: "baseline", flexWrap: "wrap", marginBottom: 8 }}>
                    <Eyebrow color={s.fg}>{s.label} · {group.length}</Eyebrow>
                    <span style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted }}>{s.blurb}</span>
                  </div>
                  {group.map((f, i) => (
                    <div key={i} style={{ display: "flex", gap: 10, flexWrap: "wrap", padding: "9px 0",
                      borderBottom: `1px solid ${T.rule}` }}>
                      <div style={{ flex: 1, minWidth: 230 }}>
                        <div style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text }}>
                          {f.person || "The crew as a whole"}
                        </div>
                        <div style={{ fontFamily: T.body, fontSize: 13, color: T.text, marginTop: 3 }}>
                          {f.requirement}
                        </div>
                        <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, lineHeight: 1.6, marginTop: 4 }}>
                          {f.detail}
                        </div>
                      </div>
                      <div style={{ minWidth: 200, flex: "0 1 260px" }}>
                        <Chip fg={s.fg} bg={s.bg}>{s.label}</Chip>
                        {f.action && (
                          <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.text, lineHeight: 1.6, marginTop: 5 }}>
                            {f.action}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              );
            })
          )}

          {/* The shift allocations, which are a rule about the crew rather than
              about any one person, so they are counted rather than listed. */}
          {shifts.length > 0 && (
            <div style={{ marginBottom: 18 }}>
              <div style={{ marginBottom: 8 }}><Eyebrow color={T.accent}>Shift allocations</Eyebrow></div>
              <div style={{ display: "flex", gap: 10, padding: "0 0 6px", borderBottom: `1px solid ${T.rule}`, flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 180 }}><Eyebrow>Shift and requirement</Eyebrow></div>
                <div style={{ minWidth: 110 }}><Eyebrow>Required</Eyebrow></div>
                <div style={{ minWidth: 110 }}><Eyebrow>Held</Eyebrow></div>
                <div style={{ minWidth: 92 }}><Eyebrow>Met</Eyebrow></div>
              </div>
              {shifts.map((s, i) => (
                <div key={i} style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap",
                  padding: "9px 0", borderBottom: `1px solid ${T.rule}` }}>
                  <div style={{ flex: 1, minWidth: 180 }}>
                    <div style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text }}>{s.shift}</div>
                    <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, marginTop: 3 }}>{s.requirement}</div>
                    {s.shortfall && (
                      <div style={{ fontFamily: T.body, fontSize: 12.5, color: T.bOrange, lineHeight: 1.6, marginTop: 4 }}>
                        {s.shortfall}
                      </div>
                    )}
                  </div>
                  <div style={{ minWidth: 110, fontFamily: T.mono, fontSize: 11.5, color: T.muted }}>{s.required}</div>
                  <div style={{ minWidth: 110, fontFamily: T.mono, fontSize: 11.5, color: T.text }}>{s.held}</div>
                  <div style={{ minWidth: 92 }}>
                    <Chip fg={s.ok ? T.bGreen : T.bRed} bg={s.ok ? T.bGreenBg : T.bRedBg}>
                      {s.ok ? "met" : "short"}
                    </Chip>
                  </div>
                </div>
              ))}
            </div>
          )}

          {notes.length > 0 && (
            <div style={{ marginBottom: 18 }}>
              <div style={{ marginBottom: 8 }}><Eyebrow>What couldn't be checked</Eyebrow></div>
              {notes.map((n, i) => (
                <div key={i} style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.7,
                  padding: "6px 0", borderBottom: `1px solid ${T.rule}` }}>
                  {n}
                </div>
              ))}
            </div>
          )}

          {matrixAnalysis.model && (
            <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, lineHeight: 1.7 }}>
              Read by {matrixAnalysis.model}. It reads the documents and reports what they say — it
              decides nothing, and a finding is a place to look rather than a ruling.
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* The portal ships with a set of example notes, documents and correspondence so
   it has something to show the very first time it is opened on a fresh server.
   Until the server has answered, that is all it is holding — and showing it
   looks exactly like the portal having been emptied and put back to the day it
   was set up. So nothing is shown until the shared copy has actually arrived. */
function NotLoadedYet({ error }) {
  // Opened straight off a disk — someone double-clicked the build file itself.
  // There is no server behind it there, so rather than reporting an outage that
  // isn't one, say which file this is and which one they were after. The test
  // preview never shows this: it answers the portal's requests itself.
  const offDisk = location.protocol === "file:";
  return (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`,
      borderLeft: `4px solid ${error ? T.bRed : T.teal}`,
      borderRadius: 2, padding: "22px 24px", maxWidth: 720 }}>
      <Eyebrow color={T.accent}>
        {error ? (offDisk ? "Nothing is broken — wrong file" : "Couldn't reach the portal") : "Loading"}
      </Eyebrow>
      <div style={{ fontFamily: T.body, fontSize: 15, color: T.text, lineHeight: 1.7, marginTop: 12 }}>
        {error
          ? (offDisk
            ? "This is the portal's build file — it only runs on the live site, so opened from a folder it shows this notice and nothing else. It never works from Downloads, and a downloaded copy like this one can simply be deleted."
            : "Everything the crew has filed is still on the server — this device just can't reach it at the moment.")
          : "Fetching everything the crew has filed…"}
      </div>
      {error && offDisk && (
        <div style={{ background: T.accentSoft, borderRadius: 2, padding: "12px 14px", marginTop: 14,
          fontFamily: T.body, fontSize: 14.5, fontWeight: 600, color: T.accent, lineHeight: 1.6 }}>
          To use the portal on this computer: Desktop → portal build → double-click preview.html
        </div>
      )}
      {error && !offDisk && (
        <>
          <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, marginTop: 12 }}>{error}</div>
          <div style={{ marginTop: 18 }}>
            <Button onClick={() => location.reload()}>Try again</Button>
          </div>
        </>
      )}
    </div>
  );
}

/* Every section of the portal can be removed from the Admin tab, and removing
   the last one leaves nothing behind it — which reads to the crew as though
   the portal has been wiped back to the day it was set up. Nothing is lost when
   a section is removed, so say so plainly, and give an admin the way back in
   one press rather than seven. */
function EverythingHidden({ admin, onRestoreAll }) {
  return (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.bOrange}`,
      borderRadius: 2, padding: "22px 24px", maxWidth: 720 }}>
      <Eyebrow color={T.accent}>Nothing to show</Eyebrow>
      <div style={{ fontFamily: T.body, fontSize: 15, color: T.text, lineHeight: 1.7, marginTop: 12 }}>
        Every section of the portal has been removed from the tab bar.
      </div>
      <div style={{ fontFamily: T.body, fontSize: 14, color: T.muted, lineHeight: 1.7, marginTop: 10 }}>
        Nothing has been deleted — the notes, documents, correspondence and crew
        matrix are all still on the server exactly as they were. They are only
        hidden, and they come back the moment the sections are restored.
      </div>
      {admin ? (

        </div>

        </div>

  );
}

/**
 * What has been taken off the portal and can still be put back.
 *
 * Removing a file anywhere in the portal — a handover note, a document, an email
 * attachment, a certificate replaced by a renewal — takes it out of sight but
 * keeps it. This is where it goes, and where a wrong click is undone. It is also
 * the only place anything can actually be destroyed, and that takes a second,
 * separate confirmation.
 */
function RemovedFiles() {
  const { log } = usePortal();
  const [state, setState] = useState({ status: "loading", items: [], msg: "" });
  const [busy, setBusy] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [problem, setProblem] = useState("");

  const load = async () => {
    try {
      const items = await fetchRemovedFiles();
      setState({ status: "ok", items, msg: "" });
    } catch (e) {
      setState({ status: "error", items: [], msg: e.message });
    }
  };

  React.useEffect(() => { load(); }, []);

  // What this file was, in the words the portal uses for it elsewhere.
  const describe = (it) => {
    const r = it.record || {};
    if (it.category === "certificate") return `${it.person || "Unknown"} — certificate`;
    if (it.category === "certificate-sheet") return "Crew certificates spreadsheet";
    if (it.category === "training-matrix") return "Training matrix";
    if (it.category === "skills-matrix") return "Skills matrix";
    if (it.category === "validity-matrix") return "Validity periods matrix";
    if (it.category === "opms-sheet") return "OPMS spreadsheet";
    if (it.category === "matrix") return "Crew matrix spreadsheet";
    if (it.category === "note") return "Handover note";
    if (it.category === "correspondence") return it.title || r.title || "Correspondence attachment";
    return it.title || r.title || "Document";
  };

  const when = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("en-AU", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
  };

  const restore = async (it) => {
    setBusy(it.record.id);
    setProblem("");
    try {
      await restoreStoredFile(it.record.id);
      log("Admin", `Restored ${it.record.filename}`, describe(it));
      await load();
    } catch (e) {
      setProblem(e.message);
    }
    setBusy(null);
  };

  const purge = async (it) => {
    setBusy(it.record.id);
    setProblem("");
    try {
      await purgeStoredFile(it.record.id);
      log("Admin", `Deleted ${it.record.filename} for good`, "It can't be restored");
      setConfirm(null);
      await load();
    } catch (e) {
      setProblem(e.message);
    }
    setBusy(null);
  };

  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, marginBottom: 10 }}>
        <Eyebrow color={T.accent}>Removed files</Eyebrow>
        <Button variant="quiet" onClick={load}>Refresh</Button>
      </div>

      <div style={{ fontFamily: T.body, fontSize: 14, color: T.muted, lineHeight: 1.6, marginBottom: 12 }}>
        Removing a file takes it off the portal but doesn't destroy it. Anything removed by mistake —
        or a certificate replaced by a renewal that turned out to be the wrong one — is put back from
        here, exactly where it was. Deleting for good is the one thing the portal can't undo, so it is
        kept separate and asks twice.
      </div>

      {state.status === "error" && (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.bOrange}`,
          borderRadius: 2, padding: "13px 15px", marginBottom: 22 }}>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7 }}>
            <b>The removed files couldn't be listed.</b> Nothing has been lost — try again in a moment.
            <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, marginTop: 8 }}>{state.msg}</div>
          </div>
        </div>
      )}

      {problem && (
        <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `4px solid ${T.bOrange}`,
          borderRadius: 2, padding: "13px 15px", marginBottom: 16 }}>
          <div style={{ fontFamily: T.body, fontSize: 14, color: T.text, lineHeight: 1.7 }}>{problem}</div>
        </div>
      )}

      {state.status === "loading" && <Empty>Checking what has been removed…</Empty>}

      {state.status === "ok" && state.items.length === 0 && (
        <Empty>Nothing has been removed. Anything taken off the portal shows up here.</Empty>
      )}

      <div style={{ marginBottom: 22 }}>
        {state.items.map((it) => {
          const r = it.record || {};
          const asking = confirm === r.id;
          return (
            <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start",
              gap: 16, flexWrap: "wrap", padding: "10px 13px", borderBottom: `1px solid ${T.rule}`,
              opacity: busy === r.id ? 0.5 : 1 }}>
              <div style={{ flex: 1, minWidth: 240 }}>
                <div style={tx.name}>{r.filename}</div>
                <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, marginTop: 4, lineHeight: 1.5 }}>
                  {describe(it)} · {r.size}
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, marginTop: 4 }}>
                  Removed {when(it.removedAt)}{it.removedBy ? ` by ${it.removedBy}` : ""}
                </div>
              </div>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                {asking ? (
                  <>
                    <span style={{ fontFamily: T.body, fontSize: 13, color: T.text }}>
                      Delete for good? This can't be undone.
                    </span>
                    <button className="um-btn" onClick={() => purge(it)}
                      style={{ background: T.accent, color: "#fff", fontSize: 10, fontWeight: 700, padding: "5px 9px", borderRadius: 2 }}>
                      Delete for good
                    </button>
                    <button className="um-btn" onClick={() => setConfirm(null)}
                      style={{ background: "transparent", color: T.muted, fontSize: 10, fontWeight: 700, padding: "4px 0" }}>
                      Keep
                    </button>
                  </>
                ) : (
                  <>
                    <OpenLink url={r.url} />
                    <Button variant="quiet" onClick={() => restore(it)}>Restore</Button>
                    <button className="um-btn" onClick={() => setConfirm(r.id)}
                      style={{ background: "transparent", color: T.muted, fontSize: 10, fontWeight: 700, padding: "4px 0" }}>
                      Delete for good
                    </button>
                  </>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

/* ==================================================================== */
/*  Crew marine certificates                                             */
/* ==================================================================== */

/* The marine tickets themselves - the certificates of competency, the STCW
   safety training, the medical, and the cards a person has to be carrying to
   step onto the vessel. The inductions and the online modules are a different
   question and are answered on the E-Learning Status tab, so they are left out
   of here: mixing the two is what made the matrix unreadable in the first place. */
const MARINE_GROUPS = ["Qualification", "Vessel Specific"];

// Items that are e-learnings whatever group the matrix files them under.
// VS-04 Helm CONNECT sits in Vessel Specific but is sat at a computer and comes
// back as a tick, so it belongs with the modules on E-Learning Status rather
// than among the marine tickets here. The same goes for anything MRN, MRM or
// MinRes issue — their modules are all online, so the name itself settles it.
const ELEARNING_CODES = ["VS-04"];
const ELEARNING_MARKS = /\b(MRN|MRM|MinRes)\b/i;
const isELearningItem = (code, title) =>
  ELEARNING_CODES.includes(String(code || "").trim().toUpperCase()) ||
  ELEARNING_MARKS.test(String(title || ""));

// Whether a filed scan is a marine ticket. The code on the row — or failing
// that, the one named in the file name — is held against the matrix's groups:
// an e-learning or non-marine code is left off this page, and a scan naming no
// code the matrix knows is kept, since plenty of genuine tickets carry none.
const marineScan = (c, QUALS) => {
  if (ELEARNING_MARKS.test(String(c.filename || "")) || ELEARNING_MARKS.test(String(c.title || ""))) return false;
  let code = String(c.qualCode || "").trim().toUpperCase();
  if (!code) {
    const up = ` ${String(c.filename || "").toUpperCase()} `;
    const hit = QUALS.cols.find(([k]) => up.includes(` ${String(k).toUpperCase()} `));
    code = hit ? String(hit[0]).toUpperCase() : "";
  }
  if (!code) return true;
  const col = QUALS.cols.find(([k]) => String(k).toUpperCase() === code);
  if (col && isELearningItem(code, col[1])) return false;
  if (ELEARNING_CODES.includes(code)) return false;
  return !col || MARINE_GROUPS.includes(col[2]);
};

function CrewMarineCertificates() {
  const { quals: QUALS, certificates, certSheet, certDates } = usePortal();
  const validityFor = useValidityLookup();
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");

  const crew = useMemo(
    () =>
      QUALS.rows.map((r) => {
        const items = itemsFor(r, QUALS).filter(
          (x) => MARINE_GROUPS.includes(x.group) && !isELearningItem(x.code, x.title));
        const dated = (test) => items.filter((x) => x.band.date && test(daysTo(x.band.date)));
        return {
          name: r[0],
          position: r[1],
          sam: r[2],
          items,
          // Certificates are filed under the name on the matrix, so a person's
          // scans are whatever is in their folder — kept to the marine tickets
          // here; the e-learning and induction scans belong to their own pages.
          files: certificates.filter((c) => c.person === r[0] && marineScan(c, QUALS)),
          expired: dated((d) => d < 0).length,
          soon: dated((d) => d >= 0 && d <= 90).length,
          missing: items.filter((x) => x.band.key === "not").length,
          unknown: items.filter((x) => x.band.key === "unknown").length,
        };
      }),
    [QUALS, certificates],
  );

  const matches = {
    all: () => true,
    expiring: (c) => c.soon > 0,
    gap: (c) => c.expired + c.missing > 0,

  const shown = crew
    .filter(matches[filter] || matches.all)
    .filter((c) => !q || (c.name + " " + c.position).toLowerCase().includes(q.toLowerCase()));

  const total = (k) => crew.reduce((n, c) => n + c[k], 0);

      <div style={{ fontFamily: T.display, fontSize: 25, fontWeight: 700, color: colour, marginTop: 5, lineHeight: 1 }}>{value}</div>
    </div>

  const chip = (label, key, colour) => (
    <button className="um-btn" onClick={() => setFilter(filter === key ? "all" : key)}

  // The list as it stands on screen, filters and all, as a PDF to hand over.
  const asPDF = () => ({
    title: "Crew marine certificates",
    subtitle: `${VESSEL.name} ${VESSEL.nameAccent} · as at ${fmtDate(TODAY)} · ${shown.length} crew · `
      + `${total("expired")} expired · ${total("soon")} within 90 days · ${total("missing")} not held`
      + (filter === "all" ? "" : " · filtered")
      + (q ? ` · matching "${q}"` : ""),
    filename: `crew-marine-certificates-${TODAY}.pdf`,
    empty: "No marine certificates on the matrix.",
    groups: shown.map((c) => ({
      heading: c.name,
      meta: `${c.position} · ${c.items.length} certificate${c.items.length === 1 ? "" : "s"} · `
        + `${c.files.length} scan${c.files.length === 1 ? "" : "s"} on file`,
      items: c.items.map(pdfLineIn({ person: c.name, dates: certDates, validityFor })),
    })),
  });

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 14,
        flexWrap: "wrap", marginBottom: 7 }}>
        <div style={{ textAlign: "right" }}>
          <Eyebrow>Matrix last updated</Eyebrow>
          <div style={{ fontFamily: T.mono, fontSize: 12, marginTop: 4,
            color: certSheet && certSheet.uploaded ? T.text : T.muted }}>
            {certSheet && certSheet.uploaded ? fmtDate(certSheet.uploaded) : "No spreadsheet uploaded yet"}
          </div>
        </div>
        <UpdateTableButton />
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        {tile("Crew on the matrix", crew.length, T.accent)}
        {tile("Certificates tracked", tracked, T.text)}
        {tile("Expired", total("expired"), T.bRed)}
        {tile("Within 90 days", total("soon"), T.bOrange)}
        {tile("Scans on file", certificates.length, T.teal)}
      </div>

      <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 14 }}>
        Every marine ticket the matrix holds for each person — competency, safety training, medical and
        the cards they carry — next to the scans filed in their certification folder. Every crew member
        is written out in full below, one after the other; the filters and the search only narrow the
        list. Module validity is how long each item stays valid, off the skills matrix, or

        left on screen by the filters.
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        {chip("Expiring within 90 days", "expiring", T.bOrange)}
        {chip("Expired or not held", "gap", T.bRed)}
        {chip("No scans on file", "nofile", T.muted)}
        <input className="um-in" style={{ flex: 1, minWidth: 170 }} value={q}
          onChange={(e) => setQ(e.target.value)} placeholder="Search crew or position" />
        <DownloadPDF build={asPDF} variant="quiet" />
      </div>

      {crew.length === 0 ? (
        <Empty>No crew on the matrix yet.</Empty>
      ) : shown.length === 0 ? (
        <Empty>Nothing matches that filter.</Empty>
      ) : (
        <>
          <div style={{ marginBottom: 14 }}>
            <Eyebrow color={T.accent}>{shown.length === crew.length
              ? `All ${shown.length} crew, written out in full`

          </div>

          {shown.map((c) => (
              <div key={c.name} style={{ background: T.panel, border: `1px solid ${T.rule}`,
                borderLeft: `3px solid ${c.expired + c.missing ? T.bRed : c.soon ? T.bOrange : T.teal}`,
                borderRadius: 2, marginBottom: 12 }}>
                <div style={{ padding: "11px 13px", borderBottom: `1px solid ${T.rule}`,
                  display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
                  <span style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text }}>
                    {c.name}
                    <span style={{ color: T.muted, fontWeight: 400 }}> · {c.position}</span>
                  </span>
                  <span style={{ display: "flex", gap: 7, alignItems: "center", flexWrap: "wrap" }}>
                    {c.expired > 0 && <Chip fg={T.bRed} bg={T.bRedBg}>{c.expired} expired</Chip>}
                    {c.missing > 0 && <Chip fg={T.bRed} bg={T.bRedBg}>{c.missing} not held</Chip>}
                    {c.soon > 0 && <Chip fg={T.bOrange} bg={T.bOrangeBg}>{c.soon} within 90 days</Chip>}
                    {c.unknown > 0 && <Chip fg={T.muted} bg={T.raised}>{c.unknown} unconfirmed</Chip>}
                    <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, letterSpacing: 0 }}>
                      {c.items.length} held · {c.files.length} on file
                    </span>
                  </span>
                </div>

                <div style={{ padding: "10px 13px 12px" }}>
                  {c.items.length === 0
                    ? <Empty>Nothing on the matrix against this person.</Empty>
                    : (
                      <>
                        <DateColsHead validity />
                        {c.items.map((x) => (
                          <ItemLine key={x.code} x={x} person={c.name} dates={certDates}
                            validity={validityFor(x)} />
                        ))}
                      </>
                    )}

                  <div style={{ marginTop: 14, marginBottom: 6 }}>
                    <Eyebrow color={T.accent}>Scans on file</Eyebrow>
                  </div>
                  {c.files.length === 0 ? (
                    <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6 }}>
                      Nothing uploaded for {c.name} yet. Certificates are filed from the Admin
                      tab, under Required Documents For Upload.
                    </div>
                  ) : c.files.map((f) => (
                    <div key={f.id} className="um-row" style={{ display: "flex", gap: 12, alignItems: "center",
                      flexWrap: "wrap", padding: "7px 0", borderTop: `1px solid ${T.rule}` }}>
                      <div style={{ flex: "1 1 220px", minWidth: 0 }}>
                        <div style={{ fontFamily: T.body, fontSize: 13.5, color: T.text, wordBreak: "break-word" }}>
                          {f.filename}
                        </div>
                        <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, marginTop: 3 }}>
                          {[f.qualCode, f.size, f.expires ? `expires ${fmtDate(f.expires)}` : null,
                            f.uploaded ? `filed ${fmtDate(f.uploaded)}` : null].filter(Boolean).join(" · ")}
                        </div>
                      </div>
                      <OpenLink url={f.url} />

                  ))}
                </div>
              </div>
          ))}
        </>
      )}
    </div>
  );
}

/* ==================================================================== */
/*  Certificates required — the matrix read down its columns             */
/* ==================================================================== */

/* Every certificate the matrix asks of anyone, written out in full one after
   the other. The other certification screens answer "what does this person
   hold?"; this one answers the office's other question — "who holds this
   certificate?" — with the issue date, expiry date and validity period against
   every name, and the people required to hold it who don't listed under them,
   marked "Certificate not held". A certificate nobody holds at all drops the
   date columns and lists just the positions required to hold it, one under the
   other, each marked the same way. The filters and the search only narrow the
   list — nothing is hidden behind a menu. */

// The distinct positions behind a list of people, in the order the matrix
// lists them — for the certificate nobody holds, where a run of names would
// say less than the ranks that are missing it.
const positionsOf = (list) => Array.from(new Set(list.map((p) => p.position)));

function CertificatesRequired() {
  const { quals: QUALS, certificates, certSheet, certDates } = usePortal();
  const validityFor = useValidityLookup();
  const [q, setQ] = useState("");
  const [group, setGroup] = useState("All");
  const [onlyGaps, setOnlyGaps] = useState(false);

  // One entry per matrix column. Everyone with a non-blank cell against it is
  // required to hold it — a blank means it was never asked of that position —
  // and the "N"/"Open" rows are split out as not held. Holders read soonest
  // expiry first, the undated ones after, so what needs attention leads.
  const certs = useMemo(
    () => QUALS.cols.map((c, i) => {
      const holders = [];
      const notHeld = [];
      QUALS.rows.forEach((r) => {
        const band = bandFor(r[3][i]);
        if (!band) return;
        (band.key === "not" ? notHeld : holders).push({ name: r[0], position: r[1], band });
      });
      holders.sort((a, b) =>
        (a.band.date ? daysTo(a.band.date) : 9e5) - (b.band.date ? daysTo(b.band.date) : 9e5)
        || a.name.localeCompare(b.name));
      const dated = (test) => holders.filter((h) => h.band.date && test(daysTo(h.band.date)));
      return {
        code: c[0], title: c[1], group: c[2],
        holders, notHeld,
        required: holders.length + notHeld.length,
        holds: holders.filter((h) => h.band.key !== "unknown").length,
        unknown: holders.filter((h) => h.band.key === "unknown").length,
        expired: dated((d) => d < 0).length,
        soon: dated((d) => d >= 0 && d <= 90).length,
      };
    }).filter((c) => c.required > 0),
    [QUALS],
  );

  const groups = ["All", ...Array.from(new Set(certs.map((c) => c.group)))];

  // The search answers both directions: a certificate by its code, title or
  // category, and a certificate by who is behind it — typing a name brings up
  // everything that person is required to hold.
  const shown = certs
    .filter((c) => group === "All" || c.group === group)
    .filter((c) => !onlyGaps || c.notHeld.length + c.expired > 0)
    .filter((c) => {
      if (!q) return true;
      const needle = q.toLowerCase();
      return (c.code + " " + c.title + " " + c.group).toLowerCase().includes(needle)
        || c.holders.concat(c.notHeld).some((h) => (h.name + " " + h.position).toLowerCase().includes(needle));
    });

  const total = (k) => certs.reduce((n, c) => n + c[k], 0);

  const tile = (label, value, colour) => (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `3px solid ${colour}`,
      borderRadius: 2, padding: "10px 13px", flex: "1 1 130px" }}>
      <Eyebrow>{label}</Eyebrow>
      <div style={{ fontFamily: T.display, fontSize: 25, fontWeight: 700, color: colour, marginTop: 5, lineHeight: 1 }}>{value}</div>
    </div>
  );

  const head = { fontFamily: T.display, fontSize: 9.5, fontWeight: 700, letterSpacing: "0.1em",
    textTransform: "uppercase", color: T.muted, minWidth: 78 };

  const validityText = (c) => validityFor(c) || null;

  // What one certificate prints as. Holders carry the issue date, the expiry
  // and the status; the people required who don't hold it follow, each line
  // reading "Certificate not held"; and a certificate nobody holds prints just
  // the positions, one under the other, marked the same way.
  const asPDF = () => ({
    title: "Certificates required",
    subtitle: `${VESSEL.name} ${VESSEL.nameAccent} · as at ${fmtDate(TODAY)} · `
      + `${shown.length} certificate${shown.length === 1 ? "" : "s"} · `
      + `${total("required")} requirements · ${total("expired")} expired · `
      + `${certs.reduce((n, c) => n + c.notHeld.length, 0)} not held`
      + (group === "All" ? "" : ` · ${group}`)
      + (onlyGaps ? " · with gaps only" : "")
      + (q ? ` · matching "${q}"` : ""),
    filename: `certificates-required-${TODAY}.pdf`,
    empty: "Nothing on the matrix yet - upload the crew certificates spreadsheet.",
    groups: shown.map((c) => {
      const validity = validityText(c);
      const col = (v) => {
        const s = v ? colDate(v) : "";
        return s === "—" ? "" : s;
      };
      const holderLine = (h) => {
        const d = certDateFor(certDates, h.name, c.code);
        return {
          code: "",
          title: `${h.name} — ${h.position}`,
          issued: col(d && d.issued),
          date: col(h.band.date || (d && d.expires)),
          status: bandLabel(h.band),
          fg: h.band.fg,
          bg: h.band.bg,
        };
      };
      const notHeldLine = (h) => ({
        code: "",
        title: `${h.name} — ${h.position}`,
        status: "Certificate not held",
        fg: T.bRed,
        bg: T.bRedBg,
      });
      return {
        // The heading band is one line on paper, so the longest titles are cut
        // rather than run under the count on the right. The full title is on
        // the screen the report came off.
        heading: `${c.code} · ${c.title.length > 64 ? c.title.slice(0, 63) + "…" : c.title}`,
        meta: `${c.holds} of ${c.required} hold it`,
        blurb: `${c.group} · Validity period: ${validity || "not on the skills matrix"}`
          + (c.holders.length === 0
            ? " · Nobody on the matrix holds this certificate - the positions required to hold it are listed below."
            : ""),
        items: c.holders.length === 0
          ? positionsOf(c.notHeld).map((p) => ({
              code: "", title: p, status: "Certificate not held", fg: T.bRed, bg: T.bRedBg,
            }))
          : [...c.holders.map(holderLine), ...c.notHeld.map(notHeldLine)],
      };
    }),
  });

  // One line per person, under headings that say what the columns are. The
  // date columns and the way into the scan are the same pieces the other
  // certification screens use, so the two directions can't drift apart.
  const personLine = (h, c) => {
    const d = certDateFor(certDates, h.name, c.code);
    return (
      <div key={h.name} style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
        padding: "5px 0", borderBottom: `1px solid ${T.rule}` }}>
        <span style={{ fontFamily: T.body, fontSize: 13, fontWeight: 600, color: T.text, flex: 1, minWidth: 180 }}>
          {h.name}
        </span>
        <span style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, minWidth: 130 }}>{h.position}</span>
        <DateCols issued={d && d.issued} expires={h.band.date || (d && d.expires)} />
        <CertCell url={certLinkFor(certDates, certificates, h.name, c.code)}
          person={h.name} code={c.code} title={c.title} />
        <span style={{ minWidth: 150, display: "flex", justifyContent: "flex-end" }}>
          <BandTag band={h.band} />
        </span>
      </div>
    );
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 14,
        flexWrap: "wrap", marginBottom: 7 }}>
        <div style={{ textAlign: "right" }}>
          <Eyebrow>Matrix last updated</Eyebrow>
          <div style={{ fontFamily: T.mono, fontSize: 12, marginTop: 4,
            color: certSheet && certSheet.uploaded ? T.text : T.muted }}>
            {certSheet && certSheet.uploaded ? fmtDate(certSheet.uploaded) : "No spreadsheet uploaded yet"}
          </div>
        </div>
        <UpdateTableButton />
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        {tile("Certificates required", certs.length, T.accent)}
        {tile("Fully held", certs.filter((c) => c.notHeld.length === 0 && c.expired === 0).length, T.teal)}
        {tile("Not held by someone", certs.filter((c) => c.notHeld.length > 0).length, T.bRed)}
        {tile("Expired somewhere", certs.filter((c) => c.expired > 0).length, T.bOrange)}
      </div>

      <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 14 }}>
        The matrix read the other way: every certificate it asks of anyone, and who is behind it. Every
        certificate is written out in full below — each person who holds it with the issue date read off
        their certificate, the expiry date, and a way into the scan on file, with anyone required to
        hold it who doesn't listed underneath. A certificate nobody holds shows just the positions
        required to hold it. The validity period is how long each certificate stays valid, off the
        validity periods matrix, and Download PDF writes out every certificate left on screen by the
        filters.
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14, alignItems: "center" }}>
        <button className="um-btn" onClick={() => setOnlyGaps(!onlyGaps)}
          style={{ background: onlyGaps ? T.bRed : "transparent", color: onlyGaps ? "#fff" : T.bRed,
            border: `1px solid ${T.bRed}`, borderRadius: 2, padding: "7px 11px", fontSize: 11, fontWeight: 700 }}>
          Not held or expired only
        </button>
        <input className="um-in" style={{ flex: 1, minWidth: 170 }} value={q}
          onChange={(e) => setQ(e.target.value)} placeholder="Search certificate, code, crew or position" />
        <DownloadPDF build={asPDF} variant="quiet" />
      </div>

      <div style={{ marginBottom: 14 }}>
        <Choices value={group} onPick={setGroup} options={groups} compact />
      </div>

      {certs.length === 0 ? (
        <Empty>Nothing on the matrix yet - upload the crew certificates spreadsheet.</Empty>
      ) : shown.length === 0 ? (
        <Empty>Nothing matches that filter.</Empty>
      ) : (
        <>
          <div style={{ marginBottom: 14 }}>
            <Eyebrow color={T.accent}>{shown.length === certs.length
              ? `All ${shown.length} certificates, written out in full`
              : `${shown.length} of ${certs.length} certificates left by the filters, written out in full`}</Eyebrow>
          </div>

          {shown.map((c) => {
            const validity = validityText(c);
            return (
              <div key={c.code} style={{ background: T.panel, border: `1px solid ${T.rule}`,
                borderLeft: `3px solid ${c.notHeld.length + c.expired ? T.bRed : c.soon ? T.bOrange : T.teal}`,
                borderRadius: 2, marginBottom: 12 }}>
                <div style={{ padding: "11px 13px", borderBottom: `1px solid ${T.rule}`,
                  display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
                  <span style={{ fontFamily: T.body, fontSize: 14, fontWeight: 600, color: T.text,
                    flex: "1 1 280px", minWidth: 0 }}>
                    <span style={{ fontFamily: T.mono, fontSize: 11, color: T.accent }}>{c.code}</span> {c.title}
                    <span style={{ color: T.muted, fontWeight: 400 }}> · {c.group}</span>
                  </span>
                  <span style={{ display: "flex", gap: 7, alignItems: "center", flexWrap: "wrap" }}>
                    {validity && <Chip fg={T.muted} bg={T.raised}>{validity}</Chip>}
                    {c.expired > 0 && <Chip fg={T.bRed} bg={T.bRedBg}>{c.expired} expired</Chip>}
                    {c.notHeld.length > 0 && <Chip fg={T.bRed} bg={T.bRedBg}>{c.notHeld.length} not held</Chip>}
                    {c.soon > 0 && <Chip fg={T.bOrange} bg={T.bOrangeBg}>{c.soon} within 90 days</Chip>}
                    {c.unknown > 0 && <Chip fg={T.muted} bg={T.raised}>{c.unknown} unconfirmed</Chip>}
                    <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, letterSpacing: 0 }}>
                      {c.holds}/{c.required} hold it
                    </span>
                  </span>
                </div>

                <div style={{ padding: "10px 13px 12px" }}>
                  <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, margin: "0 0 8px" }}>
                    Validity period: {validity || "not on the skills matrix"}
                    {" · "}{c.holds} of {c.required} required hold it
                  </div>

                  {c.holders.length === 0 ? (
                    <>
                      <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 8 }}>
                        Nobody on the matrix holds this certificate. The positions required to hold it:
                      </div>
                      {positionsOf(c.notHeld).map((p) => (
                        <div key={p} style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
                          padding: "5px 0", borderBottom: `1px solid ${T.rule}` }}>
                          <span style={{ fontFamily: T.body, fontSize: 13, fontWeight: 600, color: T.text, flex: 1, minWidth: 180 }}>
                            {p}
                          </span>
                          <Chip fg={T.bRed} bg={T.bRedBg}>Certificate not held</Chip>
                        </div>
                      ))}
                    </>
                  ) : (
                    <>
                      <div style={{ display: "flex", gap: 10, alignItems: "baseline",
                        padding: "6px 0 4px", borderBottom: `2px solid ${T.rule}` }}>
                        <span style={{ ...head, flex: 1, minWidth: 180 }}>Crew member</span>
                        <span style={{ ...head, minWidth: 130 }}>Position</span>
                        <span style={head}>Issue date</span>
                        <span style={head}>Expiry date</span>
                        <span style={{ ...head, textAlign: "right" }}>Certificate</span>
                        <span style={{ minWidth: 150 }} />
                      </div>
                      {c.holders.map((h) => personLine(h, c))}

                      {c.notHeld.length > 0 && (
                        <>
                          <div style={{ marginTop: 14, marginBottom: 4 }}>
                            <Eyebrow color={T.bRed}>Required but not held · {c.notHeld.length}</Eyebrow>
                          </div>
                          {c.notHeld.map((h) => (
                            <div key={h.name} style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap",
                              padding: "5px 0", borderBottom: `1px solid ${T.rule}` }}>
                              <span style={{ fontFamily: T.body, fontSize: 13, fontWeight: 600, color: T.text, flex: 1, minWidth: 180 }}>
                                {h.name}
                              </span>
                              <span style={{ fontFamily: T.body, fontSize: 12.5, color: T.muted, minWidth: 130 }}>{h.position}</span>
                              <Chip fg={T.bRed} bg={T.bRedBg}>Certificate not held</Chip>
                            </div>
                          ))}
                        </>
                      )}
                    </>
                  )}
                </div>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}

/* ==================================================================== */
/*  E-Learning status                                                    */
/* ==================================================================== */

/* The modules that are sat at a computer rather than on a course: the MinRes
   project inductions, the vessel and tug/barge inductions, and the project
   modules. They come back as a tick rather than a ticket, so what matters is who
   has not done them yet - not a date eighteen months out. */
const ELEARNING_GROUPS = ["Project Induction", "Vessel Induction", "Project Specific"];

// A module is done when it is marked held, or carries a date that has not passed.
const moduleState = (x) => {
  if (x.band.date) return daysTo(x.band.date) < 0 ? "overdue" : "done";
  if (x.band.key === "held") return "done";
  if (x.band.key === "not") return "outstanding";
  return "unconfirmed";
};

// How long a module stays valid, in the words the validity periods matrix uses
// — "2 years" as written where it wrote one, the months turned back into plain
// words where it only gave a number, and nothing where it doesn't list the item.
const periodText = (p) => {
  if (!p) return null;
  if (p.neverExpires) return "Doesn't expire";
  if (p.validFor) return p.validFor;
  if (p.months) {
    return p.months % 12 === 0
      ? `${p.months / 12} year${p.months === 12 ? "" : "s"}`
      : `${p.months} month${p.months === 1 ? "" : "s"}`;
  }
  return null;
};

// The validity periods matrix names items the way the office typed them, which
// is never quite the way the crew matrix does — so titles are held against each
// other with the punctuation and casing taken out.
const normTitle = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

function ELearningStatus() {
  const { quals: QUALS, certSheet, certDates, validityPeriods, validityMatrix } = usePortal();
  const [view, setView] = useState("crew");
  const [q, setQ] = useState("");
  const [onlyOpen, setOnlyOpen] = useState(false);
  // Which module's line is dropped open on the By module view, by code.
  const [openModule, setOpenModule] = useState(null);

  // Each module's validity period, off the skills matrix — the same
  // lookup the rest of the certification screens and their PDFs read from.
  const validityFor = useValidityLookup();

  const cols = useMemo(
    () => QUALS.cols
      .map((c, i) => ({ code: c[0], title: c[1], group: c[2], i }))
      // The named exceptions too — modules filed under another group but sat
      // at a computer all the same: VS-04 Helm CONNECT, and anything MRN, MRM
      // or MinRes issue.
      .filter((c) => ELEARNING_GROUPS.includes(c.group) || isELearningItem(c.code, c.title)),
    [QUALS],
  );

  const crew = useMemo(
    () =>
      QUALS.rows.map((r) => {
        // Only what this person is actually tracked against - a blank column on
        // the matrix means the module was never asked of them, and counting it
        // as outstanding would put everyone permanently behind.
        const modules = cols
          .map((c) => ({ code: c.code, title: c.title, group: c.group, value: r[3][c.i], band: bandFor(r[3][c.i]) }))
          .filter((x) => x.band)
          .map((x) => ({ ...x, state: moduleState(x) }));
        const count = (s) => modules.filter((x) => x.state === s).length;
        const done = count("done");
        return {
          name: r[0], position: r[1], modules, done,
          overdue: count("overdue"),
          outstanding: count("outstanding"),
          unconfirmed: count("unconfirmed"),
          pct: modules.length ? Math.floor((done / modules.length) * 100) : 100,
        };
      }),
    [QUALS, cols],
  );

  const shownCrew = crew
    .filter((c) => !onlyOpen || c.pct < 100)
    .filter((c) => !q || (c.name + " " + c.position).toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => a.pct - b.pct || a.name.localeCompare(b.name));

  // The same thing read down the columns: which module the crew are behind on,
  // which is what gets chased with the training provider rather than the person.
  const byModule = useMemo(() => {
    const rows = cols.map((c) => {
      // Who each line is about is kept with it, so opening a module can list
      // the crew it is tracked against rather than just count them.
      const held = crew.flatMap((p) => p.modules
        .filter((m) => m.code === c.code)
        .map((m) => ({ ...m, person: p.name, position: p.position })));
      const done = held.filter((m) => m.state === "done").length;
      return {
        ...c, tracked: held.length, done, people: held,
        open: held.length - done,
        // Rounded down all the way through, here and per person: one module
        // outstanding across the whole crew rounds up to 100% and reads as
        // finished, which is exactly the thing this page exists to catch.
        pct: held.length ? Math.floor((done / held.length) * 100) : 100,
      };
    });
    return rows.filter((r) => r.tracked > 0).sort((a, b) => a.pct - b.pct || a.code.localeCompare(b.code));
  }, [cols, crew]);

  const shownModules = byModule
    .filter((m) => !onlyOpen || m.open > 0)
    .filter((m) => !q || (m.code + " " + m.title).toLowerCase().includes(q.toLowerCase()));

  const total = (k) => crew.reduce((n, c) => n + c[k], 0);
  const trackedTotal = crew.reduce((n, c) => n + c.modules.length, 0);
  const doneTotal = total("done");
  const complete = crew.filter((c) => c.modules.length && c.pct === 100).length;

  const bar = (pct, colour) => (
    <div className="um-bar" style={{ width: 96 }}><i style={{ width: `${pct}%`, background: colour }} /></div>
  );

  const colourFor = (pct) => (pct === 100 ? T.teal : pct >= 75 ? T.bYellow : pct >= 50 ? T.bOrange : T.bRed);

  const tile = (label, value, colour) => (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `3px solid ${colour}`,
      borderRadius: 2, padding: "10px 13px", flex: "1 1 130px" }}>

      <div style={{ fontFamily: T.display, fontSize: 25, fontWeight: 700, color: colour, marginTop: 5, lineHeight: 1 }}>{value}</div>
    </div>
  );

  const asPDF = () => ({
    title: "E-learning status",
    subtitle: `${VESSEL.name} ${VESSEL.nameAccent} · as at ${fmtDate(TODAY)} · `
      + `${doneTotal} of ${trackedTotal} modules complete · ${complete} of ${crew.length} crew fully up to date`,
    filename: `e-learning-status-${TODAY}.pdf`,
    empty: "No e-learning modules on the matrix.",
    // Every module tracked against each person, as the screen lists them — the
    // ones still outstanding lead, and what is already done follows with the
    // dates it was done on and runs to, which is the part somebody reading this
    // away from the portal has no other way of seeing.
    groups: shownCrew.map((c) => ({
      heading: c.name,
      meta: `${c.position} · ${c.done} of ${c.modules.length} complete`,

        ...c.modules.filter((m) => m.state !== "done"),

    })).filter((g) => g.items.length),
  });

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 14,
        flexWrap: "wrap", marginBottom: 7 }}>
        <div style={{ textAlign: "right" }}>
          <Eyebrow>Matrix last updated</Eyebrow>
          <div style={{ fontFamily: T.mono, fontSize: 12, marginTop: 4,
            color: certSheet && certSheet.uploaded ? T.text : T.muted }}>

          </div>
        </div>
        <UpdateTableButton />
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        {tile("Modules complete", trackedTotal ? `${Math.floor((doneTotal / trackedTotal) * 100)}%` : "—", T.teal)}
        {tile("Crew fully up to date", `${complete}/${crew.length}`, complete === crew.length ? T.teal : T.bOrange)}
        {tile("Overdue", total("overdue"), T.bRed)}
        {tile("Not done", total("outstanding"), T.bRed)}
        {tile("Unconfirmed", total("unconfirmed"), T.muted)}
      </div>

      <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 14 }}>
        The inductions and online modules on the matrix — MinRes project inductions, the tug and barge
        inductions and the project modules. A module counts as done when it is marked as held or carries
        a date still to run; one marked open or not held counts as not done; a module nobody has asked
        of that person is left out of their count. Module validity is how long each module stays valid,
        read off the skills matrix
        {validityPeriods && validityPeriods.filename ? ` (${validityPeriods.filename})` : ""}; Open at the
        end of a line shows the certificate the dates were read from.
        {!validityMatrix && " No skills matrix is on file yet, so that column is blank — upload one under Required Documents For Upload."}
        {validityMatrix && validityPeriods && !validityPeriods.read && " The validity periods haven't been read off the skills matrix yet — press Update table and the column fills itself in."}
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14, alignItems: "center" }}>
        {[{ id: "crew", label: "By crew" }, { id: "module", label: "By module" }].map((v) => (
          <button key={v.id} className="um-btn" onClick={() => setView(v.id)}
            style={{ background: view === v.id ? T.accent : "transparent", color: view === v.id ? "#fff" : T.muted,
              border: `1px solid ${view === v.id ? T.accent : T.rule}`, borderRadius: 2,

        <button className="um-btn" onClick={() => setOnlyOpen(!onlyOpen)}
