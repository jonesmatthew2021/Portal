<script>
/* An error thrown inside a script served from another domain reaches this
   handler stripped down to the words "Script error." — no file, no line, no
   stack. React, React DOM and Babel are all served from a CDN, and React
   rethrows anything an event handler throws, so almost every fault in the
   portal used to arrive here anonymous and unfixable. The three tags below
   now carry crossorigin="anonymous", which is what lets the browser hand the
   real message over, and this handler reports everything it is given. */
(function () {
  var pending = null;

  // The libraries are loaded from the head, so one of them failing happens
  // before there is anywhere on the page to say so. Hold the first failure and
  // paint it as soon as the body exists.
  function report(kind, detail) {
    if (pending !== null) return;   // the first failure is the one worth reading
    pending = kind + "\n" + detail + "\n\n" + navigator.userAgent;
    paint();
  }

  function paint() {
    var f = document.getElementById("fatal");
    if (!f || pending === null) return;

    var boot = document.getElementById("boot");
    if (boot) boot.style.display = "none";

    f.textContent = "SOMETHING BROKE - screenshot this and send it over\n\n" + pending;
    f.style.display = "block";
    pending = "";                   // painted, but still counts as reported

    var actions = document.createElement("div");
    actions.className = "fatal-actions";

    var again = document.createElement("button");
    again.textContent = "Reload the portal";
    again.onclick = function () { location.reload(); };

    var hide = document.createElement("button");
    hide.textContent = "Hide this";
    hide.onclick = function () { f.style.display = "none"; };

    actions.appendChild(again);
    actions.appendChild(hide);
    f.appendChild(actions);
  }

  document.addEventListener("DOMContentLoaded", paint);

  window.addEventListener("error", function (e) {
    // A script that never downloaded. The event fires on the element itself
    // rather than bubbling, which is why this listener captures. Only scripts
    // count: the portal can't run without them, whereas a picture that didn't
    // load already has something sensible to show in its place, and the
    // spreadsheet reader is fetched on demand and reports itself.
    var el = e.target;
    if (el && el !== window && el.tagName) {
      if (el.tagName !== "SCRIPT" || el.getAttribute("data-optional")) return;
      report("Couldn't download part of the portal.", String(el.src || ""));
      return;
    }

    var where = e.filename ? e.filename + " line " + e.lineno + ", column " + e.colno : "";
    var stack = e.error && e.error.stack ? String(e.error.stack).split("\n").slice(0, 6).join("\n") : "";
    var message = e.message || "Unknown error";

    if (!e.filename && /Script error/i.test(message)) {
      message += "\n(the browser wouldn't say where - reload and see if it happens again)";
    }
    report(message, [where, stack].filter(Boolean).join("\n"));
  }, true);

  // A failed fetch or a rejected promise never fires an error event, so it used
  // to go unreported entirely.
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    var message = r && r.message ? r.message : String(r);
    var stack = r && r.stack ? String(r.stack).split("\n").slice(0, 6).join("\n") : "";
    report(message, stack);
  });
})();
</script>

/* The portal was briefly installable, and a service worker left over from then
   answers from its own cache — which is how a phone can sit on a months-old
   copy of this page and never see anything new. Unregistering it isn't enough
   on its own: the caches it filled outlive it, so they go too. Safari throws
   outright on both of these in private browsing, hence the try. */
(function () {
  try {
    if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
  } catch (e) {}
})();
</script>

// ---------------------------------------------------------------------------
// SHARED STATE
// Everything the portal holds that isn't a file — the roster, notes,
// correspondence, comments, suggestions, the crew matrix and the change history
// — is kept on the server as one document in the portal's database. Every change
// anyone makes is saved within a second of them making it, is there for
// everyone on every device, and survives a refresh, a new browser, and a
// redeploy. Nothing the portal holds lives only in the tab it was typed into.
// ---------------------------------------------------------------------------
const STATE_API = "/api/state";
const POLL_MS = 8000;        // how often to pick up other people's changes
const FILES_POLL_MS = 20000; // how often to pick up other people's uploads
const SAVE_MS = 900;         // how long to let a burst of typing settle first
const HISTORY_LIMIT = 500;   // the change log keeps this many entries

// A phone keeps this tab alive for weeks behind other apps, and iOS stops the
// timers inside it while it is out of sight. Coming back to the portal would
// show whatever it was holding when it was last looked at, until the next poll
// happened to fire. Everything that polls now also refreshes the moment the
// phone returns to it — including a page Safari restored from its
// back-forward cache, which comes back without re-running anything at all.
function onWake(run) {
  const wake = () => { if (document.visibilityState !== "hidden") run(); };
  document.addEventListener("visibilitychange", wake);
  window.addEventListener("pageshow", wake);
  return () => {
    document.removeEventListener("visibilitychange", wake);
    window.removeEventListener("pageshow", wake);
  };
}

// A file dropped anywhere that isn't a drop target would make the browser open
// the file and walk away from the portal. Swallow those, so a drop that misses
// a box by an inch costs nothing. Only files — dragging text around still works.
const dragHasFiles = (e) => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes("Files");
window.addEventListener("dragover", (e) => { if (dragHasFiles(e)) e.preventDefault(); });
window.addEventListener("drop", (e) => { if (dragHasFiles(e)) e.preventDefault(); });

// Safari on iOS will happily answer a repeated GET out of its own cache, which
// leaves a phone polling all day and reading the same stale copy every time.
// no-store makes every poll a real one.
async function loadState() {
  const r = await fetch(STATE_API, { cache: "no-store" });
  if (!r.ok) throw new Error(`Couldn't load the portal (${r.status})`);
  return r.json();                              // { rev, data }
}

// Saves on top of the revision this change was built on. If someone else saved
// in between, the server refuses and hands back what is currently stored, so a
// change is never quietly written over one made a moment earlier.
async function saveState(data, rev) {
  const r = await fetch(STATE_API, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ rev, data }),
  });
  if (r.status === 409) return { ...(await r.json()), conflict: true };
  if (!r.ok) throw new Error(`Couldn't save the change (${r.status})`);
  return r.json();                              // { rev }
}


// ---------------------------------------------------------------------------
// STORED FILES
// Every file anyone attaches is uploaded to the server and kept there: the bytes go
// to the company SharePoint, the record of what the file is and where it belongs goes to
// the portal's database. Nothing is held in the browser, so an upload is there
// for everyone, on every device, and it survives a refresh and a redeploy.
// ---------------------------------------------------------------------------
const FILES_API = "/api/files";

// A function request body is capped at 6 MB once multipart overhead is counted.
const MAX_UPLOAD_BYTES = 5 * 1024 * 1024;

const humanSize = (bytes) =>
  bytes >= 1024 * 1024
    ? `${(bytes / (1024 * 1024)).toFixed(1)} MB`
    : `${Math.max(1, Math.round(bytes / 1024))} KB`;

// Uploads the file and returns the record the portal should show for it.
async function uploadFile(file, fields) {
  if (file.size > MAX_UPLOAD_BYTES) {
    throw new Error(`${file.name} is ${humanSize(file.size)}. The limit is ${humanSize(MAX_UPLOAD_BYTES)}.`);
  }
  const body = new FormData();
  body.append("file", file);
  // Every upload carries the day it was made, so nothing can be filed dateless or
  // under the date the portal's figures were compiled. A caller may pass its own
  // filedOn; none has to remember to.
  Object.entries({ filedOn: todayISO(), ...fields }).forEach(([k, v]) => {
    if (v != null && v !== "") body.append(k, String(v));
  });

  const r = await fetch(FILES_API, { method: "POST", body });
  if (!r.ok) {
    const detail = await r.json().catch(() => null);
    throw new Error((detail && detail.error) || `Upload failed (${r.status}). Nothing was saved.`);
  }
  return r.json();
}

async function fetchStoredFiles() {
  const r = await fetch(FILES_API, { cache: "no-store" });
  if (!r.ok) throw new Error(`Couldn't reach the file store (${r.status})`);
  return r.json();
}

// Reading the certificates and holding them against the spreadsheets. The
// reading is done on the server, a few certificates per call, because fifty
// scans take far longer than one request is allowed — so the portal calls this
// until nothing is left unread and then asks for the comparison.
//   { action: "extract", cols, limit }  - read the next few certificates
//   { action: "refile", names }         - move any certificate into the folder of
//                                         the person whose name it carries
//   { action: "compare", cols, rows, sheet } - where they disagree
//   { action: "dates" }                 - the issue and expiry dates read off the
//                                         certificates, per person and matrix code,
//                                         for the date columns on the certification
//                                         screens. Cached readings only - no AI.
//   { action: "reset" }                 - forget the readings and read again
//   { action: "opms-check", cols, rows, text } - our matrix and our certificates
//                                         against the OPMS export, split by whose
//                                         mistake each disagreement is. Answers
//                                         { pending, jobId }: the comparison runs
//                                         on the server and is asked after.
//   { action: "opms-job", jobId }       - how that run is getting on, and its
//                                         answer once it has one
//   { action: "opms-reset" }            - forget the OPMS answers
//   { action: "shift-check", text, crew } - the shift allocation guideline against
//                                         the crew rostered onto one swing. Answers
//                                         the held answer where nothing has changed,
//                                         or { pending, jobId } to ask after.
//   { action: "shift-job", jobId }      - how that run is getting on, and its
//                                         answer once it has one
const ANALYSE_API = "/api/analyse";

async function analyse(body) {
  const r = await fetch(ANALYSE_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && data.error) || `The analysis couldn't be run (${r.status}).`);
  return data;
}

// A crew certificate goes into that person's own folder under `certification/`.
// Nothing is written until the folder has been checked: if the same certificate
// is already filed there, the server stores nothing and hands back what it
// clashed with, so the uploader is asked before anything is overwritten.
//   decide - "ask" (default), "replace", "keep" or "skip"
async function uploadCertificate(file, fields, decide = "ask") {
  if (file.size > MAX_UPLOAD_BYTES) {
    throw new Error(`${file.name} is ${humanSize(file.size)}. The limit is ${humanSize(MAX_UPLOAD_BYTES)}.`);
  }
  const body = new FormData();
  body.append("file", file);
  body.append("category", "certificate");
  body.append("onDuplicate", decide);
  Object.entries(fields).forEach(([k, v]) => {
    if (v != null && v !== "") body.append(k, String(v));
  });

  const r = await fetch(FILES_API, { method: "POST", body });
  const data = await r.json().catch(() => null);
  if (r.status === 409 && data && data.duplicate) return data;   // { duplicate, existing, ... }
  if (!r.ok) {
    throw new Error((data && data.error) || `Upload failed (${r.status}). Nothing was saved.`);
  }
  return data;                                                    // { record } or { skipped }
}

// A document the portal keeps exactly one of — the crew certificates
// spreadsheet, the training matrix, the skills matrix. Only the latest one is
// kept, so uploading a new one removes the one before it — which the server
// won't do until it has been asked. On the first attempt it hands back the file
// that would be overwritten instead, so the uploader sees it before anything is
// lost.
//   decide - "ask" (default), "replace" or "skip"
async function uploadSingleDocument(file, category, fields, decide = "ask") {
  if (file.size > MAX_UPLOAD_BYTES) {
    throw new Error(`${file.name} is ${humanSize(file.size)}. The limit is ${humanSize(MAX_UPLOAD_BYTES)}.`);
  }
  const body = new FormData();
  body.append("file", file);
  body.append("category", category);
  body.append("onDuplicate", decide);
  Object.entries(fields).forEach(([k, v]) => {
    if (v != null && v !== "") body.append(k, String(v));
  });

  const r = await fetch(FILES_API, { method: "POST", body });
  const data = await r.json().catch(() => null);
  if (r.status === 409 && data && data.overwrite) return data;    // { overwrite, existing }
  if (!r.ok) {
    throw new Error((data && data.error) || `Upload failed (${r.status}). Nothing was saved.`);
  }
  return data;                                                    // { record, replaced } or { skipped }
}

// The crew certificates spreadsheet is one of those documents.
const uploadCertificateSheet = (file, fields, decide = "ask") =>
  uploadSingleDocument(file, "certificate-sheet", fields, decide);

// Takes the file out of the portal. The server keeps it — the row and the bytes
// both stay — so anything removed by a wrong click is still there to be put back
// from the Admin tab. Best effort: the record has already gone from the page,
// and a file left behind is less disruptive than an error the crew can do
// nothing about.
async function deleteStoredFile(item, by) {
  if (!item || !item.stored) return;
  try {
    const params = new URLSearchParams();
    if (by) params.set("by", by);
    params.set("session", SESSION);
    if (isAdmin(by)) params.set("admin", "1");
    await fetch(`${FILES_API}/${encodeURIComponent(item.id)}?${params.toString()}`, { method: "DELETE" });
  } catch (e) {}
}

// Everything that has been removed but not destroyed, newest first.
async function fetchRemovedFiles() {
  const r = await fetch(`${FILES_API}?removed=1`, { cache: "no-store" });
  if (!r.ok) throw new Error(`Couldn't reach the file store (${r.status})`);
  return r.json();
}

// Puts a removed file back where it was. A certificate goes back into its
// person's folder, under a name that folder still has free.
async function restoreStoredFile(id) {
  // Only reachable from the Admin tab's Removed Files list, which is already
  // gated on isAdmin(currentUser) — so this always carries the admin marker
  // the server checks for.
  const r = await fetch(`${FILES_API}/${encodeURIComponent(id)}?admin=1`, { method: "PATCH" });
  if (!r.ok) {
    const detail = await r.json().catch(() => null);
    throw new Error((detail && detail.error) || `Couldn't restore that file (${r.status}).`);
  }
  return r.json();
}

// Corrects what a certificate is filed as — the matrix code, the expiry date,
// the title — without touching the file itself. It is how a detail typed in
// wrong on the day is put right, and the matrix follows the correction.
async function editStoredCertificate(id, edit) {
  // Only reachable from the Admin tab, which is already gated on
  // isAdmin(currentUser) — so this always carries the admin marker the server
  // checks for.
  const r = await fetch(`${FILES_API}/${encodeURIComponent(id)}?admin=1`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ edit }),
  });
  if (!r.ok) {
    const detail = await r.json().catch(() => null);
    throw new Error((detail && detail.error) || `The change couldn't be saved (${r.status}).`);
  }
  return r.json();
}

// Destroys a file for good — the only thing in the portal that does. The server
// refuses unless the file has already been removed, so this can't be reached
// without the removal having happened first.
async function purgeStoredFile(id) {
  // Only reachable from the Admin tab's Removed Files list, which is already
  // gated on isAdmin(currentUser) — so this always carries the admin marker
  // the server checks for.
  const r = await fetch(`${FILES_API}/${encodeURIComponent(id)}?purge=1&admin=1`, { method: "DELETE" });
  if (!r.ok) {
    const detail = await r.json().catch(() => null);
    throw new Error((detail && detail.error) || `Couldn't delete that file (${r.status}).`);
  }
}

// Fold what is stored on the server into the lists the portal starts with, so
// real uploads sit above the sample entries rather than replacing them.
function withStoredFiles(store, items) {
  const pick = (category, bucket) =>
    items
      .filter((i) => i.category === category && (bucket === undefined || i.bucket === bucket))
      .map((i) => i.record);
  const seedOnly = (list) => (list || []).filter((x) => !x.stored);

  const docs = { ...store.docs };
  Object.keys(docs).forEach((key) => { docs[key] = [...pick("document", key), ...seedOnly(docs[key])]; });

  return {
    ...store,
    // Departments that have been renamed since a roster was saved.
    people: renameDepts(store.people),
    notes: [...pick("note"), ...seedOnly(store.notes)],
    docs,
    correspondence: [...pick("correspondence", "correspondence"), ...seedOnly(store.correspondence)],
    pwCorrespondence: [...pick("correspondence", "pwCorrespondence"), ...seedOnly(store.pwCorrespondence)],
    matrixArchive: pick("matrix"),
    certificates: pick("certificate"),
    // Only ever one of these is on the server, so the newest is the current one.
    certSheet: pick("certificate-sheet")[0] || null,
    // The two documents the portal is required to hold at all times.
    trainingMatrix: pick("training-matrix")[0] || null,
    skillsMatrix: pick("skills-matrix")[0] || null,
    // The skills matrix's companion — how long each item stays valid. Read with
    // it where one is on file; the portal runs without it.
    validityMatrix: pick("validity-matrix")[0] || null,
    // The latest spreadsheet exported from OPMS. One is kept, like the others.
    opmsSheet: pick("opms-sheet")[0] || null,
    // The office's shift allocation guideline — how many holders of certain
    // certificates each shift must carry — read against the training matrix on
    // the Swing Compliance page. One is kept, like the others.
    shiftAllocation: pick("shift-allocation")[0] || null,
  };
}

// The mirror image, used on the way out. Uploaded files are already kept in the
// file store, so the shared document carries only what the portal starts with
// plus whatever crew have typed — it never carries a second copy of a file.
function withoutStoredFiles(store) {
  const seedOnly = (list) => (list || []).filter((x) => !x.stored);
  const docs = {};
  Object.keys(store.docs || {}).forEach((key) => { docs[key] = seedOnly(store.docs[key]); });

  return {
    ...store,
    notes: seedOnly(store.notes),
    docs,
    correspondence: seedOnly(store.correspondence),
    pwCorrespondence: seedOnly(store.pwCorrespondence),
    matrixArchive: [],
    certificates: [],
    certSheet: null,
    trainingMatrix: null,
    skillsMatrix: null,
    validityMatrix: null,
    opmsSheet: null,
    shiftAllocation: null,
  };
}

/**
 * Words that belong to a requirement rather than to a person.
 *
 * A crew qualification spreadsheet keeps a block of requirement furniture under
 * the crew — "Number Required", "Position", "Required Number of Position to
 * Hold Requirement" — and a matrix read out of one brings those rows across in
 * the name column as though they were people.
 */
const REQUIREMENT_ROW_WORDS =
  /\b(any|crew|holder|holders|minimum|number|position|positions|rank|required|requirement|requirements|shift|shifts|total)\b/i;

/**
 * Whether a row of the matrix is somebody.
 *
 * Nothing is tracked against a requirement row, so it counts as having nothing
 * outstanding and sits among the crew at 100% — which is how "Number Required"
 * comes to read as a deckhand who is fully up to date.
 *
 * Only a row that plainly isn't a name is dropped. A name written the way the
 * matrix writes them — surname, then given name — is kept whatever else is in
 * it, because leaving somebody who is really on the crew off a certification
 * list is the worse mistake of the two.
 */
function isCrewRow(row) {
  const name = String((row && row[0]) || "").trim();
  if (!name) return false;
  if (/[A-Za-z],\s*[A-Za-z]/.test(name)) return true;
  return !REQUIREMENT_ROW_WORDS.test(name);
}

/**
 * The matrix with only the crew on it.
 *
 * The same object comes back when every row is somebody's, so a matrix that was
 * never carrying furniture doesn't count as having changed.
 */
function crewRowsOnly(quals) {
  if (!quals || !Array.isArray(quals.rows)) return quals;
  let rows = quals.rows.filter(isCrewRow);
  let changed = rows.length !== quals.rows.length;

  // Items that never lapse (NO_EXPIRY_CODES — VS-04 Helm CONNECT) carry no
  // expiry date: any date ever typed or read into one of their columns means
  // the item was completed, so it reads as held rather than as a date that can
  // run out. Done here, at the one gate the matrix loads through, so the grid,
  // the tallies, the gap pages and every report agree without asking.
  const cols = Array.isArray(quals.cols) ? quals.cols : [];
  const noExp = cols.map((c) => NO_EXPIRY_CODES.includes(String((c && c[0]) || "").trim().toUpperCase()));
  if (noExp.some(Boolean)) {
    rows = rows.map((r) => {
      const cells = r[3];
      if (!Array.isArray(cells)) return r;
      let rowChanged = false;
      const next = cells.map((v, i) => {
        if (noExp[i] && /^\d{4}-\d{2}-\d{2}/.test(String(v || ""))) { rowChanged = true; return "Y"; }
        return v;
      });
      if (!rowChanged) return r;
      changed = true;
      const nr = r.slice();
      nr[3] = next;
      return nr;
    });
  }

  return changed ? { ...quals, rows } : quals;
}

const daysUntil = (iso) => Math.round((new Date(iso) - new Date(TODAY)) / 86400000);
const fmtDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-AU", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();

const addDays = (iso, n) => {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
};

// Swing k: flies out on ANCHOR + k*CYCLE, onboard until it flies home on
// ANCHOR + (k+1)*CYCLE — Wednesday to Wednesday. Crew B on even k, crew A on odd.
function swingAt(k) {
  const out = addDays(ROSTER_ANCHOR, k * CYCLE);
  return {
    k,
    crew: k % 2 === 0 ? "B" : "A",
    flyOut: out,
    start: addDays(out, 1),
    end: addDays(out, CYCLE - 1),
    flyHome: addDays(ROSTER_ANCHOR, (k + 1) * CYCLE),
  };
}

// Which swing a date falls in. The calendar moves with the real day in Perth —
// TODAY is the day the spreadsheet figures were compiled and is only for
// reading expiries, not for saying whose turn it is to be onboard.
function currentSwingIndex(iso = todayISO()) {
  const days = Math.round((new Date(iso) - new Date(ROSTER_ANCHOR)) / 86400000);
  return Math.floor(days / CYCLE);
}

// A swing written the way the crew say it: changeover to changeover,
// Wednesday to Wednesday.
const swingLabel = (s) =>
  `${new Date(s.flyOut + "T00:00:00").toLocaleDateString("en-AU", { day: "2-digit", month: "short" })} – ${new Date(s.flyHome + "T00:00:00").toLocaleDateString("en-AU", { day: "2-digit", month: "short" })}`;

// A swing as the Handover Notes drawer files against it. The id is the pattern's
// day out for that swing, so a note keeps saying which swing it belonged to for
// as long as it is kept — and if the pattern is ever moved, notes filed under
// the old dates are shown under the day their swing flew out rather than lost.
function noteSwing(k) {
  const s = swingAt(k);
  const part = (iso, withYear) => new Date(iso + "T00:00:00").toLocaleDateString("en-AU",
    withYear ? { day: "2-digit", month: "short", year: "numeric" } : { day: "2-digit", month: "short" });
  const sameYear = s.flyOut.slice(0, 4) === s.flyHome.slice(0, 4);
  return { id: `sw-${s.flyOut}`, k, label: `${part(s.flyOut, !sameYear)} – ${part(s.flyHome, true)}` };
}

// The swing onboard now and the ones before it, newest first, back as far as the
// first onswing or six swings, whichever comes sooner — then the swings notes
// were filed under before the portal followed the pattern.
function noteSwings() {
  const current = noteSwing(Math.max(currentSwingIndex(), 0));
  const past = [];
  for (let k = current.k - 1; k >= 0 && past.length < 6; k--) past.push(noteSwing(k));
  return { current, all: [current, ...past, ...LEGACY_NOTE_SWINGS] };
}

// How far ahead the compliance check looks: the swing onboard now, and the five
// after it — six swings, two rows of three on the Swing Compliance page, so a
// crew change or a certificate renewal can be planned the best part of half a
// year out, not just the three swings a renewal takes.
const SWING_LOOKAHEAD = 5;

/**
 * A swing carrying the dates the office has given for it.
 *
 * The four-week pattern gives every swing a date and most of the time it is the
 * right one. It is not always: a changeover slips, a swing is moved, and the
 * compliance check is then reading certificates against dates nobody is flying
 * on. Dates typed in on the Swing Compliance page are kept against the swing
 * number rather than against "the current swing", so a date given for a swing
 * three ahead is still that swing's date when it comes around, and a swing
 * nobody has touched carries on following the pattern.
 *
 * Two dates are given - the day out and the day home - and the rest follows the
 * pattern's own reading of them: onboard the day after the flight out, off on
 * the day home. A pair that reads backwards is ignored rather than used, which
 * is what makes a half-typed date harmless.
 */
function swingWithDates(k, dates) {
  const base = swingAt(k);
  const d = (dates || {})[k];
  if (!d || !d.flyOut || !d.flyHome || d.flyHome <= d.flyOut) return base;
  return {
    ...base,
    flyOut: d.flyOut,
    start: addDays(d.flyOut, 1),
    end: addDays(d.flyHome, -1),
    flyHome: d.flyHome,
    given: true,
  };
}

// Whether someone is onboard for swing k: their crew's turn, unless the roster
// has been changed for that one swing. Shared, so the roster grid and the swing
// compliance check can't drift apart on who is actually onboard.
const swingStatusFor = (p, k, overrides) => {
  const o = (overrides || {})[`${p.id}:${k}`];
  if (o) return o;
  return p.crew && swingAt(k).crew === p.crew ? "on" : "off";
};

function Field({ label, children }) {
  return <label style={{ display: "block" }}><div style={{ marginBottom: 6 }}><Eyebrow>{label}</Eyebrow></div>{children}</label>;
}

/* Like Field, but a plain division rather than a <label> — a label forwards
   clicks to its first button, which would quietly press the first option. */
function ChoiceField({ label, children }) {
  return <div><div style={{ marginBottom: 6 }}><Eyebrow>{label}</Eyebrow></div>{children}</div>;
}

/* The portal has no drop-down lists. Wherever one used to sit, every option is
   laid out in the open as a wrapping row of press-buttons — the one in force is
   filled in, and everything that could be picked is on screen at once. */
function Choices({ value, options, onPick, compact = false }) {
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
      {options.map((o, i) => {
        const v = o && typeof o === "object" ? o.value : o;
        const label = o && typeof o === "object" ? o.label : o;
        const on = String(value ?? "") === String(v ?? "");
        return (
          <button key={String(v) + "·" + i} type="button" className="um-btn"
            onClick={() => onPick(v)} aria-pressed={on}
            style={{ background: on ? T.accent : T.panel, color: on ? "#FFF" : T.text,
              border: `1px solid ${on ? T.accent : T.rule}`, borderRadius: 2,
              padding: compact ? "4px 9px" : "6px 11px",
              fontFamily: T.body, fontSize: compact ? 12 : 12.5, fontWeight: on ? 700 : 500,
              textTransform: "none", letterSpacing: 0, textAlign: "left", lineHeight: 1.4 }}>
            {label}
          </button>
        );
      })}
    </div>
  );
}

/* The one drop-down the portal has. The no-drop-downs rule above holds for
   short lists, where seeing every option at once beats a menu — but the crew
   list is forty names long, and laid out in the open it buried the page it sat
   on. A long list of names is the one place a menu reads better. */
function NameSelect({ value, options, onPick }) {
  return (
    <select className="um-in" value={String(value ?? "")}
      onChange={(e) => onPick(e.target.value)}
      style={{ fontFamily: T.body, fontSize: 13, color: T.text, background: T.panel,
        border: `1px solid ${T.rule}`, borderRadius: 2, padding: "8px 10px",
        width: "100%", maxWidth: 420 }}>
      {options.map((o, i) => {
        const v = o && typeof o === "object" ? o.value : o;
        const label = o && typeof o === "object" ? o.label : o;
        return <option key={String(v) + "·" + i} value={String(v ?? "")}>{label}</option>;
      })}
    </select>
  );
}

function Chip({ children, fg, bg }) {
  return <span style={{ fontFamily: T.display, fontSize: 10, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", background: bg, color: fg, padding: "5px 9px", borderRadius: 2, whiteSpace: "nowrap" }}>{children}</span>;
}

function Empty({ children }) {
  return <div style={{ fontFamily: T.body, fontSize: 15, color: T.muted, padding: "10px 0" }}>{children}</div>;
}

function OpenLink({ url }) {
  if (url) {
    return (
      <a href={url} target="_blank" rel="noopener noreferrer"
        style={{ fontFamily: T.display, fontSize: 11, fontWeight: 700, letterSpacing: "0.12em",
                 textTransform: "uppercase", color: T.accent, textDecoration: "none" }}>
        Open
      </a>
    );
  }
  // Nothing to open — sample data, or a record with no file behind it yet.
  return (
    <span title="Sample entry — no file attached"
      style={{ fontFamily: T.display, fontSize: 10, fontWeight: 700, letterSpacing: "0.14em",
               textTransform: "uppercase", color: T.muted, border: `1px dashed ${T.rule}`,
               borderRadius: 2, padding: "4px 8px", whiteSpace: "nowrap" }}>
      Sample
    </span>
  );
}

function FileIcon({ name }) {
  const ext = (name.split(".").pop() || "").toUpperCase().slice(0, 4);
  return (
    <div style={{ width: 38, height: 46, border: `1px solid ${T.rule}`, borderRadius: 2, display: "flex", alignItems: "flex-end", justifyContent: "center", paddingBottom: 5, flexShrink: 0, background: T.deep }}>
      <span style={{ fontFamily: T.display, fontSize: 9, fontWeight: 700, letterSpacing: "0.06em", color: T.accent }}>{ext}</span>
    </div>
  );
}

/**
 * Lets a file be dropped straight onto whatever it wraps, as an alternative to
 * the Choose button inside. The highlight is an outline and a background tint,
 * neither of which takes up space, so the box it wraps never changes size.
 *
 * One file at a time by way of onFile. Where several are wanted at once — the AI
 * Checker takes four per question — onFiles is given the whole drop instead.
 */
function DropSpot({ onFile, onFiles, disabled, accept, onReject, style, children }) {
  const [hot, setHot] = useState(false);

  const takes = (name) =>
    !accept || accept.split(",").some((ext) => name.toLowerCase().endsWith(ext.trim().toLowerCase()));

  return (
    <div
      style={{ borderRadius: 2, ...style,
        outline: hot ? `2px dashed ${T.accent}` : "none", outlineOffset: 3,
        background: hot ? T.raised : (style && style.background) }}
      onDragOver={(e) => {
        if (disabled || ![...(e.dataTransfer.types || [])].includes("Files")) return;
        e.preventDefault();
        if (!hot) setHot(true);
      }}
      // dragleave also fires crossing onto the elements inside, so the highlight
      // only drops once the pointer has left the box for good.
      onDragLeave={(e) => {
        if (!e.currentTarget.contains(e.relatedTarget)) setHot(false);
      }}
      onDrop={(e) => {
        e.preventDefault();
        setHot(false);
        if (disabled) return;
        const dropped = Array.from(e.dataTransfer.files || []);
        if (!dropped.length) return;
        const ok = dropped.filter((f) => takes(f.name));
        const no = dropped.filter((f) => !takes(f.name));
        if (no.length && onReject) onReject(no[0]);
        if (!ok.length) return;
        if (onFiles) onFiles(ok);
        else onFile(ok[0]);
      }}>
      {children}
    </div>
  );
}

function RankGrid({ notes, onOpen }) {
  const current = noteSwings().current;
  const filedThisSwing = new Set(notes.filter((n) => n.swing === current.id).map((n) => n.rank));
  const outstanding = RANKS.filter((r) => !filedThisSwing.has(r.id));

  return (
    <div>
      {/* What the Master wants to see at a glance: who hasn't filed yet. */}
      {outstanding.length > 0 && (
        <div style={{ background: T.accentSoft, border: `1px solid ${T.accent}`, borderRadius: 2, padding: "16px 20px", marginBottom: 13 }}>
          <div style={{ marginBottom: 9 }}><Eyebrow color={T.accent}>Not yet filed for {current.label}</Eyebrow></div>
          <div style={{ fontFamily: T.body, fontSize: 15, color: T.text, lineHeight: 1.6 }}>
            {outstanding.map((r) => r.label).join(" · ")}
          </div>
        </div>
      )}

      {DEPTS.map((dept) => {
        const ranks = RANKS.filter((r) => r.dept === dept);
        if (ranks.length === 0) return null;
        return (
          <div key={dept} style={{ marginBottom: 20 }}>
            <div style={{ marginBottom: 10 }}><Eyebrow>{dept}</Eyebrow></div>
            <div className="um-ranks">
              {ranks.map((r) => {
                const mine = notes.filter((n) => n.rank === r.id);
                const filed = filedThisSwing.has(r.id);
                const latest = mine.map((n) => n.uploaded).sort().pop();
                return (
                  <button key={r.id} className="um-btn um-rank" onClick={() => onOpen(r.id)}
                    style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 2, padding: "20px 18px", textAlign: "left", letterSpacing: 0, textTransform: "none", display: "block", width: "100%" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, marginBottom: 11 }}>
                      <span style={{ fontFamily: T.display, fontSize: 18, fontWeight: 700, letterSpacing: "0.04em", textTransform: "uppercase", color: T.text, lineHeight: 1.2 }}>{r.label}</span>
                      <span style={{ width: 8, height: 8, borderRadius: "50%", background: filed ? T.green : T.accent, flexShrink: 0, marginTop: 5 }} />
                    </div>
                    <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, lineHeight: 1.7 }}>
                      <div>{mine.length} {mine.length === 1 ? "note" : "notes"} on file</div>
                      <div>{latest ? `Latest ${fmtDate(latest)}` : "Nothing filed"}</div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function RankDrawer({ rankId, notes, onBack, onUpload, onDelete }) {
  const rank = RANKS.find((r) => r.id === rankId);
  const { current, all: allSwings } = noteSwings();
  const fileRef = useRef(null);
  const [by, setBy] = useState("");
  const [swing, setSwing] = useState(current.id);
  const [staged, setStaged] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const mine = notes.filter((n) => n.rank === rankId);

  // Notes whose swing the pattern no longer names — filed before the pattern was
  // moved — are still shown, grouped under the day their swing flew out.
  const known = new Set(allSwings.map((s) => s.id));
  const strayLabel = (id) => {
    const m = /^sw-(\d{4}-\d{2}-\d{2})$/.exec(id);
    return m ? `Swing out ${fmtDate(m[1])}` : "Earlier swing";
  };
  const strays = [...new Set(mine.filter((n) => !known.has(n.swing)).map((n) => n.swing))]
    .sort().reverse()
    .map((id) => ({ swing: { id, label: strayLabel(id) }, items: mine.filter((n) => n.swing === id) }));

  const grouped = [
    ...allSwings.map((s) => ({ swing: s, items: mine.filter((n) => n.swing === s.id) })).filter((g) => g.items.length > 0),
    ...strays,
  ];

  return (
    <div>
      <button className="um-btn" onClick={onBack} style={{ background: "transparent", color: T.muted, padding: "0 0 18px", fontSize: 11, fontWeight: 700 }}>
        ← All ranks
      </button>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 16, borderBottom: `1px solid ${T.rule}`, paddingBottom: 7, marginBottom: 11 }}>
        <h2 style={{ fontFamily: T.display, fontSize: 21, fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: T.text, margin: 0 }}>{rank.label}</h2>
        <div style={tx.meta}>{mine.length} on file</div>
      </div>

      {/* Attach */}
      <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 2, padding: 16, marginBottom: 20 }}>
        <div style={{ marginBottom: 5 }}><Eyebrow color={T.accent}>Attach your handover notes</Eyebrow></div>
        <div style={{ fontFamily: T.body, fontSize: 13, color: T.muted, lineHeight: 1.6, marginBottom: 11 }}>
          Anyone can file notes against their own rank. You can remove what you posted; admins can remove anything.
        </div>
        <div style={{ display: "grid", gap: 10 }}>
          <div className="um-g2">
            <ChoiceField label="Swing">
              <Choices value={swing} onPick={setSwing}
                options={allSwings.map((s) => ({ value: s.id, label: s.label }))} />
            </ChoiceField>
            <Field label="Filed by"><input className="um-in" value={by} onChange={(e) => setBy(e.target.value)} placeholder="Your name" /></Field>
          </div>

          <DropSpot onFile={(f) => { setErr(""); setStaged({ name: f.name, size: humanSize(f.size), file: f }); }}>
            <div style={{ marginBottom: 6 }}><Eyebrow>File</Eyebrow></div>
            <input ref={fileRef} type="file" style={{ display: "none" }}
              onChange={(e) => { const f = e.target.files?.[0]; if (f) { setErr(""); setStaged({ name: f.name, size: humanSize(f.size), file: f }); } }} />
            <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
              <Button variant="ghost" onClick={() => fileRef.current?.click()}>Choose file</Button>
              <span style={{ fontFamily: T.mono, fontSize: 13, color: staged ? T.text : T.muted }}>
                {staged ? `${staged.name} · ${staged.size}` : "No file chosen — or drag one here"}
              </span>
            </div>
          </DropSpot>

          <div style={{ marginTop: 4 }}>
            <Button onClick={async () => {
              if (!staged || busy) return;
              setBusy(true); setErr("");
              try {
                const { record } = await uploadFile(staged.file, {
                  category: "note", rank: rankId, swing,
                  uploadedBy: by.trim() || "—", filedOn: todayISO(), session: SESSION,
                });
                onUpload(record);
                setStaged(null); setBy("");
                if (fileRef.current) fileRef.current.value = "";
              } catch (e) {
                setErr(e.message);
              } finally {
                setBusy(false);
              }
            }}>{busy ? "Uploading…" : "Upload notes"}</Button>
            {err && <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, marginTop: 10, lineHeight: 1.6 }}>{err}</div>}
          </div>
        </div>
      </div>

      {grouped.length === 0 ? (
        <Empty>Nothing filed under {rank.label} yet.</Empty>
      ) : (
        grouped.map((g) => (
          <div key={g.swing.id} style={{ marginBottom: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
              <Eyebrow color={g.swing.id === current.id ? T.accent : T.muted}>{g.swing.label}</Eyebrow>
              {g.swing.id === current.id && <span style={{ fontFamily: T.mono, fontSize: 11, color: T.accent }}>current swing</span>}
            </div>
            {g.items.map((n) => (
              <div key={n.id} className="um-row" style={{ display: "flex", alignItems: "center", gap: 16, padding: "10px 13px", borderBottom: `1px solid ${T.rule}`, flexWrap: "wrap" }}>
                <FileIcon name={n.filename} />
                <div style={{ flex: 1, minWidth: 200 }}>
                  <div style={{ fontFamily: T.body, fontSize: 15, fontWeight: 600, color: T.text, marginBottom: 5, wordBreak: "break-word" }}>{n.filename}</div>
                  <div style={tx.meta}>{n.by} · {fmtDate(n.uploaded)} · {n.size}</div>
                  <Comments itemId={n.id} />
                </div>
                <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                  <OpenLink url={n.url} />
                  <DeleteBtn item={n} onDelete={() => onDelete(n.id)} label="Remove" />
                </div>
              </div>
            ))}
          </div>
        ))
      )}
    </div>
  );
}

function HandoverNotes({ notes, setNotes, log }) {
  const { role } = usePortal();
  const [openRank, setOpenRank] = useState(null);
  const thisSwing = notes.filter((n) => n.swing === noteSwings().current.id).length;

  if (openRank) {
    return (
      <RankDrawer rankId={openRank} notes={notes} onBack={() => setOpenRank(null)}
        onUpload={(n) => { setNotes([n, ...notes]); log("Handover Notes", `${RANKS.find((r) => r.id === n.rank).label} notes filed`, `${n.filename} · ${n.by}`); }}
        onDelete={(id) => { const n = notes.find((x) => x.id === id); setNotes(notes.filter((x) => x.id !== id)); deleteStoredFile(n, role); if (n) log("Handover Notes", `${RANKS.find((r) => r.id === n.rank).label} notes removed`, n.filename); }} />
    );
  }

  return (
    <div>
      <SectionHead title="Handover Notes" meta={`${thisSwing} of ${RANKS.length} filed this swing`} />
      <div style={{ fontFamily: T.body, fontSize: 14, color: T.muted, marginBottom: 24, lineHeight: 1.6 }}>
        Each rank files their own notes at the end of the swing. Open a rank to read what's there or attach yours.
      </div>
      <RankGrid notes={notes} onOpen={setOpenRank} />
    </div>
  );
}

function CorrespondenceComposer({ onPost, bucket }) {
  const [mode, setMode] = useState("note");
  const [f, setF] = useState({ title: "", body: "", party: PARTIES[0], tag: "" });
  const [staged, setStaged] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const fileRef = useRef(null);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  const post = async () => {
    if (busy) return;
    if (!f.title.trim()) return;
    if (mode === "note" && !f.body.trim()) return;
    if (mode === "email" && !staged) return;

    // A note is just text and goes straight on the page. An email is a file, so
    // it is uploaded first and only posted once it is safely stored.
    if (mode === "email") {
      setBusy(true); setErr("");
      try {
        const { record } = await uploadFile(staged.file, {
          category: "correspondence", bucket,
          party: f.party, tag: f.tag.trim() || "General", title: f.title.trim(),
          uploadedBy: CORRESPONDENCE_POSTER, filedOn: todayISO(), session: SESSION,
        });
        onPost(record);
      } catch (e) {
        setErr(e.message);
        return;
      } finally {
        setBusy(false);
      }
    } else {
      onPost({
        id: "k" + Date.now(),
        kind: "note",
        party: f.party,
        tag: f.tag.trim() || "General",
        title: f.title.trim(),
        body: f.body.trim(),
        postedBy: CORRESPONDENCE_POSTER,
        date: todayISO(),
        session: SESSION,
      });
    }

    setF({ title: "", body: "", party: PARTIES[0], tag: "" });
    setStaged(null);
    setErr("");
    if (fileRef.current) fileRef.current.value = "";
  };

  return (
    <div style={{ background: T.panel, border: `1px solid ${T.rule}`, borderRadius: 2, padding: 16, marginBottom: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 14, flexWrap: "wrap", marginBottom: 13 }}>
        <Eyebrow color={T.accent}>Post correspondence</Eyebrow>
        <div style={{ display: "flex", gap: 6 }}>
          <Button variant={mode === "note" ? "solid" : "quiet"} onClick={() => setMode("note")}>Write a note</Button>
          <Button variant={mode === "email" ? "solid" : "quiet"} onClick={() => setMode("email")}>Attach an email</Button>
        </div>
      </div>

      <div style={{ display: "grid", gap: 10 }}>
        <Field label="Subject">
          <input className="um-in" value={f.title} onChange={set("title")} placeholder="What this is about" />
        </Field>

        <div className="um-g2">
          <ChoiceField label="Party">
            <Choices value={f.party} onPick={(v) => setF({ ...f, party: v })} options={PARTIES} />
          </ChoiceField>
          <Field label="Topic">
            <input className="um-in" value={f.tag} onChange={set("tag")} placeholder="Manning, Maintenance, Crewing…" />
          </Field>
        </div>

        {mode === "note" ? (
          <Field label="Note">
            <textarea className="um-in" rows={5} value={f.body} onChange={set("body")} style={{ resize: "vertical", lineHeight: 1.55 }}
              placeholder="What was said, where it stands, and what the vessel needs to do about it." />
          </Field>
        ) : (
          <DropSpot onFile={(file) => { setErr(""); setStaged({ name: file.name, size: humanSize(file.size), file }); }}>
            <div style={{ marginBottom: 6 }}><Eyebrow>Email file</Eyebrow></div>
            <input ref={fileRef} type="file" style={{ display: "none" }}
              onChange={(e) => { const file = e.target.files?.[0]; if (file) { setErr(""); setStaged({ name: file.name, size: humanSize(file.size), file }); } }} />
            <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
              <Button variant="ghost" onClick={() => fileRef.current?.click()}>Choose file</Button>
              <span style={{ fontFamily: T.mono, fontSize: 13, color: staged ? T.text : T.muted }}>
                {staged ? `${staged.name} · ${staged.size}` : "No file chosen — or drag one here"}
              </span>
            </div>
          </DropSpot>
        )}

        <div style={{ marginTop: 4 }}>
          <Button onClick={post}>{busy ? "Uploading…" : "Post to correspondence"}</Button>
          {err && <div style={{ fontFamily: T.body, fontSize: 13, color: T.bRed, marginTop: 10, lineHeight: 1.6 }}>{err}</div>}
        </div>
      </div>
    </div>
  );
}

function Correspondence({ data, setData, currentUser, log, bucket, title = "Partnership Correspondence", logLabel = "Partnership Correspondence" }) {
  const [q, setQ] = useState("");
  const [party, setParty] = useState("All");

  const canPost = canPostCorrespondence(currentUser);
  const parties = ["All", ...PARTIES];

  const shown = data.filter((d) => {
    const matchesQ = (d.title + d.party + d.tag + (d.body || "")).toLowerCase().includes(q.toLowerCase());
    return matchesQ && (party === "All" || d.party === party);
  });

  return (
    <div>
      <SectionHead title={title} meta={`${data.length} items`} />

      <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap", marginBottom: 22, fontFamily: T.body, fontSize: 14, color: T.muted, lineHeight: 1.6 }}>
        <span style={{ width: 7, height: 7, borderRadius: "50%", background: canPost ? T.green : T.muted, flexShrink: 0 }} />
        <span>
          {canPost
            ? "You have posting rights for this section."
            : "Posted by admins only. Everyone else has read access."}
        </span>
      </div>

      {canPost && <CorrespondenceComposer bucket={bucket} onPost={(k) => { setData([k, ...data]); log(logLabel, `Posted ${k.kind === "note" ? "a note" : "an email"}`, `${k.title} · ${k.party}`); }} />}

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center", marginBottom: 15 }}>
        <input className="um-in" style={{ flex: 1, minWidth: 220 }} value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search correspondence" />
        <Choices value={party} onPick={setParty} options={parties} compact />
      </div>

      {shown.length === 0 ? (
        <Empty>Nothing matches that search.</Empty>
      ) : (
        shown.map((d) => {
          const isNote = d.kind === "note";
          return (
            <div key={d.id} className="um-card" style={{ background: T.panel, border: `1px solid ${T.rule}`, borderLeft: `3px solid ${isNote ? T.rule : T.accent}`, borderRadius: 2, padding: "13px 15px", marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 14, flexWrap: "wrap", marginBottom: 12 }}>
                <div style={{ flex: 1, minWidth: 220 }}>
                  <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 7, flexWrap: "wrap" }}>
                    <Chip fg={isNote ? T.muted : T.accent} bg={isNote ? T.raised : T.accentSoft}>{isNote ? "Note" : "Email"}</Chip>
                    <span style={tx.meta}>{d.party} · {d.tag}</span>
                  </div>
                  <div style={{ fontFamily: T.body, fontSize: 16, fontWeight: 600, color: T.text, lineHeight: 1.4 }}>{d.title}</div>
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, whiteSpace: "nowrap", paddingTop: 3 }}>{fmtDate(d.date)}</div>
              </div>

              {isNote ? (
                <p style={{ fontFamily: T.body, fontSize: 15, lineHeight: 1.65, color: T.text, opacity: 0.92, margin: "0 0 12px", whiteSpace: "pre-wrap", overflowWrap: "anywhere" }}>
                  {d.body}
                </p>
              ) : (
                <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 14px", background: T.deep, border: `1px solid ${T.rule}`, borderRadius: 2, flexWrap: "wrap" }}>

function daysTo(iso) {
  return Math.round((new Date(iso) - new Date(TODAY)) / 86400000);
}

// Expired or within 30 days red, 30-60 orange, 60-90 yellow, beyond 90 green.
function bandFor(v) {
  if (!v) return null;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) {
    const t = v.toUpperCase();
    if (t === "Y") return { key: "held", fg: T.green, bg: T.bGreenBg, text: "Held" };
    if (t === "N") return { key: "not", fg: T.bRed, bg: T.bRedBg, text: "Not held" };
    // The office marks a module still to be done as "open" (red, in the
    // spreadsheet) rather than "N". Same meaning, same treatment - it counts
    // as not done on the E-Learning Status page instead of unconfirmed, and
    // keeps the office's own word on the tag.
    if (t === "OPEN") return { key: "not", fg: T.bRed, bg: T.bRedBg, text: "Open" };
    return { key: "unknown", fg: T.muted, bg: T.raised, text: "?" };
  }
  const d = daysTo(v);
  if (d <= 30) return { key: "red", fg: T.bRed, bg: T.bRedBg, days: d, date: v };
  if (d <= 60) return { key: "orange", fg: T.bOrange, bg: T.bOrangeBg, days: d, date: v };
  if (d <= 90) return { key: "yellow", fg: T.bYellow, bg: T.bYellowBg, days: d, date: v };
  return { key: "green", fg: T.bGreen, bg: T.bGreenBg, days: d, date: v };
}

function Cell({ value, onOpen }) {
  const b = bandFor(value);
  if (!b) return (
    <div title="Not required for this position" style={{
      minWidth: 56, height: 15, borderRadius: 2, border: `1px solid ${T.hatchLine}`,
      backgroundImage: `repeating-linear-gradient(45deg, ${T.hatchLine} 0 1.5px, ${T.hatchBg} 1.5px 5px)`,
    }} />
  );
  const openable = !!onOpen;
  if (b.date) {
    return (
      <div title={`${b.date} - ${b.days < 0 ? Math.abs(b.days) + " days ago" : "in " + b.days + " days"}${openable ? " · open the certificate" : ""}`}
        onClick={openable ? onOpen : undefined}
        style={{ background: b.bg, color: b.fg, borderRadius: 2, padding: "2px 3px", minWidth: 56,
          fontFamily: T.mono, fontSize: 9.5, fontWeight: 600, lineHeight: 1.25,
          cursor: openable ? "pointer" : undefined,
          textDecoration: openable ? "underline" : undefined, textUnderlineOffset: 2 }}>
        {b.date.slice(8, 10)}/{b.date.slice(5, 7)}/{b.date.slice(2, 4)}
      </div>
    );
  }
  return (
