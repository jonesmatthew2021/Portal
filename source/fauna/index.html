<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fauna Log">
<link rel="manifest" href="/fauna/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/fauna/icon-192.png">
<link rel="apple-touch-icon" href="/fauna/icon-192.png">
<title>Fauna Log - TSV Coolibah</title>
<style>
  :root { --navy:#0B3D5C; --sea:#1C5C8C; --ink:#14283A; --mute:#5D7688; --line:#D6E0E8; --bg:#F2F6F9; --card:#fff;
    --warn:#B8621B; --bad:#C0281F; --good:#1F7A4D; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
  body { padding-bottom:calc(92px + env(safe-area-inset-bottom)); }
  header { background:var(--navy); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 12px; position:sticky; top:0; z-index:5; }
  header .row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  header h1 { font-size:15px; letter-spacing:.8px; margin:0; font-weight:700; }
  header .who { font-size:12px; opacity:.85; background:transparent; border:0; color:#fff; font-family:inherit; padding:0; text-decoration:underline dotted; }
  .observer { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin:0 0 12px; display:none; }
  .observer.show { display:block; }
  .observer label { font-size:12px; color:var(--mute); display:block; margin-bottom:4px; }
  .observer .row { display:flex; gap:8px; }
  .observer input { flex:1; font:inherit; font-size:16px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; min-height:42px; }
  .observer button { font:inherit; font-size:15px; font-weight:600; padding:0 16px; border:0; border-radius:8px; background:var(--sea); color:#fff; }
  header .fix { font-size:13px; margin-top:4px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  header .fix b { font-weight:600; font-variant-numeric:tabular-nums; }
  header .fix .pos { background:transparent; border:0; color:#fff; font:inherit; font-size:13px; padding:0; text-decoration:underline dotted; }
  header .fix .pos.stale { opacity:.6; }
  main { padding:14px 16px 0; max-width:640px; margin:0 auto; }
  .mode { display:flex; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:0 0 12px; }
  .mode button { flex:1; font:inherit; font-size:15px; font-weight:600; padding:11px; border:0; background:#fff; color:var(--mute); }
  .mode button.on { background:var(--sea); color:#fff; }
  .note { font-size:13px; color:var(--mute); min-height:18px; margin:0 0 10px; }
  section.group { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:0 0 12px; overflow:hidden; }
  section.group h2 { font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--mute); margin:0; padding:10px 12px 4px; }
  .fields { display:grid; grid-template-columns:1fr 1fr; }
  @media (max-width:420px) { .fields { grid-template-columns:1fr; } }
  .f { display:flex; flex-direction:column; gap:4px; padding:8px 12px 10px; border-top:1px solid var(--line); }
  .f label { font-size:12px; color:var(--mute); letter-spacing:.2px; }
  .f.need label { color:var(--warn); }
  .f.need { background:#FFFAF3; }
  .f select, .f input { font:inherit; font-size:16px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; width:100%; background:#fff; color:var(--ink); min-height:42px; }
  .f select:focus, .f input:focus { outline:2px solid var(--sea); outline-offset:-1px; }
  .f .unit { display:flex; align-items:center; gap:0; }
  .f .unit input { border-radius:8px 0 0 8px; }
  .f .unit .u { font-size:14px; color:var(--mute); border:1px solid var(--line); border-left:0; border-radius:0 8px 8px 0; padding:0 12px; min-height:42px; display:flex; align-items:center; background:#F7FAFC; white-space:nowrap; }
  .f .unit select.u { width:auto; padding:0 8px; }
  .actions { position:fixed; left:0; right:0; bottom:0; background:rgba(242,246,249,.96); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:6; }
  .actions .inner { display:flex; gap:10px; width:100%; max-width:608px; margin:0 auto; }
  .actions button { flex:1; font:inherit; font-size:16px; font-weight:600; padding:14px; border:0; border-radius:10px; }
  .actions .save { background:var(--good); color:#fff; flex:2; }
  .actions .save[disabled] { background:#9CC3AD; }
  .actions .discard { background:#fff; border:1px solid var(--line); color:var(--bad); }
  .month { display:flex; justify-content:space-between; align-items:center; margin:6px 0 8px; gap:8px; }
  .month h2 { font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--mute); margin:0; }
  .month .dl { font:inherit; font-size:13px; color:var(--sea); text-decoration:none; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; white-space:nowrap; }
  .month select { font:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:5px 8px; background:#fff; }
  .logline { font-size:12px; color:var(--mute); margin:-2px 0 8px; overflow-wrap:anywhere; }
  ul.list { list-style:none; margin:0; padding:0; }
  ul.list li { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; gap:10px; align-items:center; }
  ul.list li .t { font-weight:600; font-variant-numeric:tabular-nums; }
  ul.list li .d { font-size:14px; color:var(--ink); flex:1; margin-left:10px; }
  ul.list li .s { font-size:11.5px; color:var(--mute); text-align:right; }
  ul.list li.pending .s { color:var(--warn); }
  ul.list li.empty { color:var(--mute); justify-content:center; font-size:14px; }
  .link { background:transparent; border:0; color:var(--sea); font:inherit; font-size:13px; text-decoration:underline; padding:2px 4px; }
  .toast { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center; z-index:9; }
  .toast.show { opacity:1; }
  #fatal { display:none; color:#fff; background:var(--bad); font-family:ui-monospace,monospace; font-size:13px; line-height:1.6; padding:14px 16px; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<header>
  <div class="row"><h1>FAUNA LOG</h1><button class="who" id="who" type="button"></button></div>
  <div class="fix"><b id="clock">--:--</b><span id="today"></span><button class="pos stale" id="pos" type="button">no position yet</button></div>
</header>
<div id="fatal"></div>
<main>
  <div class="observer" id="observerPanel">
    <label for="observerName">Observer, as the log writes it</label>
    <div class="row"><input id="observerName" autocomplete="name" placeholder="M. Jones"><button type="button" id="observerKeep">Keep</button></div>
  </div>
  <div class="mode"><button type="button" id="modeSighting" class="on">Sighting</button><button type="button" id="modeNil">Nil sightings</button></div>
  <div class="note" id="note"></div>
  <div id="groups"></div>

  <div class="month">
    <h2>Saved entries</h2>
    <select id="monthPick"></select>
    <a class="dl" id="download" href="#">Download month</a>
  </div>
  <div class="logline" id="logline" style="display:none"></div>
  <ul class="list" id="list"></ul>
</main>
<div class="actions"><div class="inner">
  <button class="discard" id="discard" type="button">Clear</button>
  <button class="save" id="save" type="button">Save</button>
</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { FIELDS, FIELD, SPECIES, blankRecord, settle, missingFields, latLongText, observerName, monthName, isBlank, toNumber, windKmh } from "./fields.js";

/* ------------------------------------------------------------ helpers -- */
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localTime = (d = new Date()) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const tzHours = -new Date().getTimezoneOffset() / 60;
const store = {
  get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let toastTimer = null;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
window.addEventListener("error", (e) => { const f = $("fatal"); f.style.display = "block"; f.textContent = "SOMETHING BROKE - screenshot this\n\n" + (e.message || e) + "\n" + (e.filename || "") + ":" + (e.lineno || ""); });

const GROUPS = [
  { key: "vessel", title: "Vessel", keys: ["activity", "heading", "platformHeight"] },
  { key: "conditions", title: "Conditions", keys: ["windSpeed", "windDir", "waveHeight", "cloud", "glare", "visibility", "seaState", "weather", "light"] },
  { key: "when", title: "When and where", keys: ["time", "date", "observer", "lat", "long"] },
  { key: "animal", title: "Sighting", keys: ["faunaType", "species", "certainty", "total", "adults", "calves", "distance", "bearing", "condition", "behaviour", "inZone"] },
  { key: "response", title: "Response", keys: ["action", "stopWork", "comments"] },
];
const CARRIED_KEYS = ["activity", "heading", "platformHeight", "windSpeed", "windDir", "waveHeight", "cloud", "glare", "visibility", "seaState", "weather"];
const CARRY_HOURS = 3;

/* -------------------------------------------------------------- state -- */
let me = { name: "", role: "" };
let logInfo = null;                       // the log in SharePoint, from /api/fauna/log
let entry = newEntry();
let saved = [];                           // this month's entries from the server
let queue = store.get("fauna.queue", []); // saves that could not reach the server yet
let fix = store.get("fauna.fix", null);   // { lat, lon, at }
let month = localDate().slice(0, 7);
const controls = {};                      // key -> the input or select on the page
let windUnit = "km/h";                    // how the wind speed box is being typed
let windTyped = "";

function newEntry() {
  return { record: blankRecord(), touched: false, stamped: false, id: null };
}
/** A fresh entry shown with what the phone knows already filled in. */
function freshEntry() {
  entry = newEntry();
  carryOver();
  stampNow(true);
  entry.stamped = true;
}

/* ---------------------------------------------------------- the clock -- */
function tick() {
  const d = new Date();
  $("clock").textContent = localTime(d);
  $("today").textContent = d.toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" });
}
setInterval(tick, 1000); tick();

/* ------------------------------------------------------------ position -- */
function showFix() {
  const el = $("pos");
  if (!fix) { el.textContent = "no position yet"; el.className = "pos stale"; return; }
  const [la, lo] = latLongText(fix.lat, fix.lon);
  el.textContent = `${la} ${lo}`;
  el.className = "pos" + (Date.now() - fix.at > 10 * 60 * 1000 ? " stale" : "");
}
function takeFix() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(fix);
    navigator.geolocation.getCurrentPosition(
      (p) => { fix = { lat: p.coords.latitude, lon: p.coords.longitude, at: Date.now() }; store.set("fauna.fix", fix); showFix(); fillPosition(!entry.touched); resolve(fix); },
      () => { showFix(); resolve(fix); },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 },
    );
  });
}
$("pos").onclick = () => { $("pos").textContent = "finding position..."; takeFix(); };
showFix();
takeFix();

/* ------------------------------------------------------- the observer -- */
// Asked for once, the first time the app is opened on this phone, offered
// as the signed-in name; kept on the phone and written on every entry.
let observer = store.get("fauna.observer", "");
function showObserverPanel() {
  $("observerName").value = observer || observerName(me.name);
  $("observerPanel").classList.add("show");
  setTimeout(() => $("observerName").focus(), 0);
}
$("observerKeep").onclick = () => {
  const v = $("observerName").value.trim();
  if (!v) return;
  observer = v; store.set("fauna.observer", observer);
  $("who").textContent = observer;
  $("observerPanel").classList.remove("show");
  if (!entry.record.observer || !entry.touched) { entry.record.observer = observer; syncControls(); }
};
$("observerName").addEventListener("keydown", (e) => { if (e.key === "Enter") $("observerKeep").click(); });
$("who").onclick = showObserverPanel;

/* ------------------------------------------------------------- the form -- */
// What the phone already knows, put on the entry: the time and date now,
// the observer, and the position. Stamped when a fresh entry is shown and
// again when it is first touched, so the time is when the logging started,
// not when the app was opened.
function stampNow(fresh = false) {
  const r = entry.record;
  if (!r.time || fresh) r.time = localTime();
  if (!r.date || fresh) r.date = localDate();
  if (!r.observer) r.observer = observer || observerName(me.name);
  fillPosition(fresh);
}
// The position from the phone, unless one was typed in.
function fillPosition(force) {
  const r = entry.record;
  if (!fix) return;
  if (force || (!r.lat && !r.long)) {
    const [la, lo] = latLongText(fix.lat, fix.lon);
    r.lat = la; r.long = lo; r.latDec = fix.lat; r.lonDec = fix.lon;
    syncControls();
  }
}

function build() {
  const host = $("groups");
  host.innerHTML = "";
  for (const g of GROUPS) {
    const sec = document.createElement("section"); sec.className = "group"; sec.dataset.group = g.key;
    const h = document.createElement("h2"); h.textContent = g.title; sec.append(h);
    const grid = document.createElement("div"); grid.className = "fields";
    for (const key of g.keys) grid.append(cell(FIELD[key]));
    sec.append(grid); host.append(sec);
  }
}

function cell(f) {
  const wrap = document.createElement("div"); wrap.className = "f"; wrap.dataset.key = f.key;
  const label = document.createElement("label"); label.textContent = f.label; label.htmlFor = "in-" + f.key;
  wrap.append(label);
  let el;
  if (f.kind === "list" || f.kind === "yesno") {
    el = document.createElement("select");
    fillOptions(el, f);
    el.onchange = () => changed(f.key, el.value);
  } else if (f.kind === "time" || f.kind === "date") {
    el = document.createElement("input"); el.type = f.kind;
    el.onchange = () => changed(f.key, el.value);
  } else if (f.kind === "number") {
    el = document.createElement("input"); el.type = "text"; el.inputMode = "decimal"; el.autocomplete = "off";
    el.oninput = () => changed(f.key, el.value, true);
    el.onchange = () => changed(f.key, el.value);
  } else {
    el = document.createElement("input"); el.type = "text"; el.autocomplete = "off";
    if (f.key === "windDir") el.placeholder = "N, NE, SW...";
    el.oninput = () => changed(f.key, el.value, true);
    el.onchange = () => changed(f.key, el.value);
  }
  el.id = "in-" + f.key;
  controls[f.key] = el;
  if (f.key === "windSpeed") {
    // Typed in knots or km/h; the log keeps km/h.
    const box = document.createElement("div"); box.className = "unit";
    const unit = document.createElement("select"); unit.className = "u";
    for (const u of ["km/h", "knots"]) { const o = document.createElement("option"); o.value = u; o.textContent = u; unit.append(o); }
    unit.value = windUnit;
    unit.onchange = () => { windUnit = unit.value; store.set("fauna.windUnit", windUnit); changed("windSpeed", el.value); };
    box.append(el, unit); wrap.append(box);
    controls.windUnit = unit;
  } else if (f.unit) {
    const box = document.createElement("div"); box.className = "unit";
    const u = document.createElement("span"); u.className = "u"; u.textContent = f.unit;
    box.append(el, u); wrap.append(box);
  } else wrap.append(el);
  return wrap;
}

function fillOptions(sel, f) {
  const current = sel.value;
  sel.innerHTML = "";
  const blank = document.createElement("option"); blank.value = ""; blank.textContent = "—"; sel.append(blank);
  const options = f.kind === "yesno" ? ["Yes", "No"] : f.key === "species" ? (SPECIES[entry.record.faunaType] || []) : f.options;
  for (const o of options) { const op = document.createElement("option"); op.value = o; op.textContent = o; sel.append(op); }
  sel.value = options.includes(current) ? current : "";
}

/** A column typed or picked. Numbers still being typed are not tidied yet. */
function changed(key, value, typing = false) {
  const r = entry.record;
  if (!entry.touched) {
    entry.touched = true;
    // The first touch of a fresh entry is when the sighting is being logged.
    if (entry.stamped && !["time", "date", "lat", "long"].includes(key)) stampNow(true);
    else stampNow();
  }
  if (key === "windSpeed") {
    windTyped = value;
    const n = toNumber(value);
    r.windSpeed = n == null ? null : windKmh(n, windUnit);
  } else if (key === "faunaType") {
    r.faunaType = value || null;
    r.species = null;
    fillOptions(controls.species, FIELD.species);
  } else if (key === "lat" || key === "long") {
    r[key] = value === "" ? null : value;
    r.latDec = null; r.lonDec = null;
  } else {
    r[key] = value === "" ? null : value;
  }
  if (typing) { markNeeds(); return; }
  // Committed (picked, or typed and left): tidied into the log's words and
  // shown that way, the box just left included.
  entry.record = settle(r, { latDec: r.latDec ?? fix?.lat ?? null, lonDec: r.lonDec ?? fix?.lon ?? null, tzHours });
  syncControls(key === "windSpeed" ? key : null);
}

/** The controls shown from the record - all but the one being typed in. */
function syncControls(except = null) {
  const r = entry.record;
  for (const f of FIELDS) {
    const el = controls[f.key];
    if (!el || f.key === except) continue;
    if (f.key === "species") fillOptions(el, f);
    if (f.key === "windSpeed") {
      el.value = except === "windSpeed" ? el.value : isBlank(r.windSpeed) ? "" : windUnit === "knots" ? String(Math.round(r.windSpeed / 1.852)) : String(r.windSpeed);
      continue;
    }
    const v = isBlank(r[f.key]) ? "" : String(r[f.key]);
    if (el.tagName === "SELECT") {
      if (v && ![...el.options].some((o) => o.value === v)) { const op = document.createElement("option"); op.value = v; op.textContent = v; el.append(op); }
      el.value = v;
    } else el.value = v;
  }
  markNeeds();
  $("modeSighting").classList.toggle("on", r.kind !== "nil");
  $("modeNil").classList.toggle("on", r.kind === "nil");
  for (const sec of document.querySelectorAll("section.group")) {
    sec.style.display = r.kind === "nil" && (sec.dataset.group === "animal" || sec.dataset.group === "response") ? "none" : "";
  }
  $("save").textContent = entry.id ? "Save changes" : "Save";
}

function markNeeds() {
  const missing = new Set(missingFields(entry.record));
  for (const f of FIELDS) {
    const el = controls[f.key];
    if (el) el.closest(".f").classList.toggle("need", missing.has(f.key));
  }
}

function setMode(kind) {
  const r = entry.record;
  if (!entry.touched) { entry.touched = true; stampNow(!!entry.stamped); }
  r.kind = kind;
  if (kind === "sighting" && r.comments === "Nil sightings") r.comments = null;
  entry.record = settle(r, { latDec: r.latDec ?? fix?.lat ?? null, lonDec: r.lonDec ?? fix?.lon ?? null, tzHours });
  syncControls();
}
$("modeSighting").onclick = () => setMode("sighting");
$("modeNil").onclick = () => setMode("nil");

/* ----------------------------------------------------- the last entry -- */
function lastConditions() {
  // The most recent saved entry today, within a few hours: its conditions
  // are almost certainly still the conditions.
  const now = new Date();
  const todays = saved.filter((s) => s.date === localDate(now) && s.time);
  if (!todays.length) return null;
  const last = todays[todays.length - 1];
  const [h, m] = String(last.time).split(":").map(Number);
  const ageH = (now.getHours() * 60 + now.getMinutes() - (h * 60 + m)) / 60;
  if (ageH < 0 || ageH > CARRY_HOURS) return null;
  const out = {};
  for (const k of CARRIED_KEYS) if (!isBlank(last[k])) out[k] = last[k];
  if (out.activity === "Transiting") delete out.heading;
  return Object.keys(out).length ? out : null;
}
function carryOver() {
  if (entry.id) return;
  const last = lastConditions();
  if (!last) return;
  for (const [k, v] of Object.entries(last)) if (isBlank(entry.record[k])) entry.record[k] = v;
}

/* -------------------------------------------------------------- saving -- */
async function saveEntry() {
  const r = settle(entry.record, { latDec: entry.record.latDec, lonDec: entry.record.lonDec, tzHours });
  if (!r.time || !r.date) { entry.record = r; stampNow(); }
  const missing = missingFields(entry.record);
  if (missing.length) {
    const first = FIELD[missing[0]];
    if (!confirm(`${missing.length} column${missing.length > 1 ? "s are" : " is"} still empty (${first.label}${missing.length > 1 ? " and more" : ""}). Save anyway?`)) return;
  }
  // An entry still waiting on the phone has a local id the server never sees.
  const localId = entry.id && String(entry.id).startsWith("local-") ? entry.id : null;
  const record = { ...entry.record, id: entry.id && !localId ? entry.id : undefined };
  $("save").disabled = true;
  try {
    const res = await fetch("/api/fauna/sightings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ record }) });
    if (res.status === 401) { location.href = "/login?next=" + encodeURIComponent("/fauna/"); return; }
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || res.status);
    if (localId) { queue = queue.filter((q) => q.id !== localId); store.set("fauna.queue", queue); saved = saved.filter((s) => s.id !== localId); }
    const inLog = out.log && out.log.linked && out.record && out.record.inLog;
    const logWord = !out.log || !out.log.linked ? "" : inLog ? " In the log." : " Not in the log yet" + (out.log.error ? ": " + out.log.error : ".");
    toast((entry.id && !localId ? "Saved the changes." : "Saved.") + logWord);
    finishEntry(out.record);
  } catch (e) {
    // Kept on the phone and sent the next time the server can be reached.
    const id = localId || record.id || ("local-" + Math.random().toString(36).slice(2, 12));
    queue = queue.filter((q) => q.id !== id);
    queue.push({ ...record, id, pending: true });
    store.set("fauna.queue", queue);
    toast("No connection - kept on the phone, it will save when back in range.");
    finishEntry({ ...record, id, pending: true });
  } finally {
    $("save").disabled = false;
  }
}
function finishEntry(savedRecord) {
  const m = String(savedRecord.date || "").slice(0, 7);
  if (m === month) { saved = saved.filter((s) => s.id !== savedRecord.id); saved.push(savedRecord); saved.sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`)); }
  store.del("fauna.draft");
  windTyped = "";
  freshEntry();
  $("note").textContent = "";
  syncControls(); renderList(); loadLogInfo();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
async function flushQueue() {
  if (!queue.length || !navigator.onLine) return;
  const left = [];
  for (const q of queue) {
    try {
      const record = { ...q }; delete record.pending; if (String(record.id).startsWith("local-")) delete record.id;
      const res = await fetch("/api/fauna/sightings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ record }) });
      if (!res.ok) throw new Error(String(res.status));
      const out = await res.json();
      saved = saved.filter((s) => s.id !== q.id);
      if (String(out.record.date || "").slice(0, 7) === month) saved.push(out.record);
    } catch { left.push(q); }
  }
  queue = left; store.set("fauna.queue", queue);
  saved.sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
  renderList();
  if (!left.length) toast("The entries kept on the phone have been saved.");
}
window.addEventListener("online", flushQueue);

$("save").onclick = saveEntry;
$("discard").onclick = () => {
  if (entry.touched || entry.id) { if (!confirm(entry.id ? "Drop the changes to this entry?" : "Clear this entry?")) return; }
  store.del("fauna.draft"); windTyped = "";
  freshEntry();
  $("note").textContent = "";
  syncControls();
};

/* --------------------------------------------------------- the month -- */
function monthOptions() {
  const sel = $("monthPick"); sel.innerHTML = "";
  const d = new Date(); d.setDate(1);
  for (let i = 0; i < 12; i++) {
    const ym = localDate(d).slice(0, 7);
    const o = document.createElement("option"); o.value = ym; o.textContent = `${monthName(ym)} ${ym.slice(0, 4)}`; if (ym === month) o.selected = true; sel.append(o);
    d.setMonth(d.getMonth() - 1);
  }
  sel.onchange = () => { month = sel.value; loadLogInfo(); loadMonth(); };
}
async function loadLogInfo() {
  try {
    const res = await fetch(`/api/fauna/log?month=${month}`, { cache: "no-store" });
    if (res.ok) logInfo = await res.json();
  } catch {}
  const line = $("logline");
  if (logInfo && logInfo.linked && logInfo.file) { line.textContent = "In SharePoint: " + logInfo.file; line.style.display = ""; }
  else if (logInfo && logInfo.linked) { line.textContent = "In SharePoint: " + logInfo.folder + " (no workbook for this month yet)"; line.style.display = ""; }
  else line.style.display = "none";
}
async function loadMonth() {
  $("download").href = `/api/fauna/export?month=${month}`;
  try {
    const res = await fetch(`/api/fauna/sightings?month=${month}`, { cache: "no-store" });
    if (res.status === 401) { location.href = "/login?next=" + encodeURIComponent("/fauna/"); return; }
    const out = await res.json();
    saved = (out.entries || []);
  } catch { saved = saved.filter((s) => String(s.date || "").slice(0, 7) === month); }
  for (const q of queue) if (String(q.date || "").slice(0, 7) === month && !saved.some((s) => s.id === q.id)) saved.push(q);
  saved.sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
  renderList();
}
function renderList() {
  const ul = $("list"); ul.innerHTML = "";
  if (!saved.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "Nothing logged this month yet."; ul.append(li); return; }
  for (const s of [...saved].reverse()) {
    const li = document.createElement("li"); if (s.pending) li.classList.add("pending");
    const t = document.createElement("span"); t.className = "t"; t.textContent = `${(s.date || "").slice(8, 10)}/${(s.date || "").slice(5, 7)} ${s.time || ""}`;
    const d = document.createElement("span"); d.className = "d";
    d.textContent = s.kind === "nil" ? "Nil sightings" : [s.species || s.faunaType, s.total != null ? "×" + s.total : "", s.distance != null ? s.distance + " m" : "", s.bearing != null ? s.bearing + "°" : ""].filter(Boolean).join(" · ");
    const st = document.createElement("span"); st.className = "s";
    st.textContent = s.pending ? "on the phone" : s.inLog ? "in the log" : logInfo && logInfo.linked ? "not in the log yet" : (s.observer || "");
    li.append(t, d, st);
    li.onclick = () => openSaved(s);
    ul.append(li);
  }
}
function openSaved(s) {
  if (entry.touched && !confirm("Drop the entry you are on and open this one?")) return;
  entry = { record: { ...blankRecord(), ...s }, touched: false, id: s.id };
  delete entry.record.pending; delete entry.record.inLog; delete entry.record.logError;
  windTyped = "";
  syncControls();
  $("note").textContent = s.pending ? "Not yet on the server. " : "Saved entry. ";
  const del = document.createElement("button"); del.className = "link"; del.textContent = "Remove this entry"; del.style.color = "#C0281F";
  del.onclick = async () => {
    if (!confirm("Remove this entry from the log?")) return;
    if (String(s.id).startsWith("local-")) { queue = queue.filter((q) => q.id !== s.id); store.set("fauna.queue", queue); }
    else { try { await fetch(`/api/fauna/sightings/${encodeURIComponent(s.id)}`, { method: "DELETE" }); } catch { toast("No connection - try again in range."); return; } }
    saved = saved.filter((x) => x.id !== s.id);
    freshEntry(); $("note").textContent = ""; syncControls(); renderList(); toast("Removed.");
  };
  $("note").append(del);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------------------------------------------------------------- boot -- */
async function boot() {
  windUnit = store.get("fauna.windUnit", "km/h");
  build();
  try {
    const res = await fetch("/api/me", { cache: "no-store" });
    if (res.status === 401) { location.href = "/login?next=" + encodeURIComponent("/fauna/"); return; }
    me = await res.json();
  } catch {}
  $("who").textContent = observer || observerName(me.name) || "observer";
  monthOptions();
  await loadLogInfo();
  await loadMonth();
  flushQueue();
  const draft = store.get("fauna.draft", null);
  if (draft && draft.record) entry = { ...newEntry(), ...draft };
  else freshEntry();
  syncControls();
  // The first time on this phone: who is logging.
  if (!observer) showObserverPanel();
}
setInterval(() => { if (entry.touched) store.set("fauna.draft", entry); }, 2000);
boot();
</script>
</body></html>
